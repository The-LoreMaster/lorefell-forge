# The AI proxy every forge and the Anexanum call (cloudflare/aiforge-worker.js), deployed by
# .github/workflows/ai-worker.yml. The Anthropic key is the worker's own secret (ANTHROPIC_API_KEY),
# set once in Cloudflare; a deploy keeps it. The table room reaches this worker as its AIW binding.
name = "lorefell-ai"
main = "../aiforge-worker.js"
compatibility_date = "2025-01-01"
workers_dev = true
