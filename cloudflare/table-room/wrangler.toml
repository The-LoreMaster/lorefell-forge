name = "lorefell-table"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "TableRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TableRoom"]

# The Anexanum's own round: every two hours it looks for a new session video, waits for its
# captions, writes its title and description, and puts them up if Nate has not opened the draft
# within twelve hours.
[triggers]
crons = ["17 */2 * * *"]

# the AI proxy (lorefell-ai), reached directly: a worker cannot fetch another's workers.dev address
[[services]]
binding = "AIW"
service = "lorefell-ai"
