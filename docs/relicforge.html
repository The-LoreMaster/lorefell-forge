<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RelicForge</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Cinzel:wght@500;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
/* site-look:start */
/* site-look v2: the lorefell-site look for the player tools. Source: forge scripts/site-look.css.
   Each tool pastes this block verbatim between the site-look markers; npm run checks keeps the copies identical.
   Old variable names are aliased onto the site tokens so a tool's own rules keep resolving. */
:root{
  --void:#0A1124;--gold:#D8BC6A;--bone:#EFE8D8;--ash:#B9B2A2;--hair:rgba(239,232,216,.22);
  --panel:rgba(239,232,216,.035);--panel-2:rgba(239,232,216,.06);
  --f-display:'IM Fell English',Georgia,'Times New Roman',serif;
  --f-menu:'Cinzel','IM Fell English',Georgia,serif;
  --f-label:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --navy:var(--void);--ink:var(--void);--silver:var(--bone);--parch:var(--bone);
  --ice:var(--ash);--muted:var(--ash);--dim:var(--ash);--line:var(--hair);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--void);color:var(--bone)}
body{font-family:var(--f-display);font-size:20px;line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--bone);outline-offset:4px}
.sl-label{font-family:var(--f-label);font-weight:500;font-size:14px;line-height:1.3;letter-spacing:.3em;text-transform:uppercase;color:var(--ash)}
.sl-title{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.4vw,36px);line-height:1.15;color:var(--bone);margin:0}
.sl-btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border:1px solid var(--bone);border-radius:0;background:transparent;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:16px;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .25s,color .25s}
.sl-btn.solid{background:var(--gold);border-color:var(--gold);color:var(--void)}
.sl-btn.small{min-height:44px;padding:0 18px;font-size:14px}
.sl-btn:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover){.sl-btn:hover{background:var(--bone);color:var(--void)}.sl-btn.solid:hover{background:transparent;color:var(--gold)}}
.sl-panel{border:1px solid var(--hair);border-radius:0;background:transparent}
.sl-tabs{display:flex;flex-wrap:wrap;gap:4px 22px;border-bottom:1px solid var(--hair)}
.sl-tab{min-height:44px;padding:0 2px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ash);font-family:var(--f-menu);font-size:15px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.sl-tab[aria-selected="true"],.sl-tab.on,.sl-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.sl-chip{display:inline-flex;align-items:center;min-height:44px;min-width:44px;justify-content:center;padding:0 14px;border:1px solid var(--hair);border-radius:0;background:transparent;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.sl-chip[aria-pressed="true"],.sl-chip[aria-current="true"],.sl-chip.on,.sl-chip.active{border-color:var(--gold);color:var(--gold)}
/* info mark: a 15px glyph inside a 44px hit area, opened by tap (.open). The tip hangs from the
   row that holds the mark: put .sl-info-host on that label or row, and the tip never outgrows it. */
.sl-info-host{position:relative}
.sl-info{position:static;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-14px -12px;vertical-align:middle;cursor:pointer}
.sl-info .tip{position:absolute;top:100%;left:0;z-index:30;width:min(320px,100%);padding:12px 14px;border:1px solid var(--hair);background:var(--void);color:var(--bone);font-family:var(--f-display);font-size:16px;line-height:1.4;letter-spacing:0;text-transform:none;display:none}
.sl-info.open .tip{display:block}
.sl-split{display:grid;grid-template-columns:1fr;gap:28px}
@media (min-width:900px){.sl-split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
/* reduced motion: animations jump to their end state, so anything shown by an animation still shows */
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
/* a dropdown's list: the group labels sat on a white bar (Nate, 2026-10-12) */
select option{background:var(--void);color:var(--bone)}
select optgroup{background:var(--void);color:var(--gold);font-style:normal;font-weight:600}
/* no scrollbar inside a tool: the site holds the tool in a centred frame, so a bar inside it sat
   mid-screen (Nate, 2026-10-12). Wheel, trackpad, touch and keys still scroll. */
html,body,*{scrollbar-width:none!important}
::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
/* the page: the navy of the site's lore cards (lorefell-site src/styles/lore.css .lc-face), held
   still behind the content, with a faint gold dust drifting up it, one slow cycle a minute. The
   cards sit on it semi-transparent with a thin gold edge (Nate, 2026-10-13). A tool marks a
   grouping box with .sl-card and keeps its own padding. --void is the navy's deep end in the tools,
   so their solid bars, headers and fields sit in the same blue instead of black strips. */
html{background:#0A1124 linear-gradient(180deg,#121D3A,#0A1124) fixed!important}
body{background:transparent!important}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle at 22% 28%,rgba(216,188,106,.6) 0 1px,transparent 1.7px),radial-gradient(circle at 71% 63%,rgba(216,188,106,.45) 0 1px,transparent 1.7px),radial-gradient(circle at 46% 86%,rgba(239,232,216,.4) 0 .8px,transparent 1.5px),radial-gradient(circle at 88% 14%,rgba(216,188,106,.4) 0 .8px,transparent 1.5px);
  background-size:260px 300px,340px 300px,220px 300px,300px 300px;
  animation:slDust 60s linear infinite}
@keyframes slDust{from{background-position:0 0}to{background-position:0 -300px}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
.sl-card{position:relative;border:1px solid rgba(216,188,106,.28)!important;background:rgba(6,10,20,.42)!important}
/* site-look:end */
 :root{--warn:#d6b35a}
 *{box-sizing:border-box}
 html,body{margin:0}
 body{padding:24px 20px 48px}
 button,select{font:inherit;color:inherit}
 .shell{max-width:1100px;margin:0 auto}
 /* the tool's mark from the site's maker's marks (lorefell-site src/data/marks.js) */
 .brand{display:flex;align-items:center;gap:12px;color:var(--gold);margin:0 0 22px}
 .brand svg{width:48px;height:48px;display:block;flex:none;margin:-4px -2px -4px -6px}
 h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.4vw,34px);line-height:1;margin:0;color:var(--bone)}

 /* the form, and beside it on a wide screen the relic as it will read */
 .forge{display:grid;grid-template-columns:minmax(0,1fr);gap:40px}
 @media (min-width:900px){.forge{grid-template-columns:minmax(0,1fr) 380px}}
 .form-card{padding:20px 20px 22px}
 @media (max-width:560px){.form-card{padding:16px 14px 18px}}
 .preview{display:none}
 @media (min-width:900px){.preview{display:block;align-self:start;position:sticky;top:16px;padding:20px}}

 label.fld{display:flex;align-items:center;font-family:var(--f-label);font-weight:500;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--ash);margin:20px 0 8px;min-height:22px}
 .fld em{font-family:var(--f-display);font-style:italic;text-transform:none;letter-spacing:0;font-size:16px;margin-left:8px}
 .form-card>label.fld:first-child{margin-top:0}
 .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px}
 @media (max-width:560px){.row2{grid-template-columns:1fr}}
 input[type=text],textarea,select{width:100%;min-height:48px;background:transparent;border:1px solid var(--hair);border-radius:0;color:var(--bone);font-family:var(--f-display);font-size:18px;padding:10px 14px;outline:none}
 select{background:var(--void)}
 textarea{min-height:150px;resize:vertical;line-height:1.45}
 input::placeholder,textarea::placeholder{color:var(--ash);opacity:.75}
 input:focus,textarea:focus,select:focus{border-color:var(--gold)}

 /* image: a small square that opens the picker */
 .uploader{display:flex;align-items:center;gap:16px;min-height:88px;border:1px dashed var(--hair);padding:12px 16px;color:var(--ash);font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer}
 .uploader:hover{border-color:var(--bone);color:var(--bone)}
 .uploader input{display:none}
 .uploader img{width:64px;height:64px;object-fit:cover;border:1px solid var(--hair);flex:none}

 /* the one solid gold button */
 .submit{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:24px;padding:0 20px;background:var(--gold);border:1px solid var(--gold);border-radius:0;color:var(--void);font-family:var(--f-label);font-weight:600;font-size:16px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s}
 .submit:hover:not(:disabled){background:transparent;color:var(--gold)}
 .submit:disabled{opacity:.45;cursor:not-allowed}
 .err{margin:12px 0 0;color:var(--warn);font-size:17px;text-align:center}
 .err:empty{display:none}
 .done{padding:28px 20px;text-align:center;max-width:720px}
 .done h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 8px;color:var(--gold)}
 .done p{color:var(--ash);font-size:18px;margin:0 0 20px}
 .done button{min-height:50px;background:transparent;border:1px solid var(--bone);border-radius:0;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:16px;letter-spacing:.22em;text-transform:uppercase;padding:0 26px;cursor:pointer;transition:background .25s,color .25s}
 .done button:hover{background:var(--bone);color:var(--void)}

 /* the relic */
 .pv-img{display:block;width:100%;height:180px;object-fit:cover;border:1px solid var(--hair);margin:0 0 14px}
 .pv-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
 .pv-name{font-family:var(--f-display);font-size:24px;line-height:1.2;color:var(--bone)}
 .pv-name.unnamed{color:var(--ash)}
 .pv-cost{color:var(--ash);font-family:var(--f-label);font-size:15px;letter-spacing:.08em}
 .pv-meta{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
 .badge{font-family:var(--f-label);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;line-height:1.2;padding:4px 8px;border:1px solid var(--hair);color:var(--ash)}
 .badge.gold{color:var(--gold);border-color:rgba(216,188,106,.45)}
 .pv-desc{font-size:17px;line-height:1.45;margin:0;color:var(--bone);white-space:pre-wrap}
 .pv-empty{color:var(--ash);font-style:italic;font-size:16px;margin:0}

 @media (orientation:landscape) and (max-height:540px){
  body{padding:14px 20px 32px}
  .brand{margin-bottom:14px}
  .brand svg{width:40px;height:40px}
  h1{font-size:26px}
 }

 /* info mark: a 16px glyph in a 44px hit area, opened by tap, tip held on screen */
 .finfo{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-11px -12px -11px -4px;color:var(--gold);font-family:var(--f-display);font-size:14px;font-style:italic;line-height:1;letter-spacing:0;text-transform:none;cursor:pointer;vertical-align:middle;user-select:none}
 .finfo::before{content:'';position:absolute;left:14px;top:14px;width:16px;height:16px;border:1px solid var(--gold);box-sizing:border-box}
 .finfo:hover::before,.finfo.open::before{background:rgba(216,188,106,.14)}
 .finfo .tip{position:absolute;left:0;top:100%;width:min(280px,calc(100vw - 32px));z-index:60;display:none;background:var(--void);border:1px solid var(--hair);padding:12px 14px;color:var(--bone);font-family:var(--f-display);font-size:16px;font-style:normal;letter-spacing:0;text-transform:none;line-height:1.4;text-align:left;font-weight:400}
 .finfo.open .tip{display:block}
 @media (hover:hover){.finfo:hover .tip{display:block}}
</style></head>
<body>
<div class="shell">
 <div class="brand">
  <svg viewBox="0 0 96 96" aria-hidden="true"><path d="M48 24 L62 48 L48 72 L34 48 Z" fill="currentColor"/><path d="M48 24 V72 M34 48 H62" stroke="#0A1124" stroke-width="2.2" fill="none"/><path d="M34 48 Q22 48 24 35" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="M62 48 Q74 48 72 35" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>
  <h1>RelicForge</h1>
 </div>
 <div id="view"></div>
</div>
<script>
/* RelicForge makes one relic and submits it for the vote. The canon relics live on the character
   sheet and in the FellGuide, and the votes in the LoreForge (Nate, 2026-10-13). */
const $=id=>document.getElementById(id);
const BLANK={name:"",group:"Combat",use:"Passive",cost:"",uses:"",rarity:"Common",desc:"",image:"",state:"edit",error:""};
const F=Object.assign({},BLANK);
const GROUPS=["Skill","Combat","Field","Harvest","Other"],USES=["Passive","React","Act","Rest"],RARITY=["Common","Rare","Legendary"];
let waitTimer=null;
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const tip=t=>'<span class="finfo" tabindex="0" role="button" aria-label="What is this">i<span class="tip">'+t+'</span></span>';
const input=(id,val,ph,max)=>'<input type="text" id="'+id+'" maxlength="'+max+'" placeholder="'+esc(ph)+'" value="'+esc(val)+'" autocomplete="off">';
const pick=(id,list,val)=>'<select id="'+id+'">'+list.map(o=>'<option'+(o===val?' selected':'')+'>'+o+'</option>').join("")+'</select>';

function render(){
 const v=$("view");
 if(F.state==="done"){
  v.innerHTML='<div class="done sl-card"><h2>Submitted</h2><p>Your relic goes to the community vote, then the team checks it against the rules.</p><button type="button" id="again">Forge another</button></div>';
  $("again").onclick=()=>{Object.assign(F,BLANK);render();};
  return;
 }
 let h='<div class="forge"><div class="sl-card form-card">';
 h+='<label class="fld" for="f_name">Name</label>'+input("f_name",F.name,"What is it called",60);
 h+='<div class="row2"><div><label class="fld" for="f_group">Group'+tip("The kind of relic: Skill, Combat, Field or Harvest.")+'</label>'+pick("f_group",GROUPS,F.group)+'</div>';
 h+='<div><label class="fld" for="f_use">Use'+tip("When it works: on its own (Passive), with your React, with your Act, or at rest.")+'</label>'+pick("f_use",USES,F.use)+'</div></div>';
 h+='<div class="row2"><div><label class="fld" for="f_cost">Cost'+tip("What it takes to carry or use the relic, in the adventure’s currency of favor or coin.")+'</label>'+input("f_cost",F.cost,"e.g. 30 Arca",30)+'</div>';
 h+='<div><label class="fld" for="f_uses">Uses'+tip("How many times it works before it is spent. Leave open for relics that never run dry.")+'</label>'+input("f_uses",F.uses,"e.g. 1 time use",30)+'</div></div>';
 h+='<label class="fld" for="f_rarity">Rarity'+tip("How rare the relic is in the world. Guides where a LoreMaster would place it.")+'</label>'+pick("f_rarity",RARITY,F.rarity);
 h+='<label class="fld" for="f_desc">Description</label><textarea id="f_desc" maxlength="600" placeholder="State plainly what it does.">'+esc(F.desc)+'</textarea>';
 h+='<label class="fld">Image <em>optional</em></label><label class="uploader">'+(F.image?'<img src="'+esc(F.image)+'" alt=""><span>Change image</span>':'<span>Upload an image</span>')+'<input type="file" id="f_img" accept="image/*"></label>';
 h+='<button class="submit" id="f_submit" type="button">'+(F.state==="sending"?"Submitting":"Submit for the vote")+'</button><p class="err" role="status">'+esc(F.error)+'</p>';
 h+='</div><aside class="preview sl-card" id="preview" aria-label="How it will read"></aside></div>';
 v.innerHTML=h;
 [["f_name","name"],["f_group","group"],["f_use","use"],["f_cost","cost"],["f_uses","uses"],["f_rarity","rarity"],["f_desc","desc"]].forEach(([id,k])=>{$(id).oninput=$(id).onchange=e=>{F[k]=e.target.value;upd();};});
 $("f_img").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{F.image=ev.target.result;render();};r.readAsDataURL(f);};
 $("f_submit").onclick=submit;
 upd();
}
function upd(){
 const p=$("preview");
 if(p){
  let h=F.image?'<img class="pv-img" src="'+esc(F.image)+'" alt="">':'';
  h+='<div class="pv-top"><span class="pv-name'+(F.name.trim()?'':' unnamed')+'">'+(esc(F.name)||"Unnamed relic")+'</span>'+(F.cost.trim()?'<span class="pv-cost">'+esc(F.cost)+'</span>':'')+'</div>';
  h+='<div class="pv-meta"><span class="badge gold">'+esc(F.group)+'</span><span class="badge">'+esc(F.use)+'</span>'+(F.uses.trim()?'<span class="badge">'+esc(F.uses)+'</span>':'')+'<span class="badge">'+esc(F.rarity)+'</span></div>';
  h+=F.desc.trim()?'<p class="pv-desc">'+esc(F.desc)+'</p>':'<p class="pv-empty">What it does.</p>';
  p.innerHTML=h;
 }
 const b=$("f_submit");if(b)b.disabled=F.state==="sending"||!(F.name.trim()&&F.desc.trim());
}
function submit(){
 if(F.state==="sending")return;
 F.state="sending";F.error="";render();
 post({type:"RELIC_SUBMIT",payload:{title:F.name.trim(),tier:F.rarity,form:{group:F.group,use:F.use,cost:F.cost.trim(),uses:F.uses.trim(),rarity:F.rarity,description:F.desc.trim()},image:F.image||null,selections:[]}});
 clearTimeout(waitTimer);
 waitTimer=setTimeout(()=>{if(F.state==="sending"){F.state="edit";F.error="The forge did not answer. Try again.";render();}},30000);
}

function post(msg){try{if(window.parent)window.parent.postMessage(msg,"*");}catch(e){}}
window.onmessage=function(e){
 const m=e&&e.data;if(!m||typeof m!=="object")return;
 if(m.type==="RELIC_SUBMIT_RESULT"){
  clearTimeout(waitTimer);
  if(m.ok)F.state="done";else{F.state="edit";F.error=(m.errors&&m.errors[0])||"That did not save. Try again.";}
  render();
 }
};
render();
</script>
<script>
(function(){
 document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('.finfo'):null;
  document.querySelectorAll('.finfo.open').forEach(function(x){if(x!==t)x.classList.remove('open');});
  if(t){e.preventDefault();e.stopPropagation();t.classList.toggle('open');placeTip(t);}
 });
 /* hold the tip inside the window: 16px from either edge */
 function placeTip(f){var tip=f.querySelector('.tip');if(!tip)return;tip.style.left='0px';var r=f.getBoundingClientRect(),w=tip.offsetWidth||Math.min(280,window.innerWidth-32);var x=Math.max(16,Math.min(r.left,window.innerWidth-16-w));tip.style.left=(x-r.left)+'px';}
 document.addEventListener('mouseover',function(e){var t=e.target.closest?e.target.closest('.finfo'):null;if(t)placeTip(t);});
})();
</script></body></html>
