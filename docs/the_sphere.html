boril take herbal soups and flower wines, food drawn from the growth they tend, and they fill their groves with gentle reed instruments. They dress in floral leathers and woven vines, and they travel by root path through the living hedges. Everything they have is grown, guarded, and a little wild.\u003c/p>","teaser":"The Arboril take herbal soups and flower wines, food drawn from the growth they tend, and they fill their groves with gentle reed instruments.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sylvanoth","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Thaloryn":{"name":"Thaloryn","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Thaloryn","lineage":"The Elken","brand":"Peltharun","art":"Pelttracing","glance":[["Travel","great elk caravans"],["Monsters","Mordels and frost predators"],["What they fear","starvation, and the failed hunt"]],"saying":{"text":"The hunt feeds the clan, and the clan feeds the hunt. Stop either and you have already begun to starve.","attr":"an Elken saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Thaloryn is a world of long winters and longer hunts. Timber halls and antler lodges stand against the cold, hunting horns and war chants roll across the wilds, and the Elken follow the great herds through a land that gives nothing for free. Survival here is the hunt, and the hunt is everything, so that a good season and a bad one are the difference between a clan thriving and a clan that quietly disappears.\u003c/p>","teaser":"Thaloryn is a world of long winters and longer hunts.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Thaloryn","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Peltharun","lead":"Brand of Thaloryn · the art of Pelttracing","teaser":"Peltharun is the Brand of Thaloryn, the working called Pelttracing.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Peltharun","linkLabel":"Peltharun","html":"\u003cp>\u003cem>Also called Pelttracing.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Peltharun is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Thaloryn, the working called Pelttracing. It exists as beast-mark runes, glowing fur patterns, and hunter sigils, a magic of instinct, tracking, and the borrowed strength of beasts. Its tone is instinctive and focused. Its cost is the self's composure, for Pelttracing brings a bestial emotional bleed, the wielder's feelings sharpening toward the raw and the animal the deeper they trace.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Peltharun and the hunter's marks settle over the field. The bound become prey, and a hunter that has marked its prey does not miss. Every blow against them lands true. Call it weak and your own people wear the mark, and the enemy cannot fail to strike them.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>Attacks against the bound side automatically hit.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Frenzied*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Frenzied* breaks out on Conviction.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Pelttracing is the hunter's instinct made into a working.\u003c/p>\u003cul class=\"lst\">\u003cli>Track a quarry across any ground by scent, sign, and instinct.\u003c/li>\u003cli>Borrow a beast's strength, nose, or night-eyes for a stretch of hard country.\u003c/li>\u003cli>Read a creature's nature and intent before it commits to fight or flight.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Elken","lead":"Lineage of Thaloryn","teaser":"The Elken are woodland folk, soft-spoken and sharp-eyed and tuned to the quiet harmony of wild places.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Elken","linkLabel":"The Elken","html":"\u003cp>The Elken are woodland folk, soft-spoken and sharp-eyed and tuned to the quiet harmony of wild places. They move through the forest like whispers, talk to trees as if to old friends, and tend wounded beasts with patient hands. Harming anything without cause is simply foreign to them. Protecting it, though, they do with a quiet precision that catches people off guard.\u003c/p>\u003cp>Their homeland is Thaloryn, a realm of living greenery where the Elken build nothing from stone. They live in woven hollows, cliff-nest groves, and burrows shaped out of vine and wind.\u003c/p>\u003cp>They are lithe and graceful, hair wild as bramble and eyes deep and earnest, and they eat no meat, living on leaves and roots and fruit. None of which should be mistaken for softness. Threaten their home and an Elken will have a bow strung before you have finished the sentence.\u003c/p>\u003cdiv class=\"sub\">Roleplaying an Elken\u003c/div>\u003cp>Elken are gentle but brave, peacekeepers who value harmony over conflict, yet will not hesitate to defend the balance of life when pushed.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Using nature as an extension of your character: communing with it, reading signs, drawing comfort from it.\u003c/li>\u003cli>Allowing your pacifist philosophy to shape difficult decisions.\u003c/li>\u003cli>Playing out the challenges of your lifestyle: refusing meat, spurning man-made structures, seeking untouched places.\u003c/li>\u003cli>Portraying deep emotional bonds with animals and natural spirits, perhaps even deeper than those with people.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Elken gain +1 to their Elusion skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;If you would harm the wild, you may leave now. Or stay, and be buried beneath it.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Elken of Thaloryn\u003c/div>\u003cp>The Elken are nomadic hunting clans, hardy and instinctive, bound to the herds they follow and the beasts whose marks they bear. They are practical and proud, measuring worth by skill in the hunt and steadiness through hardship. They keep beast ancestor traditions, honoring the creatures that sustain them and the line of hunters who came before, and they fear above all the failed hunt and the starvation that follows it.\u003c/p>"},{"key":"lb:The Mordel","tag":"Lorebound","rune":"ᛈ","title":"The Mordel","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Mordel","linkLabel":"The Mordel","teaser":"The Mordel is a hulking, bearlike lorebound from the frost-forged peaks of Thaloryn, homeland of the Elken.","html":"\u003cp>The Mordel is a hulking, bearlike lorebound from the frost-forged peaks of Thaloryn, homeland of the Elken. Rigid black spines push up through its shaggy coat. These things were bred to do exactly one job, which is to endure. Avalanche, predator, or blade, the Mordel does not give ground, and neither do the Fell bonded to one.\u003c/p>\u003cp>Their patience is not natural. Threatened, a Mordel roots itself like stone and takes the hit with a glacier's calm. The cubs are taught not to flinch but to brace. As the bond with a Fell deepens, that stillness bleeds across, and the Fell turns into a fortress that happens to be walking.\u003c/p>\u003cp>In \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Transmogrifications/Corsair\" target=\"_blank\" rel=\"noopener\">Corsair\u003c/a> form all that bulk becomes a battering ram. Each slow step shakes the ground, and the sheer weight of it grinds down anything that wanders too close.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Adamant\u003c/strong>. Shrugs off a blow's bite and sends it back at the striker.\u003c/p>\u003c/div>"},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Thaloryn","teaser":"The Faelir.","html":"\u003cdiv class=\"sub\">Powers\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/The+Factions/The+Faelir\" target=\"_blank\" rel=\"noopener\">The Faelir\u003c/a>\u003c/div>\u003cp>The Faelir are fae spirits that drift between the realms and never quite belong to any of them.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Thaloryn builds to move and to endure. Timber halls and antler lodges are raised at the seasonal grounds, sturdy enough to shelter a clan and simple enough to leave behind when the herds move on. Travel runs on great elk caravans that follow the herds across the wilds.\u003c/p>","teaser":"Thaloryn builds to move and to endure.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Thaloryn","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Thaloryn is beast ancestor tradition, reverence for the creatures that feed the clans and the ancestral hunters whose instincts live on in their descendants. The Elken honor the herd and the hunt as sacred, holding that to take without respect is to invite the failed hunt and the hunger that ends clans.\u003c/p>","teaser":"Faith in Thaloryn is beast ancestor tradition, reverence for the creatures that feed the clans and the ancestral hunters whose instincts live on in their descendants.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Thaloryn","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Thaloryn","html":"\u003cp>The Elken take roasted game and berry stews, food won from the hunt and the land, and they fill their lodges with hunting horns and war chants. They dress in furs and antler adornments, marks of skill and survival, and they travel by great elk caravan. Everything in their lives bends toward the next hunt.\u003c/p>","teaser":"The Elken take roasted game and berry stews, food won from the hunt and the land, and they fill their lodges with hunting horns and war chants.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Thaloryn","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"The Scere":{"name":"The Scere","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/The+Scere","lineage":"The Vate","brand":"Scerinyx","art":"Fatescorn","glance":[["Travel","unstable pathways"],["Monsters","probability horrors and curse beasts"],["What they fear","destiny itself"]],"saying":{"text":"Fate is a road they paved for you. We taught ourselves to dig.","attr":"a Vate saying"},"soon":"\u003cp>This world carries a recorded hint: that Fatescorn can wound probability itself. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>The Scere is a world where chance refuses to lie flat. Its landscape twists into probability structures that should not hold their shape, paths that lead somewhere different each time they are walked, and skies that seem to be deciding what to be. Broken melodies drift through it with no clear source. To outsiders it feels cursed. To the people who live there, it is simply honest about something every other world hides, that nothing was ever as fixed as it pretended to be. The people who live there speak of the Scere as if it were awake, and the ones who have wounded fate the deepest stop arguing the point.\u003c/p>","teaser":"The Scere is a world where chance refuses to lie flat.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/The+Scere","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Scerinyx","lead":"Brand of The Scere · the art of Fatescorn","teaser":"Scerinyx is the Brand of The Scere, the working the world calls Fatescorn.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Scerinyx","linkLabel":"Scerinyx","html":"\u003cp>\u003cem>Also called Fatescorn.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Scerinyx is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of The Scere, the working the world calls Fatescorn. It exists as fractured probability lines and broken symbols, a magic that does not bend luck so much as cut into it, wounding the certainty of an outcome until other possibilities bleed through. Its tone is cynical and fatalistic, and its cost is severe. To scorn fate is to invite its collapse, and Fatescorn leaves bad-luck resonance trailing behind its users like a wake, settling on everything and everyone nearby.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Scerinyx and the certainty of the fight comes apart. Once each round the favored side simply decides one of its own dice, scorning the roll and naming the result outright. Call it weak and the enemy is the one dictating fate, your luck bleeding out around them.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>Once each round, the favored side may set one of its dice to any result.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Disrupted*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Disrupted* breaks out on Weaving.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Fatescorn refuses the future that was written.\u003c/p>\u003cul class=\"lst\">\u003cli>Cut into a fixed outcome to force a different possibility through, at a price.\u003c/li>\u003cli>Read where fate has been broken or bent, and by whom.\u003c/li>\u003cli>Lay a wake of ill fortune across a path, a door, or a pursuer behind you.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Vate","lead":"Lineage of The Scere","teaser":"The Vate, called the Bornasin across the Sphere, are fractured spirits dragged back into being wherever the earth has swallowed too many forgotten bodies.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Vate","linkLabel":"The Vate","html":"\u003cp>The Vate, called the Bornasin across the Sphere, are fractured spirits dragged back into being wherever the earth has swallowed too many forgotten bodies. From that buried ground they pull themselves a body, an assembly of mud, old bone, and grasping hands held upright by the penitent ghost that wears it. They are named the spirits of many hands, because it is arms, more than anything, that keep them together. The story goes that the dirt itself pities them, and the mud climbs their frame to help them stand. Every Vate carries one forgotten but damning sin, an act so destructive it cursed them to walk the world as a reminder, and maybe a warning.\u003c/p>\u003cp>They have no true homeworld. They are pulled into being by the Scere, a cosmic force of judgment said to reach across the realms. Some call the Scere a divine echo. Others call it cruel fate made solid. Everyone agrees it never errs. None of them suspect that the judgment is not blind. Something weighs them, and chooses, and what it wants has never been said.\u003c/p>\u003cp>For all the grim and fearsome shape of them, the Vate are gentle, quiet, and sorrowful. They wander not for vengeance but in search of meaning and some kind of redemption, and they rarely stay anywhere long, partly by instinct and partly because others fear what they seem to see.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Vate\u003c/div>\u003cp>Vate are soft-spoken seekers, bound by shame and sorrow but driven by compassion. They are a walking contradiction: eerie in form, empathetic in soul.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Emphasizing their redemptive arc by seeking to heal or undo harm they once caused, even if they no longer remember what it was.\u003c/li>\u003cli>Using their skeletal form as a symbol: unsettling yet noble, a reminder that appearances are not truth.\u003c/li>\u003cli>Highlighting their ability to sense guilt, sorrow, or pain in others, their empathy amplified by judgment.\u003c/li>\u003cli>Incorporating the Scere as a lingering mystery that shapes how they move through the world.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Vate gain +1 to their Sanctum skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;I do not remember what I did. Only that it was enough.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Vate of The Scere\u003c/div>\u003cp>The Vate are a people who looked at destiny and refused it. They gather in isolated cult circles rather than nations, each clinging to its own hard-won way of slipping the path laid out for it. They are wary, fatalistic, and stubborn in a way that reads as despair until you understand it as defiance. To be Vate is to believe that fate can be wounded, and to pay for that belief.\u003c/p>"},{"title":"Architecture and Cities","html":"\u003cp>The Scere's structures rise as twisted probability forms, buildings that seem to occupy several possible shapes at once and settle on one only when observed. Travel runs along unstable pathways that cannot be fully trusted to arrive where they began.\u003c/p>","teaser":"The Scere's structures rise as twisted probability forms, buildings that seem to occupy several possible shapes at once and settle on one only when observed.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/The+Scere","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Belief in The Scere is built on the rejection of fate. The cult circles do not pray for fortune. They train to refuse it, treating destiny as an enemy to be evaded rather than a will to be obeyed.\u003c/p>","teaser":"Belief in The Scere is built on the rejection of fate.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/The+Scere","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in The Scere","html":"\u003cp>The Vate take bitter roots and omen teas, food and drink chosen as much for reading signs as for sustenance. Their music comes as broken melodies, and they dress in tattered layered wraps suited to a world that rarely stays still. They cross it by unstable pathways, trusting instinct over any map, because no map here holds for long.\u003c/p>","teaser":"The Vate take bitter roots and omen teas, food and drink chosen as much for reading signs as for sustenance.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/The+Scere","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Therion":{"name":"Therion","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Therion","lineage":"The Thurani","brand":"Tempralis","art":"Tempraling","glance":[["Travel","time rails and phase paths"],["Monsters","chronobeasts and temporal echoes"],["What they fear","losing time, and losing themselves"]],"saying":{"text":"Spend an hour carelessly and it spends you back, with interest.","attr":"a Thurani saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Therion is a world where time does not run straight. Timeworn temples stand beside shifting cities that are not quite where they were yesterday, echoing drums and layered rhythms keep a beat that helps the living stay anchored, and temporal echoes drift through the streets like weather. To live here is to be careful with hours the way other peoples are careful with coin, because in Therion time is something that can be saved, squandered, and stolen.\u003c/p>","teaser":"Therion is a world where time does not run straight.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Therion","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Tempralis","lead":"Brand of Therion · the art of Tempraling","teaser":"Tempralis is the Brand of Therion, the working called Tempraling.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Tempralis","linkLabel":"Tempralis","html":"\u003cp>\u003cem>Also called Tempraling.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Tempralis is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Therion, the working called Tempraling. It exists as distorted motion blur, temporal fractures, and echo afterimages, a magic of bending the flow of time around the wielder. Its tone is tense and strategic, a craft of timing and consequence rather than raw force. Its cost is the wielder's own span, for Tempraling brings accelerated aging and a deep temporal fatigue, spending the years it borrows.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Tempralis and time seizes around the bound. Caught between two heartbeats, they can neither act nor react, frozen out of the fight while it moves on without them. Call it weak and it is your own people time leaves behind.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>Bound creatures may take neither an Act nor a React.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Frozen*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Frozen* breaks out on Bearing.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Tempraling bends time, and charges the years for it.\u003c/p>\u003cul class=\"lst\">\u003cli>Hold a moment a little longer, a fall, a fuse, a closing door.\u003c/li>\u003cli>Read the echoes of what happened in a place, played back out of time.\u003c/li>\u003cli>Spend your own years to hurry a slow work to its end.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Thurani","lead":"Lineage of Therion","teaser":"The Thurani are towering beastfolk, horned and furred and shaped for war.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Thurani","linkLabel":"The Thurani","html":"\u003cp>The Thurani are towering beastfolk, horned and furred and shaped for war. Their bodies speak to raw strength, and their faces carry the scars of having survived plenty of it. Half humanoid and half animal, they are defined by endurance rather than savagery, whatever outsiders assume. Many have been enslaved as gladiators, mercenaries, or warbeasts, and they remain a proud, ancient people still fighting to take their legacy back.\u003c/p>\u003cp>They come from Therion, a world worn down by endless conflict, barren plains under jagged mountains, the magical fallout of forgotten wars still simmering in the soil beneath elemental storms.\u003c/p>\u003cp>Their fur runs in shades of coal and earth, their horns curve like a goat's, and long beards trail windswept behind them. The yellow or green eyes hold more than instinct. There is deep thought in them, and a fair amount of bitter memory.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Thurani\u003c/div>\u003cp>Thurani are shaped by hardship. They honor strength but respect cunning. They are quick to fight, but only for something worth bleeding for. Their loyalty runs deeper than blood and their pride is not easily broken.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Emphasizing their code of honor: strength without cruelty, pride without arrogance.\u003c/li>\u003cli>Drawing from their enslaved history or warrior upbringing to fuel their goals.\u003c/li>\u003cli>Playing up their strategic and tactical mindset in battle.\u003c/li>\u003cli>Using the ruin and elemental chaos of Therion as spiritual or cultural touchstones.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Thurani gain +1 to their Might skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;Chains cannot hold a name carved in battle.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Thurani of Therion\u003c/div>\u003cp>The Thurani are an ordered, watchful people governed by strict chronologer castes, keepers of schedule, sequence, and the careful measurement of time. They revere fate and the timeline, and they distrust anything that disturbs the order of before and after. Their gravest fear is to slip out of sequence, to lose their place in time and, with it, the thread of who they are.\u003c/p>"},{"title":"Architecture and Cities","html":"\u003cp>Therion builds against the drift. Timeworn temples are raised to outlast the centuries that pass unevenly here, and the shifting cities are designed to be re-found, marked with rhythm and rune so the living can locate them again after time has moved them. Travel runs on time rails and phase paths that cut across the uneven flow.\u003c/p>","teaser":"Therion builds against the drift.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Therion","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Therion is reverence for fate and the timeline, the belief that sequence is sacred and that disturbing it is both sin and danger. The chronologer castes serve as its priesthood, guarding the order of events and the careful, anxious peace of a world that could so easily come unstuck.\u003c/p>","teaser":"Faith in Therion is reverence for fate and the timeline, the belief that sequence is sacred and that disturbing it is both sin and danger.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Therion","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Therion","html":"\u003cp>The Thurani take preserved meats and aged fruits, food that keeps against a world where time is unreliable. Their music is echoing drums and layered rhythms that double as anchors, and they dress in layered robes set with clockwork adornments. They cross their world by time rail and phase path, trusting the rhythm to keep them in sequence.\u003c/p>","teaser":"The Thurani take preserved meats and aged fruits, food that keeps against a world where time is unreliable.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Therion","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Ursathar":{"name":"Ursathar","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Ursathar","lineage":"The Boxunin","brand":"Bruingar","art":"Bruinbracing","glance":[["Travel","mammoth caravans"],["Monsters","mountain beasts and cave horrors"],["What they fear","dishonor, and weakness"]],"saying":{"text":"A mountain does not boast that it cannot be moved. It simply is not moved. Be the mountain.","attr":"a Boxunin saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Ursathar is a world of high peaks and deep stone. Mountain halls and stone dens are carved into the cliffs and caverns, drum circles and booming chants echo through the ranges, and the Boxunin endure the cold heights with a patience as old as the rock. Strength here is not loud. It is steady, honored, and proven over a lifetime, and the worst thing a Boxunin can be is not weak by accident but dishonored by choice.\u003c/p>","teaser":"Ursathar is a world of high peaks and deep stone.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Ursathar","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Bruingar","lead":"Brand of Ursathar · the art of Bruinbracing","teaser":"Bruingar is the Brand of Ursathar, the working called Bruinbracing.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Bruingar","linkLabel":"Bruingar","html":"\u003cp>\u003cem>Also called Bruinbracing.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Bruingar is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Ursathar, the working called Bruinbracing. It exists as earthen shockwaves and stone-hide resonance, a protective magic of bracing, enduring, and standing immovable against any force. Its tone is protective and immovable. Its cost is the body's reserves, for Bruinbracing demands deep physical exhaustion, spending the wielder's stamina to hold the line, though it spares the soul the corruptions that crueler Brands inflict.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Bruingar and the earth braces beneath the favored side, stone-hide settling over them. While it holds they will not fall, taken to the brink and no further, immovable against any force. Call it weak and it is the enemy the earth refuses to let die.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The favored side cannot be reduced below 1 \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Attributes/Other+Attributes/Vitality\" target=\"_blank\" rel=\"noopener\">Vitality\u003c/a>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Agonized*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Agonized* breaks out on Bearing.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Bruinbracing is the craft of standing where others are swept away.\u003c/p>\u003cul class=\"lst\">\u003cli>Stand immovable against a force that would carry others off, a flood, a fall, a charge.\u003c/li>\u003cli>Brace a failing structure or hold a collapse long enough for others to pass.\u003c/li>\u003cli>Send a shock through the ground to test it, break it, or take the footing from a foe.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Boxunin","lead":"Lineage of Ursathar","teaser":"The Boxunin are towering, fur-covered giants with hearts to match the frame.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Boxunin","linkLabel":"The Boxunin","html":"\u003cp>The Boxunin are towering, fur-covered giants with hearts to match the frame. Broad-shouldered, soft-eyed, with claws that shred bark or bone just as easily, they are built for defending and for holding on. They feel everything hard, and the bonds they form do not break.\u003c/p>\u003cp>They come from Ursathar, a green sprawl of deep woods, mossy glades, and valleys shadowed by mountains, loud with birdsong and rustling leaves. Once a year the whole world goes quiet for three months, a hush they call The Still. Nothing stirs, nothing creaks, and the Boxunin retreat into hibernation to honor it. It is a sacred kind of silence, soft and heavy and complete.\u003c/p>\u003cp>Cross a Boxunin and you have crossed something with no ceiling on it. Earn one's care and you are wrapped in something that does not come apart.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Boxunin\u003c/div>\u003cp>Boxunin are passionate, tender-hearted, and formidable. Their emotional world is vast and vivid, and they feel everything with intensity: grief, joy, rage, and love.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Playing up their nurturing instincts. Offering shelter, food, comfort, or fierce protection without hesitation.\u003c/li>\u003cli>Reacting to events with emotional honesty. Tears, laughter, or fury, unfiltered and raw.\u003c/li>\u003cli>Honoring The Still, perhaps with ritual, preparation, or even panic if it is missed.\u003c/li>\u003cli>Building strong party bonds. Once a Boxunin claims someone as kin, that bond is not negotiable.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Boxunin gain +1 to their Durability attribute upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;When the forest sleeps, I sleep. When it cries, I rise.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Boxunin of Ursathar\u003c/div>\u003cp>The Boxunin are a people of strength-based clans, broad and immovable, valuing endurance, honor, and steadfastness above flash or speed. They are slow to anger and slower to yield, and they hold dishonor and weakness as the same failing wearing different faces. They keep ancestor bear worship, honoring the great beasts whose strength and stubbornness they aspire to match.\u003c/p>"},{"title":"Architecture and Cities","html":"\u003cp>Ursathar builds into the mountain itself. Mountain halls and stone dens are carved from the living rock, warm against the cold and strong against siege, meant to outlast generations. Travel runs on mammoth caravans that haul clans and goods across the high passes.\u003c/p>","teaser":"Ursathar builds into the mountain itself.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Ursathar","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Ursathar is ancestor bear worship, reverence for the mighty beasts and the forebears whose strength and honor the living strive to uphold. The clans honor steadfastness as sacred, holding that to stand firm, to endure, and to keep one's honor is the truest devotion a Boxunin can offer.\u003c/p>","teaser":"Faith in Ursathar is ancestor bear worship, reverence for the mighty beasts and the forebears whose strength and honor the living strive to uphold.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Ursathar","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Ursathar","html":"\u003cp>The Boxunin take heavy meats and fermented drinks, hearty fare for a hardy people, and they fill their halls with drum circles and booming chants. They wear thick hides and warpaint, and they travel by mammoth caravan through the high country. Their whole way of life is built to stand, endure, and refuse to be moved.\u003c/p>","teaser":"The Boxunin take heavy meats and fermented drinks, hearty fare for a hardy people, and they fill their halls with drum circles and booming chants.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Ursathar","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Valoria":{"name":"Valoria","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","lineage":"The Dweller","brand":"Ectolume","art":"Tetherghasting","glance":[["Travel","Runesteeds, guarded caravans, and the old roads"],["Monsters","Rendrals, Veilborn, and Dreadpelts"],["What they fear","being erased, and the Queen behind the Veil"]],"saying":{"text":"A kingdom does not die when its king falls. It dies when the last person who remembers his name forgets it.","attr":"a Valorian saying"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Valoria is a kingdom in the long process of forgetting itself. Snow lies over ruined keeps and ancient castles, blue faeliri lanterns line the roads to hold the darkness back beyond the tree line, and the halls still standing glow faintly with the residue of old resonance. It was once a single realm under one great crown, ruled by King Arandon. Now it is a scatter of fragmented territories held by councils, nobles, and desperate protectors, each clinging to a piece of a story none of them can finish telling, because the story itself has been damaged.\u003c/p>\u003cp>The Dwellers speak the name of that damage carefully. The Withering. It is a blight on the land and a blight on memory at once, a slow unraveling in which villages, names, and whole histories thin out and go quiet. Where memory fails, reality frays, and in the frayed places the rendrals and the Veil-touched wake and hunt. To live in Valoria is to hold tight to what you remember as though it were a weapon, because here it is one.\u003c/p>","teaser":"Valoria is a kingdom in the long process of forgetting itself.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Ectolume","lead":"Brand of Valoria · the art of Tetherghasting","teaser":"Ectolume is the Brand of Valoria, the forbidden art its practitioners call Tetherghasting.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Ectolume","linkLabel":"Ectolume","html":"\u003cp>\u003cem>Also called Tetherghasting, or simply Tetherghast.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Ectolume is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Valoria, the forbidden art its practitioners call Tetherghasting. It is a resonance craft of the dead, binding and channeling the lingering souls that death, tragedy, and unresolved grief leave behind. A Tetherghaster forges a tether between themselves and a wandering echo, then draws on it for strength, knowledge, and protection, binding spectral force into weapons, armor, relics, lanterns, and their own body.\u003c/p>\u003cp>The power gathers wherever the dead lie thickest. Ancient battlefields, grave sites, forgotten ruins, and the zones the Veil has corrupted all run strong with it, and a skilled Tetherghaster can call a ghostly blade, a spectral guardian, or a wall of raw fear out of that residue. Some frontier settlements quietly depend on the art to hold off rendrals and Veil corruption when nothing else will answer.\u003c/p>\u003cp>Most Valorians fear it all the same. To bind a soul is to walk the same road the Veiled Queen walks, and repeated working is said to wear the practitioner's own spirit thin, drawing them by degrees toward identity loss, spectral obsession, and the influence of the Veil itself. The line between warding off \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Discord\" target=\"_blank\" rel=\"noopener\">Discord\u003c/a> and being claimed by it has always been a narrow one, and Ectolume is never far from either side of it.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Ectolume and the ground gives up its dead. The cold comes first, then a thin gray grave-light, and the fallen who never left Valoria rise across the field. They do not ask whose war this is. They answer the strength of the call and choose their side by it.\u003c/p>\u003cp>When the call lands true, the dead claim the fallen for you. Every enemy cut down rises again at your shoulder, until the foe is fighting their own dead as much as the Fell. When it comes weak, your own dead turn and stand against you, and every loss becomes the enemy's gain. Either way the Veil draws a little nearer, and the Veiled Queen is always glad to collect on a tether left open too long.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>A bound creature reduced to 0 \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Attributes/Other+Attributes/Vitality\" target=\"_blank\" rel=\"noopener\">Vitality\u003c/a> rises and fights for the favored side for the rest of the battle.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Terrorized*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Terrorized* breaks out on Conviction.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Tetherghasting is a quiet art of the lingering dead, and most of it resolves on a skill roll the LoreMaster sets.\u003c/p>\u003cul class=\"lst\">\u003cli>Question an echo about what happened in a place, a death, a battle, a thing someone wanted buried.\u003c/li>\u003cli>Find where the dead lie, an unmarked grave, a body in the water, the spot where an old killing happened.\u003c/li>\u003cli>Borrow a dead hand for a while, a fallen smith's craft, a scholar's memory, a soldier's eye for ground.\u003c/li>\u003cli>Light Discord-haunted dark with a tethered echo, or set one to ward a doorway, a camp, a sleeping ally.\u003c/li>\u003cli>Lay a restless haunting to rest, or wake one that should have stayed quiet.\u003c/li>\u003c/ul>\u003cp>The cost never changes. Lean on the dead too often and the Veil leans back.\u003c/p>\u003cdiv class=\"sub\">Ectolume in Valoria\u003c/div>\u003cp>Ectolume is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Valoria, the forbidden art the world calls Tetherghasting. It binds the lingering souls that death and grief leave behind, and a Tetherghaster forges a tether to those wandering echoes and draws spectral force into weapons, armor, lanterns, and their own body. It shows as pale teal soulfire and ghostly chains, melancholic and heroic both, the magic of a people who refuse to let go. Most Valorians fear it, yet frontier villages reluctantly depend on it against the rendrals and the Veil, and its cost is the steepest kind. To bind souls too often is to be slowly hollowed and drawn toward the same Veil that hunts the realm.\u003c/p>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Dweller","lead":"Lineage of Valoria","teaser":"The Dwellers are the adaptable heartbeat of the Sphere.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Dwellers","linkLabel":"The Dweller","html":"\u003cp>The Dwellers are the adaptable heartbeat of the Sphere. They look the most human of any lineage, but their real strength was never in blood or bone. It is in their knack for enduring, adapting, and changing to fit whatever the world throws at them. Born across countless worlds, they carry the legacy of lands still thriving and lands long fallen.\u003c/p>\u003cp>They hail from everywhere. The quiet valleys of Valoria, the mist-drenched forests of Hirayama, the cracked glass deserts of Pyranthia, the frostbitten reaches of Norska, and a hundred places past those. No two Dwellers share an origin, and yet they all share the one trait that matters, which is that they are still here.\u003c/p>\u003cp>Physically they come in every shape there is, tall and short, lean and broad, colored and customed by wherever they were raised. A Dweller does not always stand out in a room. They always belong in it.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Dweller\u003c/div>\u003cp>Dwellers are pragmatic thinkers and curious explorers. Whether bold or cautious, they are driven by the need to understand and overcome. Their vast range of histories allows them to adapt socially, culturally, and strategically to almost any situation.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Leaning into their versatility as a generalist with a few surprising specialties.\u003c/li>\u003cli>Drawing from one of the listed origin worlds to flavor your personality, speech, or beliefs.\u003c/li>\u003cli>Emphasizing their ability to blend in, earn trust, and learn quickly.\u003c/li>\u003cli>Exploring themes of identity, diaspora, or the desire to build something lasting.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Dwellers gain +1 to their Resolve skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;Everywhere is home, if you survive long enough.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Dweller of Valoria\u003c/div>\u003cp>The Dwellers are a hardy, oath-bound people, gathered into fragmented kingdoms and the knightly orders that outlasted them. Older than Valoria itself, they were wanderers and survivors long before they settled its roads, and they keep faith with old crowns and dead kings out of a conviction that what is remembered cannot be wholly lost. They carry their history in ballad and chime because written records have a way of going blank, and they meet strangers with weathered courtesy and slow, hard-earned trust. Loyal and quietly grieving, they are a people haunted by a glory they can almost remember and can no longer prove.\u003c/p>"},{"title":"The Runesteed","html":"\u003cp>The Runesteed is the \u003ca href=\"https://fellguide.com/The+FellGuide/Quick+Links/Lorebounds\" target=\"_blank\" rel=\"noopener\">Lorebound\u003c/a> of Valoria, a powerful rune-marked riding beast and the most dependable companion on the dangerous roads between settlements. Intelligent, stubborn, and fiercely loyal once bonded, a Runesteed grows agitated near corruption and rendrals and unnatural silence, and many old stories hold that it senses darkness long before its rider can. The herds run to many kinds, the war-bred Ironmanes, the tireless Longstriders of the caravan roads, and the Frostmanes of the cold high country.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Redoubt\u003c/strong>. Raises stone between a Fell and what comes for them.\u003c/p>\u003c/div>","teaser":"The Runesteed is the Lorebound of Valoria, a powerful rune-marked riding beast and the most dependable companion on the dangerous roads between settlements.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Runesteed","key":"lb:The Runesteed","tag":"Lorebound","rune":"ᛈ","linkLabel":"The Runesteed"},{"key":"campaign","tag":"The Fell","rune":"ᛟ","title":"The Shattering of Valoria","teaser":"Four strangers woke in the Whispering Woods with no memory of how they came, pulled into Valoria by something that wanted them there.","html":"\u003cp>Four strangers woke in the Whispering Woods with no memory of how they came, pulled into Valoria by something that wanted them there. Garrik the Old found them with a lantern and a warning, and told them of Eldervale at the forest's edge and the sickness eating through it. The woods did not let them leave clean. They walked out with a pack of Rendrals howling at their backs and a kingdom coming apart ahead of them.\u003c/p>\u003cp>The hunt for the shattered Crown of Valoria runs through every chapter that follows.\u003c/p>\u003cp>\u003ca class=\"watch-link\" href=\"https://www.youtube.com/live/X99Y_iTfsZs\" target=\"_blank\" rel=\"noopener\">&#9654;&nbsp; Watch The Shattering of Valoria on YouTube\u003c/a>\u003c/p>","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Histories/The+Shattering+of+Valoria/The+Shattering+of+Valoria","linkLabel":"The Shattering of Valoria"},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","teaser":"The Veiled and The Veiled Queen.","html":"\u003cdiv class=\"sub\">Powers\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/The+Factions/The+Veiled\" target=\"_blank\" rel=\"noopener\">The Veiled\u003c/a>\u003c/div>\u003cp>The Veiled are the servants of the Veil, the disguised face Discord wears to reach into mortal hearts without ever showing its own.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Aspects of Discord\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Aspects+of+Discord/The+Veiled+Queen\" target=\"_blank\" rel=\"noopener\">The Veiled Queen\u003c/a>\u003c/div>\u003cp>The Veiled Queen is the Aspect of Discord that rules the ruin of Valoria, and of all the Aspects she sits closest to the wound, for Valoria is the world where…\u003c/p>\u003c/div>"},{"title":"The Crown and the Shattering","html":"\u003cp>Valoria's wound runs back to a shattered crown. King Arandon ruled the realm whole beneath the Crown of Valoria, until Lord Brannis turned the blade Sunderbane upon him and erased him from the world, cut so cleanly out of history that even those who would save Valoria can no longer fully recall what was lost. The stroke shattered the Crown and frayed the realm's shared memory in the same instant, and the Crown Shards scattered across the land.\u003c/p>\u003cp>Calevar, the Rekindled King, is the last heir of that erased line, the stepson of a father the world no longer remembers. He was woken with the placing of the first shard and rose already corrupted, his spirit tethered to the Veil, and the Queen has since closed her hand around him. Beneath the ruin of Arandon's Keep rests Sunderbane itself, and the oldest whisper in Valoria holds that the sword which erased a king was once used to end something far greater. The seals around it are weakening again.\u003c/p>","teaser":"Valoria's wound runs back to a shattered crown.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"The Veiled Queen","html":"\u003cp>The ruin of Valoria belongs to the Veiled Queen, the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Aspects+of+Discord/Aspects+of+Discord\" target=\"_blank\" rel=\"noopener\">Aspect of Discord\u003c/a> that drew its first breath here, for this is the world where Malvaro was unmade. She was no invader out of nowhere. The shard of that unmaking found a queen already breaking, Arandon's wife and Calevar's mother, and when the same stroke took her husband and her son from her reality at once, her grief tore open a wound that \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Discord\" target=\"_blank\" rel=\"noopener\">Discord\u003c/a> poured through. She unmade her own past to escape the pain of it, and now she hunts and erases anything that resembles the life she can no longer name, her own son among it. Her court labors to keep the true history buried beneath the Withering and to leave hers the only version that remains.\u003c/p>","teaser":"The ruin of Valoria belongs to the Veiled Queen, the Aspect of Discord that drew its first breath here, for this is the world where Malvaro was unmade.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Cities and Strongholds","html":"\u003cp>Valoria's surviving places huddle behind their lanterns. Eldervale is a weathered border village beneath the great western Wallbridge, its faeliri lantern barrier holding back the Whispering Woods, often the first refuge for travelers entering the western reaches. The Silver Veil Highlands is one of the last great strongholds, a gothic city of silver-gray stone and chain-draped keeps ruled by Lady Seraphina and held by her Highland Knights and Silver Talon officers, grand and strained and quietly riddled with Veiled Court infiltration. The Broken Spire is the shattered fortress-laboratory once ruled by Lord Brannis, still crawling with his Dreadpelts and the remnants of his Dreadbound. Sanctuary Arvonis is an ancient sacred refuge carved into the cliffs of the Western Wastes, home of the Chalice of Purity and guarded by the spectral kings of Valoria's past. The Cradle of Embers is a volcanic fortress region, the domain of Vaelric and his Ember Legion, where one of the final Crown Shards lies hidden in the Ember Fort. Above them all stands Arandon's Keep, the ruined royal stronghold where the king was erased, the resting place of Sunderbane, its dead halls hung with drifting Veiled threads.\u003c/p>","teaser":"Valoria's surviving places huddle behind their lanterns.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"The Whispering Woods","html":"\u003cp>The wood on Eldervale's western edge goes by three names. Valorians call it the Whispering Woods for the sound that runs through it, the Whispered Ashwood for what made it, and the Rotwood for what it became. No flame ever burned it. Erasure did, when Discord's shadow brushed Valoria during Malvaro's last stand and whole villages lost their histories and their names in a single stroke. The people there died without dying cleanly. Their bodies fell, and their stories were never allowed to finish. The trees grew up afterward through the residue of those unremembered lives, blackened and split and leaning wrong, and the wood still holds the half-spoken endings of the dead. Those who linger too long claim to hear them, faint voices reaching for the last of a story no one will ever let them tell. The faeliri lanterns at Eldervale hold the worst of it back, and the corruption rooted there still births the Rendrals.\u003c/p>","teaser":"The wood on Eldervale's western edge goes by three names.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"The Factions","html":"\u003cp>A broken realm is held and torn by many hands.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Faction\u003c/th>\u003cth>What they want\u003c/th>\u003c/tr>\u003ctr>\u003ctd>The Veiled Court\u003c/td>\u003ctd>Spread the Veiled Queen's corruption and keep her false history buried.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Fractured Councils\u003c/td>\u003ctd>Hold their splintered territories together, each ruling a piece of a broken realm.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Thornwick Rebels\u003c/td>\u003ctd>Overthrow corrupt rulers and expose the Queen's grip on Valoria's leadership.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Highland Knights\u003c/td>\u003ctd>Keep order under Seraphina's banner, feared for brutality, quietly doubting their lady.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Ember Legion\u003c/td>\u003ctd>Guard the Cradle of Embers and the shard hidden in Vaelric's domain.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Dreadbound\u003c/td>\u003ctd>Carry on Lord Brannis's horrors, his mutated remnants still hunting from the Spire.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Last Chevaliers\u003c/td>\u003ctd>Guard the relics, tombs, and forgotten legacy of King Arandon.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Outcast Survivors\u003c/td>\u003ctd>Live one more season behind their lantern wards.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","teaser":"A broken realm is held and torn by many hands.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","key":"factions","tag":"Powers","rune":"ᚨ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Valoria is crown faith and ancestral remembrance bound into one. To remember is devotion. The dead kings, the old oaths, and the names of the lost are honored in rite and ballad, and a Dweller's gravest duty is to carry memory forward so that nothing worthy slips into the Withering unmarked. In a world where the Veiled Queen erases what she touches, to be remembered is the closest thing left to being saved.\u003c/p>","teaser":"Faith in Valoria is crown faith and ancestral remembrance bound into one.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","key":"sec:5","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Withering\u003c/div>\u003cp>The unraveling of land and memory spreads, taking villages, names, and whole histories, and waking horrors in the gaps it leaves. The Veiled Court works to keep it spreading and the true past buried beneath it.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Shattered Crown\u003c/div>\u003cp>The Crown Shards lie scattered across the realm. Whoever gathers them might restore Valoria's memory and rulership, or rewrite its history a second time in their own favor.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Veiled Court\u003c/div>\u003cp>The Queen's corrupted agents infiltrate councils and courts, and her sigil turns up where it should not. Few who serve her have any idea what she truly is.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">Sunderbane Stirring\u003c/div>\u003cp>The blade that erased Arandon rests beneath his ruined keep, and the old seals around it weaken. The few whispers that survive say it was forged to end something far greater than any king.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Queen Behind the Veil\u003c/div>\u003cp>The wisest fear the Veiled Queen was never native to Valoria, that she is a fragment of the catastrophe that ended here, one face of a shadow that wears others across \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/The+Sphere\" target=\"_blank\" rel=\"noopener\">the Sphere\u003c/a> and lingers longest where it was born.\u003c/p>\u003c/div>","teaser":"The Withering, The Shattered Crown, The Veiled Court, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Verdantia":{"name":"Verdantia","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Verdantia","lineage":"The Sprittle","brand":"Cyclesong","art":"Cyclesing","glance":[["Travel","blossom paths"],["Monsters","fey beasts and seasonal spirits"],["What they fear","eternal imbalance"]],"saying":{"text":"Every court swears the balance is eternal. Every court is also quietly hoping its season wins.","attr":"a Sprittle saying"},"soon":"\u003cp>This world carries a recorded hint: the great tree sustains all seasonal magic, one season may soon dominate forever, and if the tree dies the world freezes in permanent imbalance. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Verdantia turns with the seasons, and the seasons are governed by courts. Giant tree palaces hold the seasonal courts, each ruling its share of the year, and the whole world cycles through them in a rhythm that is supposed to stay balanced. Seasonal orchestras play the turning, enchanted fruits ripen and fade with the months, and the Sprittle live their lives along the changing of it. Beneath the beauty runs an old anxiety, that one season might one day refuse to give way.\u003c/p>","teaser":"Verdantia turns with the seasons, and the seasons are governed by courts.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Verdantia","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Cyclesong","lead":"Brand of Verdantia · the art of Cyclesing","teaser":"Cyclesong is the Brand of Verdantia, the working called Cyclesing.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Cyclesong","linkLabel":"Cyclesong","html":"\u003cp>\u003cem>Also called Cyclesing.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Cyclesong is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Verdantia, the working called Cyclesing. It exists as drifting seasonal petals and harmonic wind magic, a craft of singing with the turning year and shaping the season's force. Its tone is whimsical and ancient at once. Its cost is felt in the heart, for Cyclesing binds the wielder's emotions to the cycle, lifting and dimming them with the seasons until their inner weather is no longer entirely their own.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Cyclesong and the turning year sings for the favored side. The season bends their failures into fortune, every stumble blooming into a triumph. Call it weak and the cycle favors the enemy, turning your worst rolls into their best.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The favored side's Fellstrikes count as Fellmarks.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Bruised*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Bruised* breaks out on Bearing.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Cyclesing keeps time with the turning year.\u003c/p>\u003cul class=\"lst\">\u003cli>Turn a patch of season early or late, a thaw, a bloom, a killing frost.\u003c/li>\u003cli>Sing with the wind to carry a message, calm a storm, or stir one.\u003c/li>\u003cli>Read where the year sits in a place and what the next turn will bring.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Sprittle","lead":"Lineage of Verdantia","teaser":"The Sprittle are tiny quicksilver beings of leaf, bark, bloom, and breeze, a few inches tall and made of equal parts whimsy and wildness.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Sprittle","linkLabel":"The Sprittle","html":"\u003cp>The Sprittle are tiny quicksilver beings of leaf, bark, bloom, and breeze, a few inches tall and made of equal parts whimsy and wildness. Whether they are flitting through a glade on gossamer wings or darting between dew-soaked roots, they live in time with the endless song of Verdantia.\u003c/p>\u003cp>Verdantia runs on Courts of the seasons. Summer meadows wrapped in sunlight, Winter groves laced with frost, stormy lakes that ripple when Spring arrives, and Autumn woods burning gold with rich decay.\u003c/p>\u003cp>A Sprittle's skin takes after wherever it lives, mossy green or petal pink or bark brown or misty gray, and its hair might pass for flower petals, feathers, or morning frost. The eyes always gleam with wonder, and always with a little bit of trouble.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Sprittle\u003c/div>\u003cp>Sprittle are joyous, chaotic, and deeply loyal to those they trust. They are natural tricksters, but never heartless. To them, mischief is a dance and a way to test, teach, and discover. They are as much caretakers of the land as they are agents of unpredictability.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Playing up their seasonal Court alignment, letting it shape their mood, magic, and behavior.\u003c/li>\u003cli>Using their small size for creative exploration and unexpected solutions.\u003c/li>\u003cli>Bringing light-hearted energy to serious moments, but always with purpose behind it.\u003c/li>\u003cli>Exploring their fierce connection to Verdantia and their resistance to anyone who would harm the natural world.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Sprittle gain +1 to their Poise skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;They call us pests. Then ask us to bless their crops. Funny how that works.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Sprittle of Verdantia\u003c/div>\u003cp>The Sprittle are a fey people of the seasonal courts, whimsical and ancient, their politics and passions cycling with the year much as the world does. They are graceful and capricious, given to revel and rivalry, and they treat the balance of seasons as both the foundation of their world and the prize their courts forever maneuver over. They revere the great tree at the heart of it all.\u003c/p>"},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Verdantia","teaser":"The Faelir.","html":"\u003cdiv class=\"sub\">Powers\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/The+Factions/The+Faelir\" target=\"_blank\" rel=\"noopener\">The Faelir\u003c/a>\u003c/div>\u003cp>The Faelir are fae spirits that drift between the realms and never quite belong to any of them.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Verdantia builds in living wood and bloom. Giant tree palaces house the seasonal courts, their halls shifting in character as the year turns through them, and blossom paths thread between the courts in ribbons of perpetual flower. The great tree at the world's heart anchors all of it.\u003c/p>","teaser":"Verdantia builds in living wood and bloom.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Verdantia","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Verdantia is tree reverence, devotion to the great tree said to sustain all seasonal magic and, with it, the balance of the world. The courts honor it even as they scheme against one another, because every Sprittle knows that whatever season they favor, the tree is the thing that lets any of them turn at all.\u003c/p>","teaser":"Faith in Verdantia is tree reverence, devotion to the great tree said to sustain all seasonal magic and, with it, the balance of the world.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Verdantia","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Verdantia","html":"\u003cp>The Sprittle take seasonal feasts and enchanted fruits, their tables changing with the year, and they fill their courts with seasonal orchestras. They dress in petal dresses and seasonal armor, and they travel the blossom paths between the great tree palaces. Their whole world is a celebration that never quite forgets its own fragility.\u003c/p>","teaser":"The Sprittle take seasonal feasts and enchanted fruits, their tables changing with the year, and they fill their courts with seasonal orchestras.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Verdantia","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Vulkaris":{"name":"Vulkaris","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Vulkaris","lineage":"The Wolfir","brand":"Gelidane","art":"Frostmending","glance":[["Travel","ice sleds and glacier walkers"],["Monsters","ice horrors and frost stalkers"],["What they fear","endless winter"]],"saying":{"text":"The cold does not hate you. That is the worst of it. It simply does not stop.","attr":"a Wolfir saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Vulkaris is a frozen world held in a winter that never breaks. Frozen keeps and glacier fortresses stand against the white, deep horns sound across the ice, and the wind carries frost chants from one hold to the next. The Wolfir survive here in tight clans, enduring a cold that is not cruel so much as indifferent, and their entire way of life is shaped around the single grim fact that the winter is not going to end on its own.\u003c/p>","teaser":"Vulkaris is a frozen world held in a winter that never breaks.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Vulkaris","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Gelidane","lead":"Brand of Vulkaris · the art of Frostmending","teaser":"Gelidane is the Brand of Vulkaris, the working called Frostmending.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Gelidane","linkLabel":"Gelidane","html":"\u003cp>\u003cem>Also called Frostmending.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Gelidane is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Vulkaris, the working called Frostmending. It exists as ice-vein healing, frozen breath, and snow sigils, a magic that mends and preserves by slowing and stilling, drawing the cold inward to hold a body together. Its tone is stoic and enduring. Its cost is gentler than most Brands and crueler in its own way, for Frostmending brings emotional numbness, and those who lean on it too long find their feelings frosting over along with their wounds.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Gelidane and a killing cold seeps through every guard on the field. The favored side's blows find the bound past armor and ward alike, the frost slipping through what should have turned it. Call it weak and no defense your people raise will hold the enemy out.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The favored side's damage ignores the bound side's Durability and Resistance.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Slashed*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Slashed* breaks out on Renewal.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Frostmending preserves by stilling, and numbs what it holds.\u003c/p>\u003cul class=\"lst\">\u003cli>Mend a wound or a failing body by slowing and stilling it against the cold.\u003c/li>\u003cli>Freeze a flow, a flood, or a foe in place with frozen breath.\u003c/li>\u003cli>Read the cold of a place, what it preserves and what it has claimed.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Wolfir","lead":"Lineage of Vulkaris","teaser":"The Wolfir are humanoid lupines, muscular and fur-covered, shaped by the cold and tempered by a code.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Wolfir","linkLabel":"The Wolfir","html":"\u003cp>The Wolfir are humanoid lupines, muscular and fur-covered, shaped by the cold and tempered by a code. They stand upright on powerful limbs that end in clawed hands and feet, with piercing eyes and fangs that mark heritage as much as biology.\u003c/p>\u003cp>They come from Vulkaris, a world of endless snow and biting wind, where the Wolfir learned early that survival means unity. Their society runs on discipline, respect, and pack loyalty, in that order.\u003c/p>\u003cp>A Wolfir lives a deep contradiction, a seeker of peace who stays ready for violence at all times. They hold hard to honor, tradition, and protection, and when something pushes them past that, they answer with a ferocity few can match. Some live and die inside the pack. Others walk alone, carrying the storm in silence.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Wolfir\u003c/div>\u003cp>Wolfir are loyal and proud, often viewing their allies as packmates. They respond best to strength, clarity, and trust, and expect the same in return. Every action is weighed against duty, every word carries weight.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Playing up their loyalty: defending allies without hesitation and acting as a moral anchor.\u003c/li>\u003cli>Channeling their primal instincts through keen senses, precise movements, and hunger for the hunt.\u003c/li>\u003cli>Exploring the inner tension between their reverence for peace and their capacity for devastation.\u003c/li>\u003cli>Drawing on the harsh lessons of Vulkaris in battle tactics, diplomacy, or survival.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Wolfir gain +1 to their Resistance attribute upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;The world may freeze, the winds may howl, yet we still endure.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Wolfir of Vulkaris\u003c/div>\u003cp>The Wolfir are hardy survival clans, loyal and weathered, bound by the need to endure together what none could endure alone. They are stoic and slow to waste words or warmth, valuing endurance above almost everything. Beneath the hard surface runs a deep clan loyalty, because in Vulkaris the clan is the only thing standing between a person and the cold.\u003c/p>"},{"title":"Architecture and Cities","html":"\u003cp>Vulkaris builds to hold heat and keep out the white. Frozen keeps and glacier fortresses are raised thick-walled and inward-facing, their hearths guarded as carefully as their gates. Travel runs on ice sleds and glacier walkers, vehicles built to cross the endless white without surrendering to it.\u003c/p>","teaser":"Vulkaris builds to hold heat and keep out the white.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Vulkaris","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Vulkaris is winter spirit reverence, the honoring of the cold powers that rule the world and the spirits that move through the storm. It is a faith of endurance and respect rather than love, a way of making peace with a winter that will outlast every prayer offered against it.\u003c/p>","teaser":"Faith in Vulkaris is winter spirit reverence, the honoring of the cold powers that rule the world and the spirits that move through the storm.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Vulkaris","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Vulkaris","html":"\u003cp>The Wolfir take salt meats and preserved fish, food laid by against the long cold, and they fill their keeps with deep horns and frost chants. They dress in thick fur-lined armor and cross the ice on sleds and glacier walkers. Every habit here serves the same end, which is to last one more season against the white.\u003c/p>","teaser":"The Wolfir take salt meats and preserved fish, food laid by against the long cold, and they fill their keeps with deep horns and frost chants.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Vulkaris","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Vyrathis":{"name":"Vyrathis","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Vyrathis","lineage":"The Vyrathe","brand":"Hazenry","art":"Ashletting","glance":[["Travel","carriages, soullamp lantern roads, and the Hollow Vein passages"],["Monsters","Hexarach broods, Veinwraiths, the Hollowbound, and stray Wyspar"],["What they fear","the Crimson Haze, and the hunger it teaches"]],"saying":{"text":"The Court does not mourn its dead. It keeps them, and teaches itself to call the keeping love.","attr":"a Vyrathe saying"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Vyrathis is a world that died at the top and never finished the rest. Gothic manors and blackstone towers stand over hanging crypts beneath endless crimson moons, and a fallen aristocracy still keeps court as though the centuries since their ruin were a long tedious season rather than the end. Each night the Crimson Haze rises, a blood-red mist that seeps from fractured leylines and drifts through the ravines and the streets, and after dark whole regions belong to it rather than to the living.\u003c/p>\u003cp>The Vyrathe rule what remains, suspended between death and undeath, drawing the lifeforce of lesser folk to hold their own decay at bay. To them this is inheritance rather than horror. The dead in Vyrathis are kept and courted and put to use, dying is treated as a negotiation rather than an ending, and the realm rots elegantly around it.\u003c/p>","teaser":"Vyrathis is a world that died at the top and never finished the rest.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Vyrathis","key":"world","tag":"The Realm","rune"
