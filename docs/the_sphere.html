 the mind's own bandwidth, for Scrymarking floods the wielder with more than a mind can hold, and sensory overload is the constant hazard of seeing too much at once.\u003c/p>","teaser":"Scrythene is the Brand of Scitnix, the working called Scrymarking.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Scitnix","key":"brand","tag":"Brand of Magic","lead":"Brand of Scitnix · the art of Scrymarking","rune":"ᚹ"},{"title":"The Corvid","html":"\u003cp>The Corvid are a scholarly people of strict hierarchies, ranked by what they know and what they are trusted to know. They are analytical, secretive, and prone to paranoia, forever weighing the value of a fact against its danger. They prize knowledge above almost everything, which is exactly why they fear it, having learned that the most forbidden truths tend to look back.\u003c/p>","teaser":"The Corvid are a scholarly people of strict hierarchies, ranked by what they know and what they are trusted to know.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Scitnix","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"Architecture and Cities","html":"\u003cp>Scitnix builds for study and security. Arcane observatories crown the high places, and sigil labyrinths wind beneath them, designed as much to protect dangerous knowledge as to organize it. Travel runs through sigil gates, instantaneous and tightly controlled, each passage a record of who went where and what they were permitted to see.\u003c/p>","teaser":"Scitnix builds for study and security.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Scitnix","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Scitnix is knowledge preservation, the conviction that what is known must be kept, guarded, and passed on, but only to those who can bear it. The scholar hierarchies serve as its keepers, deciding which truths survive and which are sealed away, and treating the careful control of knowledge as a sacred and dangerous duty.\u003c/p>","teaser":"Faith in Scitnix is knowledge preservation, the conviction that what is known must be kept, guarded, and passed on, but only to those who can bear it.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Scitnix","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Scitnix","html":"\u003cp>The Corvid take crystal fungi and spiced nectar, sustenance for long hours of study, and they fill their observatories with resonant chimes and coded rhythms. They dress in rune-marked robes, and they travel by sigil gate through their labyrinthine world. Everything here is observed, recorded, and filed, including, the Corvid suspect, themselves.\u003c/p>","teaser":"The Corvid take crystal fungi and spiced nectar, sustenance for long hours of study, and they fill their observatories with resonant chimes and coded rhythms.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Scitnix","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Sellenia":{"name":"Sellenia","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","lineage":"The Lunarian","brand":"Selvyrn","art":"Selvyring","glance":[["Travel","moonstone bridges, luminous waterways, and Aerostrix flight"],["Monsters","Moonveil Stalkers, Mirrorwisps, and corrupted reflections"],["What they fear","the past returning, and the Silent Weave turned to control once more"]],"saying":{"text":"The moon illuminates but never commands. Remember that. Then remember everything else.","attr":"a Selvyrn precept"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Sellenia is a world of eternal moonlight, beautiful and quietly wounded. A single great moon hangs motionless above it and never sets, silvering forests of white-leaved trees and vast mirror-still lakes. The reflections in those lakes do not always obey the sky. Stairways continue beneath the surface, and windows show rooms that no longer stand. Where moonlight crosses the right surface, memory-script surfaces across stone and bark for a few silent moments before it fades. The world feels refined and graceful, and every reflection suggests that part of Sellenia still exists in a layer just beyond ordinary sight.\u003c/p>\u003cp>Beneath the grace lie old wounds. Sellenia is one of the oldest centers of magical scholarship in \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/The+Sphere\" target=\"_blank\" rel=\"noopener\">the Sphere\u003c/a>, and it carries the scars of Malvaro's conquest and the first great fracture among the Knights of Fell. The Lunarians hold their beauty as discipline, a way of carrying sorrow without letting it rule them.\u003c/p>","teaser":"Sellenia is a world of eternal moonlight, beautiful and quietly wounded.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Selvyrn","html":"\u003cp>Selvyrn is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Sellenia, the discipline of moonlight, reflection, and memory. It works on what is seen, remembered, and understood rather than on fire or force, revealing and concealing, sharpening perception, and shaping information. Its first teaching is that the moon illuminates and never commands, and that truth moves the world more surely than violence. The Lunarians treat it as scholarship and defense both, and they treat its deepest forms, the ones that touch memory and thought directly, with great caution. They have already seen what such power costs when it is misused.\u003c/p>","teaser":"Selvyrn is the Brand of Sellenia, the discipline of moonlight, reflection, and memory.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","key":"brand","tag":"Brand of Magic","lead":"Brand of Sellenia · the art of Selvyring","rune":"ᚹ"},{"title":"The Lunarians","html":"\u003cp>The Lunarians are the moonlit people of Sellenia, slender and poised, with gray skin, moon-pale hair, and eyes that shimmer teal or silver. They are calm, watchful, and difficult to read, carrying themselves with quiet certainty rather than open force. Their culture prizes restraint, memory, and subtle influence. Silence among them is a language, where a pause can mean trust, mourning, or disagreement, and a trained listener is expected to hear what was never said aloud.\u003c/p>\u003cp>Memory in Sellenia is a civic duty as much as a personal inheritance. Families preserve recollection through spoken lineages and witnessed retellings, and important vows are made before reflected moonlight rather than before crowds. Much of this discipline is moral preservation, a guard against control and erasure ever taking root again, because the Lunarians remember exactly what happened the last time memory became a weapon.\u003c/p>","teaser":"The Lunarians are the moonlit people of Sellenia, slender and poised, with gray skin, moon-pale hair, and eyes that shimmer teal or silver.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"The Aerostrix","html":"\u003cp>The Aerostrix is a moonlit griffin born beneath Sellenia's skies, a creature of silent flight and sharp-eyed precision. Bonded to a Lunarian, it becomes more sentinel than beast, holding the rhythm of a battle from above and shielding the one it has chosen. It is not won by reins but by clarity of spirit, answering only to a will tempered and unclouded. With feathers like silvered dusk and eyes that pierce deception, it remains guardian and companion at once.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Augury\u003c/strong>. Bends fortune so a Fell's strike lands true.\u003c/p>\u003c/div>","teaser":"The Aerostrix is a moonlit griffin born beneath Sellenia's skies, a creature of silent flight and sharp-eyed precision.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Aerostrix","key":"lb:The Aerostrix","tag":"Lorebound","rune":"ᛈ","linkLabel":"The Aerostrix"},{"title":"The Nocturnai and the Silent Weave","html":"\u003cp>The Lunarians share their blood and their grief with the Nocturnai, the keepers of the Silent Weave, an art of sharing thought, emotion, and memory without a word spoken. Long ago Malvaro passed through Sellenia and found the Weave. He did not destroy it. He twisted it into an instrument of domination, and though he moved on, the wound stayed.\u003c/p>\u003cp>When the Knights of Fell later came to free the Nocturnai, Sellenia became the birthplace of a second tragedy. Armon Mordaine defied Draedon Vesper and enslaved the surviving Nocturnai for the war against Malvaro, turning memory and communication into chains. That betrayal was the first great fracture among the Knights, and it laid the foundation for the Forsaken. The descendants of the Nocturnai still guard the Silent Weave from hidden enclaves, and Sellenia still keeps mourning rites for what was done to them.\u003c/p>","teaser":"The Lunarians share their blood and their grief with the Nocturnai, the keepers of the Silent Weave, an art of sharing thought, emotion, and memory without a word spoken.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Cities and Sanctuaries","html":"\u003cp>Sellenia builds in alabaster, moonstone, and reflected light. Selene, the royal capital, rises along the Lunar Throne, the largest Mirror Lake in the realm, where palaces and silver-domed observatories stand beside the Moonspire Observatory and the Hall of Remembered Names. Parts of the city are built to align only in reflection, so that Selene seems to exist half in stone and half in silver water. Aethralis is the scholarly city, home of the Moonbound Observatory and archives so vast that a discovery there can raise a name or erase it. Noctis lies hidden deep in the Silverwild, one of the oldest Silent Weave sanctuaries in the Sphere, grown from living wood and revealed only where moonlight crosses the right surface. Moonfall Reach clings to the coastal cliffs as Sellenia's great port and gateway to other realms, its customs halls requiring names, origins, and declared truths before entry. Beyond them all spreads the Silverwild, a luminous forest that disobeys ordinary navigation, and the Veiled Reflection, a drowned ruin where the city stands more complete in the water than in stone.\u003c/p>","teaser":"Sellenia builds in alabaster, moonstone, and reflected light.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Sellenia is reverence for the Eternal Moon and for memory itself. Households begin and end their days in stillness before silver basins and mirror pools, keeping memory and intention disciplined rather than buried. The moon is treated as a keeper and a witness, holding what the living cannot, and remembrance is practiced as an act of moral preservation, a refusal to let control and erasure take root in Sellenia ever again.\u003c/p>","teaser":"Faith in Sellenia is reverence for the Eternal Moon and for memory itself.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">Corrupted Reflections\u003c/div>\u003cp>Corruption spreads through the Mirror Lakes, and reflections begin to move on their own. People recall events that never happened until a lake or a witness proves them false, and at the center of it lies the Veiled Reflection, where the drowned city replays histories that do not agree.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Forsaken\u003c/div>\u003cp>Heirs to Mordaine's betrayal, the Forsaken infiltrate royal institutions and hunt the lost methods of control, chasing Silent Weave relics and the forbidden bindings of the war years.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Weave Grows Unstable\u003c/div>\u003cp>The Silent Weave falters across Sellenia, and the Nocturnai fear it will be exploited a second time. Some who reach into it now hear answers they did not ask for.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Fracture Wakes\u003c/div>\u003cp>Reflection-scars from the first betrayal stir across lakes, shrines, and old battle paths, and parts of the Silverwild slip into remembered landscapes from before Malvaro and refuse to return. The wise fear \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Discord\" target=\"_blank\" rel=\"noopener\">Discord\u003c/a>'s hand behind the unrest, working the oldest wound in the realm.\u003c/p>\u003c/div>","teaser":"Corrupted Reflections, The Forsaken, The Weave Grows Unstable, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Shadakar":{"name":"Shadakar","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","lineage":"The Shadowkin","brand":"Inkthraal","art":"Inkmelding","glance":[["Travel","mistships and chained ferries"],["Monsters","Abysm horrors, mist spectres, and shadewyrms"],["What they fear","the Abysm, forgetting themselves, and the Inkwight"]],"saying":{"text":"Out here you do not lose your way. You lose the part of you that wanted to find it.","attr":"a Shadakar sailor's saying"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Shadakar is a world adrift on the Abysm, a living ocean of mist where memory, oaths, and identity are not held inside a person but worked into the water itself. Inkstone towers and warped ports cling to what solid ground remains, hanging libraries sway above the fog, and out past the harbor lights the mist closes over everything. Distant horns and ocean dirges carry across it, and no one is ever sure how far away the thing sounding them really is.\u003c/p>\u003cp>To sail the Abysm is to gamble with the self. The mist reacts to what you remember and what you have sworn, and it gives back distorted versions of both. Ships go out and do not return. Worse, ships go out and return carrying crews who are almost the people who left. The Shadowkin have learned to navigate this, more or less, and the price of learning is written on every one of them.\u003c/p>","teaser":"Shadakar is a world adrift on the Abysm, a living ocean of mist where memory, oaths, and identity are not held inside a person but worked into the water itself.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Inkthraal","html":"\u003cp>Inkthraal is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Shadakar, the working called Inkmelding. It exists as living ink, drifting script, and liquid shadow, a magic that writes meaning directly into the mist and the dark and reads it back out again. Its tone is esoteric and alien, closer to translation than to spellcraft. Its cost is paid in the self. Those who shape with Inkthraal suffer memory loss and emotional imprinting, the ink taking pieces of who they were and leaving smudges of who they have touched, until a deep practitioner is a palimpsest of borrowed lives.\u003c/p>","teaser":"Inkthraal is the Brand of Shadakar, the working called Inkmelding.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","key":"brand","tag":"Brand of Magic","lead":"Brand of Shadakar · the art of Inkmelding","rune":"ᚹ"},{"title":"The Shadowkin","html":"\u003cp>The Shadowkin are a people of ship crews and archive castes, sailors and scholars bound by the same need to keep hold of what the Abysm tries to take. They are guarded, layered, and long-memoried, valuing the record and the oath above almost everything, because in Shadakar a forgotten promise is not just broken. It is erased. They guard their own memories jealously and trade in everyone else's.\u003c/p>","teaser":"The Shadowkin are a people of ship crews and archive castes, sailors and scholars bound by the same need to keep hold of what the Abysm tries to take.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"campaign","tag":"The Fell","rune":"ᛟ","title":"The Light Between Shadows","teaser":"Watch the campaign played in Shadakar.","html":"\u003cp>\u003ca class=\"watch-link\" href=\"https://www.youtube.com/live/Hx0BSig3uQ0\" target=\"_blank\" rel=\"noopener\">&#9654;&nbsp; Watch The Light Between Shadows on YouTube\u003c/a>\u003c/p>","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","linkLabel":null},{"title":"The Abysm and the Nadir Dial","html":"\u003cp>The Abysm is the great mystery and the great threat of Shadakar, a mist-ocean of memory and conceptual corruption that reacts to emotion and seems to want something. Scattered across it lie the Keyshards, pieces of an ancient mechanism called the Nadir Dial, and the Dial can either seal the Abysm away forever or turn its power upward, toward a transcendence that some believe would burn the whole Sphere clean. As the Waning eclipse approaches, rival shadowships race to gather the Keyshards, and the White-Mouthed King speaks through visions of salvation that may be the most dangerous lie in the world, or the most dangerous truth.\u003c/p>","teaser":"The Abysm is the great mystery and the great threat of Shadakar, a mist-ocean of memory and conceptual corruption that reacts to emotion and seems to want something.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Architecture and Cities","html":"\u003cp>Shadakar builds against the fog. Inkstone towers rise from the few stable anchorages, hung with libraries that drift on chains above the streets, and the ports are warped things, rebuilt so often around the shifting waterline that no two charts of them agree. Travel between anchorages runs by mistship and chained ferry, vessels rigged as much to hold a crew's memory intact as to cross the water.\u003c/p>","teaser":"Shadakar builds against the fog.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Shadakar is worship of memory and the depths. To remember is holy, to record is devotion, and the deepest reverence is reserved for the Abysm itself, terrible and vast. They fear the Inkwight, the fate of a mind so taken by the ink and the mist that nothing original remains, and they pray, in their layered guarded way, never to forget themselves into one.\u003c/p>","teaser":"Faith in Shadakar is worship of memory and the depths.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"Life in Shadakar","html":"\u003cp>The Shadowkin live on saltfish, black broth, and memory tea, the last brewed to hold a recollection steady through a long voyage. Their music is distant horns and ocean dirges, and they dress in long layered coats and waterproof wraps against the endless damp. They cross their world by mistship and chained ferry, trusting rope and record over any sense of direction the Abysm might offer.\u003c/p>","teaser":"The Shadowkin live on saltfish, black broth, and memory tea, the last brewed to hold a recollection steady through a long voyage.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Waning\u003c/div>\u003cp>An eclipse called the Waning approaches, and with it the Abysm grows stronger and the boundary between mist and Sphere grows thin. If it breaks fully, Shadakar may not be the only world to drown in fog.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Race for the Keyshards\u003c/div>\u003cp>Rival shadowships hunt the scattered Keyshards of the Nadir Dial, the Goldenmane against the Dirgecaller and worse, each crew certain its answer for the Dial is the one that saves everyone.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Upward Path\u003c/div>\u003cp>The White-Mouthed King offers transcendence through the fire of the Blazing Sun, a turning of the Dial upward that would purge the corruption and, some fear, \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/The+Sphere\" target=\"_blank\" rel=\"noopener\">the Sphere\u003c/a> along with it. The horror of the offer is that parts of it may be true. Few know the face behind the visions. The White-Mouthed King is Magnus Bane, \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Discord\" target=\"_blank\" rel=\"noopener\">Discord\u003c/a>'s own hand and the prophet the Sunborn follow.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">Losing the Self\u003c/div>\u003cp>Every voyage and every working of Inkthraal costs a little memory, and crews return less themselves than they left. The slow erasure is harder to fight than any horror, because it feels like nothing at all.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Same Silence Elsewhere\u003c/div>\u003cp>A few archivists who have compared records across worlds keep one finding off the public logs. The Inkwight is not Shadakar's alone. The same silence surfaces on other worlds wearing other faces, and all of them seem to answer to a single hand no one will name.\u003c/p>\u003c/div>","teaser":"The Waning, The Race for the Keyshards, The Upward Path, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Shervinaw":{"name":"Shervinaw","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shervinaw","lineage":"The Shrewish","brand":"Rootsummons","art":"Rootsummoning","glance":[["Travel","living root tunnels"],["Monsters","rootbound beasts and bark horrors"],["What they fear","the blight"]],"saying":{"text":"Feed the root and the root remembers you. Starve it, and it remembers that too.","attr":"a Shrewish saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Shervinaw is a world grown from the roots up. Root-cathedrals and bark fortresses rise from a tangle of living wood, wooden flutes and root harmonics drift through the green dark, and the Shrewish live in deep communion with the roots that hold their world together. They summon from the living wood and the fungus beneath it, and they tend the root with the care of a people who know exactly what happens when it begins to rot.\u003c/p>","teaser":"Shervinaw is a world grown from the roots up.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shervinaw","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Rootsummons","html":"\u003cp>Rootsummons is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Shervinaw, the working called Rootsummoning. It exists as living bark growths, root tendrils, and fungal summons, a wild magic of calling forth and shaping the living wood and the things that grow in it. Its tone is wild and territorial. Its cost is the body's own boundaries, for Rootsummoning brings a gradual bodily overgrowth, bark and root creeping over the wielder until, in time, it is hard to say where the druid ends and the forest begins.\u003c/p>","teaser":"Rootsummons is the Brand of Shervinaw, the working called Rootsummoning.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shervinaw","key":"brand","tag":"Brand of Magic","lead":"Brand of Shervinaw · the art of Rootsummoning","rune":"ᚹ"},{"title":"The Shrewish","html":"\u003cp>The Shrewish are a people of druidic circles, small, watchful, and bound to the living root. They are nurturing and territorial in equal measure, devoted to the growth they tend and wary of anything that might bring the blight. They keep spirit root worship, treating the deep roots as sacred and living, and they shape their whole way of life around feeding, guarding, and listening to the green.\u003c/p>","teaser":"The Shrewish are a people of druidic circles, small, watchful, and bound to the living root.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shervinaw","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"lb:The Felionis","tag":"Lorebound","rune":"ᛈ","title":"The Felionis","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Felionis","linkLabel":"The Felionis","teaser":"Deep in the knotted woods of Shervinaw, under curling roots and a ceiling of fungus, the Felionis hunts.","html":"\u003cp>Deep in the knotted woods of Shervinaw, under curling roots and a ceiling of fungus, the Felionis hunts. These cats were shaped by the forest itself, grown from the great mother roots, and they carry the flat defiance of wild things. Their hides are plated in spell-resistant bark, and their split forelimbs let them climb anything that stands between them and prey, or cover.\u003c/p>\u003cp>Bonded to a Fell, a Felionis guards its master the way it guards the new shoots of Shervinaw. Its presence sours spellcraft, blunting magic thrown its way and making anyone regret aiming the arcane at someone it has decided to protect.\u003c/p>\u003cp>Earn one and you have earned the respect of the forest's meanest sentinel. When the spells come down like rain, it plants itself in front of you and does not move.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Aegis\u003c/strong>. Sours hostile magic aimed at a Fell so it falters.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Shervinaw grows its strongholds rather than raising them. Root-cathedrals and bark fortresses are coaxed from the living wood, vast organic halls that the druidic circles tend across generations. Travel runs through living root tunnels that open and close at the forest's slow consent.\u003c/p>","teaser":"Shervinaw grows its strongholds rather than raising them.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shervinaw","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Shervinaw is spirit root worship, reverence for the deep living roots said to hold the world together and remember those who tend them. The druidic circles serve as its keepers, and their gravest duty is to feed and guard the root against the blight, knowing that a forest left to rot does not simply die but turns.\u003c/p>","teaser":"Faith in Shervinaw is spirit root worship, reverence for the deep living roots said to hold the world together and remember those who tend them.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shervinaw","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Shervinaw","html":"\u003cp>The Shrewish take root stew and moss cakes, food drawn from the growth they tend, and they fill their cathedrals with wooden flutes and root harmonics. They dress in living bark garments grown to fit, and they travel by living root tunnel. Their whole world is a single growing thing, and they live as its careful, wary gardeners.\u003c/p>","teaser":"The Shrewish take root stew and moss cakes, food drawn from the growth they tend, and they fill their cathedrals with wooden flutes and root harmonics.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shervinaw","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Sporion":{"name":"Sporion","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","lineage":"The Capling","brand":"Mycognosis","art":"Mycospreading","glance":[["Travel","root bridges, living lifts, and cultivation causeways"],["Monsters","Miregut growths, hostile fungal mutations, and memory-bent organisms"],["What they fear","the Great Consumption coming again, and what the Miregut keeps of the dead"]],"saying":{"text":"To us, life and death are not opposites. They are ingredients.","attr":"a Sporekeeper's first teaching"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Sporion is a living fungal world where growth and decay hold in balance, and where every death feeds something new. Towering mushroom spires rise hundreds of feet into humid, spore-filled skies, vast canopies glow in blue, green, amber, and violet, and bioluminescent growth lights the winding paths below. It is one of the oldest ecosystems in \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/The+Sphere\" target=\"_blank\" rel=\"noopener\">the Sphere\u003c/a>, threaded through by an immense mycelial network that many believe carries information between every living thing in the world.\u003c/p>\u003cp>The Caplings build civilization inside this living landscape, balancing martial discipline, culinary mastery, and patient stewardship of the soil. Their oldest traditions reach back to the First Bloom, when the first Caplings rose from sacred spores. Beneath all of it, far below the gardens and the cities, sprawls the Miregut.\u003c/p>","teaser":"Sporion is a living fungal world where growth and decay hold in balance, and where every death feeds something new.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Mycognosis","html":"\u003cp>Mycognosis is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Sporion, the working called Mycospreading. Where other Brands force a will onto the world, Mycognosis grows its effects, working through spores, roots, fermentation, and the bond between a cultivator and the living things around them. Every working begins as a seed. It is woven through ordinary life as deeply as through war, shaping agriculture, medicine, architecture, communication, and the kitchen alike. Its dangers are quiet ones: overgrowth, hostile mutation, dependency, and the slow blending of self that comes from working too long with memory spores.\u003c/p>","teaser":"Mycognosis is the Brand of Sporion, the working called Mycospreading.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","key":"brand","tag":"Brand of Magic","lead":"Brand of Sporion · the art of Mycospreading","rune":"ᚹ"},{"title":"The Caplings","html":"\u003cp>The Caplings are mushroom-born stewards of the spore, graceful and precise, devoted to both blade and broth. Each one emerges from a sacred spore already carrying fragments of cultural memory, then grows into a person entirely their own. Their bodies range from cream and pale gray to vivid red, blue, green, and amber, marked by caps, frills, bioluminescent patterns, and spore-veils that shift over a lifetime with environment and craft.\u003c/p>\u003cp>Capling life turns on cultivation. Every act is treated as a seed planted for a later harvest. Meals are sacred, hospitality is an art, and combat is held as a disciplined expression of mastery rather than simple violence. Communities keep fungal gardens, fermentation halls, memory archives, and communal kitchens where stories are passed alongside food. Many of their rites still carry echoes of the First Bloom. Others were reshaped by the Memory Schism, the long argument over what should be remembered, who should hold remembrance, and whether forgetting can ever be sacred.\u003c/p>","teaser":"The Caplings are mushroom-born stewards of the spore, graceful and precise, devoted to both blade and broth.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"campaign","tag":"The Fell","rune":"ᛟ","title":"Worriln Below","teaser":"Watch the campaign played in Sporion.","html":"\u003cp>\u003ca class=\"watch-link\" href=\"https://www.youtube.com/live/O06AW5cuul4\" target=\"_blank\" rel=\"noopener\">&#9654;&nbsp; Watch Worriln Below on YouTube\u003c/a>\u003c/p>","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","linkLabel":null},{"title":"The Miregut","html":"\u003cp>Beneath Sporion's forests sprawls the Miregut, a living organism larger than kingdoms, its roots, organs, tunnels, and digestive chambers running through the world like veins beneath flesh. Whole ecosystems live inside it, fed by everything it consumes. Scholars cannot agree what it is. Some name it the world's heart, some a forgotten god, some only a vast and hungry thing, and the truth may be all three at once.\u003c/p>\u003cp>Most Caplings never see the true Miregut. They meet only its surface manifestations: breathing caverns, pulsing root systems, organic tunnels, memory cysts, and spore vents that open without warning. It redirects its own passages, grows toward places of death, preserves some of what it swallows and wholly digests the rest, and now and then expels strange organisms that resemble creatures it consumed centuries ago. The Great Consumption, the disaster that swallowed entire colonies and rewrote whole regions overnight, is dated to a single vast convulsion within it.\u003c/p>\u003cp>In a few of its deepest reaches, the Miregut does more than digest. It keeps. Explorers have come back from those places speaking of dead companions surfacing whole within memory spores, and of chambers where the Miregut seems to regrow what it consumed and send it back changed. How far this reaches, and what it is for, none who returned could say.\u003c/p>","teaser":"Beneath Sporion's forests sprawls the Miregut, a living organism larger than kingdoms, its roots, organs, tunnels, and digestive chambers running through the world…","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Cities and Sanctuaries","html":"\u003cp>Sporion's settlements grow as much as they are built. Mycelara, the great cultivation city, climbs the stalk of the largest fungal titan in the world, its districts spiraling up for miles until weather coils around the high terraces. It holds the Grand Mycelium Archive, where millions of memory spores are kept in living vaults, among them sealed records too dangerous to surface since the Memory Schism. Mycora is the trade metropolis, thousands of giant mushrooms forming a vertical market crowned by the Great Spore Market that never closes. The Hanging Gardens of Velm hang beneath enormous canopies, a cultivation sanctuary that produces much of Sporion's medicine and rarest ingredients.\u003c/p>\u003cp>Out on the frontier, Deepcap Hollow clings to the rim of a groaning Miregut sinkhole, the last outpost willing to send delvers deeper, its whole economy built on salvage, missing-person notices, and bets on who will return. Koromyr is older still, an ancient pilgrimage site that predates Capling civilization, revered and feared in equal measure, where some pilgrims come back convinced the place remembered them before they arrived. Far gentler is Hearthspore, an agricultural village of lantern-lit kitchens and fermentation halls that hosts the Feast of First Bloom, one of Sporion's most beloved celebrations.\u003c/p>","teaser":"Sporion's settlements grow as much as they are built.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"The Factions","html":"\u003cp>Sporion's deepest conflicts are arguments about growth, memory, and how far to trust the dark below.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Faction\u003c/th>\u003cth>What they want\u003c/th>\u003c/tr>\u003ctr>\u003ctd>The Grand Cultivators\u003c/td>\u003ctd>Preserve ecological balance and regulate cultivation. Respected, and often resented as too rigid.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Miregut Seekers\u003c/td>\u003ctd>Explore the Miregut at any cost, rising fast as new depths open.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Circle of Spores\u003c/td>\u003ctd>Preserve all memory, holding that nothing truly lives once it is forgotten.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Reclaimers\u003c/td>\u003ctd>Erase harmful memory so new growth can flourish.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Fermentarium Guild\u003c/td>\u003ctd>Push cultivation, cuisine, and fungal engineering toward constant innovation.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Purecap Tradition\u003c/td>\u003ctd>Restore strict ancestral methods, certain that novelty invites collapse.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","teaser":"Sporion's deepest conflicts are arguments about growth, memory, and how far to trust the dark below.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","key":"factions","tag":"Powers","rune":"ᚨ"},{"title":"Faith and Belief","html":"\u003cp>To the Caplings, life and death are not opposites but ingredients in the same long recipe. They revere the cycle of growth and decay, and they honor it through ritual meals, seasonal harvests, and spore ceremonies that carry knowledge from one generation to the next. Memory is treated as sacred, which is exactly why the Memory Schism cut so deep. The wound it left, the question of whether some things should be allowed to be forgotten, has never fully closed.\u003c/p>","teaser":"To the Caplings, life and death are not opposites but ingredients in the same long recipe.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Miregut Stirs\u003c/div>\u003cp>New tunnels open beneath major communities, and the oldest fear in the world returns with them. Expeditions vanish in depths no one has reached since the Great Consumption, and the word on every frontier is that a second one may be coming.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Memory War\u003c/div>\u003cp>The Circle of Spores and the Reclaimers have reopened the Schism, one guarding every record, the other burning what it calls rot. Archives are turning up corrupted, and some of Sporion's last memories from before the Schism may not survive the fight over them.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">Blight and Imbalance\u003c/div>\u003cp>A fungal blight spreads from settlement to settlement, harvest regions fall barren, and hostile mutations emerge in numbers no cultivator can account for.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">What the Deep Keeps\u003c/div>\u003cp>In certain Miregut depths the dead do not stay dead. A few delvers have returned speaking of companions regrown inside memory spores, and of places that knew their names before they spoke them. Most who hear the stories would rather not learn how true they are.\u003c/p>\u003c/div>","teaser":"The Miregut Stirs, The Memory War, Blight and Imbalance, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Sylvanoth":{"name":"Sylvanoth","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sylvanoth","lineage":"The Arboril","brand":"Bramblecraft","art":"Bramblesnare","glance":[["Travel","root paths"],["Monsters","thorn beasts and vine horrors"],["What they fear","wild overgrowth"]],"saying":{"text":"The hedge does not keep the world out. It keeps deciding whether to let you back in.","attr":"an Arboril saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Sylvanoth is a world where the green fights back. Thorn keeps and living hedge cities grow rather than stand, their walls a snarl of bramble and vine trained into shape by generations of patient, wary cultivation. The Arboril live inside that growth, surrounded by a wilderness that is never entirely tame and never entirely safe. Gentle reed instruments drift through the groves, an oddly soft sound for a place where the plants have teeth.\u003c/p>","teaser":"Sylvanoth is a world where the green fights back.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sylvanoth","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Bramblecraft","html":"\u003cp>Bramblecraft is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Sylvanoth, the working called Bramblesnare. It exists as thorn growth, floral traps, and root cages, a magic of binding and warding through living plant. Its tone is protective and territorial, a craft of defense and ensnarement rather than open assault. Its cost is entanglement of a subtler kind, for Bramblesnare draws on emotional resonance and can leave its wielder bound up in the feelings of those caught in the snare.\u003c/p>","teaser":"Bramblecraft is the Brand of Sylvanoth, the working called Bramblesnare.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sylvanoth","key":"brand","tag":"Brand of Magic","lead":"Brand of Sylvanoth · the art of Bramblesnare","rune":"ᚹ"},{"title":"The Arboril","html":"\u003cp>The Arboril are a people of grove circles, rooted communities bound to the living growth around them. They are protective and territorial, slow to admit outsiders and quick to close ranks, shaped by a world that rewards vigilance over openness. They tend the hedge cities the way other peoples tend walls and gates, knowing the difference is that their walls are alive and have opinions.\u003c/p>","teaser":"The Arboril are a people of grove circles, rooted communities bound to the living growth around them.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sylvanoth","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"lb:The Thistlewing","tag":"Lorebound","rune":"ᛈ","title":"The Thistlewing","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Thistlewing","linkLabel":"The Thistlewing","teaser":"The Thistlewing is a dragon carved from living oak, its body a lattice of bark, vine, and thornwood lit by slow pulses of forest light.","html":"\u003cp>The Thistlewing is a dragon carved from living oak, its body a lattice of bark, vine, and thornwood lit by slow pulses of forest light. Native to Sylvanoth, it is half guardian and half trickster, scattering enchanted runes across the forest floor to turn back intruders and shelter its own.\u003c/p>\u003cp>It collects runes the way other things collect memories, each stone holding the echo of a spent spell. Bonded to a Fell, it passes the trick along. A spell no longer ends when it is cast. It lingers, bound into a rune that can spring or snare, and an ability hardens into a waiting trap the same way.\u003c/p>\u003cp>Mounted, the Thistlewing moves in a slow, almost stately crawl, shedding glowing runes behind it like fallen leaves. Most never notice they are surrounded until the first one goes off.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Snare\u003c/strong>. Snares a spent spell or ability into a rune or trap.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Sylvanoth grows its strongholds. Thorn keeps and living hedge cities are cultivated over generations, their defenses rooted and breathing, their layouts shifting slowly as the growth is trained and retrained. Travel runs along root paths that the Arboril coax open and let close behind them.\u003c/p>","teaser":"Sylvanoth grows its strongholds.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sylvanoth","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Sylvanoth is nature spirit worship, reverence for the living green and the spirits that move through it. The grove circles serve as both community and congregation, and the Arboril hold that the wilderness is owed respect and wariness in equal measure, a power to be lived alongside rather than ruled.\u003c/p>","teaser":"Faith in Sylvanoth is nature spirit worship, reverence for the living green and the spirits that move through it.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sylvanoth","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Sylvanoth","html":"\u003cp>The Arboril take herbal soups and flower wines, food drawn from the growth they tend, and they fill their groves with gentle reed instruments. They dress in floral leathers and woven vines, and they travel by root path through the living hedges. Everything they have is grown, guarded, and a little wild.\u003c/p>","teaser":"The Arboril take herbal soups and flower wines, food drawn from the growth they tend, and they fill their groves with gentle reed instruments.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sylvanoth","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Thaloryn":{"name":"Thaloryn","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Thaloryn","lineage":"The Elken","brand":"Peltharun","art":"Pelttracing","glance":[["Travel","great elk caravans"],["Monsters","Mordels and frost predators"],["What they fear","starvation, and the failed hunt"]],"saying":{"text":"The hunt feeds the clan, and the clan feeds the hunt. Stop either and you have already begun to starve.","attr":"an Elken saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Thaloryn is a world of long winters and longer hunts. Timber halls and antler lodges stand against the cold, hunting horns and war chants roll across the wilds, and the Elken follow the great herds through a land that gives nothing for free. Survival here is the hunt, and the hunt is everything, so that a good season and a bad one are the difference between a clan thriving and a clan that quietly disappears.\u003c/p>","teaser":"Thaloryn is a world of long winters and longer hunts.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Thaloryn","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Peltharun","html":"\u003cp>Peltharun is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Thaloryn, the working called Pelttracing. It exists as beast-mark runes, glowing fur patterns, and hunter sigils, a magic of instinct, tracking, and the borrowed strength of beasts. Its tone is instinctive and focused. Its cost is the self's composure, for Pelttracing brings a bestial emotional bleed, the wielder's feelings sharpening toward the raw and the animal the deeper they trace.\u003c/p>","teaser":"Peltharun is the Brand of Thaloryn, the working called Pelttracing.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Thaloryn","key":"brand","tag":"Brand of Magic","lead":"Brand of Thaloryn · the art of Pelttracing","rune":"ᚹ"},{"title":"The Elken","html":"\u003cp>The Elken are nomadic hunting clans, hardy and instinctive, bound to the herds they follow and the beasts whose marks they bear. They are practical and proud, measuring worth by skill in the hunt and steadiness through hardship. They keep beast ancestor traditions, honoring the creatures that sustain them and the line of hunters who came before, and they fear above all the failed hunt and the starvation that follows it.\u003c/p>","teaser":"The Elken are nomadic hunting clans, hardy and instinctive, bound to the herds they follow and the beasts whose marks they bear.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Thaloryn","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"lb:The Mordel","tag":"Lorebound","rune":"ᛈ","title":"The Mordel","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Mordel","linkLabel":"The Mordel","teaser":"The Mordel is a hulking, bearlike lorebound from the frost-forged peaks of Thaloryn, homeland of the Elken.","html":"\u003cp>The Mordel is a hulking, bearlike lorebound from the frost-forged peaks of Thaloryn, homeland of the Elken. Rigid black spines push up through its shaggy coat. These things were bred to do exactly one job, which is to endure. Avalanche, predator, or blade, the Mordel does not give ground, and neither do the Fell bonded to one.\u003c/p>\u003cp>Their patience is not natural. Threatened, a Mordel roots itself like stone and takes the hit with a glacier's calm. The cubs are taught not to flinch but to brace. As the bond with a Fell deepens, that stillness bleeds across, and the Fell turns into a fortress that happens to be walking.\u003c/p>\u003cp>In \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Transmogrifications/Corsair\" target=\"_blank\" rel=\"noopener\">Corsair\u003c/a> form all that bulk becomes a battering ram. Each slow step shakes the ground, and the sheer weight of it grinds down anything that wanders too close.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Adamant\u003c/strong>. Shrugs off a blow's bite and sends it back at the striker.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Thaloryn builds to move and to endure. Timber halls and antler lodges are raised at the seasonal grounds, sturdy enough to shelter a clan and simple enough to leave behind when the herds move on. Travel runs on great elk caravans that follow the herds across the wilds.\u003c/p>","teaser":"Thaloryn builds to move and to endure.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Thaloryn","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Thaloryn is beast ancestor tradition, reverence for the creatures that feed the clans and the ancestral hunters whose instincts live on in their descendants. The Elken honor the herd and the hunt as sacred, holding that to take without respect is to invite the failed hunt and the hunger that ends clans.\u003c/p>","teaser":"Faith in Thaloryn is beast ancestor tradition, reverence for the creatures that feed the clans and the ancestral hunters whose instincts live on in their descendants.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Thaloryn","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Thaloryn","html":"\u003cp>The Elken take roasted game and berry stews, food won from the hunt and the land, and they fill their lodges with hunting horns and war chants. They dress in furs and antler adornments, marks of skill and survival, and they travel by great elk caravan. Everything in their lives bends toward the next hunt.\u003c/p>","teaser":"The Elken take roasted game and berry stews, food won from the hunt and the land, and they fill their lodges with hunting horns and war chants.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Thaloryn","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"The Scere":{"name":"The Scere","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/The+Scere","lineage":"The Vate","brand":"Scerinyx","art":"Fatescorn","glance":[["Travel","unstable pathways"],["Monsters","probability horrors and curse beasts"],["What they fear","destiny itself"]],"saying":{"text":"Fate is a road they paved for you. We taught ourselves to dig.","attr":"a Vate saying"},"soon":"\u003cp>This world carries a recorded hint: that Fatescorn can wound probability itself. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>The Scere is a world where chance refuses to lie flat. Its landscape twists into probability structures that should not hold their shape, paths that lead somewhere different each time they are walked, and skies that seem to be deciding what to be. Broken melodies drift through it with no clear source. To outsiders it feels cursed. To the people who live there, it is simply honest about something every other world hides, that nothing was ever as fixed as it pretended to be. The people who live there speak of the Scere as if it were awake, and the ones who have wounded fate the deepest stop arguing the point.\u003c/p>","teaser":"The Scere is a world where chance refuses to lie flat.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/The+Scere","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Scerinyx","html":"\u003cp>Scerinyx is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of The Scere, the working the world calls Fatescorn. It exists as fractured probability lines and broken symbols, a magic that does not bend luck so much as cut into it, wounding the certainty of an outcome until other possibilities bleed through. Its tone is cynical and fatalistic, and its cost is severe. To scorn fate is to invite its collapse, and Fatescorn leaves bad-luck resonance trailing behind its users like a wake, settling on everything and everyone nearby.\u003c/p>","teaser":"Scerinyx is the Brand of The Scere, the working the world calls Fatescorn.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/The+Scere","key":"brand","tag":"Brand of Magic","lead":"Brand of The Scere · the art of Fatescorn","rune":"ᚹ"},{"title":"The Vate","html":"\u003cp>The Vate are a people who looked at destiny and refused it. They gather in isolated cult circles rather than nations, each clinging to its own hard-won way of slipping the path laid out for it. They are wary, fatalistic, and stubborn in a way that reads as despair until you understand it as defiance. To be Vate is to believe that fate can be wounded, and to pay for that belief.\u003c/p>","teaser":"The Vate are a people who looked at destiny and refused it.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/The+Scere","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"Architecture and Cities","html":"\u003cp>The Scere's structures rise as twisted probability forms, buildings that seem to occupy several possible shapes at once and settle on one only when observed. Travel runs along unstable pathways that cannot be fully trusted to arrive where they began.\u003c/p>","teaser":"The Scere's structures rise as twisted probability forms, buildings that seem to occupy several possible shapes at once and settle on one only when observed.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/The+Scere","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Belief in The Scere is built on the rejection of fate. The cult circles do not pray for fortune. They train to refuse it, treating destiny as an enemy to be evaded rather than a will to be obeyed.\u003c/p>","teaser":"Belief in The Scere is built on the rejection of fate.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/The+Scere","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in The Scere","html":"\u003cp>The Vate take bitter roots and omen teas, food and drink chosen as much for reading signs as for sustenance. Their music comes as broken melodies, and they dress in tattered layered wraps suited to a world that rarely stays still. They cross it by unstable pathways, trusting instinct over any map, because no map here holds for long.\u003c/p>","teaser":"The Vate take bitter roots and omen teas, food and drink chosen as much for reading signs as for sustenance.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/The+Scere","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Therion":{"name":"Therion","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Therion","lineage":"The Thurani","brand":"Tempralis","art":"Tempraling","glance":[["Travel","time rails and phase paths"],["Monsters","chronobeasts and temporal echoes"],["What they fear","losing time, and losing themselves"]],"saying":{"text":"Spend an hour carelessly and it spends you back, with interest.","attr":"a Thurani saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Therion is a world where time does not run straight. Timeworn temples stand beside shifting cities that are not quite where they were yesterday, echoing drums and layered rhythms keep a beat that helps the living stay anchored, and temporal echoes drift through the streets like weather. To live here is to be careful with hours the way other peoples are careful with coin, because in Therion time is something that can be saved, squandered, and stolen.\u003c/p>","teaser":"Therion is a world where time does not run straight.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Therion","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Tempralis","html":"\u003cp>Tempralis is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Therion, the working called Tempraling. It exists as distorted motion blur, temporal fractures, and echo afterimages, a magic of bending the flow of time around the wielder. Its tone is tense and strategic, a craft of timing and consequence rather than raw force. Its cost is the wielder's own span, for Tempraling brings accelerated aging and a deep temporal fatigue, spending the years it borrows.\u003c/p>","teaser":"Tempralis is the Brand of Therion, the working called Tempraling.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Therion","key":"brand","tag":"Brand of Magic","lead":"Brand of Therion · the art of Tempraling","rune":"ᚹ"},{"title":"The Thurani","html":"\u003cp>The Thurani are an ordered, watchful people governed by strict chronologer castes, keepers of schedule, sequence, and the careful measurement of time. They revere fate and the timeline, and they distrust anything that disturbs the order of before and after. Their gravest fear is to slip out of sequence, to lose their place in time and, with it, the thread of who they are.\u003c/p>","teaser":"The Thurani are an ordered, watchful people governed by strict chronologer castes, keepers of schedule, sequence, and the careful measurement of time.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Therion","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"Architecture and Cities","html":"\u003cp>Therion builds against the drift. Timeworn temples are raised to outlast the centuries that pass unevenly here, and the shifting cities are designed to be re-found, marked with rhythm and rune so the living can locate them again after time has moved them. Travel runs on time rails and phase paths that cut across the uneven flow.\u003c/p>","teaser":"Therion builds against the drift.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Therion","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Therion is reverence for fate and the timeline, the belief that sequence is sacred and that disturbing it is both sin and danger. The chronologer castes serve as its priesthood, guarding the order of events and the careful, anxious peace of a world that could so easily come unstuck.\u003c/p>","teaser":"Faith in Therion is reverence for fate and the timeline, the belief that sequence is sacred and that disturbing it is both sin and danger.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Therion","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Therion","html":"\u003cp>The Thurani take preserved meats and aged fruits, food that keeps against a world where time is unreliable. Their music is echoing drums and layered rhythms that double as anchors, and they dress in layered robes set with clockwork adornments. They cross their world by time rail and phase path, trusting the rhythm to keep them in sequence.\u003c/p>","teaser":"The Thurani take preserved meats and aged fruits, food that keeps against a world where time is unreliable.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Therion","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Ursathar":{"name":"Ursathar","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Ursathar","lineage":"The Boxunin","brand":"Bruingar","art":"Bruinbracing","glance":[["Travel","mammoth caravans"],["Monsters","mountain beasts and cave horrors"],["What they fear","dishonor, and weakness"]],"saying":{"text":"A mountain does not boast that it cannot be moved. It simply is not moved. Be the mountain.","attr":"a Boxunin saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Ursathar is a world of high peaks and deep stone. Mountain halls and stone dens are carved into the cliffs and caverns, drum circles and booming chants echo through the ranges, and the Boxunin endure the cold heights with a patience as old as the rock. Strength here is not loud. It is steady, honored, and proven over a lifetime, and the worst thing a Boxunin can be is not weak by accident but dishonored by choice.\u003c/p>","teaser":"Ursathar is a world of high peaks and deep stone.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Ursathar","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Bruingar","html":"\u003cp>Bruingar is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Ursathar, the working called Bruinbracing. It exists as earthen shockwaves and stone-hide resonance, a protective magic of bracing, enduring, and standing immovable against any force. Its tone is protective and immovable. Its cost is the body's reserves, for Bruinbracing demands deep physical exhaustion, spending the wielder's stamina to hold the line, though it spares the soul the corruptions that crueler Brands inflict.\u003c/p>","teaser":"Bruingar is the Brand of Ursathar, the working called Bruinbracing.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Ursathar","key":"brand","tag":"Brand of Magic","lead":"Brand of Ursathar · the art of Bruinbracing","rune":"ᚹ"},{"title":"The Boxunin","html":"\u003cp>The Boxunin are a people of strength-based clans, broad and immovable, valuing endurance, honor, and steadfastness above flash or speed. They are slow to anger and slower to yield, and they hold dishonor and weakness as the same failing wearing different faces. They keep ancestor bear worship, honoring the great beasts whose strength and stubbornness they aspire to match.\u003c/p>","teaser":"The Boxunin are a people of strength-based clans, broad and immovable, valuing endurance, honor, and steadfastness above flash or speed.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Ursathar","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"Architecture and Cities","html":"\u003cp>Ursathar builds into the mountain itself. Mountain halls and stone dens are carved from the living rock, warm against the cold and strong against siege, meant to outlast generations. Travel runs on mammoth caravans that haul clans and goods across the high passes.\u003c/p>","teaser":"Ursathar builds into the mountain itself.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Ursathar","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Ursathar is ancestor bear worship, reverence for the mighty beasts and the forebears whose strength and honor the living strive to uphold. The clans honor steadfastness as sacred, holding that to stand firm, to endure, and to keep one's honor is the truest devotion a Boxunin can offer.\u003c/p>","teaser":"Faith in Ursathar is ancestor bear worship, reverence for the mighty beasts and the forebears whose strength and honor the living strive to uphold.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Ursathar","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Ursathar","html":"\u003cp>The Boxunin take heavy meats and fermented drinks, hearty fare for a hardy people, and they fill their halls with drum circles and booming chants. They wear thick hides and warpaint, and they travel by mammoth caravan through the high country. Their whole way of life is built to stand, endure, and refuse to be moved.\u003c/p>","teaser":"The Boxunin take heavy meats and fermented drinks, hearty fare for a hardy people, and they fill their halls with drum circles and booming chants.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Ursathar","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Valoria":{"name":"Valoria","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","lineage":"The Dweller","brand":"Ectolume","art":"Tetherghasting","glance":[["Travel","Runesteeds, guarded caravans, and the old roads"],["Monsters","Rendrals, Veilborn, and Dreadpelts"],["What they fear","being erased, and the Queen behind the Veil"]],"saying":{"text":"A kingdom does not die when its king falls. It dies when the last person who remembers his name forgets it.","attr":"a Valorian saying"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Valoria is a kingdom in the long process of forgetting itself. Snow lies over ruined keeps and ancient castles, blue faeliri lanterns line the roads to hold the darkness back beyond the tree line, and the halls still standing glow faintly with the residue of old resonance. It was once a single realm under one great crown, ruled by King Arandon. Now it is a scatter of fragmented territories held by councils, nobles, and desperate protectors, each clinging to a piece of a story none of them can finish telling, because the story itself has been damaged.\u003c/p>\u003cp>The Dwellers speak the name of that damage carefully. The Withering. It is a blight on the land and a blight on memory at once, a slow unraveling in which villages, names, and whole histories thin out and go quiet. Where memory fails, reality frays, and in the frayed places the rendrals and the Veil-touched wake and hunt. To live in Valoria is to hold tight to what you remember as though it were a weapon, because here it is one.\u003c/p>","teaser":"Valoria is a kingdom in the long process of forgetting itself.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Ectolume","html":"\u003cp>Ectolume is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Valoria, the forbidden art the world calls Tetherghasting. It binds the lingering souls that death and grief leave behind, and a Tetherghaster forges a tether to those wandering echoes and draws spectral force into weapons, armor, lanterns, and their own body. It shows as pale teal soulfire and ghostly chains, melancholic and heroic both, the magic of a people who refuse to let go. Most Valorians fear it, yet frontier villages reluctantly depend on it against the rendrals and the Veil, and its cost is the steepest kind. To bind souls too often is to be slowly hollowed and drawn toward the same Veil that hunts the realm.\u003c/p>","teaser":"Ectolume is the Brand of Valoria, the forbidden art the world calls Tetherghasting.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","key":"brand","tag":"Brand of Magic","lead":"Brand of Valoria · the art of Tetherghasting","rune":"ᚹ"},{"title":"The Dweller","html":"\u003cp>The Dwellers are a hardy, oath-bound people, gathered into fragmented kingdoms and the knightly orders that outlasted them. Older than Valoria itself, they were wanderers and survivors long before they settled its roads, and they keep faith with old crowns and dead kings out of a conviction that what is remembered cannot be wholly lost. They carry their history in ballad and chime because written records have a way of going blank, and they meet strangers with weathered courtesy and slow, hard-earned trust. Loyal and quietly grieving, they are a people haunted by a glory they can almost remember and can no longer prove.\u003c/p>","teaser":"The Dwellers are a hardy, oath-bound people, gathered into fragmented kingdoms and the knightly orders that outlasted them.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"The Runesteed","html":"\u003cp>The Runesteed is the \u003ca href=\"https://fellguide.com/The+FellGuide/Quick+Links/Lorebounds\" target=\"_blank\" rel=\"noopener\">Lorebound\u003c/a> of Valoria, a powerful rune-marked riding beast and the most dependable companion on the dangerous roads between settlements. Intelligent, stubborn, and fiercely loyal once bonded, a Runesteed grows agitated near corruption and rendrals and unnatural silence, and many old stories hold that it senses darkness long before its rider can. The herds run to many kinds, the war-bred Ironmanes, the tireless Longstriders of the caravan roads, and the Frostmanes of the cold high country.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Redoubt\u003c/strong>. Raises stone between a Fell and what comes for them.\u003c/p>\u003c/div>","teaser":"The Runesteed is the Lorebound of Valoria, a powerful rune-marked riding beast and the most dependable companion on the dangerous roads between settlements.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Runesteed","key":"lb:The Runesteed","tag":"Lorebound","rune":"ᛈ","linkLabel":"The Runesteed"},{"key":"campaign","tag":"The Fell","rune":"ᛟ","title":"The Shattering of Valoria","teaser":"Four strangers woke in the Whispering Woods with no memory of how they came, pulled into Valoria by something that wanted them there.","html":"\u003cp>Four strangers woke in the Whispering Woods with no memory of how they came, pulled into Valoria by something that wanted them there. Garrik the Old found them with a lantern and a warning, and told them of Eldervale at the forest's edge and the sickness eating through it. The woods did not let them leave clean. They walked out with a pack of Rendrals howling at their backs and a kingdom coming apart ahead of them.\u003c/p>\u003cp>The hunt for the shattered Crown of Valoria runs through every chapter that follows.\u003c/p>\u003cp>\u003ca class=\"watch-link\" href=\"https://www.youtube.com/live/X99Y_iTfsZs\" target=\"_blank\" rel=\"noopener\">&#9654;&nbsp; Watch The Shattering of Valoria on YouTube\u003c/a>\u003c/p>","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Histories/The+Shattering+of+Valoria/The+Shattering+of+Valoria","linkLabel":"The Shattering of Valoria"},{"title":"The Crown and the Shattering","html":"\u003cp>Valoria's wound runs back to a shattered crown. King Arandon ruled the realm whole beneath the Crown of Valoria, until Lord Brannis turned the blade Sunderbane upon him and erased him from the world, cut so cleanly out of history that even those who would save Valoria can no longer fully recall what was lost. The stroke shattered the Crown and frayed the realm's shared memory in the same instant, and the Crown Shards scattered across the land.\u003c/p>\u003cp>Calevar, the Rekindled King, is the last heir of that erased line, the stepson of a father the world no longer remembers. He was woken with the placing of the first shard and rose already corrupted, his spirit tethered to the Veil, and the Queen has since closed her hand around him. Beneath the ruin of Arandon's Keep rests Sunderbane itself, and the oldest whisper in Valoria holds that the sword which erased a king was once used to end something far greater. The seals around it are weakening again.\u003c/p>","teaser":"Valoria's wound runs back to a shattered crown.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"The Veiled Queen","html":"\u003cp>The ruin of Valoria belongs to the Veiled Queen, the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Aspects+of+Discord/Aspects+of+Discord\" target=\"_blank\" rel=\"noopener\">Aspect of Discord\u003c/a> that drew its first breath here, for this is the world where Malvaro was unmade. She was no invader out of nowhere. The shard of that unmaking found a queen already breaking, Arandon's wife and Calevar's mother, and when the same stroke took her husband and her son from her reality at once, her grief tore open a wound that \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Discord\" target=\"_blank\" rel=\"noopener\">Discord\u003c/a> poured through. She unmade her own past to escape the pain of it, and now she hunts and erases anything that resembles the life she can no longer name, her own son among it. Her court labors to keep the true history buried beneath the Withering and to leave hers the only version that remains.\u003c/p>","teaser":"The ruin of Valoria belongs to the Veiled Queen, the Aspect of Discord that drew its first breath here, for this is the world where Malvaro was unmade.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Cities and Strongholds","html":"\u003cp>Valoria's surviving places huddle behind their lanterns. Eldervale is a weathered border village beneath the great western Wallbridge, its faeliri lantern barrier holding back the Whispering Woods, often the first refuge for travelers entering the western reaches. The Silver Veil Highlands is one of the last great strongholds, a gothic city of silver-gray stone and chain-draped keeps ruled by Lady Seraphina and held by her Highland Knights and Silver Talon officers, grand and strained and quietly riddled with Veiled Court infiltration. The Broken Spire is the shattered fortress-laboratory once ruled by Lord Brannis, still crawling with his Dreadpelts and the remnants of his Dreadbound. Sanctuary Arvonis is an ancient sacred refuge carved into the cliffs of the Western Wastes, home of the Chalice of Purity and guarded by the spectral kings of Valoria's past. The Cradle of Embers is a volcanic fortress region, the domain of Vaelric and his Ember Legion, where one of the final Crown Shards lies hidden in the Ember Fort. Above them all stands Arandon's Keep, the ruined royal stronghold where the king was erased, the resting place of Sunderbane, its dead halls hung with drifting Veiled threads.\u003c/p>","teaser":"Valoria's surviving places huddle behind their lanterns.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Valoria","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"The Whispering Woods","html":"\u003cp>The wood on Eldervale's western edge goes by three names. Valorians call it the Whispering Woods for the sound that runs through it, the Whispered Ashwood for what made it, and the Rotwo
