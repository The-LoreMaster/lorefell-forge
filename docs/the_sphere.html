f lodging somewhere behind your ribs and staying there.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Bogle\u003c/div>\u003cp>Bogles are bold in spirit, rich in voice, and endlessly curious. They are the campfire's laughter and the memory that lingers long after the battle is over.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Singing or humming constantly, even when alone, whether for comfort, magic, or mischief.\u003c/li>\u003cli>Turning even mundane events into dramatic retellings, complete with voices and flair.\u003c/li>\u003cli>Supporting your allies emotionally by lifting spirits with tales of hope or humor.\u003c/li>\u003cli>Drawing from the musical harmony of Sable in your speech patterns and worldview.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Bogle gain +1 to their Presence skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;You don't have to like my voice. But you'll remember the story.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Bogle of Sable\u003c/div>\u003cp>The Bogle are a people of bardic houses and oral historians, keepers of myth who treat memory and narrative as the foundation of the world. They are theatrical, dramatic, and deeply serious beneath the flourish, because in Sable to be forgotten is to truly cease, and to be remembered wrongly can be worse. They guard their stories the way other peoples guard borders.\u003c/p>"},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sable","teaser":"Whip.","html":"\u003cdiv class=\"sub\">Figures\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Canon+Characters/Whip\" target=\"_blank\" rel=\"noopener\">Whip\u003c/a>\u003c/div>\u003cp>A charismatic merchant, negotiator, and founder of The Enlisted.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Sable builds for the telling. Mythic amphitheaters and story-pillars stand at the heart of its settlements, stages and monuments where the great tales are performed and preserved. Travel runs on story caravans that carry the bardic houses between audiences, and on resonance stages that let a tale be told in many places at once.\u003c/p>","teaser":"Sable builds for the telling.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sable","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Sable is myth preservation, the conviction that a story kept alive keeps its subject alive, and that to be written out of the tale is the truest death. The bardic houses serve as priests of memory, and their gravest duty is to ensure that nothing worthy is forgotten, even as they wrestle with stories that would rather not stay on the page.\u003c/p>","teaser":"Faith in Sable is myth preservation, the conviction that a story kept alive keeps its subject alive, and that to be written out of the tale is the truest death.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sable","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Sable","html":"\u003cp>The Bogle take inkfruit, sweetmeats, and ceremonial feasts, meals that are themselves occasions for performance, and they fill their amphitheaters with narrative opera and spoken epics. They wear dramatic masks and embroidered cloaks, and they travel by story caravan and resonance stage. Every life here is lived a little like a role, in the hope it will be worth retelling.\u003c/p>","teaser":"The Bogle take inkfruit, sweetmeats, and ceremonial feasts, meals that are themselves occasions for performance, and they fill their amphitheaters with narrative…","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sable","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Scitnix":{"name":"Scitnix","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Scitnix","lineage":"The Corvid","brand":"Scrythene","art":"Scrymarking","glance":[["Travel","sigil gates"],["Monsters","arcane constructs and eye horrors"],["What they fear","forbidden knowledge"]],"saying":{"text":"There is no harmless thing to know. Only knowledge whose price has not yet come due.","attr":"a Corvid saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Scitnix is a world that wants to understand everything and is afraid of what that will cost. Arcane observatories and sigil labyrinths sprawl across it, resonant chimes and coded rhythms carry messages no outsider can parse, and the Corvid spend their lives gathering, recording, and guarding knowledge. It is a world of watchers, where the act of observation is itself a kind of power, and where some things, once known, cannot be unknown.\u003c/p>","teaser":"Scitnix is a world that wants to understand everything and is afraid of what that will cost.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Scitnix","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Scrythene","lead":"Brand of Scitnix · the art of Scrymarking","teaser":"Scrythene is the Brand of Scitnix, the working called Scrymarking.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Scrythene","linkLabel":"Scrythene","html":"\u003cp>\u003cem>Also called Scrymarking.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Scrythene is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Scitnix, the working called Scrymarking. It exists as floating observation sigils and eye-like glyphs, a magic of seeing, marking, and knowing, of fixing the world in symbol so it can be studied and controlled. Its tone is analytical and paranoid. Its cost is the mind's own bandwidth, for Scrymarking floods the wielder with more than a mind can hold, and sensory overload is the constant hazard of seeing too much at once.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Scrythene and watching sigils bloom over the bound, fixing them in symbol. Their intentions stop being secret. The marks lay the enemy's committed acts bare before the Fell decide their own. Call it weak and it is your plans pinned open for the enemy to read.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The bound side's committed Acts are revealed to the players.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Unlucky*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Unlucky* breaks out on Resonance.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Scrymarking is the analyst's craft of seeing too much and missing nothing.\u003c/p>\u003cul class=\"lst\">\u003cli>Mark a person, a path, or a place and know it again at any distance.\u003c/li>\u003cli>Pull a hidden detail out of a scene, a forgery, a false wall, a missing hour.\u003c/li>\u003cli>Fix a fleeting thing in a sigil to study it at leisure.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Corvid","lead":"Lineage of Scitnix","teaser":"The Corvid are sleek, black-feathered, and forever three moves into a plan you did not know you were in.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Corvid","linkLabel":"The Corvid","html":"\u003cp>The Corvid are sleek, black-feathered, and forever three moves into a plan you did not know you were in. Taloned hands, piercing eyes, beaks that fold every sentence into a whisper or a riddle. They live for secrets and schemes, they cannot resist a puzzle or a conspiracy, and nothing delights them like turning a powerful person's own plan against them.\u003c/p>\u003cp>Their world is Scitnix, a land of permanent night and thunder where broken stone spires stab at the sky and oily green fissures throw eerie light into every shadow. The Corvid roost in the high alcoves and cracks, always watching, always plotting, their society as jagged and unsteady as the cliffs they perch on.\u003c/p>\u003cp>They are social because they have to be and treacherous because that is the culture. A Corvid flock is a web of shifting alliances and sudden betrayals, and everyone in it knows it.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Corvid\u003c/div>\u003cp>Corvid are brilliant, manipulative, and conspiratorial. They are as likely to unravel a mystery as they are to create one, just the way they prefer it.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Using clever solutions and layered strategies in tense situations, leaning into their pattern recognition.\u003c/li>\u003cli>Leaning into their conspiratorial flair: whispers, schemes, and hidden motives that keep others guessing.\u003c/li>\u003cli>Portraying volatile alliances built on tension, mutual interest, or shared goals rather than trust.\u003c/li>\u003cli>Showing their thrill for rebellion and subversion at every opportunity.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Corvid gain +1 to their Vigilance skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;The difference between a mistake and a trap is whether or not I planned it.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Corvid of Scitnix\u003c/div>\u003cp>The Corvid are a scholarly people of strict hierarchies, ranked by what they know and what they are trusted to know. They are analytical, secretive, and prone to paranoia, forever weighing the value of a fact against its danger. They prize knowledge above almost everything, which is exactly why they fear it, having learned that the most forbidden truths tend to look back.\u003c/p>"},{"title":"Architecture and Cities","html":"\u003cp>Scitnix builds for study and security. Arcane observatories crown the high places, and sigil labyrinths wind beneath them, designed as much to protect dangerous knowledge as to organize it. Travel runs through sigil gates, instantaneous and tightly controlled, each passage a record of who went where and what they were permitted to see.\u003c/p>","teaser":"Scitnix builds for study and security.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Scitnix","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Scitnix is knowledge preservation, the conviction that what is known must be kept, guarded, and passed on, but only to those who can bear it. The scholar hierarchies serve as its keepers, deciding which truths survive and which are sealed away, and treating the careful control of knowledge as a sacred and dangerous duty.\u003c/p>","teaser":"Faith in Scitnix is knowledge preservation, the conviction that what is known must be kept, guarded, and passed on, but only to those who can bear it.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Scitnix","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Scitnix","html":"\u003cp>The Corvid take crystal fungi and spiced nectar, sustenance for long hours of study, and they fill their observatories with resonant chimes and coded rhythms. They dress in rune-marked robes, and they travel by sigil gate through their labyrinthine world. Everything here is observed, recorded, and filed, including, the Corvid suspect, themselves.\u003c/p>","teaser":"The Corvid take crystal fungi and spiced nectar, sustenance for long hours of study, and they fill their observatories with resonant chimes and coded rhythms.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Scitnix","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Sellenia":{"name":"Sellenia","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","lineage":"The Lunarian","brand":"Selvyrn","art":"Selvyring","glance":[["Travel","moonstone bridges, luminous waterways, and Aerostrix flight"],["Monsters","Moonveil Stalkers, Mirrorwisps, and corrupted reflections"],["What they fear","the past returning, and the Silent Weave turned to control once more"]],"saying":{"text":"The moon illuminates but never commands. Remember that. Then remember everything else.","attr":"a Selvyrn precept"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Sellenia is a world of eternal moonlight, beautiful and quietly wounded. A single great moon hangs motionless above it and never sets, silvering forests of white-leaved trees and vast mirror-still lakes. The reflections in those lakes do not always obey the sky. Stairways continue beneath the surface, and windows show rooms that no longer stand. Where moonlight crosses the right surface, memory-script surfaces across stone and bark for a few silent moments before it fades. The world feels refined and graceful, and every reflection suggests that part of Sellenia still exists in a layer just beyond ordinary sight.\u003c/p>\u003cp>Beneath the grace lie old wounds. Sellenia is one of the oldest centers of magical scholarship in \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/The+Sphere\" target=\"_blank\" rel=\"noopener\">the Sphere\u003c/a>, and it carries the scars of Malvaro's conquest and the first great fracture among the Knights of Fell. The Lunarians hold their beauty as discipline, a way of carrying sorrow without letting it rule them.\u003c/p>","teaser":"Sellenia is a world of eternal moonlight, beautiful and quietly wounded.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Selvyrn","lead":"Brand of Sellenia · the art of Selvyring","teaser":"Selvyrn is the Brand of Sellenia, the discipline of moonlight, reflection, and memory.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Selvyrn","linkLabel":"Selvyrn","html":"\u003cp>\u003cem>Also called Selvyring, or simply Selvyr.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Selvyrn is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Sellenia, the discipline of moonlight, reflection, and memory. Where other Brands reach for fire or force, Selvyrn works on what is seen, remembered, and understood. Its practitioners reveal and conceal, sharpen perception, and shape information, drawing on the silver light of the Eternal Moon and the silence beneath it.\u003c/p>\u003cp>Its first teaching is that the moon illuminates and never commands. Selvyrn holds that truth moves the world more surely than violence, and that clarity should come before action. A working of it looks like moonlight on glass and water, teal glyphs and mirrorlike distortions, rarely anything explosive.\u003c/p>\u003cp>Selvyrn is woven through Lunarian life as a tool of diplomacy, scholarship, navigation, and defense. The deepest of these arts touch memory and thought directly, and that is where Selvyrn turns dangerous. Malvaro corrupted the Silent Weave within Sellenia, and Mordaine turned memory and communication into instruments of control. The Lunarians have not forgotten, and they treat magic that can reshape what a person remembers or believes with great caution.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Selvyrn and moonlight pools across the field like water over glass. Every blow aimed at the favored side meets its own reflection, the harm thrown returning to the hand that threw it. Call it weak and the mirror faces the wrong way, turning your own strikes back on your people.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>Any attack against the favored side is dealt to the attacker as well.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Dazzled*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Dazzled* breaks out on Vigilance.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Selvyring is the calm work of seeing clearly and keeping what is true.\u003c/p>\u003cul class=\"lst\">\u003cli>Reveal what is hidden or conceal what should not be seen, in light and reflection.\u003c/li>\u003cli>Preserve a memory or a record exactly as it was, proof against tampering.\u003c/li>\u003cli>Read a room, a face, or a lie by the way the silver light falls on it.\u003c/li>\u003c/ul>\u003cdiv class=\"sub\">Selvyrn in Sellenia\u003c/div>\u003cp>Selvyrn is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Sellenia, the discipline of moonlight, reflection, and memory. It works on what is seen, remembered, and understood rather than on fire or force, revealing and concealing, sharpening perception, and shaping information. Its first teaching is that the moon illuminates and never commands, and that truth moves the world more surely than violence. The Lunarians treat it as scholarship and defense both, and they treat its deepest forms, the ones that touch memory and thought directly, with great caution. They have already seen what such power costs when it is misused.\u003c/p>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Lunarian","lead":"Lineage of Sellenia","teaser":"The Lunarians carry twilight in them, all grace and quiet resilience.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Lunarian","linkLabel":"The Lunarian","html":"\u003cp>The Lunarians carry twilight in them, all grace and quiet resilience. Gray-skinned, with eyes that shimmer in shades of teal, they bring a calming presence into a room. Slender, poised, and usually a little enigmatic, a Lunarian looks like they are holding a secret and waiting to decide whether you get to hear it.\u003c/p>\u003cp>They come from Sellenia, a realm of unending moonlight where silver rivers run through glowing forests and glassy lakes, all of it under a huge moon that never wanes and never lets the hush break.\u003c/p>\u003cp>Most Lunarians end up far from home, threading themselves into distant worlds on purpose. They are masters of the quiet kind of influence, the sort you find in circles of power, of art, of arcane knowledge. The moon is a long way off, but they carry its calm certainty wherever they go.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Lunarian\u003c/div>\u003cp>Lunarians are introspective, intelligent, and deeply attuned to the rhythms of magic and nature. While often reserved, they are fiercely loyal to those who earn their trust. They are nightwalkers, truth-seekers, and steady forces in a chaotic world.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Letting the moon guide your decisions or rituals, and highlighting that connection in play.\u003c/li>\u003cli>Playing up their calm demeanor, offset by flashes of brilliant insight or magic.\u003c/li>\u003cli>Using their cultural elegance and subtlety to navigate political or arcane situations.\u003c/li>\u003cli>Emphasizing a strong internal code shaped by Sellenia's gentle but demanding nature.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Lunarian gain +1 to their Precision attribute upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;The light may shift, but the moon still watches.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Lunarian of Sellenia\u003c/div>\u003cp>The Lunarians are the moonlit people of Sellenia, slender and poised, with gray skin, moon-pale hair, and eyes that shimmer teal or silver. They are calm, watchful, and difficult to read, carrying themselves with quiet certainty rather than open force. Their culture prizes restraint, memory, and subtle influence. Silence among them is a language, where a pause can mean trust, mourning, or disagreement, and a trained listener is expected to hear what was never said aloud.\u003c/p>\u003cp>Memory in Sellenia is a civic duty as much as a personal inheritance. Families preserve recollection through spoken lineages and witnessed retellings, and important vows are made before reflected moonlight rather than before crowds. Much of this discipline is moral preservation, a guard against control and erasure ever taking root again, because the Lunarians remember exactly what happened the last time memory became a weapon.\u003c/p>"},{"title":"The Aerostrix","html":"\u003cp>The Aerostrix is a moonlit griffin born beneath Sellenia's skies, a creature of silent flight and sharp-eyed precision. Bonded to a Lunarian, it becomes more sentinel than beast, holding the rhythm of a battle from above and shielding the one it has chosen. It is not won by reins but by clarity of spirit, answering only to a will tempered and unclouded. With feathers like silvered dusk and eyes that pierce deception, it remains guardian and companion at once.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Augury\u003c/strong>. Bends fortune so a Fell's strike lands true.\u003c/p>\u003c/div>","teaser":"The Aerostrix is a moonlit griffin born beneath Sellenia's skies, a creature of silent flight and sharp-eyed precision.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Aerostrix","key":"lb:The Aerostrix","tag":"Lorebound","rune":"ᛈ","linkLabel":"The Aerostrix"},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","teaser":"The Forsaken.","html":"\u003cdiv class=\"sub\">Powers\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/The+Factions/The+Forsaken\" target=\"_blank\" rel=\"noopener\">The Forsaken\u003c/a>\u003c/div>\u003cp>The Forsaken are Fell who break their oaths and turn to Discord.\u003c/p>\u003c/div>"},{"title":"The Nocturnai and the Silent Weave","html":"\u003cp>The Lunarians share their blood and their grief with the Nocturnai, the keepers of the Silent Weave, an art of sharing thought, emotion, and memory without a word spoken. Long ago Malvaro passed through Sellenia and found the Weave. He did not destroy it. He twisted it into an instrument of domination, and though he moved on, the wound stayed.\u003c/p>\u003cp>When the Knights of Fell later came to free the Nocturnai, Sellenia became the birthplace of a second tragedy. Armon Mordaine defied Draedon Vesper and enslaved the surviving Nocturnai for the war against Malvaro, turning memory and communication into chains. That betrayal was the first great fracture among the Knights, and it laid the foundation for the Forsaken. The descendants of the Nocturnai still guard the Silent Weave from hidden enclaves, and Sellenia still keeps mourning rites for what was done to them.\u003c/p>","teaser":"The Lunarians share their blood and their grief with the Nocturnai, the keepers of the Silent Weave, an art of sharing thought, emotion, and memory without a word spoken.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Cities and Sanctuaries","html":"\u003cp>Sellenia builds in alabaster, moonstone, and reflected light. Selene, the royal capital, rises along the Lunar Throne, the largest Mirror Lake in the realm, where palaces and silver-domed observatories stand beside the Moonspire Observatory and the Hall of Remembered Names. Parts of the city are built to align only in reflection, so that Selene seems to exist half in stone and half in silver water. Aethralis is the scholarly city, home of the Moonbound Observatory and archives so vast that a discovery there can raise a name or erase it. Noctis lies hidden deep in the Silverwild, one of the oldest Silent Weave sanctuaries in the Sphere, grown from living wood and revealed only where moonlight crosses the right surface. Moonfall Reach clings to the coastal cliffs as Sellenia's great port and gateway to other realms, its customs halls requiring names, origins, and declared truths before entry. Beyond them all spreads the Silverwild, a luminous forest that disobeys ordinary navigation, and the Veiled Reflection, a drowned ruin where the city stands more complete in the water than in stone.\u003c/p>","teaser":"Sellenia builds in alabaster, moonstone, and reflected light.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Sellenia is reverence for the Eternal Moon and for memory itself. Households begin and end their days in stillness before silver basins and mirror pools, keeping memory and intention disciplined rather than buried. The moon is treated as a keeper and a witness, holding what the living cannot, and remembrance is practiced as an act of moral preservation, a refusal to let control and erasure take root in Sellenia ever again.\u003c/p>","teaser":"Faith in Sellenia is reverence for the Eternal Moon and for memory itself.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">Corrupted Reflections\u003c/div>\u003cp>Corruption spreads through the Mirror Lakes, and reflections begin to move on their own. People recall events that never happened until a lake or a witness proves them false, and at the center of it lies the Veiled Reflection, where the drowned city replays histories that do not agree.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Forsaken\u003c/div>\u003cp>Heirs to Mordaine's betrayal, the Forsaken infiltrate royal institutions and hunt the lost methods of control, chasing Silent Weave relics and the forbidden bindings of the war years.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Weave Grows Unstable\u003c/div>\u003cp>The Silent Weave falters across Sellenia, and the Nocturnai fear it will be exploited a second time. Some who reach into it now hear answers they did not ask for.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Fracture Wakes\u003c/div>\u003cp>Reflection-scars from the first betrayal stir across lakes, shrines, and old battle paths, and parts of the Silverwild slip into remembered landscapes from before Malvaro and refuse to return. The wise fear \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Discord\" target=\"_blank\" rel=\"noopener\">Discord\u003c/a>'s hand behind the unrest, working the oldest wound in the realm.\u003c/p>\u003c/div>","teaser":"Corrupted Reflections, The Forsaken, The Weave Grows Unstable, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sellenia","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Shadakar":{"name":"Shadakar","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","lineage":"The Shadowkin","brand":"Inkthraal","art":"Inkmelding","glance":[["Travel","mistships and chained ferries"],["Monsters","Abysm horrors, mist spectres, and shadewyrms"],["What they fear","the Abysm, forgetting themselves, and the Inkwight"]],"saying":{"text":"Out here you do not lose your way. You lose the part of you that wanted to find it.","attr":"a Shadakar sailor's saying"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Shadakar is a world adrift on the Abysm, a living ocean of mist where memory, oaths, and identity are not held inside a person but worked into the water itself. Inkstone towers and warped ports cling to what solid ground remains, hanging libraries sway above the fog, and out past the harbor lights the mist closes over everything. Distant horns and ocean dirges carry across it, and no one is ever sure how far away the thing sounding them really is.\u003c/p>\u003cp>To sail the Abysm is to gamble with the self. The mist reacts to what you remember and what you have sworn, and it gives back distorted versions of both. Ships go out and do not return. Worse, ships go out and return carrying crews who are almost the people who left. The Shadowkin have learned to navigate this, more or less, and the price of learning is written on every one of them.\u003c/p>","teaser":"Shadakar is a world adrift on the Abysm, a living ocean of mist where memory, oaths, and identity are not held inside a person but worked into the water itself.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Inkthraal","lead":"Brand of Shadakar · the art of Inkmelding","teaser":"Inkthraal is the Brand of Shadakar, the working called Inkmelding.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Inkthraal","linkLabel":"Inkthraal","html":"\u003cp>\u003cem>Also called Inkmelding.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Inkthraal is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Shadakar, the working called Inkmelding. It exists as living ink, drifting script, and liquid shadow, a magic that writes meaning directly into the mist and the dark and reads it back out again. Its tone is esoteric and alien, closer to translation than to spellcraft. Its cost is paid in the self. Those who shape with Inkthraal suffer memory loss and emotional imprinting, the ink taking pieces of who they were and leaving smudges of who they have touched, until a deep practitioner is a palimpsest of borrowed lives.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Inkthraal and living ink runs across the bound, rewriting who they serve. The favored side chooses where each of them strikes, and the ink will turn a blade on a creature's own allies as readily as on a foe. Call it weak and it is your people the Inkwight points where it pleases.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The favored side chooses each bound creature's target, its own allies included.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Masked*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Masked* breaks out on Vigilance.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Inkmelding is translation as much as magic, and it always takes a little of you in trade.\u003c/p>\u003cul class=\"lst\">\u003cli>Write meaning into ink, mist, or shadow that only the right reader can draw back out.\u003c/li>\u003cli>Read a script no one living remembers, in living ink or the dark itself.\u003c/li>\u003cli>Lift or lay an imprint of feeling onto a person, a place, or a page.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Shadowkin","lead":"Lineage of Shadakar","teaser":"The Shadowkin, who call themselves the Nargálid in their own old tongue, are forged in shadow and kept alive by twilight.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Shadowkin","linkLabel":"The Shadowkin","html":"\u003cp>The Shadowkin, who call themselves the Nargálid in their own old tongue, are forged in shadow and kept alive by twilight. Tall and slender, they wear skin of pure void, black as the space between stars, and their eyes and mouths glow with an unsettling white light fixed in a permanent open smile, whether they feel joy, grief, or fury.\u003c/p>\u003cp>Gaunt and eerie as they look, the Shadowkin are no one's monsters. They are thinkers, watchers, and survivors of a world where light is a rare and dangerous thing.\u003c/p>\u003cp>They come from Shadakar, a realm locked in everlasting dusk. Leafless forests sway in silence, rivers glow faintly with a kind of bioluminescent sorrow, and mountains rise like teeth under a deep indigo sky that never once changes. It is a land of reflection, hidden war, and whispered memory.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Shadowkin\u003c/div>\u003cp>Shadowkin are often reserved, strategic, and inwardly focused. Their unsettling appearance belies a deep well of loyalty and empathy, though these must be earned. Their relationship with shadow is more than metaphorical. It is part of who they are.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Avoiding overly bright places due to light sensitivity. Shade is a comfort, not a fear.\u003c/li>\u003cli>Speaking with intent, often withholding truths until trust is earned.\u003c/li>\u003cli>Using darkness as a tool: listening in silence, retreating into cover, or appearing where least expected.\u003c/li>\u003cli>Exploring the duality between their terrifying appearance and deeply loyal nature.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Shadowkin gain +1 to their Resonance skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>_&quot;Even darkness has its watchers.&quot;_\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Shadowkin of Shadakar\u003c/div>\u003cp>The Shadowkin are a people of ship crews and archive castes, sailors and scholars bound by the same need to keep hold of what the Abysm tries to take. They are guarded, layered, and long-memoried, valuing the record and the oath above almost everything, because in Shadakar a forgotten promise is not just broken. It is erased. They guard their own memories jealously and trade in everyone else's.\u003c/p>"},{"key":"campaign","tag":"The Fell","rune":"ᛟ","title":"The Light Between Shadows","teaser":"Watch the campaign played in Shadakar.","html":"\u003cp>\u003ca class=\"watch-link\" href=\"https://www.youtube.com/live/Hx0BSig3uQ0\" target=\"_blank\" rel=\"noopener\">&#9654;&nbsp; Watch The Light Between Shadows on YouTube\u003c/a>\u003c/p>","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","linkLabel":null},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","teaser":"The Inkwight.","html":"\u003cdiv class=\"sub\">Aspects of Discord\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Aspects+of+Discord/The+Inkwight\" target=\"_blank\" rel=\"noopener\">The Inkwight\u003c/a>\u003c/div>\u003cp>The Inkwight is the Aspect of Discord that haunts Shadakar.\u003c/p>\u003c/div>"},{"title":"The Abysm and the Nadir Dial","html":"\u003cp>The Abysm is the great mystery and the great threat of Shadakar, a mist-ocean of memory and conceptual corruption that reacts to emotion and seems to want something. Scattered across it lie the Keyshards, pieces of an ancient mechanism called the Nadir Dial, and the Dial can either seal the Abysm away forever or turn its power upward, toward a transcendence that some believe would burn the whole Sphere clean. As the Waning eclipse approaches, rival shadowships race to gather the Keyshards, and the White-Mouthed King speaks through visions of salvation that may be the most dangerous lie in the world, or the most dangerous truth.\u003c/p>","teaser":"The Abysm is the great mystery and the great threat of Shadakar, a mist-ocean of memory and conceptual corruption that reacts to emotion and seems to want something.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Architecture and Cities","html":"\u003cp>Shadakar builds against the fog. Inkstone towers rise from the few stable anchorages, hung with libraries that drift on chains above the streets, and the ports are warped things, rebuilt so often around the shifting waterline that no two charts of them agree. Travel between anchorages runs by mistship and chained ferry, vessels rigged as much to hold a crew's memory intact as to cross the water.\u003c/p>","teaser":"Shadakar builds against the fog.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Shadakar is worship of memory and the depths. To remember is holy, to record is devotion, and the deepest reverence is reserved for the Abysm itself, terrible and vast. They fear the Inkwight, the fate of a mind so taken by the ink and the mist that nothing original remains, and they pray, in their layered guarded way, never to forget themselves into one.\u003c/p>","teaser":"Faith in Shadakar is worship of memory and the depths.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"Life in Shadakar","html":"\u003cp>The Shadowkin live on saltfish, black broth, and memory tea, the last brewed to hold a recollection steady through a long voyage. Their music is distant horns and ocean dirges, and they dress in long layered coats and waterproof wraps against the endless damp. They cross their world by mistship and chained ferry, trusting rope and record over any sense of direction the Abysm might offer.\u003c/p>","teaser":"The Shadowkin live on saltfish, black broth, and memory tea, the last brewed to hold a recollection steady through a long voyage.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Waning\u003c/div>\u003cp>An eclipse called the Waning approaches, and with it the Abysm grows stronger and the boundary between mist and Sphere grows thin. If it breaks fully, Shadakar may not be the only world to drown in fog.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Race for the Keyshards\u003c/div>\u003cp>Rival shadowships hunt the scattered Keyshards of the Nadir Dial, the Goldenmane against the Dirgecaller and worse, each crew certain its answer for the Dial is the one that saves everyone.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Upward Path\u003c/div>\u003cp>The White-Mouthed King offers transcendence through the fire of the Blazing Sun, a turning of the Dial upward that would purge the corruption and, some fear, \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/The+Sphere\" target=\"_blank\" rel=\"noopener\">the Sphere\u003c/a> along with it. The horror of the offer is that parts of it may be true. Few know the face behind the visions. The White-Mouthed King is Magnus Bane, \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Discord\" target=\"_blank\" rel=\"noopener\">Discord\u003c/a>'s own hand and the prophet the Sunborn follow.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">Losing the Self\u003c/div>\u003cp>Every voyage and every working of Inkthraal costs a little memory, and crews return less themselves than they left. The slow erasure is harder to fight than any horror, because it feels like nothing at all.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Same Silence Elsewhere\u003c/div>\u003cp>A few archivists who have compared records across worlds keep one finding off the public logs. The Inkwight is not Shadakar's alone. The same silence surfaces on other worlds wearing other faces, and all of them seem to answer to a single hand no one will name.\u003c/p>\u003c/div>","teaser":"The Waning, The Race for the Keyshards, The Upward Path, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shadakar","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Shervinaw":{"name":"Shervinaw","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shervinaw","lineage":"The Shrewish","brand":"Rootsummons","art":"Rootsummoning","glance":[["Travel","living root tunnels"],["Monsters","rootbound beasts and bark horrors"],["What they fear","the blight"]],"saying":{"text":"Feed the root and the root remembers you. Starve it, and it remembers that too.","attr":"a Shrewish saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Shervinaw is a world grown from the roots up. Root-cathedrals and bark fortresses rise from a tangle of living wood, wooden flutes and root harmonics drift through the green dark, and the Shrewish live in deep communion with the roots that hold their world together. They summon from the living wood and the fungus beneath it, and they tend the root with the care of a people who know exactly what happens when it begins to rot.\u003c/p>","teaser":"Shervinaw is a world grown from the roots up.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shervinaw","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Rootsummons","lead":"Brand of Shervinaw · the art of Rootsummoning","teaser":"Rootsummons is the Brand of Shervinaw, the working called Rootsummoning.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Rootsummons","linkLabel":"Rootsummons","html":"\u003cp>\u003cem>Also called Rootsummoning.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Rootsummons is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Shervinaw, the working called Rootsummoning. It exists as living bark growths, root tendrils, and fungal summons, a wild magic of calling forth and shaping the living wood and the things that grow in it. Its tone is wild and territorial. Its cost is the body's own boundaries, for Rootsummoning brings a gradual bodily overgrowth, bark and root creeping over the wielder until, in time, it is hard to say where the druid ends and the forest begins.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Rootsummons and bark and root creep over the bound, slowing them to the pace of growing things. They manage an act only every other round, the rest spent fighting the overgrowth. Call it weak and your own people are the ones the forest swallows.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>A bound creature may take an Act only every other round.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Vulnerable*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Vulnerable* breaks out on Guard.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Rootsummoning calls the living wood to do what hands cannot.\u003c/p>\u003cul class=\"lst\">\u003cli>Call forth roots, bark, or fungal growth to build, bind, or bar a way.\u003c/li>\u003cli>Wake a guardian of living wood to hold a place while you rest.\u003c/li>\u003cli>Read the wild growth of a land and what it has taken into itself.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Shrewish","lead":"Lineage of Shervinaw","teaser":"The Shrewish are clever, whiskered folk built around one idea: survive, comfortably if at all possible.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Shrewish","linkLabel":"The Shrewish","html":"\u003cp>The Shrewish are clever, whiskered folk built around one idea: survive, comfortably if at all possible. Big eyes for spotting an opening, incisors strong enough to gnaw through nearly anything, and a knack for scavenging, building, and planning that has no real equal. Their dens are stuffed with clever contraptions, warm talk, and enough food to outlast a dozen winters.\u003c/p>\u003cp>They come from Shervinaw, a temperate realm of enormous tree canopies, winding rivers, and soil soft enough to tunnel through by tooth or tool. The Shrewish prepare without pause, work as a community, and never once hesitate to help a neighbor.\u003c/p>\u003cp>They look unassuming, and they are quietly relentless. A Shrewish will not boast or charge in headfirst. It will build the trap, fortify the refuge, and find the way out of a mess while everyone around it is still busy panicking.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Shrewish\u003c/div>\u003cp>Shrewish are builders, thinkers, and perpetual planners. They love solving problems with their hands and they never go anywhere unprepared.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Portraying your character as constantly tinkering, gathering, or stockpiling just in case.\u003c/li>\u003cli>Using your strong teeth as tools: chewing through bindings, locks, or materials when others would give up.\u003c/li>\u003cli>Creating a sense of community with your party. Assign roles, check supplies, plan for every outcome.\u003c/li>\u003cli>Balancing your practicality with bursts of big-hearted bravery, especially when others are at risk.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Shrewish gain +1 to their Anchor skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;Storm's coming. Good thing I packed three cloaks, six torches, and half a stew.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Shrewish of Shervinaw\u003c/div>\u003cp>The Shrewish are a people of druidic circles, small, watchful, and bound to the living root. They are nurturing and territorial in equal measure, devoted to the growth they tend and wary of anything that might bring the blight. They keep spirit root worship, treating the deep roots as sacred and living, and they shape their whole way of life around feeding, guarding, and listening to the green.\u003c/p>"},{"key":"lb:The Felionis","tag":"Lorebound","rune":"ᛈ","title":"The Felionis","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Felionis","linkLabel":"The Felionis","teaser":"Deep in the knotted woods of Shervinaw, under curling roots and a ceiling of fungus, the Felionis hunts.","html":"\u003cp>Deep in the knotted woods of Shervinaw, under curling roots and a ceiling of fungus, the Felionis hunts. These cats were shaped by the forest itself, grown from the great mother roots, and they carry the flat defiance of wild things. Their hides are plated in spell-resistant bark, and their split forelimbs let them climb anything that stands between them and prey, or cover.\u003c/p>\u003cp>Bonded to a Fell, a Felionis guards its master the way it guards the new shoots of Shervinaw. Its presence sours spellcraft, blunting magic thrown its way and making anyone regret aiming the arcane at someone it has decided to protect.\u003c/p>\u003cp>Earn one and you have earned the respect of the forest's meanest sentinel. When the spells come down like rain, it plants itself in front of you and does not move.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Aegis\u003c/strong>. Sours hostile magic aimed at a Fell so it falters.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Shervinaw grows its strongholds rather than raising them. Root-cathedrals and bark fortresses are coaxed from the living wood, vast organic halls that the druidic circles tend across generations. Travel runs through living root tunnels that open and close at the forest's slow consent.\u003c/p>","teaser":"Shervinaw grows its strongholds rather than raising them.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shervinaw","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Shervinaw is spirit root worship, reverence for the deep living roots said to hold the world together and remember those who tend them. The druidic circles serve as its keepers, and their gravest duty is to feed and guard the root against the blight, knowing that a forest left to rot does not simply die but turns.\u003c/p>","teaser":"Faith in Shervinaw is spirit root worship, reverence for the deep living roots said to hold the world together and remember those who tend them.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shervinaw","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Shervinaw","html":"\u003cp>The Shrewish take root stew and moss cakes, food drawn from the growth they tend, and they fill their cathedrals with wooden flutes and root harmonics. They dress in living bark garments grown to fit, and they travel by living root tunnel. Their whole world is a single growing thing, and they live as its careful, wary gardeners.\u003c/p>","teaser":"The Shrewish take root stew and moss cakes, food drawn from the growth they tend, and they fill their cathedrals with wooden flutes and root harmonics.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Shervinaw","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Sporion":{"name":"Sporion","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","lineage":"The Capling","brand":"Mycognosis","art":"Mycospreading","glance":[["Travel","root bridges, living lifts, and cultivation causeways"],["Monsters","Miregut growths, hostile fungal mutations, and memory-bent organisms"],["What they fear","the Great Consumption coming again, and what the Miregut keeps of the dead"]],"saying":{"text":"To us, life and death are not opposites. They are ingredients.","attr":"a Sporekeeper's first teaching"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Sporion is a living fungal world where growth and decay hold in balance, and where every death feeds something new. Towering mushroom spires rise hundreds of feet into humid, spore-filled skies, vast canopies glow in blue, green, amber, and violet, and bioluminescent growth lights the winding paths below. It is one of the oldest ecosystems in \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/The+Sphere\" target=\"_blank\" rel=\"noopener\">the Sphere\u003c/a>, threaded through by an immense mycelial network that many believe carries information between every living thing in the world.\u003c/p>\u003cp>The Caplings build civilization inside this living landscape, balancing martial discipline, culinary mastery, and patient stewardship of the soil. Their oldest traditions reach back to the First Bloom, when the first Caplings rose from sacred spores. Beneath all of it, far below the gardens and the cities, sprawls the Miregut.\u003c/p>","teaser":"Sporion is a living fungal world where growth and decay hold in balance, and where every death feeds something new.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Mycognosis","lead":"Brand of Sporion · the art of Mycospreading","teaser":"Mycognosis is the Brand of Sporion, the art of cultivating and directing living fungal resonance.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Mycognosis","linkLabel":"Mycognosis","html":"\u003cp>\u003cem>Also called Mycospreading, or simply the Spread.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Mycognosis is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Sporion, the art of cultivating and directing living fungal resonance. Where other Brands impose a will on the world, Mycognosis grows its effects, working through spores, roots, fermentation, and the symbiosis between a practitioner and the living things around them. Every working begins as a seed.\u003c/p>\u003cp>Its power is drawn from the mycelial networks that thread the whole world, from spiritual spores and ancient cultivation sites, and from the shared memory carried through Sporion's living web. A cultivator raises magical fungi within gardens, weapons, armor, food, and their own body, and each strain answers a different need. Spore clouds and toxic blooms serve a fight, healing growths and regeneration tend the wounded, and root entanglement and symbiotic strength reward those who know how to ask.\u003c/p>\u003cp>Mycognosis runs through ordinary life as deeply as it runs through war. Push it too far and the growth turns on its keeper through overgrowth, hostile mutation, and the slow blending of identity that comes from working too long with memory spores. Worst of all, strong Mycognosis can draw the notice of the Miregut, and the Miregut does not forget what it has noticed.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Mycospreading and the mycelial web threads the whole field, knitting the bound into one body. A wound dealt to any one of them blooms in all of them at once, the spores carrying the hurt down every root. Call it weak and the web binds your own, so that one blow against a single Fell is felt by all.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>Damage dealt to one bound creature is dealt to every bound creature.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Plagued*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Plagued* breaks out on Sanctum. Heavy spreading is said to draw the Miregut's notice.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Mycospreading is gardener, healer, and messenger all at once.\u003c/p>\u003cul class=\"lst\">\u003cli>Raise a fast-growing strain for food, medicine, light, or a living barrier.\u003c/li>\u003cli>Speak through the living web to another cultivator across a distance.\u003c/li>\u003cli>Read a place's health, what grows wrong there, and what has passed through it.\u003c/li>\u003c/ul>\u003cdiv class=\"sub\">Mycognosis in Sporion\u003c/div>\u003cp>Mycognosis is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Sporion, the working called Mycospreading. Where other Brands force a will onto the world, Mycognosis grows its effects, working through spores, roots, fermentation, and the bond between a cultivator and the living things around them. Every working begins as a seed. It is woven through ordinary life as deeply as through war, shaping agriculture, medicine, architecture, communication, and the kitchen alike. Its dangers are quiet ones: overgrowth, hostile mutation, dependency, and the slow blending of self that comes from working too long with memory spores.\u003c/p>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Capling","lead":"Lineage of Sporion","teaser":"The Caplings are mushroom-born warriors, stewards of the spore who hold blade and broth in equal regard.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Capling","linkLabel":"The Capling","html":"\u003cp>The Caplings are mushroom-born warriors, stewards of the spore who hold blade and broth in equal regard. They move like water, keep silent on purpose, and hand out their loyalty only after you have earned it through fire and fermentation both.\u003c/p>\u003cp>They come from Sporion, a damp realm of fungal towers, whispering vents, and mycelial networks that pulse underfoot. The land breathes out spores in slow luminous spirals that drift across toadstool glades and hollow roots, and the Caplings build their lives there out of ritual and rhythm, martial discipline braided into culinary art.\u003c/p>\u003cp>Caplings grow their offspring from their own spores, cultivating the next sprout themselves. Each one comes up a little different in spirit while carrying the same discipline as the one before it.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Capling\u003c/div>\u003cp>Caplings are graceful, focused, and deeply attuned to cycles of growth and decay. They speak little, act with purpose, and find joy in the quiet rituals of preparation, whether in combat or the kitchen.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Moving with precision and grace, letting silence speak for your resolve.\u003c/li>\u003cli>Using your spores for evasion, illusion, or spiritual communion.\u003c/li>\u003cli>Embracing a personal code or ritual centered around hospitality, harvest, or harmony.\u003c/li>\u003cli>Treating every confrontation, with words or weapons, as an art form.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Capling gain +1 to their Trickery skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;The blade is sharp. The broth is rich. Let none disturb the balance.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Capling of Sporion\u003c/div>\u003cp>The Caplings are mushroom-born stewards of the spore, graceful and precise, devoted to both blade and broth. Each one emerges from a sacred spore already carrying fragments of cultural memory, then grows into a person entirely their own. Their bodies range from cream and pale gray to vivid red, blue, green, and amber, marked by caps, frills, bioluminescent patterns, and spore-veils that shift over a lifetime with environment and craft.\u003c/p>\u003cp>Capling life turns on cultivation. Every act is treated as a seed planted for a later harvest. Meals are sacred, hospitality is an art, and combat is held as a disciplined expression of mastery rather than simple violence. Communities keep fungal gardens, fermentation halls, memory archives, and communal kitchens where stories are passed alongside food. Many of their rites still carry echoes of the First Bloom. Others were reshaped by the Memory Schism, the long argument over what should be remembered, who should hold remembrance, and whether forgetting can ever be sacred.\u003c/p>"},{"key":"campaign","tag":"The Fell","rune":"ᛟ","title":"Worriln Below","teaser":"Watch the campaign played in Sporion.","html":"\u003cp>\u003ca class=\"watch-link\" href=\"https://www.youtube.com/live/O06AW5cuul4\" target=\"_blank\" rel=\"noopener\">&#9654;&nbsp; Watch Worriln Below on YouTube\u003c/a>\u003c/p>","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","linkLabel":null},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","teaser":"Shroomy.","html":"\u003cdiv class=\"sub\">Figures\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Canon+Characters/Shroomy\" target=\"_blank\" rel=\"noopener\">Shroomy\u003c/a>\u003c/div>\u003c/div>"},{"title":"The Miregut","html":"\u003cp>Beneath Sporion's forests sprawls the Miregut, a living organism larger than kingdoms, its roots, organs, tunnels, and digestive chambers running through the world like veins beneath flesh. Whole ecosystems live inside it, fed by everything it consumes. Scholars cannot agree what it is. Some name it the world's heart, some a forgotten god, some only a vast and hungry thing, and the truth may be all three at once.\u003c/p>\u003cp>Most Caplings never see the true Miregut. They meet only its surface manifestations: breathing caverns, pulsing root systems, organic tunnels, memory cysts, and spore vents that open without warning. It redirects its own passages, grows toward places of death, preserves some of what it swallows and wholly digests the rest, and now and then expels strange organisms that resemble creatures it consumed centuries ago. The Great Consumption, the disaster that swallowed entire colonies and rewrote whole regions overnight, is dated to a single vast convulsion within it.\u003c/p>\u003cp>In a few of its deepest reaches, the Miregut does more than digest. It keeps. Explorers have come back from those places speaking of dead companions surfacing whole within memory spores, and of chambers where the Miregut seems to regrow what it consumed and send it back changed. How far this reaches, and what it is for, none who returned could say.\u003c/p>","teaser":"Beneath Sporion's forests sprawls the Miregut, a living organism larger than kingdoms, its roots, organs, tunnels, and digestive chambers running through the world…","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Cities and Sanctuaries","html":"\u003cp>Sporion's settlements grow as much as they are built. Mycelara, the great cultivation city, climbs the stalk of the largest fungal titan in the world, its districts spiraling up for miles until weather coils around the high terraces. It holds the Grand Mycelium Archive, where millions of memory spores are kept in living vaults, among them sealed records too dangerous to surface since the Memory Schism. Mycora is the trade metropolis, thousands of giant mushrooms forming a vertical market crowned by the Great Spore Market that never closes. The Hanging Gardens of Velm hang beneath enormous canopies, a cultivation sanctuary that produces much of Sporion's medicine and rarest ingredients.\u003c/p>\u003cp>Out on the frontier, Deepcap Hollow clings to the rim of a groaning Miregut sinkhole, the last outpost willing to send delvers deeper, its whole economy built on salvage, missing-person notices, and bets on who will return. Koromyr is older still, an ancient pilgrimage site that predates Capling civilization, revered and feared in equal measure, where some pilgrims come back convinced the place remembered them before they arrived. Far gentler is Hearthspore, an agricultural village of lantern-lit kitchens and fermentation halls that hosts the Feast of First Bloom, one of Sporion's most beloved celebrations.\u003c/p>","teaser":"Sporion's settlements grow as much as they are built.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"The Factions","html":"\u003cp>Sporion's deepest conflicts are arguments about growth, memory, and how far to trust the dark below.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Faction\u003c/th>\u003cth>What they want\u003c/th>\u003c/tr>\u003ctr>\u003ctd>The Grand Cultivators\u003c/td>\u003ctd>Preserve ecological balance and regulate cultivation. Respected, and often resented as too rigid.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Miregut Seekers\u003c/td>\u003ctd>Explore the Miregut at any cost, rising fast as new depths open.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Circle of Spores\u003c/td>\u003ctd>Preserve all memory, holding that nothing truly lives once it is forgotten.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Reclaimers\u003c/td>\u003ctd>Erase harmful memory so new growth can flourish.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Fermentarium Guild\u003c/td>\u003ctd>Push cultivation, cuisine, and fungal engineering toward constant innovation.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Purecap Tradition\u003c/td>\u003ctd>Restore strict ancestral methods, certain that novelty invites collapse.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","teaser":"Sporion's deepest conflicts are arguments about growth, memory, and how far to trust the dark below.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","key":"factions","tag":"Powers","rune":"ᚨ"},{"title":"Faith and Belief","html":"\u003cp>To the Caplings, life and death are not opposites but ingredients in the same long recipe. They revere the cycle of growth and decay, and they honor it through ritual meals, seasonal harvests, and spore ceremonies that carry knowledge from one generation to the next. Memory is treated as sacred, which is exactly why the Memory Schism cut so deep. The wound it left, the question of whether some things should be allowed to be forgotten, has never fully closed.\u003c/p>","teaser":"To the Caplings, life and death are not opposites but ingredients in the same long recipe.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Miregut Stirs\u003c/div>\u003cp>New tunnels open beneath major communities, and the oldest fear in the world returns with them. Expeditions vanish in depths no one has reached since the Great Consumption, and the word on every frontier is that a second one may be coming.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Memory War\u003c/div>\u003cp>The Circle of Spores and the Reclaimers have reopened the Schism, one guarding every record, the other burning what it calls rot. Archives are turning up corrupted, and some of Sporion's last memories from before the Schism may not survive the fight over them.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">Blight and Imbalance\u003c/div>\u003cp>A fungal blight spreads from settlement to settlement, harvest regions fall barren, and hostile mutations emerge in numbers no cultivator can account for.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">What the Deep Keeps\u003c/div>\u003cp>In certain Miregut depths the dead do not stay dead. A few delvers have returned speaking of companions regrown inside memory spores, and of places that knew their names before they spoke them. Most who hear the stories would rather not learn how true they are.\u003c/p>\u003c/div>","teaser":"The Miregut Stirs, The Memory War, Blight and Imbalance, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sporion","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Sylvanoth":{"name":"Sylvanoth","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sylvanoth","lineage":"The Arboril","brand":"Bramblecraft","art":"Bramblesnare","glance":[["Travel","root paths"],["Monsters","thorn beasts and vine horrors"],["What they fear","wild overgrowth"]],"saying":{"text":"The hedge does not keep the world out. It keeps deciding whether to let you back in.","attr":"an Arboril saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Sylvanoth is a world where the green fights back. Thorn keeps and living hedge cities grow rather than stand, their walls a snarl of bramble and vine trained into shape by generations of patient, wary cultivation. The Arboril live inside that growth, surrounded by a wilderness that is never entirely tame and never entirely safe. Gentle reed instruments drift through the groves, an oddly soft sound for a place where the plants have teeth.\u003c/p>","teaser":"Sylvanoth is a world where the green fights back.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sylvanoth","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Bramblecraft","lead":"Brand of Sylvanoth · the art of Bramblesnare","teaser":"Bramblecraft is the Brand of Sylvanoth, the working called Bramblesnare.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Bramblecraft","linkLabel":"Bramblecraft","html":"\u003cp>\u003cem>Also called Bramblesnare.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Bramblecraft is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Sylvanoth, the working called Bramblesnare. It exists as thorn growth, floral traps, and root cages, a magic of binding and warding through living plant. Its tone is protective and territorial, a craft of defense and ensnarement rather than open assault. Its cost is entanglement of a subtler kind, for Bramblesnare draws on emotional resonance and can leave its wielder bound up in the feelings of those caught in the snare.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Bramblecraft and thorns erupt from the ground, snaring whatever the world turns against. The bound find their every plan seized at the root, the deed strangled before it can be done. Call it weak and the snare closes on your own, your acts torn away as the brambles take you.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The bound side's declared Acts are cancelled.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Immobilized*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Immobilized* breaks out on Movement.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Bramblesnare is the patient work of a land that does not like to be crossed.\u003c/p>\u003cul class=\"lst\">\u003cli>Raise a wall of thorn or a root cage to seal a path, a door, or a captive.\u003c/li>\u003cli>Calm or rouse the living growth of a place, reading the mood tangled in it.\u003c/li>\u003cli>Set a snare or ward across a camp that wakes when something crosses it.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Arboril","lead":"Lineage of Sylvanoth","teaser":"The Arboril are living trees.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Arboril","linkLabel":"The Arboril","html":"\u003cp>The Arboril are living trees. Towering, sentient, grown from bark, leaf, and root, they move with the slow certainty of things that have outlasted whole kingdoms, their limbs creaking and their voices rolling deep through the canopy.\u003c/p>\u003cp>They come from Sylvanoth, a realm of vast trees, glowing groves, and wind that never stops whispering. Nature runs the place unopposed, and the Arboril serve as its stewards and its shepherds. Each one is born of a particular tree, oak, ash, birch, redwood, and it shows in the grain of their bark-skin, the leaves in their hair, and the color of their eyes.\u003c/p>\u003cp>They live on sunlight and company, and they loathe metal the way you would loathe a blade made from someone's bone. Even so, when war comes for the wild places, an Arboril will pick up a forged weapon and use it.\u003c/p>\u003cdiv class=\"sub\">Roleplaying an Arboril\u003c/div>\u003cp>Arboril are slow to act but unstoppable once roused. They are gentle giants who would rather plant than fight. But when the forest calls, they answer with fury and storm.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Reflecting your tree type in your personality. Stoic as an oak, flexible as a willow, fierce as a cedar.\u003c/li>\u003cli>Playing up your discomfort around metal or cities, seeking out natural spaces for strength and healing.\u003c/li>\u003cli>Portraying grief or quiet depression when far from Sylvanoth, and the slow process of healing in a foreign world.\u003c/li>\u003cli>Bringing ancient perspective: slow wisdom, long memory, and patient faith in renewal.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Arboril gain +1 to their Creation skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;The storm comes. The rot spreads. Still, we root. Still, we rise.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Arboril of Sylvanoth\u003c/div>\u003cp>The Arboril are a people of grove circles, rooted communities bound to the living growth around them. They are protective and territorial, slow to admit outsiders and quick to close ranks, shaped by a world that rewards vigilance over openness. They tend the hedge cities the way other peoples tend walls and gates, knowing the difference is that their walls are alive and have opinions.\u003c/p>"},{"key":"lb:The Thistlewing","tag":"Lorebound","rune":"ᛈ","title":"The Thistlewing","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Thistlewing","linkLabel":"The Thistlewing","teaser":"The Thistlewing is a dragon carved from living oak, its body a lattice of bark, vine, and thornwood lit by slow pulses of forest light.","html":"\u003cp>The Thistlewing is a dragon carved from living oak, its body a lattice of bark, vine, and thornwood lit by slow pulses of forest light. Native to Sylvanoth, it is half guardian and half trickster, scattering enchanted runes across the forest floor to turn back intruders and shelter its own.\u003c/p>\u003cp>It collects runes the way other things collect memories, each stone holding the echo of a spent spell. Bonded to a Fell, it passes the trick along. A spell no longer ends when it is cast. It lingers, bound into a rune that can spring or snare, and an ability hardens into a waiting trap the same way.\u003c/p>\u003cp>Mounted, the Thistlewing moves in a slow, almost stately crawl, shedding glowing runes behind it like fallen leaves. Most never notice they are surrounded until the first one goes off.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Snare\u003c/strong>. Snares a spent spell or ability into a rune or trap.\u003c/p>\u003c/div>"},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sylvanoth","teaser":"The Faelir.","html":"\u003cdiv class=\"sub\">Powers\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/The+Factions/The+Faelir\" target=\"_blank\" rel=\"noopener\">The Faelir\u003c/a>\u003c/div>\u003cp>The Faelir are fae spirits that drift between the realms and never quite belong to any of them.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Sylvanoth grows its strongholds. Thorn keeps and living hedge cities are cultivated over generations, their defenses rooted and breathing, their layouts shifting slowly as the growth is trained and retrained. Travel runs along root paths that the Arboril coax open and let close behind them.\u003c/p>","teaser":"Sylvanoth grows its strongholds.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sylvanoth","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Sylvanoth is nature spirit worship, reverence for the living green and the spirits that move through it. The grove circles serve as both community and congregation, and the Arboril hold that the wilderness is owed respect and wariness in equal measure, a power to be lived alongside rather than ruled.\u003c/p>","teaser":"Faith in Sylvanoth is nature spirit worship, reverence for the living green and the spirits that move through it.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sylvanoth","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Sylvanoth","html":"\u003cp>The Ar
