all in battle is not tragedy but the truest sacrament, a chance to rise again with bone and spirit lashed to the song of war.\u003c/p>","teaser":"The Marrowkai do not worship gods or stars.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"War and Peace","html":"\u003cp>Karn does not remember peace. It remembers conquest. Its wars are waged for survival and sanctity rather than crown, and every campaign is a hunt while every clash is a rite. Hollow Hosts descend on titans with spears of bone and blades etched in scar, and the fallen are bound and made to march in the ranks of their slayers.\u003c/p>\u003cp>What passes for peace is never stillness. It is the sharpening of bone weapons, the carving of relics, the scar-etching of children beneath the hum of the Chimeholds. It is preparation, a quiet shaping of strength for the battles to come. To live without the rhythm of war is to drift from the marrow-song and risk being forgotten.\u003c/p>","teaser":"Karn does not remember peace.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">Vaegra and the Eternal Host\u003c/div>\u003cp>A marrow tyrant named Vaegra preaches a corrupted version of the marrow-song and gathers the dead into a single host bound to her will. Where her rites take hold, Banding stops answering its rightful callers.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Tainted Marrow\u003c/div>\u003cp>The marrow-song itself has begun to sour, and the Bonecallers who hear it most closely say the wrongness in it is no natural thing. Many fear Discord has reached into the marrow and is rewriting the rite from the inside.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Shattered Kin\u003c/div>\u003cp>A heretic faction has broken from the Hollow Hosts and refuses the rites of Banding. They build permanent halls and reject the binding of slain beasts. To many this is blasphemy. To others it is a dangerous temptation.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Bleedwake\u003c/div>\u003cp>Some Chimeholds have begun to sing without blood, calling revenants from the soil and beasts from long-dead hunts. Some Marrowkai read this as prophecy of endless war. Others fear it is the corruption spreading, unbinding the marrow-song one toll at a time.\u003c/p>\u003c/div>","teaser":"Vaegra and the Eternal Host, The Tainted Marrow, The Shattered Kin, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Kwuhara":{"name":"Kwuhara","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","lineage":"The Minerite","brand":"Khaldurgy","art":"Khaldbearing","glance":[["Travel","resonance lifts and crystal rails"],["Monsters","Grimgrit and shardspawn"],["What they fear","becoming Unshaped"]],"saying":{"text":"A Minerite is not born. They are cut, set, and seated. Crack, and you are recut.","attr":"a Minerite saying"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Kwuhara is a world of inverted gemstone cities, citadels that hang downward from vast crystal ceilings and catch the light in cold, regal facets. Resonant crystal choirs ring through the hanging streets, and everything, from a citizen's station to their next life, is measured in the gems. It is beautiful and merciless in equal measure, a realm where order is total and the cost of that order is rarely spoken aloud.\u003c/p>\u003cp>The Minerite live and die and live again through the gems, their identities cut and set into crystal and seated into a strict caste hierarchy that claims to preserve stability for all. The claim holds, mostly. But the rebirth that anchors Kwuhara's whole society has begun to falter, and a world built entirely on certainty does not know what to do when the certainty cracks.\u003c/p>","teaser":"Kwuhara is a world of inverted gemstone cities, citadels that hang downward from vast crystal ceilings and catch the light in cold, regal facets.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Khaldurgy","html":"\u003cp>Khaldurgy is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Kwuhara, the working called Khaldbearing. It exists as gem resonance, mineral pulse-lines, and floating facets, a magic drawn from the crystal that underpins Minerite life and rebirth. Its tone is regal and oppressive, the magic of a ruling order rather than a free one. Its cost is the mind. Khaldbearing carries the risk of resonance madness, the gem's cold song lodging in the wielder's thoughts and ringing there long after the working is done, until some can no longer tell their own will from the crystal's.\u003c/p>","teaser":"Khaldurgy is the Brand of Kwuhara, the working called Khaldbearing.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","key":"brand","tag":"Brand of Magic","lead":"Brand of Kwuhara · the art of Khaldbearing","rune":"ᚹ"},{"title":"The Minerite","html":"\u003cp>The Minerite are a crystalline people, formal and disciplined, their lives ordered by a caste system that determines station, duty, and worth from the moment they are seated. They prize precision, restraint, and propriety, and they regard their hierarchy not as oppression but as the natural shape of a stable world. Beneath the formality runs a deep and quiet dread of becoming Unshaped, of cracking, losing one's set place in the gem and the cycle, and falling out of the order entirely.\u003c/p>","teaser":"The Minerite are a crystalline people, formal and disciplined, their lives ordered by a caste system that determines station, duty, and worth from the moment they…","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"lb:The Grimgrit","tag":"Lorebound","rune":"ᛈ","title":"The Grimgrit","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Grimgrit","linkLabel":"The Grimgrit","teaser":"Under Kwuhara, in the molten caverns where broken Khald'hart gems fall into the earth like tears, something slowly gathers.","html":"\u003cp>Under Kwuhara, in the molten caverns where broken Khald'hart gems fall into the earth like tears, something slowly gathers. Shattered soul fragments drift down into the fire and fuse, and over centuries they stack into towering shapes of crystal and stone. That is the Grimgrit, built out of pain and carrying a great many wills at once.\u003c/p>\u003cp>It does not so much strike as crush. The jagged limbs break and reform in the middle of a fight, every motion loud with the anger of dozens of Minerite souls that flatly refuse to fade. Beside a Fell, it throws off tremors of raw force that batter everything standing too near.\u003c/p>\u003cp>Walk with a Grimgrit and you are trailed by the footsteps of the forgotten. A walking crypt that will not let the living forget what stirs under the stone.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Reprisal\u003c/strong>. Answers a blow against a Fell with one of its own.\u003c/p>\u003c/div>"},{"key":"campaign","tag":"The Fell","rune":"ᛟ","title":"Stone and Sovereign","teaser":"Watch the campaign played in Kwuhara.","html":"\u003cp>\u003ca class=\"watch-link\" href=\"https://www.youtube.com/live/asBbdoZeWmA\" target=\"_blank\" rel=\"noopener\">&#9654;&nbsp; Watch Stone and Sovereign on YouTube\u003c/a>\u003c/p>","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","linkLabel":null},{"title":"The Rebirth and the Sovereign","html":"\u003cp>At the heart of Kwuhara sits the rebirth cycle, the process by which a Minerite's identity is preserved in the Khald'hart and seated into a new life. It is the foundation of everything, and it is failing. Resonance corruption spreads through rebirth itself, and the Sovereign who rules over the cycle has begun to hear voices within the gems, a fracture in his mind that he mistakes for clarity. He means to rewrite Minerite rebirth entirely, to perfect Kwuhara through forced unity, and he is certain, in the way only a breaking mind can be, that he alone can hold the world together.\u003c/p>","teaser":"At the heart of Kwuhara sits the rebirth cycle, the process by which a Minerite's identity is preserved in the Khald'hart and seated into a new life.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Architecture and Cities","html":"\u003cp>Kwuhara builds downward and inward. Inverted gemstone cities hang from crystal ceilings, citadels suspended over deep resonant dark, their halls cut and faceted to ring with the choirs that fill them. Movement runs along resonance lifts and crystal rails that hum through the hanging districts, carrying citizens between the tiers of a society as layered as the stone it lives in.\u003c/p>","teaser":"Kwuhara builds downward and inward.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Kwuhara is Khald'hart reverence, devotion to the gems that hold identity, station, and rebirth. The crystal is treated as both ancestor and law, and to honor it is to honor the order it imposes. The caste system is not merely political here. It is sacred, and questioning it is closer to heresy than to dissent.\u003c/p>","teaser":"Faith in Kwuhara is Khald'hart reverence, devotion to the gems that hold identity, station, and rebirth.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"Life in Kwuhara","html":"\u003cp>The Minerite take crystal fungi and mineral broths, food grown in the resonant dark, and they fill their citadels with resonant crystal choirs that double as ceremony and law. They dress in gem-encrusted formalwear that displays caste at a glance, and they travel by resonance lift and crystal rail through the hanging cities. Every part of life here is arranged, set, and seated, and that is exactly how the Minerite prefer it, right up until it stops working.\u003c/p>","teaser":"The Minerite take crystal fungi and mineral broths, food grown in the resonant dark, and they fill their citadels with resonant crystal choirs that double as…","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Failing Cycle\u003c/div>\u003cp>The rebirth that anchors all of Kwuhara is breaking down, resonance corruption spreading through it, and a society built on certainty is beginning to face questions it has no answers for.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Sovereign's Voices\u003c/div>\u003cp>The ruler hears the gems speaking, mistakes the madness for revelation, and moves to rewrite rebirth itself by force. What he calls perfecting Kwuhara, others call its end.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Rebellion\u003c/div>\u003cp>Rebels led by figures like Kidran Vektor work to break the caste system entirely, and the great houses maneuver against the throne and one another, while the world cracks underneath all of them.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Unshaped\u003c/div>\u003cp>Those who fall out of the cycle, cracked and unset, become the Unshaped, and their numbers are growing. Some are simply lost. Others may be turning into something the gems were never meant to hold.\u003c/p>\u003c/div>","teaser":"The Failing Cycle, The Sovereign's Voices, The Rebellion, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Mireleor":{"name":"Mireleor","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","lineage":"The Ironclad","brand":"Aethercraft","art":"Aethershaping","glance":[["Travel","rail platforms, forgewalkers, and armored caravans"],["Monsters","Titans, Behemoths, and the Duskcarved"],["What they fear","leyline collapse, waking Titans, and forging that runs out of control"]],"saying":{"text":"We do not mend the world to save it. We mend it because it breaks, and because we are still here to hear the crack.","attr":"inscription on the outer hull of Tharnhold's gateforge"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Mireleor is a thunder-split world of molten veins, rust-choked ruins, and overgrown forgelands where ancient machines sleep beneath tangled roots. The skies hang heavy with smoke and static, casting shifting light over jagged ridgelines and half-buried gears the size of fortresses. Jungle canopies crackle with electric wind, and the plains tremble with the tread of something colossal just out of sight.\u003c/p>\u003cp>Magic here is Aethercraft, the shaping of raw resonance into form, and it runs back to the Primordial Forges. Those leyline-fed engines were built long ago to hold reality together by burning order into the bones of the world. Their power still pulses through the land, but dimly now, like the last ember in a dying furnace. To live on Mireleor is to patch the broken, remember the lost, and hold the line against Behemoths that bear down like storms with bones. Every forge relit and every oath etched into iron is a spark flung against the dark.\u003c/p>","teaser":"Mireleor is a thunder-split world of molten veins, rust-choked ruins, and overgrown forgelands where ancient machines sleep beneath tangled roots.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Aethercraft","html":"\u003cp>Aethercraft is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Mireleor, the art the world calls Aethershaping. It is reality bent through the language of the Forges, resonance burned into matter as sigil and seam until steel remembers a shape it was never poured into. In the world it appears as molten runeplates, geometric forge-glyphs, and brands seared into metal, leyline, and living armor alike.\u003c/p>\u003cp>It is the most powerful working in \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/The+Sphere\" target=\"_blank\" rel=\"noopener\">the Sphere\u003c/a> and the most dangerous. The same craft that mends a Holdfast can scar a Titan or rewrite a stretch of leyline, and every great shaping leaves the world a little less stable than before. The oldest records hold that uncontrolled Aetherforging is what broke Mireleor in the first place, and the wisest Forgekeepers treat the Brand less as a gift than as a debt that always comes due.\u003c/p>","teaser":"Aethercraft is the Brand of Mireleor, the art the world calls Aethershaping.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"brand","tag":"Brand of Magic","lead":"Brand of Mireleor · the art of Aethershaping","rune":"ᚹ"},{"title":"The Ironclad","html":"\u003cp>The Ironclad are sentient suits of living armor, vessels of will, memory, and forged purpose. Each is a relic given breath, shaped through an old ritual that binds the skull of a long-vanished creator to a hollow steel form and grows memory-root through the join. No two are alike. Some rise as towering juggernauts and others move with uncanny grace, but all carry the weight of oaths they may no longer remember.\u003c/p>\u003cp>They are steadfast and burdened, driven by duty engraved deeper than thought. They do not sleep, yet they dream, of creators who vanished, of war without end, of a design they may never complete. They speak rarely and feel deeply, and their loyalty is hard to break. To be Ironclad is to endure without rest and without fully knowing why.\u003c/p>","teaser":"The Ironclad are sentient suits of living armor, vessels of will, memory, and forged purpose.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"campaign","tag":"The Fell","rune":"ᛟ","title":"Madness of Mireleor","teaser":"Watch the campaign played in Mireleor.","html":"\u003cp>\u003ca class=\"watch-link\" href=\"https://www.youtube.com/live/igjqOAUEqfU\" target=\"_blank\" rel=\"noopener\">&#9654;&nbsp; Watch Madness of Mireleor on YouTube\u003c/a>\u003c/p>","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","linkLabel":null},{"title":"The Seeker and the Primordial Forges","html":"\u003cp>Before the Ironclad there was the Seeker, the mythic creator who forged them and raised the Primordial Forges to stabilize a world coming apart at the leylines. The Seeker meant the Forges to preserve, to imprint order onto reality and hold back the madness that unchecked resonance brings. That, at least, is the hope the faithful still carry.\u003c/p>\u003cp>What the Forges became is harder to face. Somewhere the work failed, catastrophically, and the Seeker passed into legend trailing as much grief as reverence. The Forges that remain lie scattered and half-broken, their channels clogged with rust and root, waking only when the right balance of ritual and grit is struck. Deepest of all is the Heartforge, the world-core engine whispered to lie at the center of Mireleor. Some believe it can craft anything. Others fear it remembers everything.\u003c/p>","teaser":"Before the Ironclad there was the Seeker, the mythic creator who forged them and raised the Primordial Forges to stabilize a world coming apart at the leylines.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"The Behemoths","html":"\u003cp>The Behemoths of Mireleor are not mere monsters. They are the world's oldest breath, living Titans from the primal chaos before the first Forge was lit. Each is a singular force. Some lie buried beneath storm-torn jungles, others roam the molten plains like earthquakes with eyes. Their presence distorts the land. Trees bend away, metal rusts in reverse, and even time seems to stagger near them.\u003c/p>\u003cp>Many Ironclad believe the Behemoths are the world's immune system, roused only when balance breaks through greed, invention, or too much silence in the Forges. They are feared but not universally hated. Old records speak of Titans that spared cities or slept beside cradles of invention for centuries, and offerings are still left at shattered footpaths and impact sites. No Ironclad forgets the truth of them, though. The Behemoths are not part of the world. They are what the world remembers.\u003c/p>","teaser":"The Behemoths of Mireleor are not mere monsters.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Cilaris and the Ragers","html":"\u003cp>Mireleor's wars against the Behemoths run on a mineral called Cilaris, which catches kinetic force, holds it for a breath, and detonates it the moment it is brought to a violent stop. Cilaris weapons turn a single swing into a killing blow, and Ironclad plate is grown from the same mineral, gathering the punishment it takes to loose it back through engraved runes. From this the Holdfasts built the rager, an ultralight sphere that can be charged with any kind of energy, struck by a Cilaris striker, and fired down a runed cannon to project that energy across the field. Both the blade and the rager were made for one task above all others, piercing the behemoths that the old steel could never scratch.\u003c/p>","teaser":"Mireleor's wars against the Behemoths run on a mineral called Cilaris, which catches kinetic force, holds it for a breath, and detonates it the moment it is brought…","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"The Ironglir Rite","html":"\u003cp>There is a rite kept by the first Holdfasts. Those who fell in the brutal early wars against the Titans were not buried but transcended. Their bodies were cleaned and dissected, and the skull was set into an Ironglir, a small vessel much like a pot, seeded beforehand with a plant of magical properties and a slow waking consciousness. A contraption drove the seed to the center of the skull during the dissection, and over time the plant grew through the bone and took on the memory held in it. The stripped bodies were not wasted either. Melted down with metal, they were reforged into a Holdfast's flagship weapons, so that the dead fought on in both the vessel and the blade.\u003c/p>","teaser":"There is a rite kept by the first Holdfasts.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"Architecture and Cities","html":"\u003cp>Mireleor's cities are forged rather than built, hulking enclaves of blackened steel and molten seams grown outward from ancient forge-cores like rusted clockwork stopped mid-turn. These settlements, called Holdfasts, rise in tiers of gear-platforms, winding scaffold paths, and deep core chambers where heat and memory linger. Walls hum with residual energy, and light comes from flickering aether-strips set into the metal itself.\u003c/p>\u003cp>Structures are reinforced with overlapping plates of salvaged Behemoth armor, etched with command-runes and prayer-stamps no one can fully read. Cranes of bone and brass swing over the markets, and vault doors open only to those whose forge-signature still matches the old seals. Movement runs along magnet-lined rails between the tiers, and those who walk navigate by vibration and forgebeat. Every Holdfast is a prayer welded against the wild and stubbornly alive.\u003c/p>","teaser":"Mireleor's cities are forged rather than built, hulking enclaves of blackened steel and molten seams grown outward from ancient forge-cores like rusted clockwork…","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"sec:4","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>The Ironclad do not pray to gods. They revere the Seeker and the Forges, holding that the work of shaping is both origin and purpose. Every bolt turned, every core lit, and every fallen comrade reforged into a new shell is an act of devotion. Central to this faith is the Heartforge and the belief that it holds the original pattern from which all sentient forging descends. Forgekeepers serve as its stewards, less priests than interpreters of function, failure, and flame.\u003c/p>\u003cp>Not all hold to tradition. Some Ironclad believe their creators abandoned them and have turned from maintenance to mastery, forming sects that would rewrite the Forges' purpose or weaponize their power. Others speak in whispers of dismantling the Forges entirely, convinced that the only way to stop the world from breaking again is to let the fire finally go out.\u003c/p>","teaser":"The Ironclad do not pray to gods.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"sec:5","tag":"Lore","rune":"ᛒ"},{"title":"War and Peace","html":"\u003cp>Mireleor has never truly known peace. The Ironclad were forged for war against time, entropy, and Behemoths that cannot be reasoned with. Open battles between Holdfasts are rare, but ideological rifts run deep. Some factions cling to the old protocols and maintain what remains. Others call for conquest, or for an end to Aetherforging altogether, whatever the cost.\u003c/p>\u003cp>The tension worsens as the Behemoths grow bolder, some striking with unnerving purpose as if guided from beneath the crust. Entire settlements have gone under in hours, their cores torn out and left molten. Between the stirring Titans and the factions sharpening their oaths against one another, Mireleor sits one bad spark away from a forge-war no one was built to survive.\u003c/p>","teaser":"Mireleor has never truly known peace.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"sec:6","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Titans Stir\u003c/div>\u003cp>Behemoth sightings have doubled, and the old patterns no longer hold. Some march with intent, others lie still for weeks before unleashing ruin. The Forgekeepers cannot say what is waking them.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Hexbroker's Cure\u003c/div>\u003cp>A fanatic called the Hexbroker preaches that Aetherforging must be ended permanently, even if that means sacrificing the craft and reshaping the world by force. The argument is gaining followers among Ironclad exhausted by endless collapse.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">A World That Will Not Hold\u003c/div>\u003cp>The leylines feeding the Forges grow more unstable with every great shaping. Each fix buys a little time and costs a little stability, and the oldest records warn where that road ends.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Seeker's Truth\u003c/div>\u003cp>Fragments are surfacing that suggest the Seeker's design was never meant to dominate Mireleor but to save it, and that the version everyone inherited is a corruption of the original. If that is true, the war over the Forges has been fought on a lie.\u003c/p>\u003c/div>","teaser":"The Titans Stir, The Hexbroker's Cure, A World That Will Not Hold, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Mireth":{"name":"Mireth","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","lineage":"The Fribbit","brand":"Xochitli","art":"Petalooming","glance":[["Travel","the Rootways, river craft, and canopy bridges"],["Monsters","Spinegloom Prowlers, Wild Bloom Husks, and Ghostvine Stalkers"],["What they fear","another Petal War, and the Wild Bloom no ritual can calm"]],"saying":{"text":"The flowers are a loan from the sleeping gods. Take what you are given, return what you can, and never let them bloom unwatched.","attr":"a Bloom Priest's first lesson"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Mireth is a vast jungle world where civilization grows as much as it is built. The Fribbit raise their city-states among colossal living trees and stepped pyramids beneath a canopy so deep the sun arrives as a green dusk, and through every root, ruin, and rooftop bloom the Xochitli, sacred flowers infused with the lingering essence of ancient jungle gods. The blooms are the heart of everything here. They feed the people, heal the wounded, arm the warriors, and carry the faith, and the art of unlocking them is the foundation the whole world stands on.\u003c/p>\u003cp>That foundation has cracked before. Centuries ago the Petal Wars nearly destroyed Mireth as rival city-states fought for control of the Xochitli, and only the founding of the Bloom Synod brought the killing to an end. The peace held, but the old rivalries never fully died, and now a new danger spreads faster than any war. The Wild Bloom is coming, ruins are rising from beneath the roots, and the priests have begun to whisper that the sleeping gods are starting to stir.\u003c/p>","teaser":"Mireth is a vast jungle world where civilization grows as much as it is built.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Petalooming","html":"\u003cp>Petalooming is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Mireth, the sacred art of unlocking the divine essence held within the Xochitli. Rather than calling power down from the gods directly, a loomer harvests, cultivates, and prepares the blessed flowers through rituals tied to the seasons and the turning of the heavens, then coaxes the dormant blessing inside them into a temporary working. Different blooms hold different gifts, so the same craft that brews a medicine can raise a battlefield ward or wither an enemy's footing with a breath of pollen. It touches nearly all of Fribbit life, and its dangers are real. A bloom prepared wrongly poisons the one who takes it, and reckless working can tip a grove over into Wild Bloom.\u003c/p>","teaser":"Petalooming is the Brand of Mireth, the sacred art of unlocking the divine essence held within the Xochitli.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","key":"brand","tag":"Brand of Magic","lead":"Brand of Mireth · the art of Petalooming","rune":"ᚹ"},{"title":"The Fribbit","html":"\u003cp>The Fribbit are an amphibious people born of rain, mud, and divine bloom, agile and broad-eyed, built for the wet vertical world they live in. Outsiders mistake them for playful or harmless and learn better quickly, because beneath the quick tongues and bright skin is a warrior people shaped by discipline and spiritual rigor. Skin coloration carries meaning in their culture, with darker Fribbit often guided toward stealth and martial roles and brighter ones toward magic, alchemy, and spiritual study, and their long prehensile tongues serve in climbing, crafting, and daily work far more than in battle, where they are considered too precious to risk.\u003c/p>\u003cp>Their society runs on service, discipline, and community, organized into proud city-states where collective success is valued above personal ambition and status comes from usefulness more than blood. They preserve their history in murals, ceremonial dances, oral tradition, and temple carvings, and they mark the turning of the year with festivals for the sacred blooms, the victories of their warriors, and the blessings of their gods. United by shared culture and faith, the city-states still compete fiercely for resources and for the cultivation of the Xochitli, and that competition is never far from becoming something worse.\u003c/p>","teaser":"The Fribbit are an amphibious people born of rain, mud, and divine bloom, agile and broad-eyed, built for the wet vertical world they live in.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"The Lumitoad","html":"\u003cp>The Lumitoad is the \u003ca href=\"https://fellguide.com/The+FellGuide/Quick+Links/Lorebounds\" target=\"_blank\" rel=\"noopener\">Lorebound\u003c/a> of Mireth, an amphibious companion that glows from a lifetime of feeding on enchanted Xochitli. Patient and observant, it waits motionless before striking with sudden speed, and its venomous tongue is built to disrupt rather than destroy, sapping an enemy's momentum and breaking the rhythm of a fight so allies can seize the opening. The Fribbit count them among the most respected creatures in the world, keeping them as temple guardians, hunting partners, and battlefield support, and a bonded Lumitoad senses danger long before its companion does.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Forfeit\u003c/strong>. Strips a foe of its React the moment it commits to an Act.\u003c/p>\u003c/div>","teaser":"The Lumitoad is the Lorebound of Mireth, an amphibious companion that glows from a lifetime of feeding on enchanted Xochitli.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Lumitoad","key":"lb:The Lumitoad","tag":"Lorebound","rune":"ᛈ","linkLabel":"The Lumitoad"},{"key":"campaign","tag":"The Fell","rune":"ᛟ","title":"Of Withering Thorns","teaser":"Three strangers woke in a dying grove with no memory of how they came, a Fribbit who named himself The Harold, a suit of enchanted armor called Frank that stood and…","html":"\u003cp>Three strangers woke in a dying grove with no memory of how they came, a Fribbit who named himself The Harold, a suit of enchanted armor called Frank that stood and walked on its own, and a child-shaped light named Emperion. The Needledrags came out of the undergrowth before they had names for each other, and the three fought because the alternative was worse. What they had walked into was a jungle rotting from the root, and a Council that had let it happen.\u003c/p>\u003cp>\u003ca class=\"watch-link\" href=\"https://www.youtube.com/live/K0zOSY3BnfY\" target=\"_blank\" rel=\"noopener\">&#9654;&nbsp; Watch Of Withering Thorns on YouTube\u003c/a>\u003c/p>","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Histories/Of+Withering+Thorns/Of+Withering+Thorns","linkLabel":"Of Withering Thorns"},{"title":"The Sleeping Gods","html":"\u003cp>The Xochitli are not ordinary flowers. Each holds a fragment of the lingering essence of Mireth's ancient jungle gods, and the Fribbit treat them as something closer to ancestor and divinity than to mere flora. The grandest of them all grows at Bloomspire, a single sacred bloom risen into a living mountain, and the priests there hold that it is connected directly to the gods themselves. For generations those gods have slept, their power filtered safely through bloom and ritual. Lately that has begun to change. Ruins long buried surface from beneath the roots, pilgrims speak of dreams and disturbances, and a growing number of the Xochi believe the long sleep is ending.\u003c/p>","teaser":"The Xochitli are not ordinary flowers.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Cities and City-States","html":"\u003cp>Mireth builds upward and inward through the canopy. Xol'Ratha is the capital and the largest city, strung among colossal living trees on root platforms and flowering terraces lit gold by Xochitli at night, and it holds the seat of the Bloom Synod where most of the world's decisions are negotiated. Rib'Xotal is the military heart, a fortress city of stepped pyramids and training terraces watched over by statues of legendary Petal Generals, home to the Grand Arena of Blossoms and many of Mireth's finest warriors. Bloomspire is the sacred pilgrimage city grown around the largest Xochitli in existence, its terraces spiraling out beneath petals that cast colored light across countless shrines. Rootgrave is the ancient ruin-city, its pyramids and temples split apart by roots and vines, holding the oldest surviving records of the Petal Wars. The Verdant Basin spreads across the flooded south in lily fields and bioluminescent marshes where the rarest blooms grow and whole settlements have vanished beneath the water only to surface again decades later. Xul'Veka is the great independent trade hub, built inside the hollow trunks of colossal dead trees and lit by glowing fungi, where goods, rumors, and relics from every corner of Mireth change hands.\u003c/p>","teaser":"Mireth builds upward and inward through the canopy.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"The Factions","html":"\u003cp>Mireth's power is shared and contested among many hands.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Faction\u003c/th>\u003cth>What they want\u003c/th>\u003c/tr>\u003ctr>\u003ctd>The Bloom Synod\u003c/td>\u003ctd>Keep the peace and regulate Xochitli cultivation, all that stands between Mireth and a second Petal War.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Bloomguard Legion\u003c/td>\u003ctd>Defend the groves, Rootways, and cities from monsters and Wild Bloom surges.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Circle of Xochi\u003c/td>\u003ctd>Preserve the spiritual traditions and hold the balance with the divine flora.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Verdant Spears\u003c/td>\u003ctd>Expand their reach and seize the richest bloom fields, peace or no peace.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Bloomspire Keepers\u003c/td>\u003ctd>Guard the Bloomspire and the most sacred cultivation grounds in the world.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Rootgrave Seekers\u003c/td>\u003ctd>Unearth relics and lost knowledge from the ruins of the Petal Wars.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Marshbound Clans\u003c/td>\u003ctd>Hold their wetland territories and the oldest traditions against outside rule.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Xul'Veka Consortium\u003c/td>\u003ctd>Control the trade, and the secrets that travel with it.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","teaser":"Mireth's power is shared and contested among many hands.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","key":"factions","tag":"Powers","rune":"ᚨ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Mireth is devotion to the Xochitli and the sleeping gods whose essence they carry. To tend a bloom is an act of worship and to waste one is a sin, and the Petaloom rites mark every turning of a Fribbit life, each sealed with an opened flower and a shared breath of its light. The Circle of Xochi and the Bloom Priests keep this faith, reading the divine signs and guiding the cultivation that keeps the world in balance. Lately they carry it heavily, because a religion built on gods who sleep has no easy answer for gods who might be waking.\u003c/p>","teaser":"Faith in Mireth is devotion to the Xochitli and the sleeping gods whose essence they carry.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">Wild Bloom\u003c/div>\u003cp>The defining crisis of the age. Sacred flora expands beyond all ritual balance, wildlife is driven into violent frenzy, and stable Petaloom workings turn volatile without warning. Where the overgrowth takes hold it overruns groves and harvests alike and leaves Wild Bloom Husks behind it, and the Bloom Synod cannot keep pace.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Old Rivalries\u003c/div>\u003cp>The Petal Wars ended in treaty rather than forgiveness. The Verdant Spears press to expand, bloom shortages sharpen every grievance, and the Bloom Synod strains to hold a peace that was never as settled as it looked.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Stirring Gods\u003c/div>\u003cp>Buried ruins surface from beneath the roots, pilgrims at the Bloomspire speak of disturbances, and more of the Xochi each season come to believe the ancient jungle gods are beginning to wake. No one agrees on whether to welcome it or prevent it.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Withering\u003c/div>\u003cp>In at least one telling the blooms do the opposite of running wild. They die, the ground sours, and beneath the deepest canopy the Rootheart fails over a far older wound, the Rift Below, that the flowers were grown to cover. Where that story is true, the silence spreads inward season by season, and what it uncovers is worse than any overgrowth.\u003c/p>\u003c/div>","teaser":"Wild Bloom, The Old Rivalries, The Stirring Gods, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Mortavia":{"name":"Mortavia","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mortavia","lineage":"The Rekindled","brand":"Hexpyre","art":"Hexkindling","glance":[["Travel","funeral barges and ash caravans"],["Monsters","Boreals, Ashwake Votives, Embermaids, and Cawmarches"],["What they fear","eternal death, and the cold silence after"]],"saying":{"text":"We do not bury our dead. We bank them like coals, and wait to see who the fire gives back.","attr":"a Mortavian rite-saying"},"soon":"\u003cp>This world carries a recorded hint: the dead walking the ashstorms, the Rekindled returning through unstable resonance, a rumor that death itself weakens near the strongest pyres. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Mortavia is a world that treats death as a doorway it keeps oiled and ready. Funeral monasteries and bone cathedrals stand over candle crypts, ashstorms roll across the plains, and everywhere the air smells of smoke and tallow. Here a death is not an ending but a banking of the fire, and the people watch the pyres for who the flame might give back. The dead are said to still walk the ashstorms, and the Rekindled themselves return through resonance no one fully understands.\u003c/p>","teaser":"Mortavia is a world that treats death as a doorway it keeps oiled and ready.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mortavia","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Hexpyre","html":"\u003cp>Hexpyre is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Mortavia, the working called Hexkindling. It exists as frostfire candles, funeral embers, and ash sigils, a magic of mourning flame that warms, lights, and calls back from the ash. Its tone is somber and reverent. Its cost is the slow burning of lifeforce and a heavy emotional burden, for to kindle the dead is to carry their grief alongside your own.\u003c/p>","teaser":"Hexpyre is the Brand of Mortavia, the working called Hexkindling.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mortavia","key":"brand","tag":"Brand of Magic","lead":"Brand of Mortavia · the art of Hexkindling","rune":"ᚹ"},{"title":"The Rekindled","html":"\u003cp>The Rekindled are a people shaped by mourning and return, gathered into mourning houses and tended by shrinekeepers who keep the rites and the flames. They are somber, patient, and unafraid of death in the ordinary sense, because death here is rarely the last word. What they fear is the other ending, the cold silence in which the fire does not catch and nothing comes back.\u003c/p>","teaser":"The Rekindled are a people shaped by mourning and return, gathered into mourning houses and tended by shrinekeepers who keep the rites and the flames.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mortavia","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"lb:The Boreal","tag":"Lorebound","rune":"ᛈ","title":"The Boreal","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Boreal","linkLabel":"The Boreal","teaser":"The Boreal is a luminous, feather-crowned lorebound from Mortavia, home of the Rekindled.","html":"\u003cp>The Boreal is a luminous, feather-crowned lorebound from Mortavia, home of the Rekindled. Made of spectral aether and old grief, it feels pain in the air like a pulse and carries the weight so the people around it do not have to. Its bond runs deep, rooted in a plain vow to protect.\u003c/p>\u003cp>In a fight it pulls danger onto itself, taking the blows meant for its allies and turning the spared hurt into something that keeps them alive. The oldest Boreal are said to hold every death they ever witnessed, each one resting in the soft light of their crowns.\u003c/p>\u003cp>For all their quiet, what they want on the field is not subtle. Endure, protect, and let nothing land for free.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Succor\u003c/strong>. Softens a physical blow and turns what it spares into vitality.\u003c/p>\u003c/div>"},{"key":"lb:The Cawmarch","tag":"Lorebound","rune":"ᛈ","title":"The Cawmarch","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Cawmarch","linkLabel":"The Cawmarch","teaser":"The Cawmarch is a cursed raven of Mortavia, a land that does ruin and resurrection in roughly equal measure.","html":"\u003cp>The Cawmarch is a cursed raven of Mortavia, a land that does ruin and resurrection in roughly equal measure. Bred from the old magic of the ravens of Crawd'r, it exists to pull the afflictions out of its bonded Fell. Every curse it swallows grows a second heart in its chest, black and lit red, ticking a little faster with each one. When its master dies, the raven comes back.\u003c/p>\u003cp>It manages this by tearing its own wings apart and twisting the bones into jagged limbs, then dragging itself forward, grinning and hungry for more pain to eat. Most lorebounds put themselves between their Fell and harm. The Cawmarch waits for the harm to land, then lunges to throw it back.\u003c/p>\u003cp>Take a Cawmarch and you keep death close. It is loyal, it is cruel, and it is never full.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Scour\u003c/strong>. Scours an \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Combat/The+Afflictions/Afflictions/Afflictions\" target=\"_blank\" rel=\"noopener\">Affliction\u003c/a> from a Fell before it sets in.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Mortavia builds for the dead and the grieving alike. Funeral monasteries and bone cathedrals rise in solemn stone, ringed by candle crypts where the flames are never allowed to fully gutter. Travel runs by funeral barge along the ash rivers and by ash caravan across the storm-swept plains.\u003c/p>","teaser":"Mortavia builds for the dead and the grieving alike.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mortavia","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Mortavia is flame funerary rite, the conviction that the pyre is a passage rather than an end. Mourning houses tend the dead and shrinekeepers tend the flames, and the highest devotion is to keep the fire burning so that nothing worthy passes into the cold silence unremembered.\u003c/p>","teaser":"Faith in Mortavia is flame funerary rite, the conviction that the pyre is a passage rather than an end.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mortavia","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Mortavia","html":"\u003cp>Mortavians take smoke kabobs, marrow mounds, and ember ale, food cooked in the same fires that honor the dead. Their music is somber chant and distant wailing, and they dress in heavy cloaks and candle-thread robes. They cross their world by funeral barge and ash caravan, always moving with the smell of smoke at their backs.\u003c/p>","teaser":"Mortavians take smoke kabobs, marrow mounds, and ember ale, food cooked in the same fires that honor the dead.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mortavia","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Natbakka":{"name":"Natbakka","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Natbakka","lineage":"The Din","brand":"Divisyr","art":"Scourging","glance":[["Travel","mistwalks and omen beasts"],["Monsters","fate horrors and omen beasts"],["What they fear","prophecy, and inevitability"]],"saying":{"text":"The omen is not a warning. A warning could be heeded.","attr":"a Din saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Natbakka is a world half-hidden in mist and wholly preoccupied with fate. Mist shrines and omen towers loom out of the fog, whisper songs and omen bells sound from places no one can quite locate, and the Din read the future in everything from birdflight to the curl of smoke. It is a fatalistic world, weighed down by the conviction that what is coming is already decided, and that the most one can do is learn its shape before it arrives.\u003c/p>","teaser":"Natbakka is a world half-hidden in mist and wholly preoccupied with fate.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Natbakka","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Divisyr","html":"\u003cp>Divisyr is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Natbakka, the working called Scourging. It exists as omen glyphs, split-light markings, and prophecy fractures, a magic of reading and bending the threads of fate. Its tone is ominous and foreboding. Its cost is the integrity of fate itself, for Scourging brings fate distortion, and a careless seer can fracture the very future they sought to read, twisting prophecy into something worse than what was foretold.\u003c/p>","teaser":"Divisyr is the Brand of Natbakka, the working called Scourging.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Natbakka","key":"brand","tag":"Brand of Magic","lead":"Brand of Natbakka · the art of Scourging","rune":"ᚹ"},{"title":"The Din","html":"\u003cp>The Din are a people of seer castes and omen tribes, ordered by skill at reading the future and bound by a shared dread of it. They are watchful, foreboding, and resigned, treating prophecy not as guidance but as a sentence to be understood. They interpret fate constantly, and the closer they look, the heavier the inevitability of what they see seems to press.\u003c/p>","teaser":"The Din are a people of seer castes and omen tribes, ordered by skill at reading the future and bound by a shared dread of it.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Natbakka","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"Architecture and Cities","html":"\u003cp>Natbakka builds to watch and to listen. Mist shrines and omen towers rise through the fog, sited where the signs are clearest, their chambers hung with bells and glyphs for reading what is coming. Travel runs on mistwalks through the fog and on the backs of omen beasts that are said to sense the road before it is taken.\u003c/p>","teaser":"Natbakka builds to watch and to listen.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Natbakka","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Natbakka is fate interpretation, the belief that the future is written and that wisdom lies in reading it rightly. The seer castes serve as its priesthood, and devotion is measured in the accuracy and gravity of one's prophecies, even when those prophecies promise only what cannot be avoided.\u003c/p>","teaser":"Faith in Natbakka is fate interpretation, the belief that the future is written and that wisdom lies in reading it rightly.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Natbakka","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Natbakka","html":"\u003cp>The Din take bitter teas and smoked fish, plain fare for a somber people, and they fill the mist with whisper songs and omen bells. They dress in hooded layered wraps that hide them in the fog, and they travel by mistwalk and omen beast. Their whole lives are spent listening for the future and bracing for it.\u003c/p>","teaser":"The Din take bitter teas and smoked fish, plain fare for a somber people, and they fill the mist with whisper songs and omen bells.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Natbakka","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Neriad":{"name":"Neriad","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Neriad","lineage":"The Merkith","brand":"Tidethane","art":"Tidelinking","glance":[["Travel","tidebeasts and coral skiffs"],["Monsters","leviathans and abyss horrors"],["What they fear","the deepwater voids"]],"saying":{"text":"Down here a single grief belongs to everyone. So does a single joy. You learn to be careful what you feel.","attr":"a Merkith saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Neriad is a world beneath the water, lit by bioluminescent tides and built of coral. Coral palaces and abyssal domes spread across the seafloor, whale-song harmonics roll through the deep, and the Merkith move through it all in clans linked closer than blood. Above the inhabited reefs and domes lie the deepwater voids, the lightless trenches where the leviathans and the abyss horrors dwell, and where the tide-linked clans do not willingly go.\u003c/p>","teaser":"Neriad is a world beneath the water, lit by bioluminescent tides and built of coral.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Neriad","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Tidethane","html":"\u003cp>Tidethane is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Neriad, the working called Tidelinking. It exists as bioluminescent tides and linked water sigils, a magic of connection that joins minds, currents, and clans into a single flowing whole. Its tone is alien and serene. Its cost is the danger of that very connection, for Tidelinking can carry a shared emotional overload through the link, one mind's flood of feeling drowning many at once.\u003c/p>","teaser":"Tidethane is the Brand of Neriad, the working called Tidelinking.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Neriad","key":"brand","tag":"Brand of Magic","lead":"Brand of Neriad · the art of Tidelinking","rune":"ᚹ"},{"title":"The Merkith","html":"\u003cp>The Merkith are a people of tide-linked clans, bound to one another through shared currents of feeling and thought as much as by kinship. They are serene and alien by the standards of land-dwellers, their sense of self softer at the edges, flowing into the clan and back again. This closeness is their strength and their vulnerability both, for what one Merkith feels deeply, the whole clan can feel with them.\u003c/p>","teaser":"The Merkith are a people of tide-linked clans, bound to one another through shared currents of feeling and thought as much as by kinship.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Neriad","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"lb:The Aquafin","tag":"Lorebound","rune":"ᛈ","title":"The Aquafin","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Aquafin","linkLabel":"The Aquafin","teaser":"The Aquafin is a sleek, serpentine dragon out of the abyssal deeps of Neriad, home of the ocean-walking Merkith.","html":"\u003cp>The Aquafin is a sleek, serpentine dragon out of the abyssal deeps of Neriad, home of the ocean-walking Merkith. Light bends through its scales, and its wings cut through sea spray and storm without slowing.\u003c/p>\u003cp>It feeds by draining whatever it touches, coiling its tail around raw energy and turning it to its own ends. Bonded to a Fell, it skims the charge off a striking enemy and passes that momentum to its partner, so a foe's own strength ends up working the wrong shift.\u003c/p>\u003cp>As a \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Transmogrifications/Corsair\" target=\"_blank\" rel=\"noopener\">Corsair\u003c/a> it bursts into a spiral of fizzing magic and flings its Fell into the fight, or out of it, at angles that should not be possible.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Siphon\u003c/strong>. Robs a foe of the Charge its attack would earn.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Neriad builds in living coral. Coral palaces and abyssal domes rise from the seafloor, shaped over generations and lit from within by the glowing tides, their corridors flowing rather than cornered. Travel runs on tidebeasts ridden through the open water and coral skiffs that drift the gentler currents.\u003c/p>","teaser":"Neriad builds in living coral.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Neriad","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Neriad is ocean spirit worship, reverence for the deep and the vast presences that move through it. The tide-linked clans honor the sea as the source of the connection that defines them, and they treat the deepwater voids with a dread that shades into the religious, the dark places where the ocean stops being kin and starts being other.\u003c/p>","teaser":"Faith in Neriad is ocean spirit worship, reverence for the deep and the vast presences that move through it.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Neriad","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Neriad","html":"\u003cp>The Merkith take deepfish and kelp wine, food gathered from the living reef, and they fill the water with whale-song harmonics that carry for miles. They dress in flowing scalecloth that moves with the current, and they travel by tidebeast and coral skiff. Their lives flow into one another the way their world flows around them.\u003c/p>","teaser":"The Merkith take deepfish and kelp wine, food gathered from the living reef, and they fill the water with whale-song harmonics that carry for miles.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Neriad","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Oroniel":{"name":"Oroniel","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Oroniel","lineage":"The Spireborn","brand":"Spirithral","art":"Spirecalling","glance":[["Travel","spirit bridges"],["Monsters","spirit beasts and echo dragons"],["What they fear","spiritual severance"]],"saying":{"text":"Open yourself wide enough to call a spirit, and take care what answers, and what leaves with it.","attr":"a Spireborn saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Oroniel is a world held aloft on spirit and song. Spirit towers and floating sanctums drift among airy heights, resonant choirs and ethereal tones carry between them, and the Spireborn live in close communion with the spirits and elements that move through their world. It is a serene, exalted place on its surface, and a perilous one underneath, because the same openness that lets a Spireborn call a spirit also leaves them open to what the spirit might do in return.\u003c/p>","teaser":"Oroniel is a world held aloft on spirit and song.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Oroniel","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Spirithral","html":"\u003cp>Spirithral is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Oroniel, the working called Spirecalling. It exists as elemental summons and towering spirit glyphs, a grand magic of calling forth spirits and elemental forces to act in the world. Its tone is grand and unstable. Its cost is control, for Spirecalling risks elemental possession, the summoned force taking hold of the one who called it, until it is no longer clear who is wielding whom.\u003c/p>","teaser":"Spirithral is the Brand of Oroniel, the working called Spirecalling.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Oroniel","key":"brand","tag":"Brand of Magic","lead":"Brand of Oroniel · the art of Spirecalling","rune":"ᚹ"},{"title":"The Spireborn","html":"\u003cp>The Spireborn are a people of spiritual castes, ranked by their closeness to the spirits and their skill at communion. They are devout, refined, and attuned, living much of their lives in dialogue with presences others cannot perceive. Their gravest fear is spiritual severance, the cutting-off of that communion, which to a Spireborn is a kind of deafness and exile from the only world that has ever felt fully real to them.\u003c/p>","teaser":"The Spireborn are a people of spiritual castes, ranked by their closeness to the spirits and their skill at communion.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Oroniel","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"lb:The Solmera","tag":"Lorebound","rune":"ᛈ","title":"The Solmera","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Solmera","linkLabel":"The Solmera","teaser":"The Solmera is a chimera of a lion, crowned in shifting manes of elemental flame, born from the burning spires and trembling plains of Oroniel.","html":"\u003cp>The Solmera is a chimera of a lion, crowned in shifting manes of elemental flame, born from the burning spires and trembling plains of Oroniel. Every breath hums with old magic. Stone softens under its claws, and fire follows its steps. To a Solmera, the elements are not tools to reach for. They are simply what it is made of.\u003c/p>\u003cp>This lion takes the field for itself. It watches the swing that never lands, and the moment a blade passes through empty air beside its bonded Fell, it answers. Fire follows the miss back to the one who threw it. The air keeps shifting around the lion with every change of pace.\u003c/p>\u003cp>In \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Transmogrifications/Corsair\" target=\"_blank\" rel=\"noopener\">Corsair\u003c/a> form each stride scorches the ground. Walls of fire climb out of its tracks into a burning maze, and the maze holds until something is seared or the fight is finished.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Kindle\u003c/strong>. Burns any foe whose blow finds only air.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Oroniel builds toward the heights and the unseen. Spirit towers and floating sanctums hang in the airy reaches, raised as much for communion as for shelter, their halls shaped to carry resonance and welcome the spirits. Travel runs on spirit bridges that span the gaps between sanctums, paths held aloft by the same forces the Spireborn commune with.\u003c/p>","teaser":"Oroniel builds toward the heights and the unseen.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Oroniel","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Oroniel is spirit communion, the practice and reverence of dialogue with the spirits and elements. It is the center of Spireborn life rather than one part of it, and the spiritual castes serve as its mediators, their authority drawn from how deeply and safely they can commune. To lose that communion is the worst fate they know.\u003c/p>","teaser":"Faith in Oroniel is spirit communion, the practice and reverence of dialogue with the spirits and elements.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Oroniel","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Oroniel","html":"\u003cp>The Spireborn take etherfruit and spirit teas, light fare for a people who live half in the unseen, and they fill their sanctums with resonant choirs and airy tones. They dress in floating layered silks that move with the currents of the heights, and they travel by spirit bridge between the towers. Their world is quiet, exalted, and never quite empty.\u003c/p>","teaser":"The Spireborn take etherfruit and spirit teas, light fare for a people who live half in the unseen, and they fill their sanctums with resonant choirs and airy tones.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Oroniel","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Pandemonium":{"name":"Pandemonium","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Pandemonium","lineage":"The Wyspar","brand":"Gravenry","art":"Graven","glance":[["Travel","rift tears, chained portals, and Skyvault Shards"],["Dwellers","Discordants, Hollowed souls, and drifting Aether Strands"],["What it is","the prison-realm where Discord is sealed"]],"saying":{"text":"Every other world is a place people live. Pandemonium is the place that was built to hold the thing they live in spite of.","attr":"the LoreMaster"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Pandemonium is not a world so much as a cell. It is the fractured abyss beneath reality, the prison-realm raised to hold \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Discord\" target=\"_blank\" rel=\"noopener\">Discord\u003c/a>, and everything about it bends toward that purpose. Impossible black cathedrals lean at angles that hurt to follow. Flesh-metal fortresses breathe. Chained void structures hang in a sky that is less a sky than an absence with weight. There is no food here, only soul vapors drifting through the dark, and the air carries a hollow buzz beneath which something vast and patient rumbles.\u003c/p>","teaser":"Pandemonium is not a world so much as a cell.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Pandemonium","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Gravenry","html":"\u003cp>Gravenry is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Pandemonium, the working it calls Graven. It exists as black-red vapor, floating grave sigils, and geometry that should not close but does, a magic shaped from the same nihilism that soaks the realm. Its tone is oppressive and hungry, and its cost is the highest in \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/The+Sphere\" target=\"_blank\" rel=\"noopener\">the Sphere\u003c/a>. To shape with Gravenry is to spend yourself, soul eroding and identity fracturing with every working, until the wielder becomes one more thing the prison has hollowed out.\u003c/p>","teaser":"Gravenry is the Brand of Pandemonium, the working it calls Graven.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Pandemonium","key":"brand","tag":"Brand of Magic","lead":"Brand of Pandemonium · the art of Graven","rune":"ᚹ"},{"title":"The Wyspar and the Damned","html":"\u003cp>What endures in Pandemonium endures by losing pieces of itself. The Wyspar drift through it as resonance worn down to grief and instinct, and around them gather Discordants, Hollowed souls, and stranger things that no longer remember being anything. Such order as exists is built on domination and corruption, hierarchies where the strong feed on the fading and the fading feed on whatever is weaker still. And beneath even that, something silent gathers the truly spent and keeps what is left of them, and no one in the prison can say what does the gathering or to what end.\u003c/p>","teaser":"What endures in Pandemonium endures by losing pieces of itself.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Pandemonium","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"Architecture","html":"\u003cp>Pandemonium builds the way a wound scars. Cathedrals of black stone rise without foundation, fortresses of fused flesh and metal sprawl without plan, and chains thread the void between them, binding structures to nothing at all. Nothing here was made to be lived in. It was made to hold, and to last, and to wear down whatever it holds.\u003c/p>","teaser":"Pandemonium builds the way a wound scars.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Pandemonium","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Worship and Survival","html":"\u003cp>Faith in Pandemonium runs in two directions that are often the same direction. Some worship Discord outright and hunger for its ascension. Others form survival cults that bargain, hide, and feed, telling themselves they serve only themselves. In the end both bend toward the same will, because in a prison built around one thing, everything eventually answers to it.\u003c/p>","teaser":"Faith in Pandemonium runs in two directions that are often the same direction.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Pandemonium","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"The Cracks","html":"\u003cp>Pandemonium was built to contain, and it is no longer containing perfectly. Rift tears open where the walls of reality have thinned, and through them things slip out, into the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Stratums\" target=\"_blank\" rel=\"noopener\">Stratums\u003c/a>, at night and at the edges. The sealing holds, mostly. But those who study the prison speak in lower voices of two fears they cannot disprove: that Discord is not the only ancient thing locked down here, and that the prison may be older than the Skyvault raised to reinforce it. Neither fear is proven. Both are the kind that, once heard, are difficult to set back down.\u003c/p>","teaser":"Pandemonium was built to contain, and it is no longer containing perfectly.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Pandemonium","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Sable":{"name":"Sable","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sable","lineage":"The Bogle","brand":"Cantomyth","art":"Mythcasting","glance":[["Travel","story caravans and resonance stages"],["Monsters","storyborn horrors and myth spirits"],["What they fear","being forgotten from history, and being eaten by what they tell"]],"saying":{"text":"Be in a story or be in a grave. In Sable they are often the same wager.","attr":"a Bogle saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Sable is a world where the story is real and the telling has teeth. Mythic amphitheaters and story-pillars rise across it, narrative opera and spoken epics fill the air, and the Bogle live and die by the tales they keep alive. A story well told here can take on a life of its own, for better and for worse, and the line between a legend and a living thing is thinner than anywhere else in \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/The+Sphere\" target=\"_blank\" rel=\"noopener\">the Sphere\u003c/a>.\u003c/p>","teaser":"Sable is a world where the story is real and the telling has teeth.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sable","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Cantomyth","html":"\u003cp>Cantomyth is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Sable, the working called Mythcasting. It exists as storybook glyphs, spoken symbols, and theatrical resonance, a magic of shaping reality through narrative, calling forth what is told. Its tone is whimsical and dangerous in equal measure. Its cost is the truth, for Mythcasting brings narrative distortion and false memory, rewriting the teller's own past as readily as the tale, until they can no longer be sure which of their memories were ever real.\u003c/p>","teaser":"Cantomyth is the Brand of Sable, the working called Mythcasting.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sable","key":"brand","tag":"Brand of Magic","lead":"Brand of Sable · the art of Mythcasting","rune":"ᚹ"},{"title":"The Bogle","html":"\u003cp>The Bogle are a people of bardic houses and oral historians, keepers of myth who treat memory and narrative as the foundation of the world. They are theatrical, dramatic, and deeply serious beneath the flourish, because in Sable to be forgotten is to truly cease, and to be remembered wrongly can be worse. They guard their stories the way other peoples guard borders.\u003c/p>","teaser":"The Bogle are a people of bardic houses and oral historians, keepers of myth who treat memory and narrative as the foundation of the world.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sable","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"Architecture and Cities","html":"\u003cp>Sable builds for the telling. Mythic amphitheaters and story-pillars stand at the heart of its settlements, stages and monuments where the great tales are performed and preserved. Travel runs on story caravans that carry the bardic houses between audiences, and on resonance stages that let a tale be told in many places at once.\u003c/p>","teaser":"Sable builds for the telling.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sable","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Sable is myth preservation, the conviction that a story kept alive keeps its subject alive, and that to be written out of the tale is the truest death. The bardic houses serve as priests of memory, and their gravest duty is to ensure that nothing worthy is forgotten, even as they wrestle with stories that would rather not stay on the page.\u003c/p>","teaser":"Faith in Sable is myth preservation, the conviction that a story kept alive keeps its subject alive, and that to be written out of the tale is the truest death.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sable","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Sable","html":"\u003cp>The Bogle take inkfruit, sweetmeats, and ceremonial feasts, meals that are themselves occasions for performance, and they fill their amphitheaters with narrative opera and spoken epics. They wear dramatic masks and embroidered cloaks, and they travel by story caravan and resonance stage. Every life here is lived a little like a role, in the hope it will be worth retelling.\u003c/p>","teaser":"The Bogle take inkfruit, sweetmeats, and ceremonial feasts, meals that are themselves occasions for performance, and they fill their amphitheaters with narrative…","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sable","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Scitnix":{"name":"Scitnix","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Scitnix","lineage":"The Corvid","brand":"Scrythene","art":"Scrymarking","glance":[["Travel","sigil gates"],["Monsters","arcane constructs and eye horrors"],["What they fear","forbidden knowledge"]],"saying":{"text":"There is no harmless thing to know. Only knowledge whose price has not yet come due.","attr":"a Corvid saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Scitnix is a world that wants to understand everything and is afraid of what that will cost. Arcane observatories and sigil labyrinths sprawl across it, resonant chimes and coded rhythms carry messages no outsider can parse, and the Corvid spend their lives gathering, recording, and guarding knowledge. It is a world of watchers, where the act of observation is itself a kind of power, and where some things, once known, cannot be unknown.\u003c/p>","teaser":"Scitnix is a world that wants to understand everything and is afraid of what that will cost.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Scitnix","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Scrythene","html":"\u003cp>Scrythene is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Scitnix, the working called Scrymarking. It exists as floating observation sigils and eye-like glyphs, a magic of seeing, marking, and knowing, of fixing the world in symbol so it can be studied and controlled. Its tone is analytical and paranoid. Its cost is
