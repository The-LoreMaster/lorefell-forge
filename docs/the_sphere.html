 under ancient trees and flowers that never stop blooming. The largest Sylvakith of a given wood is usually crowned King, a title that is more ceremony than command but honored all the same.\u003c/p>\u003cp>A Sylvakith does not read danger the way most people do. They trust openly, laugh fast, and meet the world with a delight that is hard to talk them out of.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Sylvakith\u003c/div>\u003cp>Sylvakith are joyful agents of chaos wrapped in innocence and wonder. They view the world as a playground, a puzzle, and a poem, often all at once.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Embodying their trickster spirit through mild illusions, clever wordplay, or harmless pranks woven into daily life.\u003c/li>\u003cli>Speaking with musical cadence, letting your laughter become a motif throughout the journey.\u003c/li>\u003cli>Using your faelari-imbued runes for light, minor environmental control, or emotional enchantment.\u003c/li>\u003cli>Exploring the tension between their trusting nature and the world's harshness. How do they respond to betrayal or cruelty?\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Sylvakith gain +1 to their Reflex skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;We laugh because the world is heavy. We dance so it doesn't catch us.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Sylvakith of Eldarwyn\u003c/div>\u003cp>The Sylvakith are a people of spirit tribes, noble and mythic in bearing, bound to the ancient forest and the ancestors who became part of it. They are reverent and unhurried, carrying themselves with the calm of those who measure their lives against the age of the trees. The longer a Sylvakith dwells in the deep wood, the further they drift from ordinary mortality, which they regard as both blessing and quiet loss.\u003c/p>"},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Eldarwyn","teaser":"Willo.","html":"\u003cdiv class=\"sub\">Figures\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Canon+Characters/Willo\" target=\"_blank\" rel=\"noopener\">Willo\u003c/a>\u003c/div>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Eldarwyn builds without disturbing. Root temples are grown into and around the ancient trees rather than imposed upon them, and Sylvakith dwellings nestle into the living wood as though they had always been part of it. Travel runs along spirit trails, paths that the forest reveals to those it trusts.\u003c/p>","teaser":"Eldarwyn builds without disturbing.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Eldarwyn","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Eldarwyn is ancestor forest worship, the belief that the dead pass into the wood and the wood remembers them. The spirit tribes commune with these ancestors through chant and rite, and they hold the ancient forest as the living body of all who came before, sacred and watchful.\u003c/p>","teaser":"Faith in Eldarwyn is ancestor forest worship, the belief that the dead pass into the wood and the wood remembers them.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Eldarwyn","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Eldarwyn","html":"\u003cp>The Sylvakith take woodland game and herbal broths, simple fare drawn from the forest's bounty, and they fill the woods with ancient chants and spirit songs. They dress in leafweave cloaks that blend into the green, and they travel the spirit trails through the deep wood. Theirs is a quiet, reverent way of living, paced to the breath of the trees.\u003c/p>","teaser":"The Sylvakith take woodland game and herbal broths, simple fare drawn from the forest's bounty, and they fill the woods with ancient chants and spirit songs.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Eldarwyn","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Elysara":{"name":"Elysara","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Elysara","lineage":"The Hallowed","brand":"Veriscendence","art":"Veriscending","glance":[["Travel","pilgrim caravans"],["Monsters","bloom horrors and radiant predators"],["What they fear","spiritual decay"]],"saying":{"text":"We do not pray for the suffering to end. We pray to be the ones who carry it.","attr":"a Hallowed pilgrim's vow"},"soon":"\u003cp>This world carries a recorded hint: it is tied to the Hallowed, to figures like Magnus, and to events the Riftrunners remember. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Elysara is a world of blooming sanctums and radiant gardens, holy ground where the air is sweet with pollen and the light falls like a blessing. Hymns and pollen flutes drift between the sanctuaries, and the Hallowed move through it as pilgrims, devoted to the sacred bloom that gives their world its grace. It is beautiful and reverent, a place built around compassion and sacrifice, and beneath the radiance runs a quiet fear that even holiness can rot.\u003c/p>","teaser":"Elysara is a world of blooming sanctums and radiant gardens, holy ground where the air is sweet with pollen and the light falls like a blessing.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Elysara","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Veriscendence","lead":"Brand of Elysara · the art of Veriscending","teaser":"Veriscendence is the Brand of Elysara, the working called Veriscending.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Veriscendence","linkLabel":"Veriscendence","html":"\u003cp>\u003cem>Also called Veriscending.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Veriscendence is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Elysara, the working called Veriscending. It exists as holy floral sigils, radiant pollen, and blessing circles, a magic of healing, blessing, and sacred growth. Its tone is reverent and compassionate. Its cost is the heart, for Veriscending draws on emotional martyrdom, the wielder pouring their own feeling and strength into others until there is little left for themselves.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Veriscendence and blessing circles bloom beneath the favored side. While the grace holds, no blow can find them. The enemy's strikes pass through sacred light and touch nothing. Call it weak and it is the enemy who cannot be reached, untouchable while your blows fall short.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The favored side cannot be targeted by attacks.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Ensnared*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Ensnared* breaks out on Might.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Veriscending is the compassion of a people who give until it costs them.\u003c/p>\u003cul class=\"lst\">\u003cli>Bless a wound, a meal, or a road so that it mends, sustains, or holds true.\u003c/li>\u003cli>Raise a circle of sacred growth that wards a place against corruption.\u003c/li>\u003cli>Pour your own strength into another to carry them through what they could not bear alone.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Hallowed","lead":"Lineage of Elysara","teaser":"The Hallowed are celestial-born, radiant and unbending in their virtue, with bodies that look carved from marble and eyes that gleam with a clarity that unsettles people.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Hallowed","linkLabel":"The Hallowed","html":"\u003cp>The Hallowed are celestial-born, radiant and unbending in their virtue, with bodies that look carved from marble and eyes that gleam with a clarity that unsettles people. Some say they were stars once, given form. Others say they are the leftovers of fallen gods, still trying to earn their light back.\u003c/p>\u003cp>They come from Elysara, a realm of harmony and near-perfection where isles of light drift through sapphire skies and the rivers sing with their own resonance. There, compassion is not a virtue so much as the basic culture.\u003c/p>\u003cp>For all their physical power, the Hallowed use it with restraint, favoring their fists and finding honor in directness and disgrace in cruelty. They also, genuinely, cannot lie. Not a polite cannot, an actual one. So when a Hallowed speaks, the honesty can be devastating.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Hallowed\u003c/div>\u003cp>The Hallowed are kind without naivety, strong without arrogance, and honest without exception. They often seek meaning beyond themselves and quests to protect, restore, or illuminate.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Letting their inability to lie create powerful roleplay moments and social complications.\u003c/li>\u003cli>Reflecting their longing for flight and open sky, both physically and spiritually.\u003c/li>\u003cli>Embracing their preference for peace, but never shying from noble combat when it is called for.\u003c/li>\u003cli>Using their presence as a stabilizing force for the party: grounded, centered, and quietly certain.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Hallowed gain +1 to their Wit attribute upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;I will not promise victory. I will only promise truth.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Hallowed of Elysara\u003c/div>\u003cp>The Hallowed are a devout people of pilgrim orders, given to compassion, sacrifice, and the long road between sacred places. They are gentle and serious, finding meaning in service and in the carrying of others' burdens. Their faith asks much of them, and they give it willingly, though the giving wears at them, and their gravest dread is spiritual decay, the slow withering of the very devotion that defines them.\u003c/p>"},{"key":"lb:The Worgar","tag":"Lorebound","rune":"ᛈ","title":"The Worgar","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Worgar","linkLabel":"The Worgar","teaser":"The Worgar is a radiant wolf from the sacred realm of Elysara.","html":"\u003cp>The Worgar is a radiant wolf from the sacred realm of Elysara. Shimmering white fur covers it, and golden, jewel-like bone plating runs the length of its frame. It moves almost without sound, every snarl bright, the grace of it hiding old instinct and a fierce, unembarrassed loyalty.\u003c/p>\u003cp>This one turns pain into purpose. When it snarls, wounds close. When blood spills, it sees what others cannot, shards of the Skyvault caught in the weave of reality itself. A Worgar does not wait to be asked for help. It gathers, restores, and renews, all of it with a quiet kind of precision.\u003c/p>\u003cp>In \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Transmogrifications/Corsair\" target=\"_blank\" rel=\"noopener\">Corsair\u003c/a> form the bond goes solid. Each stride strikes off luminous energy that hardens into shards, and wherever it runs it leaves a trail of golden paw prints across the field.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Reap\u003c/strong>. Reaps a \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Currency/Definitions/Skyvault+Shards\" target=\"_blank\" rel=\"noopener\">Skyvault Shard\u003c/a> from every wound a Fell takes.\u003c/p>\u003c/div>"},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Elysara","teaser":"Lantern.","html":"\u003cdiv class=\"sub\">Figures\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Canon+Characters/Lantern\" target=\"_blank\" rel=\"noopener\">Lantern\u003c/a>\u003c/div>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Elysara builds its holy places to bloom. Blooming sanctums and radiant gardens form the heart of every settlement, their halls grown through with sacred flowers and lit by gentle radiance. Travel runs on pilgrim caravans that move between the sanctuaries along the well-worn holy roads.\u003c/p>","teaser":"Elysara builds its holy places to bloom.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Elysara","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Elysara is sacred bloom worship, reverence for the holy flowers said to hold and preserve grace, memory, and blessing. The pilgrim orders serve as its devout, and the highest calling is sacrifice in service of others, even unto the spiritual decay that such giving risks.\u003c/p>","teaser":"Faith in Elysara is sacred bloom worship, reverence for the holy flowers said to hold and preserve grace, memory, and blessing.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Elysara","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Elysara","html":"\u003cp>The Hallowed take floral wines and sacred meals, food blessed and shared in ceremony, and they fill their sanctums with hymns and pollen flutes. They dress in flowing floral fabrics, and they travel by pilgrim caravan between the radiant gardens. Theirs is a life of devotion, given freely and at real cost.\u003c/p>","teaser":"The Hallowed take floral wines and sacred meals, food blessed and shared in ceremony, and they fill their sanctums with hymns and pollen flutes.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Elysara","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Felidae":{"name":"Felidae","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Felidae","lineage":"The Grimalkin","brand":"Shynderis","art":"Bladestepping","glance":[["Travel","mirage roads and blinkpaths"],["Monsters","trickster beasts and prismatic cats"],["What they fear","bad luck, and being shut in"]],"saying":{"text":"Win or lose, you walk out smiling. Anything else and the house remembers your face.","attr":"a Grimalkin saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Felidae is a world that never quite holds still. Light bends through it in ribbons of color, splitting off prismatic walls and pooling in the streets, so that a single lantern can throw a dozen shadows and none of them point the same way. It is a realm of palaces and gambling dens, of laughter carried on the night air and luck treated as something you can hear coming. To the people who live here, fortune is not an abstraction. It is weather. It rolls in, it turns, and the wise learn to read the sky.\u003c/p>","teaser":"Felidae is a world that never quite holds still.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Felidae","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Shynderis","lead":"Brand of Felidae · the art of Bladestepping","teaser":"Shynderis is the Brand of Felidae, a magic of motion and nerve.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Shynderis","linkLabel":"Shynderis","html":"\u003cp>\u003cem>Also called Bladestepping.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Shynderis is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Felidae, a magic of motion and nerve. It exists in the world as flash-step trails and silver cuts, a blur of mirrored movement where a body seems to be in three places before it finishes leaving the first. It is stylish and precise, bound up with confidence and timing, and it answers best to those willing to gamble on their own speed. The cost is in the temperament it breeds. Shynderis rewards boldness so consistently that its practitioners drift toward recklessness, chasing the next impossible step long after caution would have called it a night.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Shynderis and the favored side moves between the moments. They are already there, already gone, resolving every exchange before the bound can answer. Call it weak and it is the enemy who acts first every time, while your people are left a step behind.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The favored side resolves before the bound side in every \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Combat/Definitions/Spotlight\" target=\"_blank\" rel=\"noopener\">Spotlight\u003c/a>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Staggered*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Staggered* breaks out on Reflex.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Bladestepping is speed and nerve made into a working.\u003c/p>\u003cul class=\"lst\">\u003cli>Cross a gap, a wall, or a crowd in a blur before anyone marks the move.\u003c/li>\u003cli>Win a race of pure speed, a closing door, a falling bridge, a fleeing mark.\u003c/li>\u003cli>Read the timing of a thing, when to step and when the moment will turn.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Grimalkin","lead":"Lineage of Felidae","teaser":"The Grimalkin are feline folk, sleek-furred, with ears that swivel and tails that never quite hold still.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Grimalkin","linkLabel":"The Grimalkin","html":"\u003cp>The Grimalkin are feline folk, sleek-furred, with ears that swivel and tails that never quite hold still. They run on equal parts aloof charm and twitchy survival instinct. A Grimalkin's purr can talk a panicking ally down, and its hiss can put a lesser threat off the idea entirely.\u003c/p>\u003cp>They come from Felidae, a world of erratic weather and steady danger, jungle to desert to forests that turn to storm without warning. All of which keeps a Grimalkin agile, on edge, and very awake. Their culture is loose-knit and independent, fond of comfort wherever it can be scrounged.\u003c/p>\u003cp>To play a Grimalkin is to live in the gap between a nap and a sprint. They are creatures of impulse and precision, with roughly nine lives' worth of luck to spend.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Grimalkin\u003c/div>\u003cp>Grimalkin are typically curious, impulsive, and high-strung. They can be both endearing and frustrating, their natural laziness contrasting with sudden bursts of anxious energy and playful curiosity.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Emphasizing their catlike behavior: frequent napping, sudden bursts of energy, and unpredictable moods.\u003c/li>\u003cli>Highlighting their skittishness under pressure. Startling easily, reacting quickly, rarely staying still.\u003c/li>\u003cli>Leaning into their stealth and agility in exploration and combat.\u003c/li>\u003cli>Using their vocalizations naturally: a soothing purr to calm allies, a sharp hiss to assert dominance or unsettle foes.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Grimalkin gain +1 to their Mobility attribute upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;If I hissed at you, consider it a compliment.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Grimalkin of Felidae\u003c/div>\u003cp>The Grimalkin are a sleek, quick-eyed people, easy with a smile and quicker with their hands. They keep loose pleasure courts rather than rigid kingdoms, and standing comes from charm, daring, and the run of one's luck more than from blood or law. They love a wager, a performance, and a clean escape, and they distrust anyone who seems to want nothing at all.\u003c/p>"},{"title":"Architecture and Cities","html":"\u003cp>Felidae builds for spectacle. Prismatic palaces refract the light into shifting color, and gambling dens form the true heart of most settlements, louder and busier than any temple or hall. Streets fold into mirage roads that are not always where they were yesterday, and the cities glitter most at night, when the lanterns come up and the games begin.\u003c/p>","teaser":"Felidae builds for spectacle.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Felidae","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Worship in Felidae centers on luck and indulgence. Cults form around fortune itself, treating a good run as a blessing and a long cold streak as a warning to heed. Devotion looks less like prayer and more like ritual play, offerings made at the table and oaths sworn on the turn of a card.\u003c/p>","teaser":"Worship in Felidae centers on luck and indulgence.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Felidae","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Felidae","html":"\u003cp>The Grimalkin favor sugared meats and dreamfish, food made to be savored late and shared loud. Their music is jazzy and chaotic, all laughter songs and improvisation, and their fashion runs to flashy layered silks built to catch the prismatic light. They cross their world on mirage roads and blinkpaths, routes that reward a quick foot and a quicker eye and punish anyone who hesitates at the wrong moment.\u003c/p>","teaser":"The Grimalkin favor sugared meats and dreamfish, food made to be savored late and shared loud.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Felidae","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Garyx":{"name":"Garyx","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Garyx","lineage":"The Nyseen","brand":"Guisewyrd","art":"Guiseshifting","glance":[["Travel","lava crawlers and glacier sleds"],["Monsters","frostfire beasts and Paradox Shifters"],["What they fear","elemental imbalance"]],"saying":{"text":"Burn too hot and the ice takes you. Freeze too hard and the fire does. Walk the seam.","attr":"a Nyseen saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Garyx is a world split between fire and ice and at war with itself over which should win. Frigid fortresses stand cracked across volcanic ice ruins, where glaciers grind against magma and steam never stops rising. The Nyseen live along that seam, in clans whose rivalries echo the war of the elements themselves, and they have learned that survival means holding two opposite forces in balance rather than choosing one.\u003c/p>","teaser":"Garyx is a world split between fire and ice and at war with itself over which should win.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Garyx","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Guisewyrd","lead":"Brand of Garyx · the art of Guiseshifting","teaser":"Guisewyrd is the Brand of Garyx, the working called Guiseshifting.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Guisewyrd","linkLabel":"Guisewyrd","html":"\u003cp>\u003cem>Also called Guiseshifting.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Guisewyrd is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Garyx, the working called Guiseshifting. It exists as elemental body morphing and dual-color displays of flame and frost, a magic of becoming, of taking the shape and substance the moment demands. Its tone is chaotic and adaptive. Its cost is the body's own coherence, for Guiseshifting risks the instability of physical form, and a careless shifter can lose the shape they started with.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Guisewyrd and the bound lose the shape of their own bodies, flame and frost warring under the skin. Their forms will not hold long enough to land a blow, and every strike goes wide. Call it weak and it is your people who cannot keep a shape, swinging at nothing.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The bound side's attacks automatically miss.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Crippled*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Crippled* breaks out on Anchor.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Guiseshifting is the art of becoming whatever the moment asks.\u003c/p>\u003cul class=\"lst\">\u003cli>Take the shape the moment demands, a smaller frame, a tougher hide, a creature's stride.\u003c/li>\u003cli>Turn part of yourself to flame or frost to pass a hazard or grip a foe.\u003c/li>\u003cli>Read the unstable edges of a place where elements bleed together.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Nyseen","lead":"Lineage of Garyx","teaser":"The Nyseen are quiet dreamers and shapebound souls, born of frost and longing.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Nyseen","linkLabel":"The Nyseen","html":"\u003cp>The Nyseen are quiet dreamers and shapebound souls, born of frost and longing. In their true form they are delicate things, white-skinned and silver-haired and soft-spoken, lit with a faint ghostlight, their large black eyes reflecting a cosmos they will never get to see. That form is rarely shown to anyone. Revealing it is a sacred act, saved for a chosen few and bound in trust for life.\u003c/p>\u003cp>So the Nyseen move through the world in borrowed shapes instead. Their bodies ripple and resettle at will, skin tone, build, posture, even gender and age, all reshaped to fit need, safety, or strategy.\u003c/p>\u003cp>Home is Garyx, a realm of endless ice and smoking frost where volcanic vents blast frozen steam high enough to blot out the stars for good. Under that veil the Nyseen live in a permanent radiant twilight, their auroras drifting across the glaciers like prayers.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Nyseen\u003c/div>\u003cp>Nyseen are seekers, shaped by longing and defined by trust. They are resilient pacifists and adaptive survivors, holding a deep desire for connection and for freedom beyond the sky.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Using shapeshifting not just for utility, but as an extension of emotion or identity.\u003c/li>\u003cli>Choosing one character in the party to eventually reveal your true form to and playing that bond slowly and meaningfully.\u003c/li>\u003cli>Reflecting your harmonious culture: resolving tension, seeking unity, and resisting violence when possible.\u003c/li>\u003cli>Exploring the duality of hiding and revealing. When is it safer to become someone else, and when is it braver to remain yourself?\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Nyseen gain +1 to a skill or attribute of their choice upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;I've worn many faces. Only one is mine.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Nyseen of Garyx\u003c/div>\u003cp>The Nyseen are a people of duality, their clans built on rivalry and the constant negotiation between heat and cold. They are adaptive, contentious, and proud, treating the balance of opposites as both a way of life and a point of honor. They distrust extremes in anything, having watched what happens to those who let one element rule them.\u003c/p>"},{"title":"Architecture and Cities","html":"\u003cp>Garyx builds to survive both fire and frost at once. Split fortresses are raised half against the cold and half against the heat, anchored in volcanic ice ruins where the two elements meet. Travel runs on lava crawlers across the burning ground and glacier sleds across the frozen, each clan favoring the terrain it knows best.\u003c/p>","teaser":"Garyx builds to survive both fire and frost at once.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Garyx","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Garyx is worship of elemental balance, the conviction that fire and ice must be held in equilibrium and that imbalance is the true enemy. The clans honor the seam between the elements as sacred ground, and they regard the loss of balance, in the world or in a person, as the beginning of ruin.\u003c/p>","teaser":"Faith in Garyx is worship of elemental balance, the conviction that fire and ice must be held in equilibrium and that imbalance is the true enemy.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Garyx","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Garyx","html":"\u003cp>The Nyseen take firefish, frostberries, and magma stew, food drawn from both halves of their divided world. Their music is rhythmic chant and elemental percussion, and they dress in layered heat-cold survival gear suited to crossing the seam. They travel by lava crawler and glacier sled, moving between fire and ice as the route demands.\u003c/p>","teaser":"The Nyseen take firefish, frostberries, and magma stew, food drawn from both halves of their divided world.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Garyx","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Karn":{"name":"Karn","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","lineage":"The Marrowkai","brand":"Bloodband","art":"Bloodbinding","glance":[["Travel","beast caravans and the backs of giant wurms"],["Monsters","marrow beasts, ossified horrors, and bone wurms"],["What they fear","weakness, and the corruption working its way into the marrow"]],"saying":{"text":"Kill the mountain, ring the marrow, march its shadow.","attr":"a Hollow Host proverb"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Karn is a realm of crimson skies and thunder-scarred earth, where every horizon is lined with the broken ribs of mountains and the husks of beasts once thought eternal. Valleys lie gouged by the charge of titans. Forests twist upward like bone spires. The wind carries the iron tang of blood, and during the Threnody Season it howls with the voices of battles long past, as though the land refuses to forget its dead.\u003c/p>\u003cp>Here, blood is more than life. It is resonance. Spilled on Karn's soil, it wakes the Chimeholds, and their marrowglass shards toll with terrible harmony. That resonance fuels Bloodbanding, the binding of the slain back into motion, not as shades but as chained warriors and towering beasts of bone and sinew. In Karn, death is never an ending. It is a conscription.\u003c/p>\u003cp>To live in Karn is to hunt the mighty and carve strength from their ruin. The Marrowkai fell colossal predators, wyrm-scaled horrors, and storm-feathered leviathans, then bind them into their Hollow Hosts. The land trembles under the tread of armies half-living and half-dead, their march a dirge of marrow and steel. Karn offers no peace and no respite, only the promise that if you fall, your echo will march on in the song of war.\u003c/p>","teaser":"Karn is a realm of crimson skies and thunder-scarred earth, where every horizon is lined with the broken ribs of mountains and the husks of beasts once thought eternal.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Bloodband","lead":"Brand of Karn · the art of Bloodbinding","teaser":"To shape with Bloodbinding is to let Karn's silence seep into your veins.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Bloodband","linkLabel":"Bloodband","html":"\u003cp>\u003cem>Also called Bloodbinding, or simply Bind.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>To shape with Bloodbinding is to let Karn's silence seep into your veins. In that realm of marrow towers and cathedral spines, the living and the dead are bound by bone, and the pulse of every heart resounds like a tolling bell. Bloodbinding scores the flesh and binds the rhythm of life to a chain of shared consequence. Every shaping is an oath, etched deeper with each heartbeat.\u003c/p>\u003cp>When blood is shed, Bloodbinding resonates. Your wound becomes another's, their wound becomes yours, and each strike sounds a chord in a symphony of marrow. Some Marrowkai call it communion. Others call it penance. To shape with it is to turn harm into hymn, a chorus of flesh where the bound answer your pain with their own.\u003c/p>\u003cp>The deeper one shapes, the closer one brushes against the Ossuary Vein, the endless artery said to coil beneath Karn like a black river. Some whisper it is endless unity, a place where every pulse beats as one. Others fear it is only hunger, and that every note of Bloodbinding draws the shaper closer to drowning in its tide.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Bloodbinding and the Death Toll rings across the field, scoring an oath into every creature it binds. The blow a bound enemy throws never reaches you. It rebounds into the one who swung it, blood answering blood. Call it weak and the oath binds your own people, their every strike turned back on themselves.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The bound side's attacks deal their damage to the attacker instead of the target.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Mangled*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Mangled* breaks out on Renewal.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Bloodbinding is a covenant written in the pulse.\u003c/p>\u003cul class=\"lst\">\u003cli>Bind your wound to a willing ally, or take theirs onto yourself to keep them standing.\u003c/li>\u003cli>Feel the pulse of a hidden heart nearby, the living and the recently dead alike.\u003c/li>\u003cli>Swear a blood-oath that both parties feel the moment either one breaks it.\u003c/li>\u003c/ul>\u003cdiv class=\"sub\">Bloodband in Karn\u003c/div>\u003cp>Bloodband is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Karn, and the Marrowkai do not treat it as sorcery. They treat it as dominion. It is the art of chaining death through resonance, binding marrow and spirit to the toll of the Chimeholds. There are no whispered prayers and no woven light, only the cut, the bleeding, and the command. Every scar is a sigil and every drop of blood a note in an endless dirge.\u003c/p>\u003cp>In the world it shows itself as the fallen rising half-shattered yet unbroken in will. Colossal beasts are felled and driven back to their feet as skeletal juggernauts. Foes slain in defiance march again beneath the banners they once opposed. Its deepest practice is simply called Banding, worked at the height of carnage when the Blood Chimes scream and a Bonecaller can lash the marrow-song of the dead into unbreakable chains. To the Marrowkai this is not desecration but sanctity. Death as inheritance, marrow as scripture, blood as the chain that binds all legacies into one host.\u003c/p>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Marrowkai","lead":"Lineage of Karn","teaser":"The Marrowkai are blood-marked warriors, nomadic and scarred and lit up by the pulse of a fight.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Marrowkai","linkLabel":"The Marrowkai","html":"\u003cp>The Marrowkai are blood-marked warriors, nomadic and scarred and lit up by the pulse of a fight. Their cannibal rites and endless warpath have earned them a reputation as savages, and most people never look past it. Underneath, though, there is ritual, tradition, and a code that does not bend: strength is honored, the weak are consumed, and kin are never left behind.\u003c/p>\u003cp>They come from Karn, a place of savage beauty and brutal extremes, mountainous barrens and choked forests and scarred valleys under a blood-red sky. There, survival is the whole culture and the blade is the common tongue.\u003c/p>\u003cp>A Marrowkai never settles for long. The warbands roam without end, raiding to live, to win glory, and to honor the old rites. Earn their respect through honor and strength and you have it. Show them cowardice and you are already finished.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Marrowkai\u003c/div>\u003cp>Marrowkai are relentless, proud, and rooted in a culture where blood binds and battle defines. Their presence should always feel like a smoldering ember: contained, but never out.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Channeling their intensity in combat through feral charges, ritual howls, or the gleam of hunger.\u003c/li>\u003cli>Embracing their nomadic identity. Rarely attached to places, but fiercely protective of companions.\u003c/li>\u003cli>Forming grudging respect for powerful allies, perhaps the only bonds they understand beyond kinship.\u003c/li>\u003cli>Drawing from Karn's unforgiving terrain to shape their outlook on the world.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Marrowkai gain +1 to their Temper skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;Every scar is a name. Every name is a vow.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Marrowkai of Karn\u003c/div>\u003cp>The Marrowkai are blood-marked warriors, nomads carved in scar and bone, their flesh etched with the trophies of battle and their souls tethered to the pulse of the Chimeholds. They are not wanderers of chance but hunters of purpose, seeking the mightiest prey the realm can offer. To kill such a beast is triumph. To bind it through Bloodbanding is legacy.\u003c/p>\u003cp>Their rites come from inheritance rather than cruelty. Through ritual consumption they claim the strength and memory of the worthy, believing that flesh is fleeting while marrow carries permanence into the soul. To consume is to honor, and to waste is sacrilege. A warrior's body is not buried. It is devoured, the essence reforged into kin.\u003c/p>\u003cp>Marrowkai warbands, the Hollow Hosts, march beneath banners woven from sinew and bone. Each host is led by a Bonecaller, a seer who reads the resonance of the Chimeholds and guides the hunt. Where the Hosts pass, they leave more than ash. They leave the tread of colossal revenants, behemoths of claw and fang risen again in skeletal fury. To the Marrowkai this is the truest immortality, an unbroken line of warriors and beasts bound forever to the song of war.\u003c/p>"},{"title":"The Chimeholds","html":"\u003cp>The Chimeholds rise like broken altars across Karn, monoliths of jagged stone latticed with marrowglass shards and rib-like arcs of ancient bone. When blood touches their soil they wake, humming with a resonance that rattles the marrow of anyone who hears it. The tones are not mournful. They are commands, forging chains between the living and the dead.\u003c/p>\u003cp>To the Marrowkai the Chimeholds are sacred forges where legacy is beaten into shape. Warriors duel to feed their echoes into the marrow-song, and the greatest beasts are brought there to be slain and bound. A dragon felled at a Chimehold does not rot. It rises again as a hollow revenant, its bones lashed to the will of its slayers, and the Hosts call this the ringing of the beast.\u003c/p>\u003cp>Their origin is older than any Marrowkai tale. Some whisper they were carved by gods who bled themselves into stone during the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Discord\" target=\"_blank\" rel=\"noopener\">Discord\u003c/a> Wars. Others claim they are scars left by Discord itself, branding Karn as its crucible. Whatever the truth, each chime is both dirge and summons, thinning the veil and amplifying Bloodbanding until whole armies of the dead can be lashed together.\u003c/p>","teaser":"The Chimeholds rise like broken altars across Karn, monoliths of jagged stone latticed with marrowglass shards and rib-like arcs of ancient bone.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Architecture and Cities","html":"\u003cp>Marrowkai settlements are warcamps made sacred more than they are cities. Bone frames chiseled from the carcasses of titans are lashed with blood-hardened hide and draped in banners of sinew and scarlet thread. Most dwellings are temporary, raised on ancient stones and burned when the Host moves on, leaving only ash and marrow behind. To stay still is to invite weakness.\u003c/p>\u003cp>Around the greatest Chimeholds stand more enduring places. Ring-forts carved into cliff faces, their walls studded with marrowglass and bone, serve as sanctuaries where Hollow Hosts gather to duel, feast, and bind their fallen prey. Dros'Thaar, raised around a mountain Chimehold, is ringed by terraces of ribstone where Bonecallers chant into the wind. Such places are less cities than crucibles, where blood becomes memory and memory becomes command.\u003c/p>","teaser":"Marrowkai settlements are warcamps made sacred more than they are cities.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>The Marrowkai do not worship gods or stars. Their faith is carved into marrow and carried in blood. They believe the soul is tethered not to heaven or void but to the resonance of what it has slain and what has slain it. When blood feeds the Chimeholds, the tones that rise are the voices of ancestors, bound as echoes of strength and will.\u003c/p>\u003cp>Central to their belief is Banding, the conviction that nothing worthy is ever lost. Through ritual consumption a warrior inherits the marrow of kin and foe alike. Through the Blood Chimes a Bonecaller binds the echoes of beasts and champions so that glory does not fade. To bleed, to scar, and to bind are their prayers. To fall in battle is not tragedy but the truest sacrament, a chance to rise again with bone and spirit lashed to the song of war.\u003c/p>","teaser":"The Marrowkai do not worship gods or stars.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"War and Peace","html":"\u003cp>Karn does not remember peace. It remembers conquest. Its wars are waged for survival and sanctity rather than crown, and every campaign is a hunt while every clash is a rite. Hollow Hosts descend on titans with spears of bone and blades etched in scar, and the fallen are bound and made to march in the ranks of their slayers.\u003c/p>\u003cp>What passes for peace is never stillness. It is the sharpening of bone weapons, the carving of relics, the scar-etching of children beneath the hum of the Chimeholds. It is preparation, a quiet shaping of strength for the battles to come. To live without the rhythm of war is to drift from the marrow-song and risk being forgotten.\u003c/p>","teaser":"Karn does not remember peace.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">Vaegra and the Eternal Host\u003c/div>\u003cp>A marrow tyrant named Vaegra preaches a corrupted version of the marrow-song and gathers the dead into a single host bound to her will. Where her rites take hold, Banding stops answering its rightful callers.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Tainted Marrow\u003c/div>\u003cp>The marrow-song itself has begun to sour, and the Bonecallers who hear it most closely say the wrongness in it is no natural thing. Many fear Discord has reached into the marrow and is rewriting the rite from the inside.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Shattered Kin\u003c/div>\u003cp>A heretic faction has broken from the Hollow Hosts and refuses the rites of Banding. They build permanent halls and reject the binding of slain beasts. To many this is blasphemy. To others it is a dangerous temptation.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Bleedwake\u003c/div>\u003cp>Some Chimeholds have begun to sing without blood, calling revenants from the soil and beasts from long-dead hunts. Some Marrowkai read this as prophecy of endless war. Others fear it is the corruption spreading, unbinding the marrow-song one toll at a time.\u003c/p>\u003c/div>","teaser":"Vaegra and the Eternal Host, The Tainted Marrow, The Shattered Kin, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Kwuhara":{"name":"Kwuhara","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","lineage":"The Minerite","brand":"Khaldurgy","art":"Khaldbearing","glance":[["Travel","resonance lifts and crystal rails"],["Monsters","Grimgrit and shardspawn"],["What they fear","becoming Unshaped"]],"saying":{"text":"A Minerite is not born. They are cut, set, and seated. Crack, and you are recut.","attr":"a Minerite saying"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Kwuhara is a world of inverted gemstone cities, citadels that hang downward from vast crystal ceilings and catch the light in cold, regal facets. Resonant crystal choirs ring through the hanging streets, and everything, from a citizen's station to their next life, is measured in the gems. It is beautiful and merciless in equal measure, a realm where order is total and the cost of that order is rarely spoken aloud.\u003c/p>\u003cp>The Minerite live and die and live again through the gems, their identities cut and set into crystal and seated into a strict caste hierarchy that claims to preserve stability for all. The claim holds, mostly. But the rebirth that anchors Kwuhara's whole society has begun to falter, and a world built entirely on certainty does not know what to do when the certainty cracks.\u003c/p>","teaser":"Kwuhara is a world of inverted gemstone cities, citadels that hang downward from vast crystal ceilings and catch the light in cold, regal facets.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Khaldurgy","lead":"Brand of Kwuhara · the art of Khaldbearing","teaser":"Khaldurgy is the Brand of Kwuhara, the working called Khaldbearing.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Khaldurgy","linkLabel":"Khaldurgy","html":"\u003cp>\u003cem>Also called Khaldbearing.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Khaldurgy is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Kwuhara, the working called Khaldbearing. It exists as gem resonance, mineral pulse-lines, and floating facets, a magic drawn from the crystal that underpins Minerite life and rebirth. Its tone is regal and oppressive, the magic of a ruling order rather than a free one. Its cost is the mind. Khaldbearing carries the risk of resonance madness, the gem's cold song lodging in the wielder's thoughts and ringing there long after the working is done, until some can no longer tell their own will from the crystal's.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Khaldurgy and the crystal's cold song lodges in the bound. Their triumphs curdle. Every brilliant moment turns on them, the crystal souring success into ruin. Call it weak and it is your own victories that betray you.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>A bound creature's Fellmarks count as Fellstrikes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Diminished*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Diminished* breaks out on Resolve.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Khaldbearing is the cold, ordered craft of the crystal.\u003c/p>\u003cul class=\"lst\">\u003cli>Wake a crystal to light, to store a charge, or to ring a warning.\u003c/li>\u003cli>Read the resonance in stone and gem, what is flawed, what is hollow, what is old.\u003c/li>\u003cli>Shape mineral and facet into a tool, a key, or a lattice that holds a working.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Minerite","lead":"Lineage of Kwuhara","teaser":"The Minerite are crystalline folk, made when a soul bonds to a Khald'hart, a rare gem that serves as both heart and mind.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Minerite","linkLabel":"The Minerite","html":"\u003cp>The Minerite are crystalline folk, made when a soul bonds to a Khald'hart, a rare gem that serves as both heart and mind. Their bodies form around uncut stone, quartz or obsidian or ruby, and they shimmer with an inner light that takes its color from the soul held inside.\u003c/p>\u003cp>They come from Kwuhara, a vast underground realm where communities grow in the caverns around shared protection and a deep reverence for legacy. Their society runs on altruism with a quiet hierarchy underneath it, since a rarer or brighter Khald'hart tends to earn its bearer more respect.\u003c/p>\u003cp>To be a Minerite is to walk the line between memory and identity. You are more than your gem's past, but its echo lives in you all the same. Honor that inheritance or push against it, either way you are a light reclaimed in a world carved out of stone.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Minerite\u003c/div>\u003cp>Minerite are thoughtful, resilient, and community-bound, but many are shaped by the weight of legacy. Whether you are the first bearer of a Khald'hart or the ninth, its resonance lingers and so might the past.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Reflecting your gem type in your personality, power, or temperament. Does it shape your nature or define your purpose?\u003c/li>\u003cli>Playing into the deep communal codes of Minerite culture or questioning the elitism that surrounds gem inheritance.\u003c/li>\u003cli>Wrestling with memory fragments from past lives, whether they guide or haunt you.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Minerite gain +1 to their Power attribute upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;We do not live once. We resonate forever.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Minerite of Kwuhara\u003c/div>\u003cp>The Minerite are a crystalline people, formal and disciplined, their lives ordered by a caste system that determines station, duty, and worth from the moment they are seated. They prize precision, restraint, and propriety, and they regard their hierarchy not as oppression but as the natural shape of a stable world. Beneath the formality runs a deep and quiet dread of becoming Unshaped, of cracking, losing one's set place in the gem and the cycle, and falling out of the order entirely.\u003c/p>"},{"key":"lb:The Grimgrit","tag":"Lorebound","rune":"ᛈ","title":"The Grimgrit","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Grimgrit","linkLabel":"The Grimgrit","teaser":"Under Kwuhara, in the molten caverns where broken Khald'hart gems fall into the earth like tears, something slowly gathers.","html":"\u003cp>Under Kwuhara, in the molten caverns where broken Khald'hart gems fall into the earth like tears, something slowly gathers. Shattered soul fragments drift down into the fire and fuse, and over centuries they stack into towering shapes of crystal and stone. That is the Grimgrit, built out of pain and carrying a great many wills at once.\u003c/p>\u003cp>It does not so much strike as crush. The jagged limbs break and reform in the middle of a fight, every motion loud with the anger of dozens of Minerite souls that flatly refuse to fade. Beside a Fell, it throws off tremors of raw force that batter everything standing too near.\u003c/p>\u003cp>Walk with a Grimgrit and you are trailed by the footsteps of the forgotten. A walking crypt that will not let the living forget what stirs under the stone.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Reprisal\u003c/strong>. Answers a blow against a Fell with one of its own.\u003c/p>\u003c/div>"},{"key":"campaign","tag":"The Fell","rune":"ᛟ","title":"Stone and Sovereign","teaser":"Watch the campaign played in Kwuhara.","html":"\u003cp>\u003ca class=\"watch-link\" href=\"https://www.youtube.com/live/asBbdoZeWmA\" target=\"_blank\" rel=\"noopener\">&#9654;&nbsp; Watch Stone and Sovereign on YouTube\u003c/a>\u003c/p>","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","linkLabel":null},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","teaser":"Glower.","html":"\u003cdiv class=\"sub\">Figures\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Canon+Characters/Glower\" target=\"_blank\" rel=\"noopener\">Glower\u003c/a>\u003c/div>\u003c/div>"},{"title":"The Rebirth and the Sovereign","html":"\u003cp>At the heart of Kwuhara sits the rebirth cycle, the process by which a Minerite's identity is preserved in the Khald'hart and seated into a new life. It is the foundation of everything, and it is failing. Resonance corruption spreads through rebirth itself, and the Sovereign who rules over the cycle has begun to hear voices within the gems, a fracture in his mind that he mistakes for clarity. He means to rewrite Minerite rebirth entirely, to perfect Kwuhara through forced unity, and he is certain, in the way only a breaking mind can be, that he alone can hold the world together.\u003c/p>","teaser":"At the heart of Kwuhara sits the rebirth cycle, the process by which a Minerite's identity is preserved in the Khald'hart and seated into a new life.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Architecture and Cities","html":"\u003cp>Kwuhara builds downward and inward. Inverted gemstone cities hang from crystal ceilings, citadels suspended over deep resonant dark, their halls cut and faceted to ring with the choirs that fill them. Movement runs along resonance lifts and crystal rails that hum through the hanging districts, carrying citizens between the tiers of a society as layered as the stone it lives in.\u003c/p>","teaser":"Kwuhara builds downward and inward.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Kwuhara is Khald'hart reverence, devotion to the gems that hold identity, station, and rebirth. The crystal is treated as both ancestor and law, and to honor it is to honor the order it imposes. The caste system is not merely political here. It is sacred, and questioning it is closer to heresy than to dissent.\u003c/p>","teaser":"Faith in Kwuhara is Khald'hart reverence, devotion to the gems that hold identity, station, and rebirth.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"Life in Kwuhara","html":"\u003cp>The Minerite take crystal fungi and mineral broths, food grown in the resonant dark, and they fill their citadels with resonant crystal choirs that double as ceremony and law. They dress in gem-encrusted formalwear that displays caste at a glance, and they travel by resonance lift and crystal rail through the hanging cities. Every part of life here is arranged, set, and seated, and that is exactly how the Minerite prefer it, right up until it stops working.\u003c/p>","teaser":"The Minerite take crystal fungi and mineral broths, food grown in the resonant dark, and they fill their citadels with resonant crystal choirs that double as…","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Failing Cycle\u003c/div>\u003cp>The rebirth that anchors all of Kwuhara is breaking down, resonance corruption spreading through it, and a society built on certainty is beginning to face questions it has no answers for.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Sovereign's Voices\u003c/div>\u003cp>The ruler hears the gems speaking, mistakes the madness for revelation, and moves to rewrite rebirth itself by force. What he calls perfecting Kwuhara, others call its end.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Rebellion\u003c/div>\u003cp>Rebels led by figures like Kidran Vektor work to break the caste system entirely, and the great houses maneuver against the throne and one another, while the world cracks underneath all of them.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Unshaped\u003c/div>\u003cp>Those who fall out of the cycle, cracked and unset, become the Unshaped, and their numbers are growing. Some are simply lost. Others may be turning into something the gems were never meant to hold.\u003c/p>\u003c/div>","teaser":"The Failing Cycle, The Sovereign's Voices, The Rebellion, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Kwuhara","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Mireleor":{"name":"Mireleor","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","lineage":"The Ironclad","brand":"Aethercraft","art":"Aethershaping","glance":[["Travel","rail platforms, forgewalkers, and armored caravans"],["Monsters","Titans, Behemoths, and the Duskcarved"],["What they fear","leyline collapse, waking Titans, and forging that runs out of control"]],"saying":{"text":"We do not mend the world to save it. We mend it because it breaks, and because we are still here to hear the crack.","attr":"inscription on the outer hull of Tharnhold's gateforge"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Mireleor is a thunder-split world of molten veins, rust-choked ruins, and overgrown forgelands where ancient machines sleep beneath tangled roots. The skies hang heavy with smoke and static, casting shifting light over jagged ridgelines and half-buried gears the size of fortresses. Jungle canopies crackle with electric wind, and the plains tremble with the tread of something colossal just out of sight.\u003c/p>\u003cp>Magic here is Aethercraft, the shaping of raw resonance into form, and it runs back to the Primordial Forges. Those leyline-fed engines were built long ago to hold reality together by burning order into the bones of the world. Their power still pulses through the land, but dimly now, like the last ember in a dying furnace. To live on Mireleor is to patch the broken, remember the lost, and hold the line against Behemoths that bear down like storms with bones. Every forge relit and every oath etched into iron is a spark flung against the dark.\u003c/p>","teaser":"Mireleor is a thunder-split world of molten veins, rust-choked ruins, and overgrown forgelands where ancient machines sleep beneath tangled roots.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Aethercraft","lead":"Brand of Mireleor · the art of Aethershaping","teaser":"To shape with Aethercraft is to feel the pulse of Mireleor beneath your feet.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Aethercraft","linkLabel":"Aethercraft","html":"\u003cp>\u003cem>Also called Aethershaping, or simply Craft.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>To shape with Aethercraft is to feel the pulse of Mireleor beneath your feet. The brand draws from hidden furnaces deep within the earth, where molten gears and embered veins still churn with a forgotten rhythm. Every shaping is a hammer strike against that buried anvil, and every success a spark drawn from the sleeping forge below.\u003c/p>\u003cp>The power is resonated rather than summoned. The brand hums when grit and will align with the Forge's ancient cadence, and what follows is release. Fatigue burns away, afflictions are smothered, and the raw forms of spell and steel are impressed into being. The Ironclad hold that this is no spellwork at all, only a reactivation, a reminder to the earth of what it once knew how to make.\u003c/p>\u003cp>The deeper one shapes, the closer one brushes against the Prime Forge, whispered to rest at the world's core. Some Forgemasters call it a wellspring of perfect design. Others warn that it is a memory as much as a forge, and that every act of shaping wakes something vast that has only been half-asleep, and listening.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Aethercraft and the Forge below answers in iron. The hammer of shaping falls on the fight itself, and the power an enemy was building toward is struck loose and reforged in your own hand before they can spend it. Call it badly and the Forge reclaims from you instead, every charge you gather drawn down into the dark.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>When a bound creature would gain a Charge, the favored side gains it instead.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Disenchanted*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Disenchanted* breaks out on Creation.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Aethershaping is the craft of reminding the world what it once knew how to make.\u003c/p>\u003cul class=\"lst\">\u003cli>Reforge a broken weapon, a seized lock, or a shattered mechanism back into working order.\u003c/li>\u003cli>Read the making of a thing by touch, who forged it, how, and where it will fail.\u003c/li>\u003cli>Wake a dormant Mireleoran construct, or still one that should not be running.\u003c/li>\u003c/ul>\u003cdiv class=\"sub\">Aethercraft in Mireleor\u003c/div>\u003cp>Aethercraft is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Mireleor, the art the world calls Aethershaping. It is reality bent through the language of the Forges, resonance burned into matter as sigil and seam until steel remembers a shape it was never poured into. In the world it appears as molten runeplates, geometric forge-glyphs, and brands seared into metal, leyline, and living armor alike.\u003c/p>\u003cp>It is the most powerful working in \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/The+Sphere\" target=\"_blank\" rel=\"noopener\">the Sphere\u003c/a> and the most dangerous. The same craft that mends a Holdfast can scar a Titan or rewrite a stretch of leyline, and every great shaping leaves the world a little less stable than before. The oldest records hold that uncontrolled Aetherforging is what broke Mireleor in the first place, and the wisest Forgekeepers treat the Brand less as a gift than as a debt that always comes due.\u003c/p>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Ironclad","lead":"Lineage of Mireleor","teaser":"The Ironclad are sentient suits of enchanted armor, awakened leftovers of an age that already ended.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Ironclad","linkLabel":"The Ironclad","html":"\u003cp>The Ironclad are sentient suits of enchanted armor, awakened leftovers of an age that already ended. Their makers vanished long ago. The armor rose anyway, off battlefields and out of broken halls, each spirit bound to its plate and to some purpose it can no longer fully name. Centuries of wear have made them distinct, etched over with runes, scars, and symbols nobody alive still knows how to read. They come in every build, from towering juggernauts to lean tactical frames, and they all share one fact. There is no flesh under there.\u003c/p>\u003cp>They hail from Mireleor, a shattered realm once rich with arcane technology and now ground down under the behemoths that still roam its plains. The sky churns, the earth shifts, and ancient ruins lie scattered across the land like bones. The Ironclad pick their way through all of it with a resolve that does not flinch, hunting for some remnant of where they came from and what they were for.\u003c/p>\u003cdiv class=\"sub\">Roleplaying an Ironclad\u003c/div>\u003cp>Ironclad are stoic, driven, and duty-bound. While their affinity for magic is weak, many seek to understand it, often fumbling through arcane practice with curiosity or frustration. They revere the ruins of their creators, guarding them or searching for answers in the dust.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Playing up awkward or flawed interactions with magic: trial, error, and unintended consequences.\u003c/li>\u003cli>Showing reverence for ancient relics, especially those that feel strangely familiar.\u003c/li>\u003cli>Taking on a protector role in the party, acting as shield and anchor for the group.\u003c/li>\u003cli>Exploring the quiet curiosity beneath the metal frame. They may not breathe, but they feel.\u003c/li>\u003c/ul>\u003cdiv class=\"sub\">Cilaris and the Kinetic Arts\u003c/div>\u003cp>The Ironclad arm themselves with weapons that multiply kinetic energy into ruinous impact, built around a mineral called Cilaris that holds force for a moment and detonates it the instant the weapon stops hard. A Cilaris weapon that lands wrong goes off in its wielder's hands, so the Ironclad train a martial discipline of deceleration, every strike controlled, every stop deliberate, so the mineral releases only where it is meant to. Their armor is Cilaris too, plating that gathers the punishment it takes and looses it back through engraved runes. The greatest of these weapons were forged for one purpose, to punch through the behemoths that still walk Mireleor.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Ironclad gain +1 to their Endurance skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;I am steel without origin. Yet still, I remember the forge.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Ironclad of Mireleor\u003c/div>\u003cp>The Ironclad are sentient suits of living armor, vessels of will, memory, and forged purpose. Each is a relic given breath, shaped through an old ritual that binds the skull of a long-vanished creator to a hollow steel form and grows memory-root through the join. No two are alike. Some rise as towering juggernauts and others move with uncanny grace, but all carry the weight of oaths they may no longer remember.\u003c/p>\u003cp>They are steadfast and burdened, driven by duty engraved deeper than thought. They do not sleep, yet they dream, of creators who vanished, of war without end, of a design they may never complete. They speak rarely and feel deeply, and their loyalty is hard to break. To be Ironclad is to endure without rest and without fully knowing why.\u003c/p>"},{"key":"campaign","tag":"The Fell","rune":"ᛟ","title":"Madness of Mireleor","teaser":"Watch the campaign played in Mireleor.","html":"\u003cp>\u003ca class=\"watch-link\" href=\"https://www.youtube.com/live/igjqOAUEqfU\" target=\"_blank\" rel=\"noopener\">&#9654;&nbsp; Watch Madness of Mireleor on YouTube\u003c/a>\u003c/p>","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","linkLabel":null},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","teaser":"Frank, Malvaro and The Unforged.","html":"\u003cdiv class=\"sub\">Figures\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Canon+Characters/Frank\" target=\"_blank\" rel=\"noopener\">Frank\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Canon+Characters/Malvaro\" target=\"_blank\" rel=\"noopener\">Malvaro\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"sub\">Powers\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/The+Factions/The+Unforged\" target=\"_blank\" rel=\"noopener\">The Unforged\u003c/a>\u003c/div>\u003cp>The Unforged are proto-Ironclad, frames begun in the old Mireleoran way and never completed, the skull seated and the body raised but the soul and the oath never…\u003c/p>\u003c/div>"},{"title":"The Seeker and the Primordial Forges","html":"\u003cp>Before the Ironclad there was the Seeker, the mythic creator who forged them and raised the Primordial Forges to stabilize a world coming apart at the leylines. The Seeker meant the Forges to preserve, to imprint order onto reality and hold back the madness that unchecked resonance brings. That, at least, is the hope the faithful still carry.\u003c/p>\u003cp>What the Forges became is harder to face. Somewhere the work failed, catastrophically, and the Seeker passed into legend trailing as much grief as reverence. The Forges that remain lie scattered and half-broken, their channels clogged with rust and root, waking only when the right balance of ritual and grit is struck. Deepest of all is the Heartforge, the world-core engine whispered to lie at the center of Mireleor. Some believe it can craft anything. Others fear it remembers everything.\u003c/p>","teaser":"Before the Ironclad there was the Seeker, the mythic creator who forged them and raised the Primordial Forges to stabilize a world coming apart at the leylines.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"The Behemoths","html":"\u003cp>The Behemoths of Mireleor are not mere monsters. They are the world's oldest breath, living Titans from the primal chaos before the first Forge was lit. Each is a singular force. Some lie buried beneath storm-torn jungles, others roam the molten plains like earthquakes with eyes. Their presence distorts the land. Trees bend away, metal rusts in reverse, and even time seems to stagger near them.\u003c/p>\u003cp>Many Ironclad believe the Behemoths are the world's immune system, roused only when balance breaks through greed, invention, or too much silence in the Forges. They are feared but not universally hated. Old records speak of Titans that spared cities or slept beside cradles of invention for centuries, and offerings are still left at shattered footpaths and impact sites. No Ironclad forgets the truth of them, though. The Behemoths are not part of the world. They are what the world remembers.\u003c/p>","teaser":"The Behemoths of Mireleor are not mere monsters.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Cilaris and the Ragers","html":"\u003cp>Mireleor's wars against the Behemoths run on a mineral called Cilaris, which catches kinetic force, holds it for a breath, and detonates it the moment it is brought to a violent stop. Cilaris weapons turn a single swing into a killing blow, and Ironclad plate is grown from the same mineral, gathering the punishment it takes to loose it back through engraved runes. From this the Holdfasts built the rager, an ultralight sphere that can be charged with any kind of energy, struck by a Cilaris striker, and fired down a runed cannon to project that energy across the field. Both the blade and the rager were made for one task above all others, piercing the behemoths that the old steel could never scratch.\u003c/p>","teaser":"Mireleor's wars against the Behemoths run on a mineral called Cilaris, which catches kinetic force, holds it for a breath, and detonates it the moment it is brought…","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"The Ironglir Rite","html":"\u003cp>There is a rite kept by the first Holdfasts. Those who fell in the brutal early wars against the Titans were not buried but transcended. Their bodies were cleaned and dissected, and the skull was set into an Ironglir, a small vessel much like a pot, seeded beforehand with a plant of magical properties and a slow waking consciousness. A contraption drove the seed to the center of the skull during the dissection, and over time the plant grew through the bone and took on the memory held in it. The stripped bodies were not wasted either. Melted down with metal, they were reforged into a Holdfast's flagship weapons, so that the dead fought on in both the vessel and the blade.\u003c/p>","teaser":"There is a rite kept by the first Holdfasts.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"Architecture and Cities","html":"\u003cp>Mireleor's cities are forged rather than built, hulking enclaves of blackened steel and molten seams grown outward from ancient forge-cores like rusted clockwork stopped mid-turn. These settlements, called Holdfasts, rise in tiers of gear-platforms, winding scaffold paths, and deep core chambers where heat and memory linger. Walls hum with residual energy, and light comes from flickering aether-strips set into the metal itself.\u003c/p>\u003cp>Structures are reinforced with overlapping plates of salvaged Behemoth armor, etched with command-runes and prayer-stamps no one can fully read. Cranes of bone and brass swing over the markets, and vault doors open only to those whose forge-signature still matches the old seals. Movement runs along magnet-lined rails between the tiers, and those who walk navigate by vibratio
