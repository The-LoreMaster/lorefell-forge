n and forgebeat. Every Holdfast is a prayer welded against the wild and stubbornly alive.\u003c/p>","teaser":"Mireleor's cities are forged rather than built, hulking enclaves of blackened steel and molten seams grown outward from ancient forge-cores like rusted clockwork…","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"sec:4","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>The Ironclad do not pray to gods. They revere the Seeker and the Forges, holding that the work of shaping is both origin and purpose. Every bolt turned, every core lit, and every fallen comrade reforged into a new shell is an act of devotion. Central to this faith is the Heartforge and the belief that it holds the original pattern from which all sentient forging descends. Forgekeepers serve as its stewards, less priests than interpreters of function, failure, and flame.\u003c/p>\u003cp>Not all hold to tradition. Some Ironclad believe their creators abandoned them and have turned from maintenance to mastery, forming sects that would rewrite the Forges' purpose or weaponize their power. Others speak in whispers of dismantling the Forges entirely, convinced that the only way to stop the world from breaking again is to let the fire finally go out.\u003c/p>","teaser":"The Ironclad do not pray to gods.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"sec:5","tag":"Lore","rune":"ᛒ"},{"title":"War and Peace","html":"\u003cp>Mireleor has never truly known peace. The Ironclad were forged for war against time, entropy, and Behemoths that cannot be reasoned with. Open battles between Holdfasts are rare, but ideological rifts run deep. Some factions cling to the old protocols and maintain what remains. Others call for conquest, or for an end to Aetherforging altogether, whatever the cost.\u003c/p>\u003cp>The tension worsens as the Behemoths grow bolder, some striking with unnerving purpose as if guided from beneath the crust. Entire settlements have gone under in hours, their cores torn out and left molten. Between the stirring Titans and the factions sharpening their oaths against one another, Mireleor sits one bad spark away from a forge-war no one was built to survive.\u003c/p>","teaser":"Mireleor has never truly known peace.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"sec:6","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Titans Stir\u003c/div>\u003cp>Behemoth sightings have doubled, and the old patterns no longer hold. Some march with intent, others lie still for weeks before unleashing ruin. The Forgekeepers cannot say what is waking them.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Hexbroker's Cure\u003c/div>\u003cp>A fanatic called the Hexbroker preaches that Aetherforging must be ended permanently, even if that means sacrificing the craft and reshaping the world by force. The argument is gaining followers among Ironclad exhausted by endless collapse.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">A World That Will Not Hold\u003c/div>\u003cp>The leylines feeding the Forges grow more unstable with every great shaping. Each fix buys a little time and costs a little stability, and the oldest records warn where that road ends.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Seeker's Truth\u003c/div>\u003cp>Fragments are surfacing that suggest the Seeker's design was never meant to dominate Mireleor but to save it, and that the version everyone inherited is a corruption of the original. If that is true, the war over the Forges has been fought on a lie.\u003c/p>\u003c/div>","teaser":"The Titans Stir, The Hexbroker's Cure, A World That Will Not Hold, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireleor","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Mireth":{"name":"Mireth","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","lineage":"The Fribbit","brand":"Xochitli","art":"Petalooming","glance":[["Travel","the Rootways, river craft, and canopy bridges"],["Monsters","Spinegloom Prowlers, Wild Bloom Husks, and Ghostvine Stalkers"],["What they fear","another Petal War, and the Wild Bloom no ritual can calm"]],"saying":{"text":"The flowers are a loan from the sleeping gods. Take what you are given, return what you can, and never let them bloom unwatched.","attr":"a Bloom Priest's first lesson"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Mireth is a vast jungle world where civilization grows as much as it is built. The Fribbit raise their city-states among colossal living trees and stepped pyramids beneath a canopy so deep the sun arrives as a green dusk, and through every root, ruin, and rooftop bloom the Xochitli, sacred flowers infused with the lingering essence of ancient jungle gods. The blooms are the heart of everything here. They feed the people, heal the wounded, arm the warriors, and carry the faith, and the art of unlocking them is the foundation the whole world stands on.\u003c/p>\u003cp>That foundation has cracked before. Centuries ago the Petal Wars nearly destroyed Mireth as rival city-states fought for control of the Xochitli, and only the founding of the Bloom Synod brought the killing to an end. The peace held, but the old rivalries never fully died, and now a new danger spreads faster than any war. The Wild Bloom is coming, ruins are rising from beneath the roots, and the priests have begun to whisper that the sleeping gods are starting to stir.\u003c/p>","teaser":"Mireth is a vast jungle world where civilization grows as much as it is built.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Xochitli","lead":"Brand of Mireth · the art of Petalooming","teaser":"Xochitli is the Brand of Mireth, the sacred art its people practice as Petalooming.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Xochitli","linkLabel":"Xochitli","html":"\u003cp>\u003cem>Also called Petalooming or Bloomcraft, and known to its practitioners simply as the Loom.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Xochitli is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Mireth, the sacred art its people practice as Petalooming. Rather than calling power down from the gods directly, it unlocks the divine essence sleeping inside the Xochitli, the blessed flowers infused with the lingering spirits of Mireth's ancient jungle gods. A loomer harvests, cultivates, and prepares blooms through rituals tied to the seasons, then coaxes the dormant blessing inside them into a temporary working of light, growth, healing, or harm.\u003c/p>\u003cp>Because every effect begins as a flower, Petalooming touches nearly all of Fribbit life. The art that brews a medicine can raise a battlefield ward or wither an enemy's footing with a breath of pollen, depending only on the bloom and the hand that prepares it. Different flowers hold different blessings, so a skilled loomer is part warrior, part gardener, and part priest, and the rarest blooms have been worth wars.\u003c/p>\u003cp>The craft has its costs. A bloom prepared wrongly poisons the one who takes it, an effect pushed too far turns unstable, and reckless working can tip a grove over into Wild Bloom, the divine overgrowth that no ritual easily calls back.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Petalooming and the divine blooms of Mireth open all at once. The blessing pours into the favored side and mends them whole, wounds closing as the petals unfurl. Call it weak and the bloom turns its gift on the enemy instead, knitting them up while your own hurts stay open.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The favored side restores all \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Attributes/Other+Attributes/Vitality\" target=\"_blank\" rel=\"noopener\">Vitality\u003c/a>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Worn*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake blooms the moment the brand is called, so there is nothing to hold or to sever. Worn* breaks out on Reflex.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Petalooming is medicine, blessing, and quiet warfare grown from the same garden.\u003c/p>\u003cul class=\"lst\">\u003cli>Prepare a bloom that heals, wards, calms, or wakes the one who takes it.\u003c/li>\u003cli>Coax a grove or a field into season early, or hold it back from blooming.\u003c/li>\u003cli>Read the blessing or the poison sleeping in a flower before anyone tastes it.\u003c/li>\u003c/ul>\u003cdiv class=\"sub\">Xochitli in Mireth\u003c/div>\u003cp>Petalooming is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Mireth, the sacred art of unlocking the divine essence held within the Xochitli. Rather than calling power down from the gods directly, a loomer harvests, cultivates, and prepares the blessed flowers through rituals tied to the seasons and the turning of the heavens, then coaxes the dormant blessing inside them into a temporary working. Different blooms hold different gifts, so the same craft that brews a medicine can raise a battlefield ward or wither an enemy's footing with a breath of pollen. It touches nearly all of Fribbit life, and its dangers are real. A bloom prepared wrongly poisons the one who takes it, and reckless working can tip a grove over into Wild Bloom.\u003c/p>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Fribbit","lead":"Lineage of Mireth","teaser":"The Fribbit are agile, amphibious folk born of rain, mud, and war.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Fribbit","linkLabel":"The Fribbit","html":"\u003cp>The Fribbit are agile, amphibious folk born of rain, mud, and war. Smooth vivid skin, long expressive tongues, and a grace that carries them through the dense jungles of Mireth, a world pulsing with magic, danger, and divine flora. Outsiders take them for playful or peculiar. Underneath that is a warrior people shaped by discipline, resilience, and hard spiritual training.\u003c/p>\u003cp>Skin color carries real weight in their culture. Darker-toned Fribbits are usually raised toward stealth and close combat, brighter ones toward magic, alchemy, or ranged work.\u003c/p>\u003cp>Their bodies are built for leaping, for reading the lay of a place at a glance, and for tongues that handle nearly any task, though almost never in a fight. There, a Fribbit's tongue is considered far too valuable to risk.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Fribbit\u003c/div>\u003cp>Fribbits are curious and alert, always scanning for movement, opportunity, or the perfect place to leap. Their society is communal but deeply proud, and Fribbits are often driven by legacy, spiritual conviction, or a desire to prove themselves in a world that misunderstands them.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Reflecting their strong bond to the jungle.\u003c/li>\u003cli>Using coloration as a narrative tool. How are you perceived among your own kind?\u003c/li>\u003cli>Playing up their amphibious biology: quick leaps, long tongue uses, moisture sensitivity.\u003c/li>\u003cli>Highlighting their discipline and military background, especially in battle or ritual.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Fribbit gain +1 to their Movement skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;The jungle remembers who walks it with honor. So do we.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Fribbit of Mireth\u003c/div>\u003cp>The Fribbit are an amphibious people born of rain, mud, and divine bloom, agile and broad-eyed, built for the wet vertical world they live in. Outsiders mistake them for playful or harmless and learn better quickly, because beneath the quick tongues and bright skin is a warrior people shaped by discipline and spiritual rigor. Skin coloration carries meaning in their culture, with darker Fribbit often guided toward stealth and martial roles and brighter ones toward magic, alchemy, and spiritual study, and their long prehensile tongues serve in climbing, crafting, and daily work far more than in battle, where they are considered too precious to risk.\u003c/p>\u003cp>Their society runs on service, discipline, and community, organized into proud city-states where collective success is valued above personal ambition and status comes from usefulness more than blood. They preserve their history in murals, ceremonial dances, oral tradition, and temple carvings, and they mark the turning of the year with festivals for the sacred blooms, the victories of their warriors, and the blessings of their gods. United by shared culture and faith, the city-states still compete fiercely for resources and for the cultivation of the Xochitli, and that competition is never far from becoming something worse.\u003c/p>"},{"title":"The Lumitoad","html":"\u003cp>The Lumitoad is the \u003ca href=\"https://fellguide.com/The+FellGuide/Quick+Links/Lorebounds\" target=\"_blank\" rel=\"noopener\">Lorebound\u003c/a> of Mireth, an amphibious companion that glows from a lifetime of feeding on enchanted Xochitli. Patient and observant, it waits motionless before striking with sudden speed, and its venomous tongue is built to disrupt rather than destroy, sapping an enemy's momentum and breaking the rhythm of a fight so allies can seize the opening. The Fribbit count them among the most respected creatures in the world, keeping them as temple guardians, hunting partners, and battlefield support, and a bonded Lumitoad senses danger long before its companion does.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Forfeit\u003c/strong>. Strips a foe of its React the moment it commits to an Act.\u003c/p>\u003c/div>","teaser":"The Lumitoad is the Lorebound of Mireth, an amphibious companion that glows from a lifetime of feeding on enchanted Xochitli.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Lumitoad","key":"lb:The Lumitoad","tag":"Lorebound","rune":"ᛈ","linkLabel":"The Lumitoad"},{"key":"campaign","tag":"The Fell","rune":"ᛟ","title":"Of Withering Thorns","teaser":"Three strangers woke in a dying grove with no memory of how they came, a Fribbit who named himself The Harold, a suit of enchanted armor called Frank that stood and…","html":"\u003cp>Three strangers woke in a dying grove with no memory of how they came, a Fribbit who named himself The Harold, a suit of enchanted armor called Frank that stood and walked on its own, and a child-shaped light named Emperion. The Needledrags came out of the undergrowth before they had names for each other, and the three fought because the alternative was worse. What they had walked into was a jungle rotting from the root, and a Council that had let it happen.\u003c/p>\u003cp>\u003ca class=\"watch-link\" href=\"https://www.youtube.com/live/K0zOSY3BnfY\" target=\"_blank\" rel=\"noopener\">&#9654;&nbsp; Watch Of Withering Thorns on YouTube\u003c/a>\u003c/p>","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Histories/Of+Withering+Thorns/Of+Withering+Thorns","linkLabel":"Of Withering Thorns"},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","teaser":"The Harold.","html":"\u003cdiv class=\"sub\">Figures\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Canon+Characters/The+Harold\" target=\"_blank\" rel=\"noopener\">The Harold\u003c/a>\u003c/div>\u003c/div>"},{"title":"The Sleeping Gods","html":"\u003cp>The Xochitli are not ordinary flowers. Each holds a fragment of the lingering essence of Mireth's ancient jungle gods, and the Fribbit treat them as something closer to ancestor and divinity than to mere flora. The grandest of them all grows at Bloomspire, a single sacred bloom risen into a living mountain, and the priests there hold that it is connected directly to the gods themselves. For generations those gods have slept, their power filtered safely through bloom and ritual. Lately that has begun to change. Ruins long buried surface from beneath the roots, pilgrims speak of dreams and disturbances, and a growing number of the Xochi believe the long sleep is ending.\u003c/p>","teaser":"The Xochitli are not ordinary flowers.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Cities and City-States","html":"\u003cp>Mireth builds upward and inward through the canopy. Xol'Ratha is the capital and the largest city, strung among colossal living trees on root platforms and flowering terraces lit gold by Xochitli at night, and it holds the seat of the Bloom Synod where most of the world's decisions are negotiated. Rib'Xotal is the military heart, a fortress city of stepped pyramids and training terraces watched over by statues of legendary Petal Generals, home to the Grand Arena of Blossoms and many of Mireth's finest warriors. Bloomspire is the sacred pilgrimage city grown around the largest Xochitli in existence, its terraces spiraling out beneath petals that cast colored light across countless shrines. Rootgrave is the ancient ruin-city, its pyramids and temples split apart by roots and vines, holding the oldest surviving records of the Petal Wars. The Verdant Basin spreads across the flooded south in lily fields and bioluminescent marshes where the rarest blooms grow and whole settlements have vanished beneath the water only to surface again decades later. Xul'Veka is the great independent trade hub, built inside the hollow trunks of colossal dead trees and lit by glowing fungi, where goods, rumors, and relics from every corner of Mireth change hands.\u003c/p>","teaser":"Mireth builds upward and inward through the canopy.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"The Factions","html":"\u003cp>Mireth's power is shared and contested among many hands.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Faction\u003c/th>\u003cth>What they want\u003c/th>\u003c/tr>\u003ctr>\u003ctd>The Bloom Synod\u003c/td>\u003ctd>Keep the peace and regulate Xochitli cultivation, all that stands between Mireth and a second Petal War.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Bloomguard Legion\u003c/td>\u003ctd>Defend the groves, Rootways, and cities from monsters and Wild Bloom surges.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Circle of Xochi\u003c/td>\u003ctd>Preserve the spiritual traditions and hold the balance with the divine flora.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Verdant Spears\u003c/td>\u003ctd>Expand their reach and seize the richest bloom fields, peace or no peace.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Bloomspire Keepers\u003c/td>\u003ctd>Guard the Bloomspire and the most sacred cultivation grounds in the world.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Rootgrave Seekers\u003c/td>\u003ctd>Unearth relics and lost knowledge from the ruins of the Petal Wars.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Marshbound Clans\u003c/td>\u003ctd>Hold their wetland territories and the oldest traditions against outside rule.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Xul'Veka Consortium\u003c/td>\u003ctd>Control the trade, and the secrets that travel with it.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","teaser":"Mireth's power is shared and contested among many hands.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","key":"factions","tag":"Powers","rune":"ᚨ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Mireth is devotion to the Xochitli and the sleeping gods whose essence they carry. To tend a bloom is an act of worship and to waste one is a sin, and the Petaloom rites mark every turning of a Fribbit life, each sealed with an opened flower and a shared breath of its light. The Circle of Xochi and the Bloom Priests keep this faith, reading the divine signs and guiding the cultivation that keeps the world in balance. Lately they carry it heavily, because a religion built on gods who sleep has no easy answer for gods who might be waking.\u003c/p>","teaser":"Faith in Mireth is devotion to the Xochitli and the sleeping gods whose essence they carry.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">Wild Bloom\u003c/div>\u003cp>The defining crisis of the age. Sacred flora expands beyond all ritual balance, wildlife is driven into violent frenzy, and stable Petaloom workings turn volatile without warning. Where the overgrowth takes hold it overruns groves and harvests alike and leaves Wild Bloom Husks behind it, and the Bloom Synod cannot keep pace.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Old Rivalries\u003c/div>\u003cp>The Petal Wars ended in treaty rather than forgiveness. The Verdant Spears press to expand, bloom shortages sharpen every grievance, and the Bloom Synod strains to hold a peace that was never as settled as it looked.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Stirring Gods\u003c/div>\u003cp>Buried ruins surface from beneath the roots, pilgrims at the Bloomspire speak of disturbances, and more of the Xochi each season come to believe the ancient jungle gods are beginning to wake. No one agrees on whether to welcome it or prevent it.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Withering\u003c/div>\u003cp>In at least one telling the blooms do the opposite of running wild. They die, the ground sours, and beneath the deepest canopy the Rootheart fails over a far older wound, the Rift Below, that the flowers were grown to cover. Where that story is true, the silence spreads inward season by season, and what it uncovers is worse than any overgrowth.\u003c/p>\u003c/div>","teaser":"Wild Bloom, The Old Rivalries, The Stirring Gods, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mireth","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Mortavia":{"name":"Mortavia","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mortavia","lineage":"The Rekindled","brand":"Hexpyre","art":"Hexkindling","glance":[["Travel","funeral barges and ash caravans"],["Monsters","Boreals, Ashwake Votives, Embermaids, and Cawmarches"],["What they fear","eternal death, and the cold silence after"]],"saying":{"text":"We do not bury our dead. We bank them like coals, and wait to see who the fire gives back.","attr":"a Mortavian rite-saying"},"soon":"\u003cp>This world carries a recorded hint: the dead walking the ashstorms, the Rekindled returning through unstable resonance, a rumor that death itself weakens near the strongest pyres. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Mortavia is a world that treats death as a doorway it keeps oiled and ready. Funeral monasteries and bone cathedrals stand over candle crypts, ashstorms roll across the plains, and everywhere the air smells of smoke and tallow. Here a death is not an ending but a banking of the fire, and the people watch the pyres for who the flame might give back. The dead are said to still walk the ashstorms, and the Rekindled themselves return through resonance no one fully understands.\u003c/p>","teaser":"Mortavia is a world that treats death as a doorway it keeps oiled and ready.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mortavia","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Hexpyre","lead":"Brand of Mortavia · the art of Hexkindling","teaser":"Hexpyre is the Brand of Mortavia, the working called Hexkindling.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Hexpyre","linkLabel":"Hexpyre","html":"\u003cp>\u003cem>Also called Hexkindling.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Hexpyre is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Mortavia, the working called Hexkindling. It exists as frostfire candles, funeral embers, and ash sigils, a magic of mourning flame that warms, lights, and calls back from the ash. Its tone is somber and reverent. Its cost is the slow burning of lifeforce and a heavy emotional burden, for to kindle the dead is to carry their grief alongside your own.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Hexpyre and the mourning flame kindles over the bound. The warmth meant to mend them is drawn off down the candle's smoke and given to the one who called it. Whatever healing finds them feeds you instead. Call it weak and your own care for your wounded goes to the enemy.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>Healing a bound creature would receive is given to the favored side instead.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Ignited*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Ignited* breaks out on Endurance.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Hexkindling tends the flame between the living and the dead.\u003c/p>\u003cul class=\"lst\">\u003cli>Kindle a flame that lights, warms, or calls a little of the dead back to speak.\u003c/li>\u003cli>Carry a measure of someone's grief so they can do what grief would stop them doing.\u003c/li>\u003cli>Read the embers of a place, who died there and whether they rest.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Rekindled","lead":"Lineage of Mortavia","teaser":"The Rekindled are the dead who got up again.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Rekindled","linkLabel":"The Rekindled","html":"\u003cp>The Rekindled are the dead who got up again. Undead forms that shuffle, stride, or stagger through the wreckage of who they used to be, animated by forbidden rituals that lash soul back to bone. Some are bare skeletal husks, some are still rotting, and all of them burn with a spark that will not quite go out.\u003c/p>\u003cp>They are summoned into Mortavia, a cursed and apocalyptic realm where wild sorcery roams loose and death is only the opening move. Chaos rules the broken lands, and the Rekindled walk the ruins of kingdoms nobody remembers, carrying purposes that came back to them in pieces.\u003c/p>\u003cp>Each one keeps faint echoes of an older life. Their speech is arcane, felt more than heard, carried on magical resonance. They can be grotesque to look at, and a great many of them are still noble, fierce, or kind underneath it.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Rekindled\u003c/div>\u003cp>The Rekindled straddle two worlds: the memory of life and the reality of undeath. They may be seeking redemption, vengeance, or simply trying to understand why they still exist.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Showcasing the tension between who you were and what you have become.\u003c/li>\u003cli>Using your haunting presence to unsettle, intrigue, or provoke. Your voice, posture, or silence can speak more than words.\u003c/li>\u003cli>Portraying the absence of a homeland or cultural anchor as part of your identity.\u003c/li>\u003cli>Crafting layered interactions with others: sometimes cold, sometimes warm, shaped by fragmented memory and lingering emotion.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Rekindled gain +1 to their Renewal skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;I don't remember my name. But I remember how it felt to lose it.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Rekindled of Mortavia\u003c/div>\u003cp>The Rekindled are a people shaped by mourning and return, gathered into mourning houses and tended by shrinekeepers who keep the rites and the flames. They are somber, patient, and unafraid of death in the ordinary sense, because death here is rarely the last word. What they fear is the other ending, the cold silence in which the fire does not catch and nothing comes back.\u003c/p>"},{"key":"lb:The Boreal","tag":"Lorebound","rune":"ᛈ","title":"The Boreal","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Boreal","linkLabel":"The Boreal","teaser":"The Boreal is a luminous, feather-crowned lorebound from Mortavia, home of the Rekindled.","html":"\u003cp>The Boreal is a luminous, feather-crowned lorebound from Mortavia, home of the Rekindled. Made of spectral aether and old grief, it feels pain in the air like a pulse and carries the weight so the people around it do not have to. Its bond runs deep, rooted in a plain vow to protect.\u003c/p>\u003cp>In a fight it pulls danger onto itself, taking the blows meant for its allies and turning the spared hurt into something that keeps them alive. The oldest Boreal are said to hold every death they ever witnessed, each one resting in the soft light of their crowns.\u003c/p>\u003cp>For all their quiet, what they want on the field is not subtle. Endure, protect, and let nothing land for free.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Succor\u003c/strong>. Softens a physical blow and turns what it spares into vitality.\u003c/p>\u003c/div>"},{"key":"lb:The Cawmarch","tag":"Lorebound","rune":"ᛈ","title":"The Cawmarch","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Cawmarch","linkLabel":"The Cawmarch","teaser":"The Cawmarch is a cursed raven of Mortavia, a land that does ruin and resurrection in roughly equal measure.","html":"\u003cp>The Cawmarch is a cursed raven of Mortavia, a land that does ruin and resurrection in roughly equal measure. Bred from the old magic of the ravens of Crawd'r, it exists to pull the afflictions out of its bonded Fell. Every curse it swallows grows a second heart in its chest, black and lit red, ticking a little faster with each one. When its master dies, the raven comes back.\u003c/p>\u003cp>It manages this by tearing its own wings apart and twisting the bones into jagged limbs, then dragging itself forward, grinning and hungry for more pain to eat. Most lorebounds put themselves between their Fell and harm. The Cawmarch waits for the harm to land, then lunges to throw it back.\u003c/p>\u003cp>Take a Cawmarch and you keep death close. It is loyal, it is cruel, and it is never full.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Scour\u003c/strong>. Scours an \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Combat/The+Afflictions/Afflictions/Afflictions\" target=\"_blank\" rel=\"noopener\">Affliction\u003c/a> from a Fell before it sets in.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Mortavia builds for the dead and the grieving alike. Funeral monasteries and bone cathedrals rise in solemn stone, ringed by candle crypts where the flames are never allowed to fully gutter. Travel runs by funeral barge along the ash rivers and by ash caravan across the storm-swept plains.\u003c/p>","teaser":"Mortavia builds for the dead and the grieving alike.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mortavia","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Mortavia is flame funerary rite, the conviction that the pyre is a passage rather than an end. Mourning houses tend the dead and shrinekeepers tend the flames, and the highest devotion is to keep the fire burning so that nothing worthy passes into the cold silence unremembered.\u003c/p>","teaser":"Faith in Mortavia is flame funerary rite, the conviction that the pyre is a passage rather than an end.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mortavia","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Mortavia","html":"\u003cp>Mortavians take smoke kabobs, marrow mounds, and ember ale, food cooked in the same fires that honor the dead. Their music is somber chant and distant wailing, and they dress in heavy cloaks and candle-thread robes. They cross their world by funeral barge and ash caravan, always moving with the smell of smoke at their backs.\u003c/p>","teaser":"Mortavians take smoke kabobs, marrow mounds, and ember ale, food cooked in the same fires that honor the dead.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Mortavia","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Natbakka":{"name":"Natbakka","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Natbakka","lineage":"The Din","brand":"Divisyr","art":"Scourging","glance":[["Travel","mistwalks and omen beasts"],["Monsters","fate horrors and omen beasts"],["What they fear","prophecy, and inevitability"]],"saying":{"text":"The omen is not a warning. A warning could be heeded.","attr":"a Din saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Natbakka is a world half-hidden in mist and wholly preoccupied with fate. Mist shrines and omen towers loom out of the fog, whisper songs and omen bells sound from places no one can quite locate, and the Din read the future in everything from birdflight to the curl of smoke. It is a fatalistic world, weighed down by the conviction that what is coming is already decided, and that the most one can do is learn its shape before it arrives.\u003c/p>","teaser":"Natbakka is a world half-hidden in mist and wholly preoccupied with fate.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Natbakka","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Divisyr","lead":"Brand of Natbakka · the art of Scourging","teaser":"Divisyr is the Brand of Natbakka, the working called Scourging.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Divisyr","linkLabel":"Divisyr","html":"\u003cp>\u003cem>Also called Scourging.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Divisyr is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Natbakka, the working called Scourging. It exists as omen glyphs, split-light markings, and prophecy fractures, a magic of reading and bending the threads of fate. Its tone is ominous and foreboding. Its cost is the integrity of fate itself, for Scourging brings fate distortion, and a careless seer can fracture the very future they sought to read, twisting prophecy into something worse than what was foretold.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Divisyr and the threads of fate fracture around the bound. Every turn of chance breaks the wrong way for them, each roll collapsing into ruin. Call it weak and it is your own future that splinters, every attempt soured before it begins.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>Every roll a bound creature makes counts as a \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Luck/Definitions/Fellstrike\" target=\"_blank\" rel=\"noopener\">Fellstrike\u003c/a>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Jinxed*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Jinxed* breaks out on Resonance.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Scourging reads the threads of fate, and frays them when it must.\u003c/p>\u003cul class=\"lst\">\u003cli>Read an omen in a death, a sky, a spilled thing, and know what it warns of.\u003c/li>\u003cli>Trace the threads of fate around a choice to see where each one leads.\u003c/li>\u003cli>Fracture a prophecy already laid, at the risk of twisting it worse.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Din","lead":"Lineage of Natbakka","teaser":"The Din are nocturnal, bat-like folk built for a world of darkness and echo.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Din","linkLabel":"The Din","html":"\u003cp>The Din are nocturnal, bat-like folk built for a world of darkness and echo. Lean and aerodynamic, small to middling in size, they sleep hanging from cavern ceilings, glide between trees without a sound, and cross fog like it owes them nothing. Their eyes are vestigial and near-useless in daylight, but their echolocation paints a world in sound far sharper than sight ever managed.\u003c/p>\u003cp>They come from Natbakka, a dim realm of patchy undergrowth, towering blackwood trees, and deep cavern hollows. In all that gloom the Din thrive, fast and fierce and fitted exactly to their eerie home.\u003c/p>\u003cp>Their fighting is fluid and reactive, all fast aerial skirmishes and sudden angles. As a Din ages its wings strengthen and its echolocation sharpens, and it grows into the intricate dance of flight and battle that the young only fumble at.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Din\u003c/div>\u003cp>Din are quiet observers, cautious by nature but lethal when provoked. They operate through instinct and coordination, preferring swift strikes and group cohesion to brute force.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Leaning into echolocation as more than a mechanic. Describe the world in terms of sound, pressure, and vibration.\u003c/li>\u003cli>Playing up their discomfort in daylight: drowsiness, irritability, or confusion under the sun.\u003c/li>\u003cli>Reflecting their communal nature through group loyalty and coordinated tactics.\u003c/li>\u003cli>Drawing from Natbakka's hushed mysticism to shape your character's personality and worldview.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Din gain +1 to their Finesse skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;One whisper is enough to strike.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Din of Natbakka\u003c/div>\u003cp>The Din are a people of seer castes and omen tribes, ordered by skill at reading the future and bound by a shared dread of it. They are watchful, foreboding, and resigned, treating prophecy not as guidance but as a sentence to be understood. They interpret fate constantly, and the closer they look, the heavier the inevitability of what they see seems to press.\u003c/p>"},{"title":"Architecture and Cities","html":"\u003cp>Natbakka builds to watch and to listen. Mist shrines and omen towers rise through the fog, sited where the signs are clearest, their chambers hung with bells and glyphs for reading what is coming. Travel runs on mistwalks through the fog and on the backs of omen beasts that are said to sense the road before it is taken.\u003c/p>","teaser":"Natbakka builds to watch and to listen.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Natbakka","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Natbakka is fate interpretation, the belief that the future is written and that wisdom lies in reading it rightly. The seer castes serve as its priesthood, and devotion is measured in the accuracy and gravity of one's prophecies, even when those prophecies promise only what cannot be avoided.\u003c/p>","teaser":"Faith in Natbakka is fate interpretation, the belief that the future is written and that wisdom lies in reading it rightly.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Natbakka","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Natbakka","html":"\u003cp>The Din take bitter teas and smoked fish, plain fare for a somber people, and they fill the mist with whisper songs and omen bells. They dress in hooded layered wraps that hide them in the fog, and they travel by mistwalk and omen beast. Their whole lives are spent listening for the future and bracing for it.\u003c/p>","teaser":"The Din take bitter teas and smoked fish, plain fare for a somber people, and they fill the mist with whisper songs and omen bells.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Natbakka","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Neriad":{"name":"Neriad","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Neriad","lineage":"The Merkith","brand":"Tidethane","art":"Tidelinking","glance":[["Travel","tidebeasts and coral skiffs"],["Monsters","leviathans and abyss horrors"],["What they fear","the deepwater voids"]],"saying":{"text":"Down here a single grief belongs to everyone. So does a single joy. You learn to be careful what you feel.","attr":"a Merkith saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Neriad is a world beneath the water, lit by bioluminescent tides and built of coral. Coral palaces and abyssal domes spread across the seafloor, whale-song harmonics roll through the deep, and the Merkith move through it all in clans linked closer than blood. Above the inhabited reefs and domes lie the deepwater voids, the lightless trenches where the leviathans and the abyss horrors dwell, and where the tide-linked clans do not willingly go.\u003c/p>","teaser":"Neriad is a world beneath the water, lit by bioluminescent tides and built of coral.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Neriad","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Tidethane","lead":"Brand of Neriad · the art of Tidelinking","teaser":"Tidethane is the Brand of Neriad, the working called Tidelinking.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Tidethane","linkLabel":"Tidethane","html":"\u003cp>\u003cem>Also called Tidelinking.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Tidethane is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Neriad, the working called Tidelinking. It exists as bioluminescent tides and linked water sigils, a magic of connection that joins minds, currents, and clans into a single flowing whole. Its tone is alien and serene. Its cost is the danger of that very connection, for Tidelinking can carry a shared emotional overload through the link, one mind's flood of feeling drowning many at once.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Tidethane and the favored side moves as a single flowing whole, minds and currents joined. Acting in concert, each of them strikes twice for every chance the bound gets once. Call it weak and the enemy is the one moving as one, a tide your people cannot match.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The favored side may take a second Act each round.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Strung*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Strung* breaks out on Resonance.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Tidelinking joins what was separate into one moving whole.\u003c/p>\u003cul class=\"lst\">\u003cli>Join minds across a distance to share what each one sees and knows.\u003c/li>\u003cli>Link a group so they move, work, or swim as one without a word spoken.\u003c/li>\u003cli>Read the currents of water, mood, or crowd and steer the whole of it.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Merkith","lead":"Lineage of Neriad","teaser":"The Merkith are amphibious explorers, slender and shimmering, their bodies at home in sea and on shore alike.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Merkith","linkLabel":"The Merkith","html":"\u003cp>The Merkith are amphibious explorers, slender and shimmering, their bodies at home in sea and on shore alike. Thin reflective scales sheathe them, soft webbing between their limbs makes them effortless in the water, and they breathe both air and ocean through voices that come out hollow and echoing, like wind moving through coral. They wear their long hair woven with shells and sea-debris, and they carry curiosity, calm, and a pull toward the tides.\u003c/p>\u003cp>They come from Neriad, a world of roiling ocean kingdoms, coral mountains, and drifting sandbars, where towering crustacean beasts hold the shorelines and iridescent sky-whales breach the waves overhead.\u003c/p>\u003cp>As a people the Merkith are serene and fierce at once. Their whole lives bend around movement and understanding, always seeking, always swimming forward.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Merkith\u003c/div>\u003cp>Merkith are calm, graceful, and drawn to the unknown. They flow like water through conversation and battle alike, their strength revealed only when tested.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Emphasizing their fierce serenity: responding to chaos with poise, letting silence speak volumes.\u003c/li>\u003cli>Using their aquatic grace in and out of combat, dashing across wet stone or diving into unknown depths.\u003c/li>\u003cli>Speaking with a breathy, echo-like cadence, soft and distant, like a memory carried by the tide.\u003c/li>\u003cli>Portraying their familiarity with natural disaster. Unphased by storms, leviathans, or collapsing coastlines.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Merkith gain +1 to their Logic skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;Still waters hide blades. Do not mistake our quiet for peace.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Merkith of Neriad\u003c/div>\u003cp>The Merkith are a people of tide-linked clans, bound to one another through shared currents of feeling and thought as much as by kinship. They are serene and alien by the standards of land-dwellers, their sense of self softer at the edges, flowing into the clan and back again. This closeness is their strength and their vulnerability both, for what one Merkith feels deeply, the whole clan can feel with them.\u003c/p>"},{"key":"lb:The Aquafin","tag":"Lorebound","rune":"ᛈ","title":"The Aquafin","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Aquafin","linkLabel":"The Aquafin","teaser":"The Aquafin is a sleek, serpentine dragon out of the abyssal deeps of Neriad, home of the ocean-walking Merkith.","html":"\u003cp>The Aquafin is a sleek, serpentine dragon out of the abyssal deeps of Neriad, home of the ocean-walking Merkith. Light bends through its scales, and its wings cut through sea spray and storm without slowing.\u003c/p>\u003cp>It feeds by draining whatever it touches, coiling its tail around raw energy and turning it to its own ends. Bonded to a Fell, it skims the charge off a striking enemy and passes that momentum to its partner, so a foe's own strength ends up working the wrong shift.\u003c/p>\u003cp>As a \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Transmogrifications/Corsair\" target=\"_blank\" rel=\"noopener\">Corsair\u003c/a> it bursts into a spiral of fizzing magic and flings its Fell into the fight, or out of it, at angles that should not be possible.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Siphon\u003c/strong>. Robs a foe of the Charge its attack would earn.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Neriad builds in living coral. Coral palaces and abyssal domes rise from the seafloor, shaped over generations and lit from within by the glowing tides, their corridors flowing rather than cornered. Travel runs on tidebeasts ridden through the open water and coral skiffs that drift the gentler currents.\u003c/p>","teaser":"Neriad builds in living coral.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Neriad","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Neriad is ocean spirit worship, reverence for the deep and the vast presences that move through it. The tide-linked clans honor the sea as the source of the connection that defines them, and they treat the deepwater voids with a dread that shades into the religious, the dark places where the ocean stops being kin and starts being other.\u003c/p>","teaser":"Faith in Neriad is ocean spirit worship, reverence for the deep and the vast presences that move through it.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Neriad","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Neriad","html":"\u003cp>The Merkith take deepfish and kelp wine, food gathered from the living reef, and they fill the water with whale-song harmonics that carry for miles. They dress in flowing scalecloth that moves with the current, and they travel by tidebeast and coral skiff. Their lives flow into one another the way their world flows around them.\u003c/p>","teaser":"The Merkith take deepfish and kelp wine, food gathered from the living reef, and they fill the water with whale-song harmonics that carry for miles.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Neriad","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Oroniel":{"name":"Oroniel","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Oroniel","lineage":"The Spireborn","brand":"Spirithral","art":"Spirecalling","glance":[["Travel","spirit bridges"],["Monsters","spirit beasts and echo dragons"],["What they fear","spiritual severance"]],"saying":{"text":"Open yourself wide enough to call a spirit, and take care what answers, and what leaves with it.","attr":"a Spireborn saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Oroniel is a world held aloft on spirit and song. Spirit towers and floating sanctums drift among airy heights, resonant choirs and ethereal tones carry between them, and the Spireborn live in close communion with the spirits and elements that move through their world. It is a serene, exalted place on its surface, and a perilous one underneath, because the same openness that lets a Spireborn call a spirit also leaves them open to what the spirit might do in return.\u003c/p>","teaser":"Oroniel is a world held aloft on spirit and song.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Oroniel","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Spirithral","lead":"Brand of Oroniel · the art of Spirecalling","teaser":"Spirithral is the Brand of Oroniel, the working called Spirecalling.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Spirithral","linkLabel":"Spirithral","html":"\u003cp>\u003cem>Also called Spirecalling.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Spirithral is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Oroniel, the working called Spirecalling. It exists as elemental summons and towering spirit glyphs, a grand magic of calling forth spirits and elemental forces to act in the world. Its tone is grand and unstable. Its cost is control, for Spirecalling risks elemental possession, the summoned force taking hold of the one who called it, until it is no longer clear who is wielding whom.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Spirithral and a towering summoned force sweeps the field for the favored side. Their every attack breaks across all the bound at once, an elemental tide that spares none of them. Call it weak and that tide turns, sweeping your own people instead.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The favored side's attacks strike every bound creature.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Conjoined*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Conjoined* breaks out on Sanctum.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Spirecalling bargains with forces larger than the one who calls them.\u003c/p>\u003cul class=\"lst\">\u003cli>Call a spirit or elemental force to labor, guard, or carry across hard country.\u003c/li>\u003cli>Bargain with a local spirit for passage, knowledge, or aid.\u003c/li>\u003cli>Read the elemental temper of a place, what it holds and what would wake it.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Spireborn","lead":"Lineage of Oroniel","teaser":"The Spireborn are elemental incarnates, humanoids shaped out of the raw forces of the world.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Spireborn","linkLabel":"The Spireborn","html":"\u003cp>The Spireborn are elemental incarnates, humanoids shaped out of the raw forces of the world. Each one is born from an ancient monolith, a spire, and carries the essence of its homeland in its body and its soul. They are earth, wind, fire, and water made into something that walks, speaks, and defends with the world's own fury.\u003c/p>\u003cp>They rise from Oroniel, a primordial realm where each towering spire pulses with old magic. It is from those spires that the Spireborn come, bound for good to the land that forged them.\u003c/p>\u003cp>A Spireborn sculpts its own shape, usually after the terrain of its birth spire, so the outer shell might read as polished stone, churning smoke, crackling flame, or falling water. Under that shell the pattern holds: a heart of fire, blood of water, bones of stone, and a soul carried on the wind.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Spireborn\u003c/div>\u003cp>Spireborn are proud and territorial, elemental forces given purpose and form. Their personalities often reflect their elemental expression, and their duty to their homeland is unwavering.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Speaking with authority and weight, letting every word feel rooted or charged with elemental resonance.\u003c/li>\u003cli>Reflecting your dominant element in your demeanor: burning with passion, standing unyielding, flowing with wit, or drifting unpredictably.\u003c/li>\u003cli>Guarding natural spaces or sacred grounds with fierce dedication.\u003c/li>\u003cli>Anchoring your appearance in elemental symbolism, even when it shifts.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Spireborn gain +1 to their Weaving skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;I do not guard the spire. I am the spire.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Spireborn of Oroniel\u003c/div>\u003cp>The Spireborn are a people of spiritual castes, ranked by their closeness to the spirits and their skill at communion. They are devout, refined, and attuned, living much of their lives in dialogue with presences others cannot perceive. Their gravest fear is spiritual severance, the cutting-off of that communion, which to a Spireborn is a kind of deafness and exile from the only world that has ever felt fully real to them.\u003c/p>"},{"key":"lb:The Solmera","tag":"Lorebound","rune":"ᛈ","title":"The Solmera","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Solmera","linkLabel":"The Solmera","teaser":"The Solmera is a chimera of a lion, crowned in shifting manes of elemental flame, born from the burning spires and trembling plains of Oroniel.","html":"\u003cp>The Solmera is a chimera of a lion, crowned in shifting manes of elemental flame, born from the burning spires and trembling plains of Oroniel. Every breath hums with old magic. Stone softens under its claws, and fire follows its steps. To a Solmera, the elements are not tools to reach for. They are simply what it is made of.\u003c/p>\u003cp>This lion takes the field for itself. It watches the swing that never lands, and the moment a blade passes through empty air beside its bonded Fell, it answers. Fire follows the miss back to the one who threw it. The air keeps shifting around the lion with every change of pace.\u003c/p>\u003cp>In \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Transmogrifications/Corsair\" target=\"_blank\" rel=\"noopener\">Corsair\u003c/a> form each stride scorches the ground. Walls of fire climb out of its tracks into a burning maze, and the maze holds until something is seared or the fight is finished.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Kindle\u003c/strong>. Burns any foe whose blow finds only air.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Oroniel builds toward the heights and the unseen. Spirit towers and floating sanctums hang in the airy reaches, raised as much for communion as for shelter, their halls shaped to carry resonance and welcome the spirits. Travel runs on spirit bridges that span the gaps between sanctums, paths held aloft by the same forces the Spireborn commune with.\u003c/p>","teaser":"Oroniel builds toward the heights and the unseen.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Oroniel","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Oroniel is spirit communion, the practice and reverence of dialogue with the spirits and elements. It is the center of Spireborn life rather than one part of it, and the spiritual castes serve as its mediators, their authority drawn from how deeply and safely they can commune. To lose that communion is the worst fate they know.\u003c/p>","teaser":"Faith in Oroniel is spirit communion, the practice and reverence of dialogue with the spirits and elements.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Oroniel","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Oroniel","html":"\u003cp>The Spireborn take etherfruit and spirit teas, light fare for a people who live half in the unseen, and they fill their sanctums with resonant choirs and airy tones. They dress in floating layered silks that move with the currents of the heights, and they travel by spirit bridge between the towers. Their world is quiet, exalted, and never quite empty.\u003c/p>","teaser":"The Spireborn take etherfruit and spirit teas, light fare for a people who live half in the unseen, and they fill their sanctums with resonant choirs and airy tones.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Oroniel","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Pandemonium":{"name":"Pandemonium","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Pandemonium","lineage":"The Wyspar","brand":"Gravenry","art":"Graven","glance":[["Travel","rift tears, chained portals, and Skyvault Shards"],["Dwellers","Discordants, Hollowed souls, and drifting Aether Strands"],["What it is","the prison-realm where Discord is sealed"]],"saying":{"text":"Every other world is a place people live. Pandemonium is the place that was built to hold the thing they live in spite of.","attr":"the LoreMaster"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Pandemonium is not a world so much as a cell. It is the fractured abyss beneath reality, the prison-realm raised to hold \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Discord\" target=\"_blank\" rel=\"noopener\">Discord\u003c/a>, and everything about it bends toward that purpose. Impossible black cathedrals lean at angles that hurt to follow. Flesh-metal fortresses breathe. Chained void structures hang in a sky that is less a sky than an absence with weight. There is no food here, only soul vapors drifting through the dark, and the air carries a hollow buzz beneath which something vast and patient rumbles.\u003c/p>","teaser":"Pandemonium is not a world so much as a cell.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Pandemonium","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Gravenry","lead":"Brand of Pandemonium · the art of Graven","teaser":"Gravenry is the Brand of Pandemonium, the working it calls Graven.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Gravenry","linkLabel":"Gravenry","html":"\u003cp>\u003cem>Also called Graven.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Gravenry is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Pandemonium, the working it calls Graven. It exists as black-red vapor, floating grave sigils, and geometry that should not close but does, a magic shaped from the same nihilism that soaks the realm. Its tone is oppressive and hungry, and its cost is the highest in \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/The+Sphere\" target=\"_blank\" rel=\"noopener\">the Sphere\u003c/a>. To shape with Gravenry is to spend yourself, soul eroding and identity fracturing with every working, until the wielder becomes one more thing the prison has hollowed out.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Gravenry and the prison-realm's hunger opens beneath the field. While it holds, a creature that falls is gone, dragged down with no rising and no rescue against \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Discord\" target=\"_blank\" rel=\"noopener\">Discord\u003c/a>'s threads. Call it weak and it is your own people the dark keeps. There is no more dangerous brand to call, and no worse ground to call it on.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>A bound creature reduced to 0 \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Attributes/Other+Attributes/Vitality\" target=\"_blank\" rel=\"noopener\">Vitality\u003c/a> is removed from the battle and cannot be revived or saved by any means.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Harvested*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Harvested* breaks out on Spirit.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Graven is the nihil-craft of the prison beneath reality, and it spends the one who works it.\u003c/p>\u003cul class=\"lst\">\u003cli>Open or read a rift tear, and know what waits to slip through it.\u003c/li>\u003cli>Bind a thing or a soul in graven sigils that will not let it go.\u003c/li>\u003cli>Read the hollow resonance of a place, what it has emptied out and what still answers.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">A Warning\u003c/div>\u003cp>Pandemonium is the realm where the dead stay dead. A Fell who falls here does not get to fight Discord's threads back to their feet. Calling Gravenry on its own ground is the most dangerous wager in the Sphere.\u003c/p>\u003c/div>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Wyspar","lead":"Lineage of Pandemonium","teaser":"The Wyspar are spectral echoes of the once-living, wraiths caught between death and whatever purpose still holds them here.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Wyspar","linkLabel":"The Wyspar","html":"\u003cp>The Wyspar are spectral echoes of the once-living, wraiths caught between death and whatever purpose still holds them here. Their forms shimmer with a translucent kind of agony and keep shifting to show how they died, a broken neck, drowned eyes, burned skin, crushed limbs. They are solitary phantoms who cannot even perceive one another, haunted by memory, and visible only to the living.\u003c/p>\u003cp>They surface out of Pandemonium, a liminal realm draped in fog, silence, and sorrow. There, final death is not a rest. It is obliteration, as strands of Discord hunt down and consume whatever is left of a Wyspar.\u003c/p>\u003cp>What keeps one going is a single goal, revenge or revelation or redemption or a vow left unfinished. A Wyspar holds on until that goal is met or final death finally takes it. Until then, it simply does not stop.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Wyspar\u003c/div>\u003cp>Wyspar are relentless and sorrowful, haunted but unyielding. Their presence distorts reality, and their determination knows no rest.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Playing into their disconnection. Unable to perceive others of their kind, relying only on the living for interaction.\u003c/li>\u003cli>Emphasizing their ghostly traits: shifting horror, pale translucency, or flickering forms that echo trauma.\u003c/li>\u003cli>Making their purpose central. Every choice a step toward the goal, no matter how bleak or how long it takes.\u003c/li>\u003cli>Bringing the dread of Pandemonium with you through visions, whispers, or unease that trails your presence.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Wyspar gain +1 to their Vigor attribute upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;I do not sleep. I do not dream. I only continue.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Wyspar of Pandemonium\u003c/div>\u003cp>What endures in Pandemonium endures by losing pieces of itself. The Wyspar drift through it as resonance worn down to grief and instinct, and around them gather Discordants, Hollowed souls, and stranger things that no longer remember being anything. Such order as exists is built on domination and corruption, hierarchies where the strong feed on the fading and the fading feed on whatever is weaker still. And beneath even that, something silent gathers the truly spent and keeps what is left of them, and no one in the prison can say what does the gathering or to what end.\u003c/p>"},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Pandemonium","teaser":"Abbigale, Discord and The Dark Entities.","html":"\u003cdiv class=\"sub\">Figures\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Canon+Characters/Abbigale\" target=\"_blank\" rel=\"noopener\">Abbigale\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"sub\">Powers\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Discord\" target=\"_blank\" rel=\"noopener\">Discord\u003c/a>\u003c/div>\u003cp>Discord is what became of Vorce Malvaro.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/The+Factions/The+Dark+Entities\" target=\"_blank\" rel=\"noopener\">The Dark Entities\u003c/a>\u003c/div>\u003cp>The Dark Entities are the silent judges.\u003c/p>\u003c/div>"},{"title":"Architecture","html":"\u003cp>Pandemonium builds the way a wound scars. Cathedrals of black stone rise without foundation, fortresses of fused flesh and metal sprawl without plan, and chains thread the void between them, binding structures to nothing at all. Nothing here was made to be lived in. It was made to hold, and to last, and to wear down whatever it holds.\u003c/p>","teaser":"Pandemonium builds the way a wound scars.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Pandemonium","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Worship and Survival","html":"\u003cp>Faith in Pandemonium runs in two directions that are often the same direction. Some worship Discord outright and hunger for its ascension. Others form survival cults that bargain, hide, and feed, telling themselves they serve only themselves. In the end both bend toward the same will, because in a prison built around one thing, everything eventually answers to it.\u003c/p>","teaser":"Faith in Pandemonium runs in two directions that are often the same direction.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Pandemonium","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"The Cracks","html":"\u003cp>Pandemonium was built to contain, and it is no longer containing perfectly. Rift tears open where the walls of reality have thinned, and through them things slip out, into the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Stratums\" target=\"_blank\" rel=\"noopener\">Stratums\u003c/a>, at night and at the edges. The sealing holds, mostly. But those who study the prison speak in lower voices of two fears they cannot disprove: that Discord is not the only ancient thing locked down here, and that the prison may be older than the Skyvault raised to reinforce it. Neither fear is proven. Both are the kind that, once heard, are difficult to set back down.\u003c/p>","teaser":"Pandemonium was built to contain, and it is no longer containing perfectly.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Pandemonium","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Sable":{"name":"Sable","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sable","lineage":"The Bogle","brand":"Cantomyth","art":"Mythcasting","glance":[["Travel","story caravans and resonance stages"],["Monsters","storyborn horrors and myth spirits"],["What they fear","being forgotten from history, and being eaten by what they tell"]],"saying":{"text":"Be in a story or be in a grave. In Sable they are often the same wager.","attr":"a Bogle saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Sable is a world where the story is real and the telling has teeth. Mythic amphitheaters and story-pillars rise across it, narrative opera and spoken epics fill the air, and the Bogle live and die by the tales they keep alive. A story well told here can take on a life of its own, for better and for worse, and the line between a legend and a living thing is thinner than anywhere else in \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/The+Sphere\" target=\"_blank\" rel=\"noopener\">the Sphere\u003c/a>.\u003c/p>","teaser":"Sable is a world where the story is real and the telling has teeth.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Sable","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Cantomyth","lead":"Brand of Sable · the art of Mythcasting","teaser":"Cantomyth is the Brand of Sable, the working called Mythcasting.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Cantomyth","linkLabel":"Cantomyth","html":"\u003cp>\u003cem>Also called Mythcasting.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Cantomyth is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Sable, the working called Mythcasting. It exists as storybook glyphs, spoken symbols, and theatrical resonance, a magic of shaping reality through narrative, calling forth what is told. Its tone is whimsical and dangerous in equal measure. Its cost is the truth, for Mythcasting brings narrative distortion and false memory, rewriting the teller's own past as readily as the tale, until they can no longer be sure which of their memories were ever real.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Cantomyth and the fight becomes a story you are telling. The bound become characters in your tale, and you write their part, choosing what they do as though you held the pen. Call it weak and the story slips its teller, and it is the enemy who decides how your own people move.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The favored side chooses the bound side's declared Acts.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Disoriented*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Disoriented* breaks out on Logic.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Mythcasting bends the world toward the tale that is told well enough.\u003c/p>\u003cul class=\"lst\">\u003cli>Speak a small thing into being true, a rumor, a reputation, a remembered face.\u003c/li>\u003cli>Tell a tale so well it takes on a life, a guide, a guard, a distraction.\u003c/li>\u003cli>Read the story already woven through a place and find where it was rewritten.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Bogle","lead":"Lineage of Sable","teaser":"The Bogle are small, blue-skinned folk with more personality than people twice their size.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Bogle","linkLabel":"The Bogle","html":"\u003cp>The Bogle are small, blue-skinned folk with more personality than people twice their size. Their songs land off-key to outside ears, but they sing with so much open joy that even a sour warlord catches himself humming along. They are born storytellers, living their whole lives out loud in song, laughter, and shared memory.\u003c/p>\u003cp>Home is Sable, a softly glowing realm of violet trees, ashen soil, and houses hollowed out of stone. The wind sings through the branches in eerie harmony, and the rain comes down gentle and often. Every night the Bogle gather to eat, sing, and spin the tales that will outlive them.\u003c/p>\u003cp>They live simply and vividly. Small as they are, they are hard to overlook, mostly because their stories have a way o
