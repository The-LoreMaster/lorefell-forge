<script>

const DATA = {"rings":[["Amaranthia","Pandemonium","Brimsever","The Scere","Valoria","Mortavia"],["Mireleor","Vyrathis","Shadakar","Sellenia","Karn","Garyx","Therion","Sable","Crixalis"],["Mireth","Shervinaw","Burhallow","Felidae","Wildermire","Vulkaris","Thaloryn","Ursathar","Natbakka"],["Scitnix","Avemriol","Sylvanoth","Verdantia","Eldarwyn","Wylv","Elysara","Kwuhara","Neriad","Akkoroka","Sporion","Oroniel"]],"worlds":{"Akkoroka":{"name":"Akkoroka","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Akkoroka","lineage":"The Flayed","brand":"Saporset","art":"Saporstilling","glance":[["Travel","sigil lifts"],["Monsters","Splayed, Glaspikes, and Voremasons"],["What they fear","mutation, and the memory loss that comes with it"]],"saying":{"text":"Every flaw is a question of measurement. Hold still. We will correct you.","attr":"a Flayed maxim"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Akkoroka is a world built like a proof. Geometric towers rise in cold exactitude over alchemical vaults, harmonic geometric resonance hums through the air at frequencies that set the teeth on edge, and everything is arranged according to a sacred order of angle and ratio. The Flayed pursue perfection here through chemistry and shape, and the pursuit has a way of leaving its subjects altered, masked, and not entirely sure what they used to be.\u003c/p>","teaser":"Akkoroka is a world built like a proof.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Akkoroka","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Saporset","html":"\u003cp>Saporset is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Akkoroka, the working called Saporstilling. It exists as alchemical vapors and geometric potion sigils, a magic of transformation worked through chemistry, resonance, and exact form. Its tone is clinical and disturbing. Its cost is the body and the senses, for Saporstilling brings bodily mutation and sensory distortion, reshaping its wielders by degrees until the line between the chemist and the experiment blurs.\u003c/p>","teaser":"Saporset is the Brand of Akkoroka, the working called Saporstilling.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Akkoroka","key":"brand","tag":"Brand of Magic","lead":"Brand of Akkoroka · the art of Saporstilling","rune":"ᚹ"},{"title":"The Flayed","html":"\u003cp>The Flayed are a clinical people, organized into alchemical circles that treat flesh, mind, and world as materials to be measured and improved. They wear masked robes and crystal implants, and they regard the unaltered body as a rough draft. Beneath their precise, unsettling calm runs a real dread, the mutation and memory loss that their own art inflicts, the slow forgetting of who one was before the corrections began.\u003c/p>","teaser":"The Flayed are a clinical people, organized into alchemical circles that treat flesh, mind, and world as materials to be measured and improved.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Akkoroka","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"lb:The Alkagoo","tag":"Lorebound","rune":"ᛈ","title":"The Alkagoo","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Alkagoo","linkLabel":"The Alkagoo","teaser":"The Alkagoo is a sentient blob of iridescent ooze from the rain-veiled world of Akkoroka, home of the Flayed.","html":"\u003cp>The Alkagoo is a sentient blob of iridescent ooze from the rain-veiled world of Akkoroka, home of the Flayed. It hangs in the air like a slow-pulsing sphere, magic in about its rawest form, and it is always hungry for more.\u003c/p>\u003cp>Drift it beside a Fell and it catches spells the instant they are cast, friend or foe, and corks them as potions in your inventory. Abilities it pockets the same way, pressed flat into tablets. It would rather not be ridden. It wraps its partner like a living exosuit instead to quicken every step.\u003c/p>\u003cp>Half spellbook, half satchel. A fine match for anyone willing to fight a little strangely.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Distillation\u003c/strong>. Distills a spent spell or ability into a potion or tablet to use later.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Akkoroka builds by formula. Geometric towers and alchemical vaults are raised to exact proportion, their halls humming with harmonic resonance, their layouts following a sacred geometry no one is permitted to disturb. Travel runs on sigil lifts that move through the towers along precise inscribed paths.\u003c/p>","teaser":"Akkoroka builds by formula.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Akkoroka","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Akkoroka is the worship of sacred geometry, the conviction that the world has a correct shape and that approaching it is the highest calling. The alchemical circles serve as its priesthood, and to them improvement is devotion, even when the improving leaves its subjects barely recognizable.\u003c/p>","teaser":"Faith in Akkoroka is the worship of sacred geometry, the conviction that the world has a correct shape and that approaching it is the highest calling.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Akkoroka","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Akkoroka","html":"\u003cp>The Flayed take strange fungi and preserved flesh, food as clinical as everything else they touch, and they fill their towers with harmonic geometric resonance. They dress in masked robes and crystal implants, and they travel by sigil lift through the exact geometry of their cities. Nothing here is left rough, including the people.\u003c/p>","teaser":"The Flayed take strange fungi and preserved flesh, food as clinical as everything else they touch, and they fill their towers with harmonic geometric resonance.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Akkoroka","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Amaranthia":{"name":"Amaranthia","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Amaranthia","lineage":"The Rysen","brand":"Luminarch","art":"Luminate","glance":[["Travel","light rails"],["Monsters","radiant beasts and halo spirits"],["What they fear","darkness, and corruption reaching the light"]],"saying":{"text":"We do not fear the dark because it is empty. We fear it because it remembers being light.","attr":"a Rysen hymn"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Amaranthia is a world that never fully sets. Its cities of luminous marble hold the glow of a perpetual dawn, and the air carries the warm hum of choir and bell. To stand in its great plazas is to feel watched over, bathed in a light that feels less like sun and more like memory made visible. The Rysen call it a blessing. They are also very careful never to let it go out.\u003c/p>","teaser":"Amaranthia is a world that never fully sets.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Amaranthia","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Luminarch","html":"\u003cp>Luminarch is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Amaranthia, the working the world calls Luminate. It exists as radiant ribbons, glowing halos, and lights that carry memory inside them, so that a single conjured glow can hold the warmth of a moment long past. Its tone is nostalgic and hopeful, a magic of remembrance as much as radiance. The cost is paid in that same currency. Those who reach too deep into Luminate find their memories thinning, leaking out into the light they shape, until they can no longer say which warm moments were truly theirs.\u003c/p>","teaser":"Luminarch is the Brand of Amaranthia, the working the world calls Luminate.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Amaranthia","key":"brand","tag":"Brand of Magic","lead":"Brand of Amaranthia · the art of Luminate","rune":"ᚹ"},{"title":"The Rysen","html":"\u003cp>The Rysen are a radiant people, gathered into hierarchical priesthoods where station is measured in nearness to the light. They are warm, ceremonious, and deeply ordered, finding comfort in ritual and rank where others might find constraint. To them the light is not metaphor. It is presence, divinity, and the thing that holds the dark at bay.\u003c/p>","teaser":"The Rysen are a radiant people, gathered into hierarchical priesthoods where station is measured in nearness to the light.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Amaranthia","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"Architecture and Cities","html":"\u003cp>Amaranthia builds in luminous marble, raising temple-cities that glow from within and bend the perpetual dawn along their colonnades. Light rails thread between districts and spires, carrying travelers on beams of steady radiance high above the streets.\u003c/p>","teaser":"Amaranthia builds in luminous marble, raising temple-cities that glow from within and bend the perpetual dawn along their colonnades.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Amaranthia","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Worship in Amaranthia centers on solar divinity, tended by the hierarchical priesthoods that order Rysen life. The light is god and ancestor at once, and devotion is measured in service to it.\u003c/p>","teaser":"Worship in Amaranthia centers on solar divinity, tended by the hierarchical priesthoods that order Rysen life.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Amaranthia","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Amaranthia","html":"\u003cp>The Rysen favor sweet fruits and radiant pastries, food made bright and shared at long ceremonial tables. Their music runs to choir orchestras and crystal bells that ring through the marble halls, and they dress in white-gold robes that catch and hold the dawn. They move through their world on light rails, gliding the radiant lines that link city to city.\u003c/p>","teaser":"The Rysen favor sweet fruits and radiant pastries, food made bright and shared at long ceremonial tables.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Amaranthia","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Avemriol":{"name":"Avemriol","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Avemriol","lineage":"The Strixle","brand":"Thyricon","art":"Skyrending","glance":[["Travel","skyships and gliders"],["Monsters","sky serpents and winged predators"],["What they fear","falling, and the storms"]],"saying":{"text":"We do not fear the storm. We fear the moment after, when the wind decides it is finished holding you.","attr":"a Strixle saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Avemriol is a world of the open sky. Floating spires and sky monasteries hang among the clouds, wind flutes and aerial chorales ride the gusts, and the Strixle live their whole lives aloft, with nothing beneath them but more sky and the long fall. Storms are the great power and the great terror here, and everything the Strixle build is shaped by the wind that could just as easily carry it away.\u003c/p>","teaser":"Avemriol is a world of the open sky.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Avemriol","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Thyricon","html":"\u003cp>Thyricon is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Avemriol, the working called Skyrending. It exists as stormglass cuts, aerial arcs, and cloud-tearing sigils, a violent magic of wind and storm wielded like a blade across the sky. Its tone is exhilarating and dangerous. Its cost is balance itself, for Skyrending can rob the wielder of bodily stability in midair, and in a world with no floor, losing one's footing is rarely a small mistake.\u003c/p>","teaser":"Thyricon is the Brand of Avemriol, the working called Skyrending.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Avemriol","key":"brand","tag":"Brand of Magic","lead":"Brand of Avemriol · the art of Skyrending","rune":"ᚹ"},{"title":"The Strixle","html":"\u003cp>The Strixle are an aerial people of noble houses, proud and sharp-eyed, at home in the heights where others would only feel the drop. They are exhilarated by the open air and disciplined by its dangers, treating mastery of wind and wing as the mark of worth. Beneath the bravado runs the one fear every Strixle carries, the moment the air stops holding them.\u003c/p>","teaser":"The Strixle are an aerial people of noble houses, proud and sharp-eyed, at home in the heights where others would only feel the drop.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Avemriol","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"lb:The Slipfang","tag":"Lorebound","rune":"ᛈ","title":"The Slipfang","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Slipfang","linkLabel":"The Slipfang","teaser":"Slipfangs are sleek emerald serpents born in the aether currents of Avemriol.","html":"\u003cp>Slipfangs are sleek emerald serpents born in the aether currents of Avemriol. Their iridescent scales catch the wind like sunlight through water, and once one is moving it is very nearly impossible to track. Raised among sky-hunting predators and floating isles, a Slipfang thrives on chaos. Appear, strike, gone.\u003c/p>\u003cp>Its bond to a Fell comes on quick and fierce. Every dodge it grants folds into the next, until its partner becomes genuinely hard to pin down. Around it, enemy strikes lose their footing and spells scatter wide.\u003c/p>\u003cp>As a \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Transmogrifications/Corsair\" target=\"_blank\" rel=\"noopener\">Corsair\u003c/a> it changes shape entirely. The moment harm comes near, it coils and lunges, carrying its rider clear on glittering scales before the next blow has anywhere to land.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Elude\u003c/strong>. Slips a Fell out of an attack's path.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Avemriol builds where nothing should stand. Floating spires and sky monasteries are anchored to the wind and the clouds, their structures light and sweeping, designed to ride the gusts rather than resist them. Travel runs on skyships and gliders, and a Strixle measures distance in updrafts and storm fronts rather than roads.\u003c/p>","teaser":"Avemriol builds where nothing should stand.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Avemriol","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Avemriol is storm reverence, the worship of the winds and tempests that rule the sky. The aerial houses honor the storm as both giver and taker, the force that lifts them and the force that could end them, and devotion here is a matter of respecting a power far larger than any house.\u003c/p>","teaser":"Faith in Avemriol is storm reverence, the worship of the winds and tempests that rule the sky.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Avemriol","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Avemriol","html":"\u003cp>The Strixle take cloudfruit and bird meats, food of the high places, and they fill the air with wind flutes and aerial chorales. They dress in feathered cloaks and flight harnesses, ready to ride the wind at any moment, and they travel by skyship and glider. Their whole way of life is balanced on the breath of the sky.\u003c/p>","teaser":"The Strixle take cloudfruit and bird meats, food of the high places, and they fill the air with wind flutes and aerial chorales.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Avemriol","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Brimsever":{"name":"Brimsever","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","lineage":"The Harrowed","brand":"Grimscour","art":"Grimcarving","glance":[["Travel","magma crawlers"],["Monsters","Ashgnarls and ember horrors"],["What they fear","weakness, and extinction"]],"saying":{"text":"A scar is a question the fire asked, and you survived answering it.","attr":"a Harrowed saying"},"soon":"\u003cp>This world carries a recorded hint: Grimcarving spreading emotional corruption, and a rumor that its flames are touched by Discord. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Brimsever is a world of ash fortresses and volcanic trenches, where the ground runs hot and the only law anyone fully respects is strength. War drums and furnace chants echo off the trench walls, and the people carry their history on their skin in burns and brands. Survival here is a contest that never ends, and weakness is treated not as misfortune but as the beginning of extinction.\u003c/p>","teaser":"Brimsever is a world of ash fortresses and volcanic trenches, where the ground runs hot and the only law anyone fully respects is strength.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Grimscour","html":"\u003cp>Grimscour is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Brimsever, the working called Grimcarving. It exists as burning carvings, molten scars, and ash sigils, a magic worked by searing power into one's own flesh and the world's stone. Its tone is aggressive and fanatical. Its cost is severe and seductive at once, for Grimcarving scars the soul as well as the body and breeds an addiction to pain, and the deeper truth the Harrowed rarely admit is that the corruption it spreads runs through emotion itself.\u003c/p>","teaser":"Grimscour is the Brand of Brimsever, the working called Grimcarving.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","key":"brand","tag":"Brand of Magic","lead":"Brand of Brimsever · the art of Grimcarving","rune":"ᚹ"},{"title":"The Harrowed","html":"\u003cp>The Harrowed are a scarred, fanatical people, organized into military forge castes and bound by a creed of strength through fire. They wear their burns as marks of honor, and they meet hardship by hardening. Outsiders read them as half-mad, and the Harrowed would not entirely argue, only insist that the world made them this way and that softness would already have killed them.\u003c/p>","teaser":"The Harrowed are a scarred, fanatical people, organized into military forge castes and bound by a creed of strength through fire.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"The Brim","html":"\u003cp>Brimsever is also called the Brim, a name that belongs to its oldest wound rather than its people. The realm was a battlefield in the war against Malvaro, and the fire that tore through it then still scars the deep trenches, primordial and slow to die. It was into the Brim that Lantern once cast the Hallowed who would later return as Magnus Bane, and Magnus came back out of that ruin as one of the Harrowed, broken and stripped of the man he had been.\u003c/p>","teaser":"Brimsever is also called the Brim, a name that belongs to its oldest wound rather than its people.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Architecture and Cities","html":"\u003cp>Brimsever builds to endure heat and siege. Ash fortresses squat over volcanic trenches, their walls fused from slag and bone, and the settlements burrow toward the warmth and the defensible dark. Travel runs on magma crawlers, armored things built to cross ground that would kill anything on foot.\u003c/p>","teaser":"Brimsever builds to endure heat and siege.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Brimsever is fire purification, the belief that flame burns away weakness and leaves only what deserves to survive. The forge castes treat strength as sacred and scars as scripture, and the gravest sin is to flinch from the fire that would temper you.\u003c/p>","teaser":"Faith in Brimsever is fire purification, the belief that flame burns away weakness and leaves only what deserves to survive.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"Life in Brimsever","html":"\u003cp>The Harrowed take charred meats and ashroot stew, hard food for a hard world, and they fill their fortresses with war drums and furnace chants. They wear scarred armor and ashcloth, and they cross the trenches on magma crawlers. Everything here is built to last through heat and violence, including the people.\u003c/p>","teaser":"The Harrowed take charred meats and ashroot stew, hard food for a hard world, and they fill their fortresses with war drums and furnace chants.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","key":"sec:3","tag":"Lore","rune":"ᛒ"}]},"Burhallow":{"name":"Burhallow","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","lineage":"The Harfolk","brand":"Echochurn","art":"Luckchurning","glance":[["Travel","the Thousand Tunnels, caravan roads, and bonded Drakelith flight"],["Monsters","Echohollows, Lucksnatchers, Storystalkers, and Fateweavers"],["What they fear","a future with only one outcome left"]],"saying":{"text":"Luck is not what lands in your lap. It is what you plant, and who you plant it for.","attr":"a Harfolk hearth-saying"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Burhallow is a cozy world with a long shadow under it. The Harfolk live across rolling green hills and sprawling underground warren-cities, bound together less by walls or borders than by stories, shared meals, and the steady belief that every life helps shape what the world becomes. Through all of it runs the Echochurn, a resonance that carries luck and possibility from one end of Burhallow to the other. Most Harfolk treat it as a natural wonder, a blessing that nudges the world toward brighter days.\u003c/p>\u003cp>Few know where the blessing actually comes from. Deep beneath Mount Maelor rests the Fatewell, and the truth kept there is heavier than any festival song lets on. Lately the wonder has begun to misbehave. Impossible coincidences pile up, roads appear where no road was, and whole communities wake from the same vision of a day that has not happened yet. Beneath the cheer, the Harfolk can feel something tightening around their future, and not everyone wants it loosened.\u003c/p>","teaser":"Burhallow is a cozy world with a long shadow under it.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Luckchurning","html":"\u003cp>Luckchurning is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Burhallow, the resonance art the Harfolk draw from the Echochurn. It is a craft of probability and possibility, and it works by influence rather than force. A Luckchurner seldom conjures a miracle outright. Instead they coax an unlikely outcome into being, steer a fortunate coincidence, and lift one favorable possibility to the surface from among the many surrounding every choice. They work through charms, rituals, stories, songs, and carved tokens, and many Harfolk use small forms of it without ever naming it. In skilled hands it is anything but harmless. Whole battles and histories have turned on a single fortunate moment, guided by someone who knew how to ask.\u003c/p>","teaser":"Luckchurning is the Brand of Burhallow, the resonance art the Harfolk draw from the Echochurn.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"brand","tag":"Brand of Magic","lead":"Brand of Burhallow · the art of Luckchurning","rune":"ᚹ"},{"title":"The Harfolk","html":"\u003cp>The Harfolk are energetic, fur-covered folk with rabbit-like features, long listening ears, and a pace few can match. They are curious, hospitable, and famous for finding joy in the worst circumstances, and they are tougher than outsiders ever expect. A people raised among shifting fate currents and unmapped tunnels learns to adapt fast, improvise faster, and spot opportunity where others see only trouble. They build as explorers, traders, storytellers, farmers, and burrow-makers, and the playful grin tends to hide a sharp mind and a stubborn loyalty to hearth and home.\u003c/p>\u003cp>Luck holds a special place in Harfolk life. Outsiders call them simply fortunate, but most Harfolk hold that luck is something you nurture through kindness, courage, and generosity rather than something that falls from the sky. Their deepest disagreements are not about land or coin but about fate itself. Some believe the future should stay entirely free and unpredictable. Others argue that the most dangerous possibilities should be guided, or restrained, for everyone's good. As the disturbances around the Fatewell grow, that argument grows with them.\u003c/p>","teaser":"The Harfolk are energetic, fur-covered folk with rabbit-like features, long listening ears, and a pace few can match.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"lb:The Drakelith","tag":"Lorebound","rune":"ᛈ","title":"The Drakelith","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Drakelith","linkLabel":"The Drakelith","teaser":"The Drakelith is a celestial dragon from Burhallow, the asteroid-born home of the Harfolk, a legend stitched out of gold, flame, and fate.","html":"\u003cp>The Drakelith is a celestial dragon from Burhallow, the asteroid-born home of the Harfolk, a legend stitched out of gold, flame, and fate. Diamonds sit embedded in its scales, and its glittering eyes are said to look clean across timelines and lean on fortune itself. Hunters covet the gem-lined hide. Few last long enough to learn there is no greed in the thing, only a gentle seer.\u003c/p>\u003cp>A pale blue wyrm with stars for eyes, it ties itself to a Fell through the currents of luck, tipping a hard moment their way. Turn aside a failure, steer a clean strike, the Drakelith's hand rests quietly on every roll either way.\u003c/p>\u003cp>The greatest of them, Osan'maelor, grew for sixteen hundred years and learned to touch the present itself, not only the threads of what was and what might be. He lies buried in the mountain that now carries his name, and the cult drawn to his still-bright eyes is still climbing toward it.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Boon\u003c/strong>. Turns any roll a Fell makes into a stroke of luck.\u003c/p>\u003c/div>"},{"key":"campaign","tag":"The Fell","rune":"ᛟ","title":"Echoes Below","teaser":"The Echochurn is the oldest sound in Burhallow, the buried beat that carries luck from one end of the Harfolk warrens to the other, and lately it has begun to skip.","html":"\u003cp>The Echochurn is the oldest sound in Burhallow, the buried beat that carries luck from one end of the Harfolk warrens to the other, and lately it has begun to skip. When it skips it reaches, and what it reaches for is the Fell. Four strangers wake in an abandoned root cellar with the dirt humming wrong around them and no memory of how they came to be there.\u003c/p>\u003cp>What pulled them under is the same thing fraying the world above. The beat is breaking, something beneath the roots is stirring to take its place, and the Harfolk who find the Fell are far from certain these strangers are an answer rather than one more symptom.\u003c/p>\u003cp>\u003ca class=\"watch-link\" href=\"https://www.youtube.com/live/Ku0zwvExxRM\" target=\"_blank\" rel=\"noopener\">&#9654;&nbsp; Watch Echoes Below on YouTube\u003c/a>\u003c/p>","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Histories/Echoes+Below+Burhallow/Echoes+Below+Burhallow","linkLabel":"Echoes Below Burhallow"},{"title":"The Echochurn and the Fatewell","html":"\u003cp>To most of Burhallow the Echochurn is the source of its good fortune. In truth it is only the vessel that carries it. Beneath Mount Maelor lies the Fatewell, a living reservoir of possibility that holds every choice the world ever made, every path it turned away from, and every future still waiting to happen. The Echochurn does not create fate. It distributes it, echoing the Fatewell's currents back out across the world, and a Luckchurner who reaches into the flow is touching the Fatewell without ever knowing its name. For generations that truth stayed buried. The disturbances spreading through Burhallow now are the first sign, to those who can read it, that the buried thing is stirring.\u003c/p>","teaser":"To most of Burhallow the Echochurn is the source of its good fortune.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"The Drakeliths","html":"\u003cp>The Drakeliths are celestial dragons native to Burhallow, said to have fallen from the heavens as living stars before rising from their craters as gem-scaled wyrms. Diamonds and resonance crystals grow between their light blue scales, and their eyes hold shifting points of starlight that many believe look out across possible futures. They are gentle wanderers rather than hoarders or tyrants, drawn to moments of choice and crossroads, and a sighting is treated across Burhallow as a blessing or an omen of change. Bonded to a companion, a Drakelith becomes a fierce protector and, for a fortunate few, a mount that crosses the hills by air. That same reverence has made them prey. Their eyes are among the most valuable magical components in the world, and despite every law against it, poaching rings still hunt them through the hills.\u003c/p>","teaser":"The Drakeliths are celestial dragons native to Burhallow, said to have fallen from the heavens as living stars before rising from their craters as gem-scaled wyrms.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Osan'maelor and the Eye of the Present","html":"\u003cp>The greatest of the Drakeliths was Osan'maelor, a blue dragon who grew for sixteen hundred years. Most of his kind can only pull at the threads of past and future for those they choose to favor, but Maelor alone could touch the present, a gift the Harfolk name the Eye of the Present. He died in the high country, and the mountain that holds his grave carries his name still, with Maelor's Reach and the pilgrim road climbing toward it. His buried eyes never went dark. They still leak the quiet bliss of the power he laid down, and over the years a cult of Osan'maelor gathered around them, carving their devotions into the rock where he fell.\u003c/p>\u003cp>There is a darker thread the Storykeepers seldom follow aloud. A Drakelith reads the present through its eyes and the tip of its tongue, which also carries its sense of smell, and there are those who have cut the tongues from living drakeliths to chase Maelor's gift for themselves. A drakelith left senseless that way does not simply suffer. It becomes something else, and the worst of those stories end with whispering shapes in the deep mountain abysses. How that change runs its course is a thing few will claim to know for certain.\u003c/p>","teaser":"The greatest of the Drakeliths was Osan'maelor, a blue dragon who grew for sixteen hundred years.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"The Thousand Tunnels","html":"\u003cp>The Thousand Tunnels are the oldest and strangest landmark in Burhallow, an immense underground network of roads, chambers, and shifting passages that reaches farther beneath the world than anyone has mapped. No settlement claims to have built them and no culture remembers their beginning. The Harfolk treat the shallow tunnels as ordinary roads and the deep ones as something closer to weather, useful, unavoidable, and never entirely safe. Down in those depths the rules thin out. Dead ends reopen years later, routes connect settlements that should be weeks apart, and the oldest stories insist that some passages lead not merely somewhere else but to when. Every traveler knows the rule before they know their letters: never enter an unknown tunnel without a story to carry with you.\u003c/p>","teaser":"The Thousand Tunnels are the oldest and strangest landmark in Burhallow, an immense underground network of roads, chambers, and shifting passages that reaches…","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"Cities and Sanctuaries","html":"\u003cp>Burhallow's settlements run from sunlit hillsides down into the deep dark. Thimblehill is the warren outsiders picture when they imagine the Harfolk at their brightest, a frontier village of grass-roofed burrows famous for its luck festival, its fiercely contested pie markets, and its role as the main recruiting ground for Fellwatch. Fellwatch Tower itself is the wardens' stronghold, an ancient watchtower grown over generations into a beacon, a training ground, and the hub from which protectors are sent across the realm. Burrowmarket is the great underground trade city, a colossal cavern metropolis at the crossroads of the tunnel highways where fortunes and rumors change hands by the thousand each day. Luckhollow is the festival town where almost nothing is bought outright and nearly everything is wagered, from meals and labor to apprenticeships and marriages. Maelor's Reach clings to the lower slopes of Mount Maelor as the last safe haven for pilgrims and scholars climbing toward the mountain's mysteries. Far below them all lies the Fatewell, the sacred nexus that few citizens know exists and fewer still have seen.\u003c/p>","teaser":"Burhallow's settlements run from sunlit hillsides down into the deep dark.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"sec:4","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Burhallow is woven from luck and possibility. The Harfolk hold that fortune is nurtured rather than granted, and they honor it through festivals, games, and the telling of stories. Their Storykeepers are revered as far more than historians, because here a story and a future are nearly the same thing, and so they record not only the past but the choices, prophecies, and fate anomalies that decide what the world may yet become. The Drakeliths are treated as living blessings. The Harfolk's gravest fear is not that luck will be misused but that it will be controlled, because they understand that whoever can command possibility can command freedom itself.\u003c/p>","teaser":"Faith in Burhallow is woven from luck and possibility.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"sec:5","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Disturbances\u003c/div>\u003cp>Coincidence is curdling into something deliberate. Roads appear where none existed, communities share visions of unlived days, and the Echochurn runs unsteady. Those who understand it know the trouble runs all the way down to the Fatewell.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Silentchoir\u003c/div>\u003cp>A hidden order holds that suffering exists only because possibility exists, and so they mean to end possibility. They work to seize the Fatewell and collapse the future into a single inevitable outcome, safe and certain and empty. The wardens of Fellwatch stand against them, guarding not a kingdom but the chance that tomorrow can still become something new.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Poaching Trade\u003c/div>\u003cp>Drakelith eyes remain the most valuable contraband in Burhallow, and black-market rings hunt the gentle dragons across the hills no matter how many laws forbid it. The Drakelith Conservancy fights a losing arithmetic against the prices on offer.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Hollow Silence\u003c/div>\u003cp>In at least one corner of Burhallow the Silentchoir's work did more than still the future. It hollowed the people themselves, draining feeling, memory, and name until a warren could no longer remember its own. How far that silence reached, and whether it can spread again, is a wound a few Fellwatch Wardens carry and almost none will speak of aloud.\u003c/p>\u003c/div>","teaser":"The Disturbances, The Silentchoir, The Poaching Trade, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Crixalis":{"name":"Crixalis","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Crixalis","lineage":"The Trinumite","brand":"Chrysalith","art":"Hivestalking","glance":[["Travel","tunnel crawlers and wing gliders"],["Monsters","hive predators and Scalemire Hollows"],["What they fear","isolation from the hive"]],"saying":{"text":"Alone, you are a question the hive does not bother to answer.","attr":"a Trinumite saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Crixalis is a world of hives. Hive spires and glass nests rise over cocoon tunnels that wind through the dark, clicking percussion and hive resonance pulse through every chamber, and the Trinumite live their lives as part of broods far larger than any individual. Identity here is a shared thing, held in the collective memory of the hive, and the worst fate a Trinumite can imagine is to be cut off from it.\u003c/p>","teaser":"Crixalis is a world of hives.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Crixalis","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Chrysalith","html":"\u003cp>Chrysalith is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Crixalis, the working called Hivestalking. It exists as insectoid crystal growths and hive resonance webs, a predatory and evolving magic that draws on the hive's shared instinct and the crystal that threads through its nests. Its tone is predatory and ever-changing. Its cost is the self, for Hivestalking risks identity assimilation into hive instinct, the wielder's own will dissolving into the brood's hunger.\u003c/p>","teaser":"Chrysalith is the Brand of Crixalis, the working called Hivestalking.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Crixalis","key":"brand","tag":"Brand of Magic","lead":"Brand of Crixalis · the art of Hivestalking","rune":"ᚹ"},{"title":"The Trinumite","html":"\u003cp>The Trinumite are an insectoid people of brood hierarchies, ordered by caste and bound by a collective hive memory that carries knowledge and self across generations. They are industrious, evolving, and unnervingly unified, their sense of individual self thinner than land-dwellers find comfortable. To be Trinumite is to belong, and to be severed from the hive is to lose not just company but a piece of one's own mind.\u003c/p>","teaser":"The Trinumite are an insectoid people of brood hierarchies, ordered by caste and bound by a collective hive memory that carries knowledge and self across generations.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Crixalis","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"lb:The Xenophis","tag":"Lorebound","rune":"ᛈ","title":"The Xenophis","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Xenophis","linkLabel":"The Xenophis","teaser":"The Xenophis is a sleek obsidian mantis from the scorched sands and hidden hives of Crixalis.","html":"\u003cp>The Xenophis is a sleek obsidian mantis from the scorched sands and hidden hives of Crixalis. Small and lethal, its carapace shines like polished armor and its scythe-like forelimbs cut clean. Raised among the stone spires of the Trinumite colonies, it lives by stealth, speed, and economy of effort.\u003c/p>\u003cp>It does not overwhelm anything. It disappears. Each time its Fell takes a hit, the partner thins into a shimmer of shadow and slips past sight and sense alike. As the Xenophis matures, its own strikes start working the same trick, cloaking its master again with every clean blow.\u003c/p>\u003cp>In \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Transmogrifications/Corsair\" target=\"_blank\" rel=\"noopener\">Corsair\u003c/a> form it becomes a smear of motion and shade. Every time its Fell vanishes, it sets them down somewhere else entirely. Trackers usually find nothing but dust where the target was standing.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Umbra\u003c/strong>. Wraps a wounded Fell in shadow, beyond an enemy's sight.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Crixalis builds as a colony builds. Hive spires, cocoon tunnels, and glass nests are grown and extended by the brood, vast organic structures that house thousands as a single body. Travel runs on tunnel crawlers through the deep passages and wing gliders across the open air between spires.\u003c/p>","teaser":"Crixalis builds as a colony builds.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Crixalis","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Crixalis is reverence for the collective hive memory, the shared mind that preserves the brood across death and generation. The Trinumite honor belonging itself as sacred, and they regard the preservation of the hive's memory as the truest immortality, the individual fading while the whole remembers.\u003c/p>","teaser":"Faith in Crixalis is reverence for the collective hive memory, the shared mind that preserves the brood across death and generation.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Crixalis","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Crixalis","html":"\u003cp>The Trinumite take nectar broth and insect protein, food produced by the brood for the brood, and they fill their nests with clicking percussion and hive resonance. They wear chitin plating and silk wraps, and they travel by tunnel crawler and wing glider. Every part of life here serves the hive, which is the only way the Trinumite know how to live.\u003c/p>","teaser":"The Trinumite take nectar broth and insect protein, food produced by the brood for the brood, and they fill their nests with clicking percussion and hive resonance.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Crixalis","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"The Dunes and Their Hunters","html":"\u003cp>The open sand belongs to the Ixoar, great flying insects the natives break to the saddle and lend to travelers crossing the dunes. They carry a rider well enough over short hops, though they tire under real weight, and a long haul still comes down to walking. The dunes hold worse than heat. The Sand Stalkers, called raxoar a raan in the native tongue, are mimic-predators that take the shape of harmless creatures, the Ixoar among them, and hold the disguise until the body twists open into pincers and a draining spike beneath the jaw. They are fast, armored, and patient, and a tired caravan rarely sees the change coming. Passage across the sand is the trade of the Pherfarn guild, who hire out guides and contracts for the runs north to south and answer for the cargo when the journey goes wrong.\u003c/p>","teaser":"The open sand belongs to the Ixoar, great flying insects the natives break to the saddle and lend to travelers crossing the dunes.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Crixalis","key":"sec:3","tag":"Lore","rune":"ᛒ"}]},"Eldarwyn":{"name":"Eldarwyn","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Eldarwyn","lineage":"The Sylvakith","brand":"Faelivra","art":"Faeliring","glance":[["Travel","spirit trails"],["Monsters","treants and root horrors"],["What they fear","the death of the forest"]],"saying":{"text":"Stay long enough beneath the old trees and you stop counting the years. That is the gift, and that is the warning.","attr":"a Sylvakith saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Eldarwyn is an ancient forest world, older and stiller than any place has a right to be. Vast primeval woods stretch unbroken between root temples, and ancient chants and spirit songs drift between the trunks like something the forest itself is remembering. The Sylvakith live among these woods as guests as much as inhabitants, and time moves strangely under the old canopy, slow and deep, so that centuries can pass like a long afternoon.\u003c/p>","teaser":"Eldarwyn is an ancient forest world, older and stiller than any place has a right to be.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Eldarwyn","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Faelivra","html":"\u003cp>Faelivra is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Eldarwyn, the working called Faeliring. It exists as verdant glyph rings, spirit antlers, and deep forest resonance, a magic of communion with the living wood and the spirits within it. Its tone is noble and mythic. Its cost is a gradual separation from mortality, for to delve into Faelivra is to grow ever more like the ancient forest itself, lasting longer and feeling the ordinary world recede.\u003c/p>","teaser":"Faelivra is the Brand of Eldarwyn, the working called Faeliring.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Eldarwyn","key":"brand","tag":"Brand of Magic","lead":"Brand of Eldarwyn · the art of Faeliring","rune":"ᚹ"},{"title":"The Sylvakith","html":"\u003cp>The Sylvakith are a people of spirit tribes, noble and mythic in bearing, bound to the ancient forest and the ancestors who became part of it. They are reverent and unhurried, carrying themselves with the calm of those who measure their lives against the age of the trees. The longer a Sylvakith dwells in the deep wood, the further they drift from ordinary mortality, which they regard as both blessing and quiet loss.\u003c/p>","teaser":"The Sylvakith are a people of spirit tribes, noble and mythic in bearing, bound to the ancient forest and the ancestors who became part of it.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Eldarwyn","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"Architecture and Cities","html":"\u003cp>Eldarwyn builds without disturbing. Root temples are grown into and around the ancient trees rather than imposed upon them, and Sylvakith dwellings nestle into the living wood as though they had always been part of it. Travel runs along spirit trails, paths that the forest reveals to those it trusts.\u003c/p>","teaser":"Eldarwyn builds without disturbing.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Eldarwyn","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Eldarwyn is ancestor forest worship, the belief that the dead pass into the wood and the wood remembers them. The spirit tribes commune with these ancestors through chant and rite, and they hold the ancient forest as the living body of all who came before, sacred and watchful.\u003c/p>","teaser":"Faith in Eldarwyn is ancestor forest worship, the belief that the dead pass into the wood and the wood remembers them.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Eldarwyn","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Eldarwyn","html":"\u003cp>The Sylvakith take woodland game and herbal broths, simple fare drawn from the forest's bounty, and they fill the woods with ancient chants and spirit songs. They dress in leafweave cloaks that blend into the green, and they travel the spirit trails through the deep wood. Theirs is a quiet, reverent way of living, paced to the breath of the trees.\u003c/p>","teaser":"The Sylvakith take woodland game and herbal broths, simple fare drawn from the forest's bounty, and they fill the woods with ancient chants and spirit songs.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Eldarwyn","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Elysara":{"name":"Elysara","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Elysara","lineage":"The Hallowed","brand":"Veriscendence","art":"Veriscending","glance":[["Travel","pilgrim caravans"],["Monsters","bloom horrors and radiant predators"],["What they fear","spiritual decay"]],"saying":{"text":"We do not pray for the suffering to end. We pray to be the ones who carry it.","attr":"a Hallowed pilgrim's vow"},"soon":"\u003cp>This world carries a recorded hint: it is tied to the Hallowed, to figures like Magnus, and to events the Riftrunners remember. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Elysara is a world of blooming sanctums and radiant gardens, holy ground where the air is sweet with pollen and the light falls like a blessing. Hymns and pollen flutes drift between the sanctuaries, and the Hallowed move through it as pilgrims, devoted to the sacred bloom that gives their world its grace. It is beautiful and reverent, a place built around compassion and sacrifice, and beneath the radiance runs a quiet fear that even holiness can rot.\u003c/p>","teaser":"Elysara is a world of blooming sanctums and radiant gardens, holy ground where the air is sweet with pollen and the light falls like a blessing.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Elysara","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Veriscendence","html":"\u003cp>Veriscendence is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Elysara, the working called Veriscending. It exists as holy floral sigils, radiant pollen, and blessing circles, a magic of healing, blessing, and sacred growth. Its tone is reverent and compassionate. Its cost is the heart, for Veriscending draws on emotional martyrdom, the wielder pouring their own feeling and strength into others until there is little left for themselves.\u003c/p>","teaser":"Veriscendence is the Brand of Elysara, the working called Veriscending.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Elysara","key":"brand","tag":"Brand of Magic","lead":"Brand of Elysara · the art of Veriscending","rune":"ᚹ"},{"title":"The Hallowed","html":"\u003cp>The Hallowed are a devout people of pilgrim orders, given to compassion, sacrifice, and the long road between sacred places. They are gentle and serious, finding meaning in service and in the carrying of others' burdens. Their faith asks much of them, and they give it willingly, though the giving wears at them, and their gravest dread is spiritual decay, the slow withering of the very devotion that defines them.\u003c/p>","teaser":"The Hallowed are a devout people of pilgrim orders, given to compassion, sacrifice, and the long road between sacred places.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Elysara","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"key":"lb:The Worgar","tag":"Lorebound","rune":"ᛈ","title":"The Worgar","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Worgar","linkLabel":"The Worgar","teaser":"The Worgar is a radiant wolf from the sacred realm of Elysara.","html":"\u003cp>The Worgar is a radiant wolf from the sacred realm of Elysara. Shimmering white fur covers it, and golden, jewel-like bone plating runs the length of its frame. It moves almost without sound, every snarl bright, the grace of it hiding old instinct and a fierce, unembarrassed loyalty.\u003c/p>\u003cp>This one turns pain into purpose. When it snarls, wounds close. When blood spills, it sees what others cannot, shards of the Skyvault caught in the weave of reality itself. A Worgar does not wait to be asked for help. It gathers, restores, and renews, all of it with a quiet kind of precision.\u003c/p>\u003cp>In \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Transmogrifications/Corsair\" target=\"_blank\" rel=\"noopener\">Corsair\u003c/a> form the bond goes solid. Each stride strikes off luminous energy that hardens into shards, and wherever it runs it leaves a trail of golden paw prints across the field.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Reap\u003c/strong>. Reaps a \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Currency/Definitions/Skyvault+Shards\" target=\"_blank\" rel=\"noopener\">Skyvault Shard\u003c/a> from every wound a Fell takes.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Elysara builds its holy places to bloom. Blooming sanctums and radiant gardens form the heart of every settlement, their halls grown through with sacred flowers and lit by gentle radiance. Travel runs on pilgrim caravans that move between the sanctuaries along the well-worn holy roads.\u003c/p>","teaser":"Elysara builds its holy places to bloom.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Elysara","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Elysara is sacred bloom worship, reverence for the holy flowers said to hold and preserve grace, memory, and blessing. The pilgrim orders serve as its devout, and the highest calling is sacrifice in service of others, even unto the spiritual decay that such giving risks.\u003c/p>","teaser":"Faith in Elysara is sacred bloom worship, reverence for the holy flowers said to hold and preserve grace, memory, and blessing.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Elysara","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Elysara","html":"\u003cp>The Hallowed take floral wines and sacred meals, food blessed and shared in ceremony, and they fill their sanctums with hymns and pollen flutes. They dress in flowing floral fabrics, and they travel by pilgrim caravan between the radiant gardens. Theirs is a life of devotion, given freely and at real cost.\u003c/p>","teaser":"The Hallowed take floral wines and sacred meals, food blessed and shared in ceremony, and they fill their sanctums with hymns and pollen flutes.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Elysara","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Felidae":{"name":"Felidae","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Felidae","lineage":"The Grimalkin","brand":"Shynderis","art":"Bladestepping","glance":[["Travel","mirage roads and blinkpaths"],["Monsters","trickster beasts and prismatic cats"],["What they fear","bad luck, and being shut in"]],"saying":{"text":"Win or lose, you walk out smiling. Anything else and the house remembers your face.","attr":"a Grimalkin saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Felidae is a world that never quite holds still. Light bends through it in ribbons of color, splitting off prismatic walls and pooling in the streets, so that a single lantern can throw a dozen shadows and none of them point the same way. It is a realm of palaces and gambling dens, of laughter carried on the night air and luck treated as something you can hear coming. To the people who live here, fortune is not an abstraction. It is weather. It rolls in, it turns, and the wise learn to read the sky.\u003c/p>","teaser":"Felidae is a world that never quite holds still.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Felidae","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Shynderis","html":"\u003cp>Shynderis is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Felidae, a magic of motion and nerve. It exists in the world as flash-step trails and silver cuts, a blur of mirrored movement where a body seems to be in three places before it finishes leaving the first. It is stylish and precise, bound up with confidence and timing, and it answers best to those willing to gamble on their own speed. The cost is in the temperament it breeds. Shynderis rewards boldness so consistently that its practitioners drift toward recklessness, chasing the next impossible step long after caution would have called it a night.\u003c/p>","teaser":"Shynderis is the Brand of Felidae, a magic of motion and nerve.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Felidae","key":"brand","tag":"Brand of Magic","lead":"Brand of Felidae · the art of Bladestepping","rune":"ᚹ"},{"title":"The Grimalkin","html":"\u003cp>The Grimalkin are a sleek, quick-eyed people, easy with a smile and quicker with their hands. They keep loose pleasure courts rather than rigid kingdoms, and standing comes from charm, daring, and the run of one's luck more than from blood or law. They love a wager, a performance, and a clean escape, and they distrust anyone who seems to want nothing at all.\u003c/p>","teaser":"The Grimalkin are a sleek, quick-eyed people, easy with a smile and quicker with their hands.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Felidae","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"Architecture and Cities","html":"\u003cp>Felidae builds for spectacle. Prismatic palaces refract the light into shifting color, and gambling dens form the true heart of most settlements, louder and busier than any temple or hall. Streets fold into mirage roads that are not always where they were yesterday, and the cities glitter most at night, when the lanterns come up and the games begin.\u003c/p>","teaser":"Felidae builds for spectacle.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Felidae","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Worship in Felidae centers on luck and indulgence. Cults form around fortune itself, treating a good run as a blessing and a long cold streak as a warning to heed. Devotion looks less like prayer and more like ritual play, offerings made at the table and oaths sworn on the turn of a card.\u003c/p>","teaser":"Worship in Felidae centers on luck and indulgence.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Felidae","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Felidae","html":"\u003cp>The Grimalkin favor sugared meats and dreamfish, food made to be savored late and shared loud. Their music is jazzy and chaotic, all laughter songs and improvisation, and their fashion runs to flashy layered silks built to catch the prismatic light. They cross their world on mirage roads and blinkpaths, routes that reward a quick foot and a quicker eye and punish anyone who hesitates at the wrong moment.\u003c/p>","teaser":"The Grimalkin favor sugared meats and dreamfish, food made to be savored late and shared loud.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Felidae","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Garyx":{"name":"Garyx","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Garyx","lineage":"The Nyseen","brand":"Guisewyrd","art":"Guiseshifting","glance":[["Travel","lava crawlers and glacier sleds"],["Monsters","frostfire beasts and Paradox Shifters"],["What they fear","elemental imbalance"]],"saying":{"text":"Burn too hot and the ice takes you. Freeze too hard and the fire does. Walk the seam.","attr":"a Nyseen saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Garyx is a world split between fire and ice and at war with itself over which should win. Frigid fortresses stand cracked across volcanic ice ruins, where glaciers grind against magma and steam never stops rising. The Nyseen live along that seam, in clans whose rivalries echo the war of the elements themselves, and they have learned that survival means holding two opposite forces in balance rather than choosing one.\u003c/p>","teaser":"Garyx is a world split between fire and ice and at war with itself over which should win.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Garyx","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Guisewyrd","html":"\u003cp>Guisewyrd is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Garyx, the working called Guiseshifting. It exists as elemental body morphing and dual-color displays of flame and frost, a magic of becoming, of taking the shape and substance the moment demands. Its tone is chaotic and adaptive. Its cost is the body's own coherence, for Guiseshifting risks the instability of physical form, and a careless shifter can lose the shape they started with.\u003c/p>","teaser":"Guisewyrd is the Brand of Garyx, the working called Guiseshifting.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Garyx","key":"brand","tag":"Brand of Magic","lead":"Brand of Garyx · the art of Guiseshifting","rune":"ᚹ"},{"title":"The Nyseen","html":"\u003cp>The Nyseen are a people of duality, their clans built on rivalry and the constant negotiation between heat and cold. They are adaptive, contentious, and proud, treating the balance of opposites as both a way of life and a point of honor. They distrust extremes in anything, having watched what happens to those who let one element rule them.\u003c/p>","teaser":"The Nyseen are a people of duality, their clans built on rivalry and the constant negotiation between heat and cold.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Garyx","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"Architecture and Cities","html":"\u003cp>Garyx builds to survive both fire and frost at once. Split fortresses are raised half against the cold and half against the heat, anchored in volcanic ice ruins where the two elements meet. Travel runs on lava crawlers across the burning ground and glacier sleds across the frozen, each clan favoring the terrain it knows best.\u003c/p>","teaser":"Garyx builds to survive both fire and frost at once.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Garyx","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Garyx is worship of elemental balance, the conviction that fire and ice must be held in equilibrium and that imbalance is the true enemy. The clans honor the seam between the elements as sacred ground, and they regard the loss of balance, in the world or in a person, as the beginning of ruin.\u003c/p>","teaser":"Faith in Garyx is worship of elemental balance, the conviction that fire and ice must be held in equilibrium and that imbalance is the true enemy.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Garyx","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Garyx","html":"\u003cp>The Nyseen take firefish, frostberries, and magma stew, food drawn from both halves of their divided world. Their music is rhythmic chant and elemental percussion, and they dress in layered heat-cold survival gear suited to crossing the seam. They travel by lava crawler and glacier sled, moving between fire and ice as the route demands.\u003c/p>","teaser":"The Nyseen take firefish, frostberries, and magma stew, food drawn from both halves of their divided world.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Garyx","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Karn":{"name":"Karn","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","lineage":"The Marrowkai","brand":"Bloodband","art":"Bloodbinding","glance":[["Travel","beast caravans and the backs of giant wurms"],["Monsters","marrow beasts, ossified horrors, and bone wurms"],["What they fear","weakness, and the corruption working its way into the marrow"]],"saying":{"text":"Kill the mountain, ring the marrow, march its shadow.","attr":"a Hollow Host proverb"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Karn is a realm of crimson skies and thunder-scarred earth, where every horizon is lined with the broken ribs of mountains and the husks of beasts once thought eternal. Valleys lie gouged by the charge of titans. Forests twist upward like bone spires. The wind carries the iron tang of blood, and during the Threnody Season it howls with the voices of battles long past, as though the land refuses to forget its dead.\u003c/p>\u003cp>Here, blood is more than life. It is resonance. Spilled on Karn's soil, it wakes the Chimeholds, and their marrowglass shards toll with terrible harmony. That resonance fuels Bloodbanding, the binding of the slain back into motion, not as shades but as chained warriors and towering beasts of bone and sinew. In Karn, death is never an ending. It is a conscription.\u003c/p>\u003cp>To live in Karn is to hunt the mighty and carve strength from their ruin. The Marrowkai fell colossal predators, wyrm-scaled horrors, and storm-feathered leviathans, then bind them into their Hollow Hosts. The land trembles under the tread of armies half-living and half-dead, their march a dirge of marrow and steel. Karn offers no peace and no respite, only the promise that if you fall, your echo will march on in the song of war.\u003c/p>","teaser":"Karn is a realm of crimson skies and thunder-scarred earth, where every horizon is lined with the broken ribs of mountains and the husks of beasts once thought eternal.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","key":"world","tag":"The Realm","rune":"ᚠ"},{"title":"Bloodband","html":"\u003cp>Bloodband is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Karn, and the Marrowkai do not treat it as sorcery. They treat it as dominion. It is the art of chaining death through resonance, binding marrow and spirit to the toll of the Chimeholds. There are no whispered prayers and no woven light, only the cut, the bleeding, and the command. Every scar is a sigil and every drop of blood a note in an endless dirge.\u003c/p>\u003cp>In the world it shows itself as the fallen rising half-shattered yet unbroken in will. Colossal beasts are felled and driven back to their feet as skeletal juggernauts. Foes slain in defiance march again beneath the banners they once opposed. Its deepest practice is simply called Banding, worked at the height of carnage when the Blood Chimes scream and a Bonecaller can lash the marrow-song of the dead into unbreakable chains. To the Marrowkai this is not desecration but sanctity. Death as inheritance, marrow as scripture, blood as the chain that binds all legacies into one host.\u003c/p>","teaser":"Bloodband is the Brand of Karn, and the Marrowkai do not treat it as sorcery.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","key":"brand","tag":"Brand of Magic","lead":"Brand of Karn · the art of Bloodbinding","rune":"ᚹ"},{"title":"The Marrowkai","html":"\u003cp>The Marrowkai are blood-marked warriors, nomads carved in scar and bone, their flesh etched with the trophies of battle and their souls tethered to the pulse of the Chimeholds. They are not wanderers of chance but hunters of purpose, seeking the mightiest prey the realm can offer. To kill such a beast is triumph. To bind it through Bloodbanding is legacy.\u003c/p>\u003cp>Their rites come from inheritance rather than cruelty. Through ritual consumption they claim the strength and memory of the worthy, believing that flesh is fleeting while marrow carries permanence into the soul. To consume is to honor, and to waste is sacrilege. A warrior's body is not buried. It is devoured, the essence reforged into kin.\u003c/p>\u003cp>Marrowkai warbands, the Hollow Hosts, march beneath banners woven from sinew and bone. Each host is led by a Bonecaller, a seer who reads the resonance of the Chimeholds and guides the hunt. Where the Hosts pass, they leave more than ash. They leave the tread of colossal revenants, behemoths of claw and fang risen again in skeletal fury. To the Marrowkai this is the truest immortality, an unbroken line of warriors and beasts bound forever to the song of war.\u003c/p>","teaser":"The Marrowkai are blood-marked warriors, nomads carved in scar and bone, their flesh etched with the trophies of battle and their souls tethered to the pulse of the…","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","key":"lineage","tag":"Lineage","rune":"ᛖ"},{"title":"The Chimeholds","html":"\u003cp>The Chimeholds rise like broken altars across Karn, monoliths of jagged stone latticed with marrowglass shards and rib-like arcs of ancient bone. When blood touches their soil they wake, humming with a resonance that rattles the marrow of anyone who hears it. The tones are not mournful. They are commands, forging chains between the living and the dead.\u003c/p>\u003cp>To the Marrowkai the Chimeholds are sacred forges where legacy is beaten into shape. Warriors duel to feed their echoes into the marrow-song, and the greatest beasts are brought there to be slain and bound. A dragon felled at a Chimehold does not rot. It rises again as a hollow revenant, its bones lashed to the will of its slayers, and the Hosts call this the ringing of the beast.\u003c/p>\u003cp>Their origin is older than any Marrowkai tale. Some whisper they were carved by gods who bled themselves into stone during the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Astral+Entities/Discord\" target=\"_blank\" rel=\"noopener\">Discord\u003c/a> Wars. Others claim they are scars left by Discord itself, branding Karn as its crucible. Whatever the truth, each chime is both dirge and summons, thinning the veil and amplifying Bloodbanding until whole armies of the dead can be lashed together.\u003c/p>","teaser":"The Chimeholds rise like broken altars across Karn, monoliths of jagged stone latticed with marrowglass shards and rib-like arcs of ancient bone.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Architecture and Cities","html":"\u003cp>Marrowkai settlements are warcamps made sacred more than they are cities. Bone frames chiseled from the carcasses of titans are lashed with blood-hardened hide and draped in banners of sinew and scarlet thread. Most dwellings are temporary, raised on ancient stones and burned when the Host moves on, leaving only ash and marrow behind. To stay still is to invite weakness.\u003c/p>\u003cp>Around the greatest Chimeholds stand more enduring places. Ring-forts carved into cliff faces, their walls studded with marrowglass and bone, serve as sanctuaries where Hollow Hosts gather to duel, feast, and bind their fallen prey. Dros'Thaar, raised around a mountain Chimehold, is ringed by terraces of ribstone where Bonecallers chant into the wind. Such places are less cities than crucibles, where blood becomes memory and memory becomes command.\u003c/p>","teaser":"Marrowkai settlements are warcamps made sacred more than they are cities.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Karn","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>The Marrowkai do not worship gods or stars. Their faith is carved into marrow and carried in blood. They believe the soul is tethered not to heaven or void but to the resonance of what it has slain and what has slain it. When blood feeds the Chimeholds, the tones that rise are the voices of ancestors, bound as echoes of strength and will.\u003c/p>\u003cp>Central to their belief is Banding, the conviction that nothing worthy is ever lost. Through ritual consumption a warrior inherits the marrow of kin and foe alike. Through the Blood Chimes a Bonecaller binds the echoes of beasts and champions so that glory does not fade. To bleed, to scar, and to bind are their prayers. To f
