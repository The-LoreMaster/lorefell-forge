<script>
/* =========================================================================

const DATA = {"rings":[["Amaranthia","Pandemonium","Brimsever","The Scere","Valoria","Mortavia"],["Mireleor","Vyrathis","Shadakar","Sellenia","Karn","Garyx","Therion","Sable","Crixalis"],["Mireth","Shervinaw","Burhallow","Felidae","Wildermire","Vulkaris","Thaloryn","Ursathar","Natbakka"],["Scitnix","Avemriol","Sylvanoth","Verdantia","Eldarwyn","Wylv","Elysara","Kwuhara","Neriad","Akkoroka","Sporion","Oroniel"]],"worlds":{"Akkoroka":{"name":"Akkoroka","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Akkoroka","lineage":"The Flayed","brand":"Saporset","art":"Saporstilling","glance":[["Travel","sigil lifts"],["Monsters","Splayed, Glaspikes, and Voremasons"],["What they fear","mutation, and the memory loss that comes with it"]],"saying":{"text":"Every flaw is a question of measurement. Hold still. We will correct you.","attr":"a Flayed maxim"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Akkoroka is a world built like a proof. Geometric towers rise in cold exactitude over alchemical vaults, harmonic geometric resonance hums through the air at frequencies that set the teeth on edge, and everything is arranged according to a sacred order of angle and ratio. The Flayed pursue perfection here through chemistry and shape, and the pursuit has a way of leaving its subjects altered, masked, and not entirely sure what they used to be.\u003c/p>","teaser":"Akkoroka is a world built like a proof.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Akkoroka","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Saporset","lead":"Brand of Akkoroka · the art of Saporstilling","teaser":"Saporset is the Brand of Akkoroka, the working called Saporstilling.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Saporset","linkLabel":"Saporset","html":"\u003cp>\u003cem>Also called Saporstilling.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Saporset is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Akkoroka, the working called Saporstilling. It exists as alchemical vapors and geometric potion sigils, a magic of transformation worked through chemistry, resonance, and exact form. Its tone is clinical and disturbing. Its cost is the body and the senses, for Saporstilling brings bodily mutation and sensory distortion, reshaping its wielders by degrees until the line between the chemist and the experiment blurs.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Saporset and a clinical vapor settles over the bound. The brand stills what it touches, draining the force from their blows until their attacks land as nothing, inert as spent reagent. Call it weak and your own strikes are the ones rendered harmless.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>Bound creatures deal no damage.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Accursed*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Accursed* breaks out on Sanctum.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Saporstilling is exacting chemistry dressed as magic.\u003c/p>\u003cul class=\"lst\">\u003cli>Brew a draught that heals, alters, or undoes, given the right reagents and time.\u003c/li>\u003cli>Still a reaction gone wrong, a fire, a poison, a corrosion eating through metal.\u003c/li>\u003cli>Read a substance by vapor and sigil, what it is, what it will do, what made it.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Flayed","lead":"Lineage of Akkoroka","teaser":"The Flayed are luminous thinkers, tall and slender, their skin like glassed lavender and their minds always faintly humming.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Flayed","linkLabel":"The Flayed","html":"\u003cp>The Flayed are luminous thinkers, tall and slender, their skin like glassed lavender and their minds always faintly humming. Where hair might be they wear a translucent gelatinous crown, and from it trail delicate tendrils that taste the air and turn feeling into meaning. They do not speak aloud. They share, thought to thought and feeling to feeling, wordless and deep.\u003c/p>\u003cp>They come from Akkoroka, a world wrapped in mist and rain, where algae forests shimmer under soft skies and glowing shells glint across the sand like fallen stars. It is a quiet, creative place, and it shows in them.\u003c/p>\u003cp>Violence is one of the few things that makes a Flayed loud. Struck, the gelatinous crown hardens and sends a surge down its glowing blue veins. The wide dark eyes get mistaken for vacant all the time, which says more about the observer than the Flayed. Behind them sits an ocean of thought.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Flayed\u003c/div>\u003cp>Flayed are serene, expressive, and profoundly thoughtful. They process the world through patterns, sensations, and emotional resonance rather than words alone.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Using your telepathy and tendrils not just to communicate but to genuinely connect.\u003c/li>\u003cli>Highlighting your artistic nature through creative problem solving: drawing messages, sculpting signals, crafting meaning from motion.\u003c/li>\u003cli>Channeling your calm, contemplative personality. Rarely rushing, always perceiving the fuller picture.\u003c/li>\u003cli>Letting silence, scent, or light communicate what words cannot.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Flayed gain +1 to their Bearing skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;Pain has pattern. Joy, too. We map them both.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Flayed of Akkoroka\u003c/div>\u003cp>The Flayed are a clinical people, organized into alchemical circles that treat flesh, mind, and world as materials to be measured and improved. They wear masked robes and crystal implants, and they regard the unaltered body as a rough draft. Beneath their precise, unsettling calm runs a real dread, the mutation and memory loss that their own art inflicts, the slow forgetting of who one was before the corrections began.\u003c/p>"},{"key":"lb:The Alkagoo","tag":"Lorebound","rune":"ᛈ","title":"The Alkagoo","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Alkagoo","linkLabel":"The Alkagoo","teaser":"The Alkagoo is a sentient blob of iridescent ooze from the rain-veiled world of Akkoroka, home of the Flayed.","html":"\u003cp>The Alkagoo is a sentient blob of iridescent ooze from the rain-veiled world of Akkoroka, home of the Flayed. It hangs in the air like a slow-pulsing sphere, magic in about its rawest form, and it is always hungry for more.\u003c/p>\u003cp>Drift it beside a Fell and it catches spells the instant they are cast, friend or foe, and corks them as potions in your inventory. Abilities it pockets the same way, pressed flat into tablets. It would rather not be ridden. It wraps its partner like a living exosuit instead to quicken every step.\u003c/p>\u003cp>Half spellbook, half satchel. A fine match for anyone willing to fight a little strangely.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Distillation\u003c/strong>. Distills a spent spell or ability into a potion or tablet to use later.\u003c/p>\u003c/div>"},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Akkoroka","teaser":"Bullsworth.","html":"\u003cdiv class=\"sub\">Figures\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Canon+Characters/Bullsworth\" target=\"_blank\" rel=\"noopener\">Bullsworth\u003c/a>\u003c/div>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Akkoroka builds by formula. Geometric towers and alchemical vaults are raised to exact proportion, their halls humming with harmonic resonance, their layouts following a sacred geometry no one is permitted to disturb. Travel runs on sigil lifts that move through the towers along precise inscribed paths.\u003c/p>","teaser":"Akkoroka builds by formula.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Akkoroka","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Akkoroka is the worship of sacred geometry, the conviction that the world has a correct shape and that approaching it is the highest calling. The alchemical circles serve as its priesthood, and to them improvement is devotion, even when the improving leaves its subjects barely recognizable.\u003c/p>","teaser":"Faith in Akkoroka is the worship of sacred geometry, the conviction that the world has a correct shape and that approaching it is the highest calling.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Akkoroka","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Akkoroka","html":"\u003cp>The Flayed take strange fungi and preserved flesh, food as clinical as everything else they touch, and they fill their towers with harmonic geometric resonance. They dress in masked robes and crystal implants, and they travel by sigil lift through the exact geometry of their cities. Nothing here is left rough, including the people.\u003c/p>","teaser":"The Flayed take strange fungi and preserved flesh, food as clinical as everything else they touch, and they fill their towers with harmonic geometric resonance.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Akkoroka","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Amaranthia":{"name":"Amaranthia","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Amaranthia","lineage":"The Rysen","brand":"Luminarch","art":"Luminate","glance":[["Travel","light rails"],["Monsters","radiant beasts and halo spirits"],["What they fear","darkness, and corruption reaching the light"]],"saying":{"text":"We do not fear the dark because it is empty. We fear it because it remembers being light.","attr":"a Rysen hymn"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Amaranthia is a world that never fully sets. Its cities of luminous marble hold the glow of a perpetual dawn, and the air carries the warm hum of choir and bell. To stand in its great plazas is to feel watched over, bathed in a light that feels less like sun and more like memory made visible. The Rysen call it a blessing. They are also very careful never to let it go out.\u003c/p>","teaser":"Amaranthia is a world that never fully sets.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Amaranthia","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Luminarch","lead":"Brand of Amaranthia · the art of Luminate","teaser":"Luminarch is the Brand of Amaranthia, the working the world calls Luminate.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Luminarch","linkLabel":"Luminarch","html":"\u003cp>\u003cem>Also called Luminate.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Luminarch is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Amaranthia, the working the world calls Luminate. It exists as radiant ribbons, glowing halos, and lights that carry memory inside them, so that a single conjured glow can hold the warmth of a moment long past. Its tone is nostalgic and hopeful, a magic of remembrance as much as radiance. The cost is paid in that same currency. Those who reach too deep into Luminate find their memories thinning, leaking out into the light they shape, until they can no longer say which warm moments were truly theirs.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Luminarch and remembered light pours over the bound, and their memory of their own power thins with it. Each round their gathered strength leaks away into the glow, charges fading before they can be spent. Call it weak and it is your people who forget the power they were building.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The bound side's Charges are wiped at the start of each round.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Lacerated*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Lacerated* breaks out on Poise.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Luminate is light that remembers.\u003c/p>\u003cul class=\"lst\">\u003cli>Conjure a light that holds a memory inside it for another to see.\u003c/li>\u003cli>Light a place with a warmth that steadies the frightened and the lost.\u003c/li>\u003cli>Read the memories worn into an old room, a kept thing, a place of grief or joy.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Rysen","lead":"Lineage of Amaranthia","teaser":"The Rysen are ageless spirits of radiant knowledge wearing the bodies of mortal children, world to world across the cosmos.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Rysen","linkLabel":"The Rysen","html":"\u003cp>The Rysen are ageless spirits of radiant knowledge wearing the bodies of mortal children, world to world across the cosmos. Each one looks like a luminous youth somewhere between five and twelve. They take a child's shape from whatever realm they visit, but no Rysen is born. They are sent, as vessels of enlightenment meant to guide the people of each world they land in.\u003c/p>\u003cp>They come from Amaranthia, a realm of pure light and flowing knowledge, a world with no shadow in it, where the Rysen spirits dwell in luminous harmony and each one is a single thread in a vast tapestry of understanding.\u003c/p>\u003cp>A Rysen is a walking paradox, childlike in form and carrying centuries of purpose behind the eyes. They move through the world to guide, to question, and to inspire, gentle and serene right up until things get dark, which is exactly when they shine hardest.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Rysen\u003c/div>\u003cp>Rysen are serene, compassionate, and full of quiet wisdom. Their light is not for power but for healing, understanding, and awakening others.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Emphasizing their role as seekers and speakers of truth. Offering ancient insights to shape modern choices.\u003c/li>\u003cli>Portraying their glowing, childlike presence with a balance of playful curiosity and moments of startling clarity.\u003c/li>\u003cli>Reflecting their origin from Amaranthia in their dreams, speech, or reactions to the unknown.\u003c/li>\u003cli>Showing their boundless compassion and selflessness. Always willing to sacrifice, teach, or walk alone if it serves a greater good.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Rysen gain +1 to their Lore skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;I may look small, but my light has seen the rise and fall of stars.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Rysen of Amaranthia\u003c/div>\u003cp>The Rysen are a radiant people, gathered into hierarchical priesthoods where station is measured in nearness to the light. They are warm, ceremonious, and deeply ordered, finding comfort in ritual and rank where others might find constraint. To them the light is not metaphor. It is presence, divinity, and the thing that holds the dark at bay.\u003c/p>"},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Amaranthia","teaser":"Rysn and The Faelir.","html":"\u003cdiv class=\"sub\">Figures\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Canon+Characters/Rysn\" target=\"_blank\" rel=\"noopener\">Rysn\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"sub\">Powers\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/The+Factions/The+Faelir\" target=\"_blank\" rel=\"noopener\">The Faelir\u003c/a>\u003c/div>\u003cp>The Faelir are fae spirits that drift between the realms and never quite belong to any of them.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Amaranthia builds in luminous marble, raising temple-cities that glow from within and bend the perpetual dawn along their colonnades. Light rails thread between districts and spires, carrying travelers on beams of steady radiance high above the streets.\u003c/p>","teaser":"Amaranthia builds in luminous marble, raising temple-cities that glow from within and bend the perpetual dawn along their colonnades.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Amaranthia","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Worship in Amaranthia centers on solar divinity, tended by the hierarchical priesthoods that order Rysen life. The light is god and ancestor at once, and devotion is measured in service to it.\u003c/p>","teaser":"Worship in Amaranthia centers on solar divinity, tended by the hierarchical priesthoods that order Rysen life.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Amaranthia","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Amaranthia","html":"\u003cp>The Rysen favor sweet fruits and radiant pastries, food made bright and shared at long ceremonial tables. Their music runs to choir orchestras and crystal bells that ring through the marble halls, and they dress in white-gold robes that catch and hold the dawn. They move through their world on light rails, gliding the radiant lines that link city to city.\u003c/p>","teaser":"The Rysen favor sweet fruits and radiant pastries, food made bright and shared at long ceremonial tables.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Amaranthia","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Avemriol":{"name":"Avemriol","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Avemriol","lineage":"The Strixle","brand":"Thyricon","art":"Skyrending","glance":[["Travel","skyships and gliders"],["Monsters","sky serpents and winged predators"],["What they fear","falling, and the storms"]],"saying":{"text":"We do not fear the storm. We fear the moment after, when the wind decides it is finished holding you.","attr":"a Strixle saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Avemriol is a world of the open sky. Floating spires and sky monasteries hang among the clouds, wind flutes and aerial chorales ride the gusts, and the Strixle live their whole lives aloft, with nothing beneath them but more sky and the long fall. Storms are the great power and the great terror here, and everything the Strixle build is shaped by the wind that could just as easily carry it away.\u003c/p>","teaser":"Avemriol is a world of the open sky.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Avemriol","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Thyricon","lead":"Brand of Avemriol · the art of Skyrending","teaser":"Thyricon is the Brand of Avemriol, the working called Skyrending.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Thyricon","linkLabel":"Thyricon","html":"\u003cp>\u003cem>Also called Skyrending.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Thyricon is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Avemriol, the working called Skyrending. It exists as stormglass cuts, aerial arcs, and cloud-tearing sigils, a violent magic of wind and storm wielded like a blade across the sky. Its tone is exhilarating and dangerous. Its cost is balance itself, for Skyrending can rob the wielder of bodily stability in midair, and in a world with no floor, losing one's footing is rarely a small mistake.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Thyricon and the storm tears the footing out from under the bound. Knocked from the wind and forever a beat behind, they act last in every exchange, always answering and never leading. Call it weak and your own people are the ones left trailing the storm.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The bound side always resolves last in every \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Combat/Definitions/Spotlight\" target=\"_blank\" rel=\"noopener\">Spotlight\u003c/a>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Impeded*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Impeded* breaks out on Movement.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Skyrending is wind and storm wielded like a blade.\u003c/p>\u003cul class=\"lst\">\u003cli>Ride the wind across a gap, a height, or a storm that would ground anyone else.\u003c/li>\u003cli>Cut a path through cloud, fog, or a gale with a blade of moving air.\u003c/li>\u003cli>Read the sky and the storm, what is coming and how long until it breaks.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Strixle","lead":"Lineage of Avemriol","teaser":"The Strixle are sharp-eyed avian folk, lean and agile and made for the hunt.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Strixle","linkLabel":"The Strixle","html":"\u003cp>The Strixle are sharp-eyed avian folk, lean and agile and made for the hunt. Feathered bodies, piercing stares, and a grace that carries them through sapphire skies without effort. While other peoples raise cities and draw borders, the Strixle hold air and island both as sacred ground and defend them with the fury of a nesting storm.\u003c/p>\u003cp>They come from Avemriol, a realm of floating archipelagos strung above vast oceans full of underwater forests, where drowned trees sway beneath the surface and waterfalls pour off skyborne islands into the deep. The Strixle rule it not with castles but with claim.\u003c/p>\u003cp>A Strixle would take claw over blade and sky over stone any day. They are not unfriendly, only selective. Befriend one and you are family. Betray one and you are prey.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Strixle\u003c/div>\u003cp>Strixle are hunters and sentinels: beings of precision, pride, and purpose. They do not speak much unless they must, but their presence is always felt.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Portraying strong territorial instincts. Protecting what is yours, whether land, people, or reputation.\u003c/li>\u003cli>Highlighting your natural weapons: talons, wings, and a skyborn perspective few can match.\u003c/li>\u003cli>Balancing your solitary instincts with deep bonds once trust is earned.\u003c/li>\u003cli>Channeling the majesty and danger of Avemriol: aloof, breathtaking, and ready to strike.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Strixle gain +1 to their Evasion attribute upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;From this height, I can see the truth. And I don't like what I see.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Strixle of Avemriol\u003c/div>\u003cp>The Strixle are an aerial people of noble houses, proud and sharp-eyed, at home in the heights where others would only feel the drop. They are exhilarated by the open air and disciplined by its dangers, treating mastery of wind and wing as the mark of worth. Beneath the bravado runs the one fear every Strixle carries, the moment the air stops holding them.\u003c/p>"},{"key":"lb:The Slipfang","tag":"Lorebound","rune":"ᛈ","title":"The Slipfang","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Slipfang","linkLabel":"The Slipfang","teaser":"Slipfangs are sleek emerald serpents born in the aether currents of Avemriol.","html":"\u003cp>Slipfangs are sleek emerald serpents born in the aether currents of Avemriol. Their iridescent scales catch the wind like sunlight through water, and once one is moving it is very nearly impossible to track. Raised among sky-hunting predators and floating isles, a Slipfang thrives on chaos. Appear, strike, gone.\u003c/p>\u003cp>Its bond to a Fell comes on quick and fierce. Every dodge it grants folds into the next, until its partner becomes genuinely hard to pin down. Around it, enemy strikes lose their footing and spells scatter wide.\u003c/p>\u003cp>As a \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Transmogrifications/Corsair\" target=\"_blank\" rel=\"noopener\">Corsair\u003c/a> it changes shape entirely. The moment harm comes near, it coils and lunges, carrying its rider clear on glittering scales before the next blow has anywhere to land.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Elude\u003c/strong>. Slips a Fell out of an attack's path.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Avemriol builds where nothing should stand. Floating spires and sky monasteries are anchored to the wind and the clouds, their structures light and sweeping, designed to ride the gusts rather than resist them. Travel runs on skyships and gliders, and a Strixle measures distance in updrafts and storm fronts rather than roads.\u003c/p>","teaser":"Avemriol builds where nothing should stand.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Avemriol","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Avemriol is storm reverence, the worship of the winds and tempests that rule the sky. The aerial houses honor the storm as both giver and taker, the force that lifts them and the force that could end them, and devotion here is a matter of respecting a power far larger than any house.\u003c/p>","teaser":"Faith in Avemriol is storm reverence, the worship of the winds and tempests that rule the sky.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Avemriol","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Avemriol","html":"\u003cp>The Strixle take cloudfruit and bird meats, food of the high places, and they fill the air with wind flutes and aerial chorales. They dress in feathered cloaks and flight harnesses, ready to ride the wind at any moment, and they travel by skyship and glider. Their whole way of life is balanced on the breath of the sky.\u003c/p>","teaser":"The Strixle take cloudfruit and bird meats, food of the high places, and they fill the air with wind flutes and aerial chorales.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Avemriol","key":"sec:2","tag":"Lore","rune":"ᛒ"}]},"Brimsever":{"name":"Brimsever","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","lineage":"The Harrowed","brand":"Grimscour","art":"Grimcarving","glance":[["Travel","magma crawlers"],["Monsters","Ashgnarls and ember horrors"],["What they fear","weakness, and extinction"]],"saying":{"text":"A scar is a question the fire asked, and you survived answering it.","attr":"a Harrowed saying"},"soon":"\u003cp>This world carries a recorded hint: Grimcarving spreading emotional corruption, and a rumor that its flames are touched by Discord. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Brimsever is a world of ash fortresses and volcanic trenches, where the ground runs hot and the only law anyone fully respects is strength. War drums and furnace chants echo off the trench walls, and the people carry their history on their skin in burns and brands. Survival here is a contest that never ends, and weakness is treated not as misfortune but as the beginning of extinction.\u003c/p>","teaser":"Brimsever is a world of ash fortresses and volcanic trenches, where the ground runs hot and the only law anyone fully respects is strength.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Grimscour","lead":"Brand of Brimsever · the art of Grimcarving","teaser":"Grimscour is the Brand of Brimsever, the working called Grimcarving.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Grimscour","linkLabel":"Grimscour","html":"\u003cp>\u003cem>Also called Grimcarving.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Grimscour is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Brimsever, the working called Grimcarving. It exists as burning carvings, molten scars, and ash sigils, a magic worked by searing power into one's own flesh and the world's stone. Its tone is aggressive and fanatical. Its cost is severe and seductive at once, for Grimcarving scars the soul as well as the body and breeds an addiction to pain, and the deeper truth the Harrowed rarely admit is that the corruption it spreads runs through emotion itself.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Grimscour and molten sigils sear themselves into the bound. The carving cuts so deep that a single further blow will end them, life worn down to a thread. Call it weak and it is your own people scarred to the breaking point.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>A bound creature's maximum \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Attributes/Other+Attributes/Vitality\" target=\"_blank\" rel=\"noopener\">Vitality\u003c/a> becomes 1.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Bleeding*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Bleeding* breaks out on Renewal.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Grimcarving burns power into flesh and stone, and it always asks for pain.\u003c/p>\u003cul class=\"lst\">\u003cli>Carve a sigil into flesh or stone that holds a power, a ward, or an oath.\u003c/li>\u003cli>Read the scars of a place or a person, the pain worked into them and by whom.\u003c/li>\u003cli>Burn away a binding, a sigil, or a corruption with searing force.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Harrowed","lead":"Lineage of Brimsever","teaser":"The Harrowed were not born into a people.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Harrowed","linkLabel":"The Harrowed","html":"\u003cp>The Harrowed were not born into a people. They were thrown out of one. Every Harrowed is a former Hallowed, a celestial stripped of grace and hurled through the Brim, the portal out of Elysara into Brimsever, for sins the Hallowed judged past forgiving.\u003c/p>\u003cp>Where a Hallowed wears a halo as proof of virtue, the Harrowed lost theirs in the fall. What is left is a pair of shattered horns, jagged and dark, the broken stubs of what they used to be. Some arrive in Brimsever with their eyes or mouths sewn shut, a last verdict from the ones who cast them out, meant to seal away whatever guilt might otherwise leak into the world.\u003c/p>\u003cp>Brimsever itself was broken by cosmic malice, torn open by a ritual that reached past the Skyvault, and its air still churns with volatile rifts and infernal wind. The Harrowed do not belong there. They simply survive it. No two wear their ruin the same way, but they all carry the same marks: pale ashen skin, haunted eyes, broken horns, and a weight that trails them like a second shadow.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Harrowed\u003c/div>\u003cp>The Harrowed are fallen celestials: driven, scarred, and often desperate to understand what they did to deserve what was done to them.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Portraying their inner conflict. They were once beings of virtue. Whatever broke that is still with them, known or not.\u003c/li>\u003cli>Leaning into the physical remnants of their fall. Shattered horns, sewn features, the absence of a halo where one should be.\u003c/li>\u003cli>Using their cursed aura to create tension, unease, or fascination in social encounters, especially with those who recognize what they once were.\u003c/li>\u003cli>Building relationships slowly. They were betrayed by the very culture that shaped them.\u003c/li>\u003cli>Exploring whether they believe their punishment was just, and what that answer means for who they are now.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Harrowed gain +1 to their Conviction skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;No, I was not born. I was branded.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Harrowed of Brimsever\u003c/div>\u003cp>The Harrowed are a scarred, fanatical people, organized into military forge castes and bound by a creed of strength through fire. They wear their burns as marks of honor, and they meet hardship by hardening. Outsiders read them as half-mad, and the Harrowed would not entirely argue, only insist that the world made them this way and that softness would already have killed them.\u003c/p>"},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","teaser":"Kreven.","html":"\u003cdiv class=\"sub\">Figures\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Canon+Characters/Kreven\" target=\"_blank\" rel=\"noopener\">Kreven\u003c/a>\u003c/div>\u003c/div>"},{"title":"The Brim","html":"\u003cp>Brimsever is also called the Brim, a name that belongs to its oldest wound rather than its people. The realm was a battlefield in the war against Malvaro, and the fire that tore through it then still scars the deep trenches, primordial and slow to die. It was into the Brim that Lantern once cast the Hallowed who would later return as Magnus Bane, and Magnus came back out of that ruin as one of the Harrowed, broken and stripped of the man he had been.\u003c/p>","teaser":"Brimsever is also called the Brim, a name that belongs to its oldest wound rather than its people.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Architecture and Cities","html":"\u003cp>Brimsever builds to endure heat and siege. Ash fortresses squat over volcanic trenches, their walls fused from slag and bone, and the settlements burrow toward the warmth and the defensible dark. Travel runs on magma crawlers, armored things built to cross ground that would kill anything on foot.\u003c/p>","teaser":"Brimsever builds to endure heat and siege.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Brimsever is fire purification, the belief that flame burns away weakness and leaves only what deserves to survive. The forge castes treat strength as sacred and scars as scripture, and the gravest sin is to flinch from the fire that would temper you.\u003c/p>","teaser":"Faith in Brimsever is fire purification, the belief that flame burns away weakness and leaves only what deserves to survive.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"Life in Brimsever","html":"\u003cp>The Harrowed take charred meats and ashroot stew, hard food for a hard world, and they fill their fortresses with war drums and furnace chants. They wear scarred armor and ashcloth, and they cross the trenches on magma crawlers. Everything here is built to last through heat and violence, including the people.\u003c/p>","teaser":"The Harrowed take charred meats and ashroot stew, hard food for a hard world, and they fill their fortresses with war drums and furnace chants.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Brimsever","key":"sec:3","tag":"Lore","rune":"ᛒ"}]},"Burhallow":{"name":"Burhallow","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","lineage":"The Harfolk","brand":"Echochurn","art":"Luckchurning","glance":[["Travel","the Thousand Tunnels, caravan roads, and bonded Drakelith flight"],["Monsters","Echohollows, Lucksnatchers, Storystalkers, and Fateweavers"],["What they fear","a future with only one outcome left"]],"saying":{"text":"Luck is not what lands in your lap. It is what you plant, and who you plant it for.","attr":"a Harfolk hearth-saying"},"soon":null,"cards":[{"title":"The World","html":"\u003cp>Burhallow is a cozy world with a long shadow under it. The Harfolk live across rolling green hills and sprawling underground warren-cities, bound together less by walls or borders than by stories, shared meals, and the steady belief that every life helps shape what the world becomes. Through all of it runs the Echochurn, a resonance that carries luck and possibility from one end of Burhallow to the other. Most Harfolk treat it as a natural wonder, a blessing that nudges the world toward brighter days.\u003c/p>\u003cp>Few know where the blessing actually comes from. Deep beneath Mount Maelor rests the Fatewell, and the truth kept there is heavier than any festival song lets on. Lately the wonder has begun to misbehave. Impossible coincidences pile up, roads appear where no road was, and whole communities wake from the same vision of a day that has not happened yet. Beneath the cheer, the Harfolk can feel something tightening around their future, and not everyone wants it loosened.\u003c/p>","teaser":"Burhallow is a cozy world with a long shadow under it.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Echochurn","lead":"Brand of Burhallow · the art of Luckchurning","teaser":"Echochurn is the Brand of Burhallow, the art its people call Luckchurning.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Echochurn","linkLabel":"Echochurn","html":"\u003cp>\u003cem>Also called Luckchurning, or simply the Churn.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Echochurn is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Burhallow, the art its people call Luckchurning. It is a resonance craft of probability, fortune, and possibility, and where other Brands force their will on the world, Echochurn works by influence. A Luckchurner rarely makes a miracle outright. Instead they coax unlikely outcomes into being, steer fortunate coincidences, and lift one favorable possibility to the surface from among the many surrounding every choice.\u003c/p>\u003cp>Its practitioners work through charms, rituals, stories, songs, carved tokens, and a trained instinct for the currents of chance. Most Harfolk use small forms of it without ever naming it, folding a little luck into a festival, a trade, a journey, or a harvest. In skilled hands it is far from harmless. Whole battles and histories have turned on a single fortunate moment, guided by someone who knew how to ask.\u003c/p>\u003cp>The currents a Luckchurner taps are not their own. They flow from the Echochurn, the resonance network that threads the world, and the Echochurn draws in turn from something far deeper that almost no practitioner ever suspects.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call the Churn and the currents of chance bend your way. Every roll the favored side makes comes up the kinder of two, the lucky coincidence arriving exactly when it is needed. Call it badly and fortune turns its back, and the only luck left on the field belongs to the other side.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The favored side rolls everything as Lucky.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Hunted*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Hunted* breaks out on Elusion.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Luckchurning is the quiet art of asking fortune nicely.\u003c/p>\u003cul class=\"lst\">\u003cli>Coax a fortunate outcome from a long shot, a lock, a wager, a desperate leap.\u003c/li>\u003cli>Steer a chance meeting, a found road, a trade that falls your way.\u003c/li>\u003cli>Read whether a path ahead runs lucky or cursed before you commit to it.\u003c/li>\u003c/ul>\u003cdiv class=\"sub\">Echochurn in Burhallow\u003c/div>\u003cp>Luckchurning is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Burhallow, the resonance art the Harfolk draw from the Echochurn. It is a craft of probability and possibility, and it works by influence rather than force. A Luckchurner seldom conjures a miracle outright. Instead they coax an unlikely outcome into being, steer a fortunate coincidence, and lift one favorable possibility to the surface from among the many surrounding every choice. They work through charms, rituals, stories, songs, and carved tokens, and many Harfolk use small forms of it without ever naming it. In skilled hands it is anything but harmless. Whole battles and histories have turned on a single fortunate moment, guided by someone who knew how to ask.\u003c/p>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Harfolk","lead":"Lineage of Burhallow","teaser":"The Harfolk are energetic, fur-covered folk with rabbit features, twitchy curiosity, and a pace almost nobody can keep up with.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Harfolk","linkLabel":"The Harfolk","html":"\u003cp>The Harfolk are energetic, fur-covered folk with rabbit features, twitchy curiosity, and a pace almost nobody can keep up with. Keen ears, toothy grins, and a bottomless appetite for company make them endlessly social and just as endlessly mischievous.\u003c/p>\u003cp>They come from Burhallow, a world of rolling green hills, lush groves, and sprawling underground hovel-cities lit by glowing tunnels. Harfolk get around by sound and instinct, and they fill their lives with joy, feasts, and the occasional dirt-skidding getaway.\u003c/p>\u003cp>The easygoing act hides a people built to survive. Those big ears catch the softest footstep, and those teeth chew through root, rope, or a well-stocked pantry with equal ease. A Harfolk is swift, reactive, and very hard to catch, especially with mischief on the line.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Harfolk\u003c/div>\u003cp>Harfolk are the spark of any group: playful, impulsive, but fiercely community-minded. They bring levity to darkness and loyalty to chaos.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Embracing their extroverted nature. Talk often, joke more, and always sit at the center of the table.\u003c/li>\u003cli>Playing up their scouting and stealth. Those big ears catch everything, and so do their feet.\u003c/li>\u003cli>Highlighting their underground upbringing through tunnel logic, cozy corners, or hidden escape routes.\u003c/li>\u003cli>Making their love of parties and festivals part of their identity, bringing joy as naturally as others breathe.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>Harfolk gain a permanent extra lucky die for Treasure Rolls upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;You worry too much. Take a nap, eat a root, and if it still bothers you, run away.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Harfolk of Burhallow\u003c/div>\u003cp>The Harfolk are energetic, fur-covered folk with rabbit-like features, long listening ears, and a pace few can match. They are curious, hospitable, and famous for finding joy in the worst circumstances, and they are tougher than outsiders ever expect. A people raised among shifting fate currents and unmapped tunnels learns to adapt fast, improvise faster, and spot opportunity where others see only trouble. They build as explorers, traders, storytellers, farmers, and burrow-makers, and the playful grin tends to hide a sharp mind and a stubborn loyalty to hearth and home.\u003c/p>\u003cp>Luck holds a special place in Harfolk life. Outsiders call them simply fortunate, but most Harfolk hold that luck is something you nurture through kindness, courage, and generosity rather than something that falls from the sky. Their deepest disagreements are not about land or coin but about fate itself. Some believe the future should stay entirely free and unpredictable. Others argue that the most dangerous possibilities should be guided, or restrained, for everyone's good. As the disturbances around the Fatewell grow, that argument grows with them.\u003c/p>"},{"key":"lb:The Drakelith","tag":"Lorebound","rune":"ᛈ","title":"The Drakelith","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Drakelith","linkLabel":"The Drakelith","teaser":"The Drakelith is a celestial dragon from Burhallow, the asteroid-born home of the Harfolk, a legend stitched out of gold, flame, and fate.","html":"\u003cp>The Drakelith is a celestial dragon from Burhallow, the asteroid-born home of the Harfolk, a legend stitched out of gold, flame, and fate. Diamonds sit embedded in its scales, and its glittering eyes are said to look clean across timelines and lean on fortune itself. Hunters covet the gem-lined hide. Few last long enough to learn there is no greed in the thing, only a gentle seer.\u003c/p>\u003cp>A pale blue wyrm with stars for eyes, it ties itself to a Fell through the currents of luck, tipping a hard moment their way. Turn aside a failure, steer a clean strike, the Drakelith's hand rests quietly on every roll either way.\u003c/p>\u003cp>The greatest of them, Osan'maelor, grew for sixteen hundred years and learned to touch the present itself, not only the threads of what was and what might be. He lies buried in the mountain that now carries his name, and the cult drawn to his still-bright eyes is still climbing toward it.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Boon\u003c/strong>. Turns any roll a Fell makes into a stroke of luck.\u003c/p>\u003c/div>"},{"key":"campaign","tag":"The Fell","rune":"ᛟ","title":"Echoes Below","teaser":"The Echochurn is the oldest sound in Burhallow, the buried beat that carries luck from one end of the Harfolk warrens to the other, and lately it has begun to skip.","html":"\u003cp>The Echochurn is the oldest sound in Burhallow, the buried beat that carries luck from one end of the Harfolk warrens to the other, and lately it has begun to skip. When it skips it reaches, and what it reaches for is the Fell. Four strangers wake in an abandoned root cellar with the dirt humming wrong around them and no memory of how they came to be there.\u003c/p>\u003cp>What pulled them under is the same thing fraying the world above. The beat is breaking, something beneath the roots is stirring to take its place, and the Harfolk who find the Fell are far from certain these strangers are an answer rather than one more symptom.\u003c/p>\u003cp>\u003ca class=\"watch-link\" href=\"https://www.youtube.com/live/Ku0zwvExxRM\" target=\"_blank\" rel=\"noopener\">&#9654;&nbsp; Watch Echoes Below on YouTube\u003c/a>\u003c/p>","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Histories/Echoes+Below+Burhallow/Echoes+Below+Burhallow","linkLabel":"Echoes Below Burhallow"},{"key":"people","tag":"People and Powers","rune":"ᚨ","title":"Figures and Forces","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","teaser":"Mozzle.","html":"\u003cdiv class=\"sub\">Figures\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">\u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Characters/Canon+Characters/Mozzle\" target=\"_blank\" rel=\"noopener\">Mozzle\u003c/a>\u003c/div>\u003c/div>"},{"title":"The Echochurn and the Fatewell","html":"\u003cp>To most of Burhallow the Echochurn is the source of its good fortune. In truth it is only the vessel that carries it. Beneath Mount Maelor lies the Fatewell, a living reservoir of possibility that holds every choice the world ever made, every path it turned away from, and every future still waiting to happen. The Echochurn does not create fate. It distributes it, echoing the Fatewell's currents back out across the world, and a Luckchurner who reaches into the flow is touching the Fatewell without ever knowing its name. For generations that truth stayed buried. The disturbances spreading through Burhallow now are the first sign, to those who can read it, that the buried thing is stirring.\u003c/p>","teaser":"To most of Burhallow the Echochurn is the source of its good fortune.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"The Drakeliths","html":"\u003cp>The Drakeliths are celestial dragons native to Burhallow, said to have fallen from the heavens as living stars before rising from their craters as gem-scaled wyrms. Diamonds and resonance crystals grow between their light blue scales, and their eyes hold shifting points of starlight that many believe look out across possible futures. They are gentle wanderers rather than hoarders or tyrants, drawn to moments of choice and crossroads, and a sighting is treated across Burhallow as a blessing or an omen of change. Bonded to a companion, a Drakelith becomes a fierce protector and, for a fortunate few, a mount that crosses the hills by air. That same reverence has made them prey. Their eyes are among the most valuable magical components in the world, and despite every law against it, poaching rings still hunt them through the hills.\u003c/p>","teaser":"The Drakeliths are celestial dragons native to Burhallow, said to have fallen from the heavens as living stars before rising from their craters as gem-scaled wyrms.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Osan'maelor and the Eye of the Present","html":"\u003cp>The greatest of the Drakeliths was Osan'maelor, a blue dragon who grew for sixteen hundred years. Most of his kind can only pull at the threads of past and future for those they choose to favor, but Maelor alone could touch the present, a gift the Harfolk name the Eye of the Present. He died in the high country, and the mountain that holds his grave carries his name still, with Maelor's Reach and the pilgrim road climbing toward it. His buried eyes never went dark. They still leak the quiet bliss of the power he laid down, and over the years a cult of Osan'maelor gathered around them, carving their devotions into the rock where he fell.\u003c/p>\u003cp>There is a darker thread the Storykeepers seldom follow aloud. A Drakelith reads the present through its eyes and the tip of its tongue, which also carries its sense of smell, and there are those who have cut the tongues from living drakeliths to chase Maelor's gift for themselves. A drakelith left senseless that way does not simply suffer. It becomes something else, and the worst of those stories end with whispering shapes in the deep mountain abysses. How that change runs its course is a thing few will claim to know for certain.\u003c/p>","teaser":"The greatest of the Drakeliths was Osan'maelor, a blue dragon who grew for sixteen hundred years.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"The Thousand Tunnels","html":"\u003cp>The Thousand Tunnels are the oldest and strangest landmark in Burhallow, an immense underground network of roads, chambers, and shifting passages that reaches farther beneath the world than anyone has mapped. No settlement claims to have built them and no culture remembers their beginning. The Harfolk treat the shallow tunnels as ordinary roads and the deep ones as something closer to weather, useful, unavoidable, and never entirely safe. Down in those depths the rules thin out. Dead ends reopen years later, routes connect settlements that should be weeks apart, and the oldest stories insist that some passages lead not merely somewhere else but to when. Every traveler knows the rule before they know their letters: never enter an unknown tunnel without a story to carry with you.\u003c/p>","teaser":"The Thousand Tunnels are the oldest and strangest landmark in Burhallow, an immense underground network of roads, chambers, and shifting passages that reaches…","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"sec:3","tag":"Lore","rune":"ᛒ"},{"title":"Cities and Sanctuaries","html":"\u003cp>Burhallow's settlements run from sunlit hillsides down into the deep dark. Thimblehill is the warren outsiders picture when they imagine the Harfolk at their brightest, a frontier village of grass-roofed burrows famous for its luck festival, its fiercely contested pie markets, and its role as the main recruiting ground for Fellwatch. Fellwatch Tower itself is the wardens' stronghold, an ancient watchtower grown over generations into a beacon, a training ground, and the hub from which protectors are sent across the realm. Burrowmarket is the great underground trade city, a colossal cavern metropolis at the crossroads of the tunnel highways where fortunes and rumors change hands by the thousand each day. Luckhollow is the festival town where almost nothing is bought outright and nearly everything is wagered, from meals and labor to apprenticeships and marriages. Maelor's Reach clings to the lower slopes of Mount Maelor as the last safe haven for pilgrims and scholars climbing toward the mountain's mysteries. Far below them all lies the Fatewell, the sacred nexus that few citizens know exists and fewer still have seen.\u003c/p>","teaser":"Burhallow's settlements run from sunlit hillsides down into the deep dark.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"sec:4","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Burhallow is woven from luck and possibility. The Harfolk hold that fortune is nurtured rather than granted, and they honor it through festivals, games, and the telling of stories. Their Storykeepers are revered as far more than historians, because here a story and a future are nearly the same thing, and so they record not only the past but the choices, prophecies, and fate anomalies that decide what the world may yet become. The Drakeliths are treated as living blessings. The Harfolk's gravest fear is not that luck will be misused but that it will be controlled, because they understand that whoever can command possibility can command freedom itself.\u003c/p>","teaser":"Faith in Burhallow is woven from luck and possibility.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"sec:5","tag":"Lore","rune":"ᛒ"},{"title":"Current Challenges","html":"\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Disturbances\u003c/div>\u003cp>Coincidence is curdling into something deliberate. Roads appear where none existed, communities share visions of unlived days, and the Echochurn runs unsteady. Those who understand it know the trouble runs all the way down to the Fatewell.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Silentchoir\u003c/div>\u003cp>A hidden order holds that suffering exists only because possibility exists, and so they mean to end possibility. They work to seize the Fatewell and collapse the future into a single inevitable outcome, safe and certain and empty. The wardens of Fellwatch stand against them, guarding not a kingdom but the chance that tomorrow can still become something new.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Poaching Trade\u003c/div>\u003cp>Drakelith eyes remain the most valuable contraband in Burhallow, and black-market rings hunt the gentle dragons across the hills no matter how many laws forbid it. The Drakelith Conservancy fights a losing arithmetic against the prices on offer.\u003c/p>\u003c/div>\u003cdiv class=\"chal\">\u003cdiv class=\"ch-t\">The Hollow Silence\u003c/div>\u003cp>In at least one corner of Burhallow the Silentchoir's work did more than still the future. It hollowed the people themselves, draining feeling, memory, and name until a warren could no longer remember its own. How far that silence reached, and whether it can spread again, is a wound a few Fellwatch Wardens carry and almost none will speak of aloud.\u003c/p>\u003c/div>","teaser":"The Disturbances, The Silentchoir, The Poaching Trade, and more.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Burhallow","key":"challenges","tag":"Threats","rune":"ᚾ"}]},"Crixalis":{"name":"Crixalis","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Crixalis","lineage":"The Trinumite","brand":"Chrysalith","art":"Hivestalking","glance":[["Travel","tunnel crawlers and wing gliders"],["Monsters","hive predators and Scalemire Hollows"],["What they fear","isolation from the hive"]],"saying":{"text":"Alone, you are a question the hive does not bother to answer.","attr":"a Trinumite saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Crixalis is a world of hives. Hive spires and glass nests rise over cocoon tunnels that wind through the dark, clicking percussion and hive resonance pulse through every chamber, and the Trinumite live their lives as part of broods far larger than any individual. Identity here is a shared thing, held in the collective memory of the hive, and the worst fate a Trinumite can imagine is to be cut off from it.\u003c/p>","teaser":"Crixalis is a world of hives.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Crixalis","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Chrysalith","lead":"Brand of Crixalis · the art of Hivestalking","teaser":"Chrysalith is the Brand of Crixalis, the working called Hivestalking.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Chrysalith","linkLabel":"Chrysalith","html":"\u003cp>\u003cem>Also called Hivestalking.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Chrysalith is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Crixalis, the working called Hivestalking. It exists as insectoid crystal growths and hive resonance webs, a predatory and evolving magic that draws on the hive's shared instinct and the crystal that threads through its nests. Its tone is predatory and ever-changing. Its cost is the self, for Hivestalking risks identity assimilation into hive instinct, the wielder's own will dissolving into the brood's hunger.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Chrysalith and the hive's hunger settles over the field. Each bound creature that falls is devoured down the resonance web, and the whole favored side swells whole again on the meal. Call it weak and it is your fallen that feed the enemy back to full.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>When a bound creature is reduced to 0, every favored creature restores all \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Attributes/Other+Attributes/Vitality\" target=\"_blank\" rel=\"noopener\">Vitality\u003c/a>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Synchronized*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Synchronized* breaks out on Trickery.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Hivestalking thinks with the whole brood at once.\u003c/p>\u003cul class=\"lst\">\u003cli>Speak through the hive-web to the brood and bend its instinct toward a task.\u003c/li>\u003cli>Read the shared memory of a hive, what it has hunted and where it has been.\u003c/li>\u003cli>Grow a crystal-chitin tool, ward, or shell shaped to the moment's need.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Trinumite","lead":"Lineage of Crixalis","teaser":"The Trinumite are carapaced humanoids, a hivemind people built around focus, strength, and unfailing loyalty.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Trinumite","linkLabel":"The Trinumite","html":"\u003cp>The Trinumite are carapaced humanoids, a hivemind people built around focus, strength, and unfailing loyalty. Antennae that sense more than eyes or ears could, shells as hard as stone, and an origin not as individuals but as parts of a larger whole. Every Trinumite lives to serve its queen and its colony.\u003c/p>\u003cp>They come from the arid world of Crixalis, where they raise colossal mound-cities of mud and stone that glow faintly at night like constellations pressed into the earth. Vast tunnels and underground rivers run beneath them. The world is harsh and dry, but the seasonal rains bring a brief riot of color and life, and the Trinumite spread out to meet it.\u003c/p>\u003cp>Alone, a Trinumite can go shy, slow, a little lost. Among its kin it wakes all the way up. The intelligence sharpens, the resolve hardens, the feeling deepens, and the hum of shared thought comes back.\u003c/p>\u003cdiv class=\"sub\">Roleplaying a Trinumite\u003c/div>\u003cp>Trinumite are task-focused, loyal, and wired for cooperation. Their identity is shaped by presence. When alone, they shrink. When among kin, they shine.\u003c/p>\u003cp>Consider:\u003c/p>\u003cul class=\"lst\">\u003cli>Playing into their shifting personality: timid or uncertain alone, bold and efficient in company.\u003c/li>\u003cli>Using telepathic communication in subtle, creative ways.\u003c/li>\u003cli>Demonstrating immense physical strength, not as flash, but as functional precision.\u003c/li>\u003cli>Letting their sense of purpose define them. Every action, every plan, rooted in the question: how does this serve the whole?\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Lineage Bonus\u003c/div>\u003cp>The Trinumite gain +1 to their Guard skill upon character creation.\u003c/p>\u003c/div>\u003cblockquote>\u003cp>\u003cem>&quot;Alone, I am silence. Together, we are purpose.&quot;\u003c/em>\u003c/p>\u003c/blockquote>\u003cdiv class=\"sub\">The Trinumite of Crixalis\u003c/div>\u003cp>The Trinumite are an insectoid people of brood hierarchies, ordered by caste and bound by a collective hive memory that carries knowledge and self across generations. They are industrious, evolving, and unnervingly unified, their sense of individual self thinner than land-dwellers find comfortable. To be Trinumite is to belong, and to be severed from the hive is to lose not just company but a piece of one's own mind.\u003c/p>"},{"key":"lb:The Xenophis","tag":"Lorebound","rune":"ᛈ","title":"The Xenophis","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Lorebound+Types/The+Xenophis","linkLabel":"The Xenophis","teaser":"The Xenophis is a sleek obsidian mantis from the scorched sands and hidden hives of Crixalis.","html":"\u003cp>The Xenophis is a sleek obsidian mantis from the scorched sands and hidden hives of Crixalis. Small and lethal, its carapace shines like polished armor and its scythe-like forelimbs cut clean. Raised among the stone spires of the Trinumite colonies, it lives by stealth, speed, and economy of effort.\u003c/p>\u003cp>It does not overwhelm anything. It disappears. Each time its Fell takes a hit, the partner thins into a shimmer of shadow and slips past sight and sense alike. As the Xenophis matures, its own strikes start working the same trick, cloaking its master again with every clean blow.\u003c/p>\u003cp>In \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Arsenal/Lorebounds/Transmogrifications/Corsair\" target=\"_blank\" rel=\"noopener\">Corsair\u003c/a> form it becomes a smear of motion and shade. Every time its Fell vanishes, it sets them down somewhere else entirely. Trackers usually find nothing but dust where the target was standing.\u003c/p>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">Aspect\u003c/div>\u003cp>\u003cstrong>Umbra\u003c/strong>. Wraps a wounded Fell in shadow, beyond an enemy's sight.\u003c/p>\u003c/div>"},{"title":"Architecture and Cities","html":"\u003cp>Crixalis builds as a colony builds. Hive spires, cocoon tunnels, and glass nests are grown and extended by the brood, vast organic structures that house thousands as a single body. Travel runs on tunnel crawlers through the deep passages and wing gliders across the open air between spires.\u003c/p>","teaser":"Crixalis builds as a colony builds.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Crixalis","key":"sec:0","tag":"Lore","rune":"ᛒ"},{"title":"Faith and Belief","html":"\u003cp>Faith in Crixalis is reverence for the collective hive memory, the shared mind that preserves the brood across death and generation. The Trinumite honor belonging itself as sacred, and they regard the preservation of the hive's memory as the truest immortality, the individual fading while the whole remembers.\u003c/p>","teaser":"Faith in Crixalis is reverence for the collective hive memory, the shared mind that preserves the brood across death and generation.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Crixalis","key":"sec:1","tag":"Lore","rune":"ᛒ"},{"title":"Life in Crixalis","html":"\u003cp>The Trinumite take nectar broth and insect protein, food produced by the brood for the brood, and they fill their nests with clicking percussion and hive resonance. They wear chitin plating and silk wraps, and they travel by tunnel crawler and wing glider. Every part of life here serves the hive, which is the only way the Trinumite know how to live.\u003c/p>","teaser":"The Trinumite take nectar broth and insect protein, food produced by the brood for the brood, and they fill their nests with clicking percussion and hive resonance.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Crixalis","key":"sec:2","tag":"Lore","rune":"ᛒ"},{"title":"The Dunes and Their Hunters","html":"\u003cp>The open sand belongs to the Ixoar, great flying insects the natives break to the saddle and lend to travelers crossing the dunes. They carry a rider well enough over short hops, though they tire under real weight, and a long haul still comes down to walking. The dunes hold worse than heat. The Sand Stalkers, called raxoar a raan in the native tongue, are mimic-predators that take the shape of harmless creatures, the Ixoar among them, and hold the disguise until the body twists open into pincers and a draining spike beneath the jaw. They are fast, armored, and patient, and a tired caravan rarely sees the change coming. Passage across the sand is the trade of the Pherfarn guild, who hire out guides and contracts for the runs north to south and answer for the cargo when the journey goes wrong.\u003c/p>","teaser":"The open sand belongs to the Ixoar, great flying insects the natives break to the saddle and lend to travelers crossing the dunes.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Crixalis","key":"sec:3","tag":"Lore","rune":"ᛒ"}]},"Eldarwyn":{"name":"Eldarwyn","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Eldarwyn","lineage":"The Sylvakith","brand":"Faelivra","art":"Faeliring","glance":[["Travel","spirit trails"],["Monsters","treants and root horrors"],["What they fear","the death of the forest"]],"saying":{"text":"Stay long enough beneath the old trees and you stop counting the years. That is the gift, and that is the warning.","attr":"a Sylvakith saying"},"soon":"\u003cp>This world has an identity and a Brand. Its deeper canon is still being written.\u003c/p>","cards":[{"title":"The World","html":"\u003cp>Eldarwyn is an ancient forest world, older and stiller than any place has a right to be. Vast primeval woods stretch unbroken between root temples, and ancient chants and spirit songs drift between the trunks like something the forest itself is remembering. The Sylvakith live among these woods as guests as much as inhabitants, and time moves strangely under the old canopy, slow and deep, so that centuries can pass like a long afternoon.\u003c/p>","teaser":"Eldarwyn is an ancient forest world, older and stiller than any place has a right to be.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/The+Sphere/Stratums/Eldarwyn","key":"world","tag":"The Realm","rune":"ᚠ"},{"key":"brand","tag":"Brand of Magic","rune":"ᚹ","title":"Faelivra","lead":"Brand of Eldarwyn · the art of Faeliring","teaser":"Faelivra is the Brand of Eldarwyn, the working called Faeliring.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Faelivra","linkLabel":"Faelivra","html":"\u003cp>\u003cem>Also called Faeliring.\u003c/em>\u003c/p>\u003cdiv class=\"sub\">Lore of the Brand\u003c/div>\u003cp>Faelivra is the \u003ca href=\"https://fellguide.com/The+FellGuide/The+FellGuide/The+Lore+(Contains+Spoilers)/Brands+of+Magic/Brands+of+Magic\" target=\"_blank\" rel=\"noopener\">Brand\u003c/a> of Eldarwyn, the working called Faeliring. It exists as verdant glyph rings, spirit antlers, and deep forest resonance, a magic of communion with the living wood and the spirits within it. Its tone is noble and mythic. Its cost is a gradual separation from mortality, for to delve into Faelivra is to grow ever more like the ancient forest itself, lasting longer and feeling the ordinary world recede.\u003c/p>\u003cdiv class=\"sub\">In Battle\u003c/div>\u003cp>Call Faelivra and the ancient wood lends the favored side its long sight. They move with foreknowledge, declaring after the enemy has shown their hand and changing course as the wood whispers. Call it weak and it is the enemy who sees your moves before you make them.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable class=\"lf\">\u003ctr>\u003cth>Roll\u003c/th>\u003cth>The Wake\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1 or 6\u003c/td>\u003ctd>The favored side declares its Acts after the bound side and may change them.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 to 5\u003c/td>\u003ctd>The bound side is afflicted with Unclad*.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cdiv class=\"nt\">At the Table\u003c/div>\u003cp>The greater Wake holds until the battle ends and can only be lifted by Severing the Call. Unclad* breaks out on Creation.\u003c/p>\u003c/div>\u003cdiv class=\"sub\">Outside Battle\u003c/div>\u003cp>Outside a fight, Faeliring is communion with a forest old enough to remember everything.\u003c/p>\u003cul class=\"lst\">\u003cli>Commune with the spirits of an old wood for counsel, passage, or warning.\u003c/li>\u003cli>Read the deep memory of a forest, what it has seen across the long years.\u003c/li>\u003cli>Walk unaging through wild country, the ordinary world receding for a time.\u003c/li>\u003c/ul>"},{"key":"lineage","tag":"Lineage","rune":"ᛖ","title":"The Sylvakith","lead":"Lineage of Eldarwyn","teaser":"The Sylvakith are faelari-touched and lithe, brimming with wild magic, childlike wonder, and laughter they never seem to run out of.","url":"https://fellguide.com/The+FellGuide/The+FellGuide/The+Characters/The+Lineages/The+Sylvakith","linkLabel":"The Sylvakith","html":"\u003cp>The Sylvakith are faelari-touched and lithe, brimming with wild magic, childlike wonder, and laughter they never seem to run out of. Their eyes are wide and bright, their hair a riot of color, and their skin is traced with spiraling runes that shimmer with enchantment. They are tricksters, but the mischief rarely has any malice in it. It is mostly just joy that needed somewhere to go.\u003c/p>\u003cp>They are born in Eldarwyn, a twilight-soaked forest realm where magic hums in every petal and root and the Sylvakith live
