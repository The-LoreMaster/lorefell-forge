<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BondForge</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Cinzel:wght@500;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
/* site-look:start */
/* site-look v2: the lorefell-site look for the player tools. Source: forge scripts/site-look.css.
   Each tool pastes this block verbatim between the site-look markers; npm run checks keeps the copies identical.
   Old variable names are aliased onto the site tokens so a tool's own rules keep resolving. */
:root{
  --void:#060A14;--gold:#D8BC6A;--bone:#EFE8D8;--ash:#B9B2A2;--hair:rgba(239,232,216,.22);
  --panel:rgba(239,232,216,.035);--panel-2:rgba(239,232,216,.06);
  --f-display:'IM Fell English',Georgia,'Times New Roman',serif;
  --f-menu:'Cinzel','IM Fell English',Georgia,serif;
  --f-label:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --navy:var(--void);--ink:var(--void);--silver:var(--bone);--parch:var(--bone);
  --ice:var(--ash);--muted:var(--ash);--dim:var(--ash);--line:var(--hair);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--void);color:var(--bone)}
body{font-family:var(--f-display);font-size:20px;line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--bone);outline-offset:4px}
.sl-label{font-family:var(--f-label);font-weight:500;font-size:14px;line-height:1.3;letter-spacing:.3em;text-transform:uppercase;color:var(--ash)}
.sl-title{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.4vw,36px);line-height:1.15;color:var(--bone);margin:0}
.sl-btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border:1px solid var(--bone);border-radius:0;background:transparent;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:16px;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .25s,color .25s}
.sl-btn.solid{background:var(--gold);border-color:var(--gold);color:var(--void)}
.sl-btn.small{min-height:44px;padding:0 18px;font-size:14px}
.sl-btn:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover){.sl-btn:hover{background:var(--bone);color:var(--void)}.sl-btn.solid:hover{background:transparent;color:var(--gold)}}
.sl-panel{border:1px solid var(--hair);border-radius:0;background:transparent}
.sl-tabs{display:flex;flex-wrap:wrap;gap:4px 22px;border-bottom:1px solid var(--hair)}
.sl-tab{min-height:44px;padding:0 2px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ash);font-family:var(--f-menu);font-size:15px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.sl-tab[aria-selected="true"],.sl-tab.on,.sl-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.sl-chip{display:inline-flex;align-items:center;min-height:44px;min-width:44px;justify-content:center;padding:0 14px;border:1px solid var(--hair);border-radius:0;background:transparent;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.sl-chip[aria-pressed="true"],.sl-chip[aria-current="true"],.sl-chip.on,.sl-chip.active{border-color:var(--gold);color:var(--gold)}
/* info mark: a 15px glyph inside a 44px hit area, opened by tap (.open). The tip hangs from the
   row that holds the mark: put .sl-info-host on that label or row, and the tip never outgrows it. */
.sl-info-host{position:relative}
.sl-info{position:static;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-14px -12px;vertical-align:middle;cursor:pointer}
.sl-info .tip{position:absolute;top:100%;left:0;z-index:30;width:min(320px,100%);padding:12px 14px;border:1px solid var(--hair);background:var(--void);color:var(--bone);font-family:var(--f-display);font-size:16px;line-height:1.4;letter-spacing:0;text-transform:none;display:none}
.sl-info.open .tip{display:block}
.sl-split{display:grid;grid-template-columns:1fr;gap:28px}
@media (min-width:900px){.sl-split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
/* reduced motion: animations jump to their end state, so anything shown by an animation still shows */
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
/* a dropdown's list: the group labels sat on a white bar (Nate, 2026-10-12) */
select option{background:var(--void);color:var(--bone)}
select optgroup{background:var(--void);color:var(--gold);font-style:normal;font-weight:600}
/* site-look:end */
/* file pickers wear a bone outline: the one solid gold button on Forge is Submit */
input[type=file]{ color:var(--ash); font-family:inherit; }
input[type=file]::file-selector-button{ margin-right:10px; min-height:44px; padding:0 18px; border-radius:0; border:1px solid var(--bone); background:transparent; color:var(--bone); font-family:var(--f-label); font-weight:600; font-size:14px; letter-spacing:.22em; text-transform:uppercase; cursor:pointer; }
input[type=file]::file-selector-button:hover{ background:var(--bone); color:var(--void); }
input[type=file]::-webkit-file-upload-button{ margin-right:10px; min-height:44px; padding:0 18px; border-radius:0; border:1px solid var(--bone); background:transparent; color:var(--bone); font-family:var(--f-label); font-weight:600; font-size:14px; letter-spacing:.22em; text-transform:uppercase; cursor:pointer; }

 :root{--bad:#d77;--good:#7fb98a;--warn:#cdb05a}
 *{box-sizing:border-box}
 html,body{margin:0}
 button{font:inherit;color:inherit}
 header.top{max-width:1180px;margin:0 auto;padding:20px 16px 0}
 .eyebrow{font-family:var(--f-label);font-weight:500;font-size:14px;line-height:1.3;letter-spacing:.3em;text-transform:uppercase;color:var(--ash)}
 .title{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.4vw,36px);line-height:1.15;margin:6px 0 0}
 .title .ember{color:var(--gold)}
 /* the tab bar sits in the page flow, so the site header above the frame never covers it */
 .topbar{position:static;background:transparent}
 .topinner{max-width:1180px;margin:0 auto;padding:14px 16px 0}
 .tabs{display:flex;flex-wrap:wrap;gap:4px 26px;border-bottom:1px solid var(--hair)}
 .tab{min-height:48px;padding:0 2px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--ash);font-family:var(--f-menu);font-size:15px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:color .2s}
 .tab:hover{color:var(--bone)}
 .tab.active{color:var(--gold);border-bottom-color:var(--gold)}
 .wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px}
 main{display:grid;grid-template-columns:1fr;gap:28px;margin-top:24px}
 main.forge{grid-template-columns:1fr}
 @media(min-width:900px){main.forge{grid-template-columns:minmax(0,1fr) 400px;gap:40px}}
 .panel{min-width:0;background:transparent;border:0;border-radius:0;padding:0}
 .explain{font-size:18px;color:var(--ash);border-left:1px solid var(--gold);padding:4px 0 4px 16px;margin-bottom:20px}
 .explain b{color:var(--bone);font-weight:400}
 .empty{color:var(--ash);font-style:italic;font-size:18px;padding:12px 2px}
 select,input[type=text],textarea{width:100%;min-height:48px;background:transparent;border:1px solid var(--hair);border-radius:0;color:var(--bone);font-family:var(--f-display);font-size:18px;padding:10px 14px;outline:none}
 select:disabled{opacity:.45}
 input::placeholder,textarea::placeholder{color:var(--ash);opacity:.75}
 input:focus,textarea:focus,select:focus{border-color:var(--gold)}
 label.fld{display:block;font-family:var(--f-label);font-weight:500;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--ash);margin:18px 0 8px}
 .uploader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:120px;border:1px dashed var(--hair);border-radius:0;padding:16px;text-align:center;color:var(--ash);font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;background:transparent}
 .uploader:hover{border-color:var(--bone);color:var(--bone)} .uploader input{display:none}
 .uploader img{width:104px;height:104px;object-fit:cover;border-radius:0;border:1px solid var(--hair)}
 .preview .seal{font-family:var(--f-label);font-weight:500;letter-spacing:.3em;color:var(--ash);font-size:14px;text-transform:uppercase;text-align:center;border-bottom:1px solid var(--hair);padding-bottom:10px;margin-bottom:14px}
 .pv-portrait{display:block;width:104px;height:104px;object-fit:cover;border-radius:0;border:1px solid var(--hair);margin:0 auto 10px}
 .pv-name{font-family:var(--f-display);font-size:26px;line-height:1.2;text-align:center}
 .pv-arch{text-align:center;color:var(--gold);font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.22em;text-transform:uppercase;margin-top:2px}
 .pv-role{text-align:center;font-style:italic;color:var(--ash);margin:8px 0 14px;font-size:17px}
 .pv-h{font-family:var(--f-label);font-weight:600;font-size:14px;color:var(--gold);letter-spacing:.22em;text-transform:uppercase;margin:16px 0 4px;border-left:1px solid var(--gold);padding-left:10px}
 .pv-h .pv-sub{color:var(--ash);font-size:15px;letter-spacing:0;text-transform:none;font-family:var(--f-display);font-weight:400;font-style:italic;margin-left:4px}
 .pv-line{font-size:17px;margin:4px 0;line-height:1.45}
 .pv-opt{color:var(--bone);font-size:17px;line-height:1.45;margin:3px 0;padding-left:18px;position:relative}
 .pv-opt:before{content:"\25C7";color:var(--gold);position:absolute;left:0;font-size:11px;top:6px}
 .pv-or{color:var(--ash);font-size:14px;font-style:italic;margin:1px 0 1px 18px}
 .pv-empty{color:var(--ash);font-style:italic;font-size:16px}
 .charge{font-size:16px;color:var(--ash);margin-top:16px;border-top:1px solid var(--hair);padding-top:12px;line-height:1.6}
 .charge b{color:var(--bone);font-weight:400}
 /* buttons: bone outline, and .go is the one solid gold button on Forge */
 button.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border:1px solid var(--bone);border-radius:0;background:transparent;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:16px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s}
 button.btn:hover:not(:disabled){background:var(--bone);color:var(--void)}
 button.btn.go{background:var(--gold);border-color:var(--gold);color:var(--void)}
 button.btn.go:hover:not(:disabled){background:transparent;color:var(--gold)}
 button.btn:disabled{opacity:.45;cursor:not-allowed}
 button.btn.go.submitted{background:transparent;border-color:var(--gold);color:var(--gold);opacity:1}
 .payload{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font-family:var(--f-display);font-size:17px;color:var(--ash);background:transparent;border:1px solid var(--hair);border-radius:0;padding:12px 14px;margin-top:12px;max-height:220px;overflow:auto}
 .catitem{border:0;border-bottom:1px solid var(--hair);background:transparent;border-radius:0;padding:20px 0;margin:0;display:flex;gap:24px;align-items:stretch}
 .catitem:first-child{padding-top:4px}
 .catimg{flex:0 0 34%;align-self:stretch;min-height:190px;border-radius:0;border:1px solid var(--hair);background:transparent;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:64px;color:var(--gold);overflow:hidden}
 .catimg img{width:100%;height:100%;object-fit:cover;display:block}
 .catbody{flex:1;min-width:0}
 .catbody .cn{font-family:var(--f-display);font-size:24px;line-height:1.2} .catbody .cw,.preview .cw{font-family:var(--f-label);font-weight:500;color:var(--ash);font-size:14px;letter-spacing:.22em;text-transform:uppercase;margin-left:6px}
 .preview .cw{margin:4px 0 0}
 .catbody .cr{font-style:italic;color:var(--ash);font-size:18px;margin:6px 0 8px}
 @media(max-width:560px){.catitem{flex-direction:column;gap:16px}.catimg{flex-basis:auto;width:100%;min-height:160px;font-size:54px}.catimg.has{min-height:0}.catimg.has img{height:auto;object-fit:contain}}

 textarea{min-height:72px;resize:vertical;line-height:1.45}
 .pv-aspectname{font-family:var(--f-label);font-weight:600;color:var(--gold);text-align:center;font-size:14px;letter-spacing:.22em;text-transform:uppercase;margin:4px 0 10px}
 .catbody .pv-aspectname{text-align:left;margin:6px 0 8px}
 .preview{align-self:start;position:sticky;top:16px;border:1px solid var(--hair);padding:20px}
 .lgfilters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
 .lgf{min-height:44px;min-width:44px;padding:0 16px;background:transparent;border:1px solid var(--hair);border-radius:0;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
 .lgf:hover{border-color:var(--bone)}
 .lgf.active{border-color:var(--gold);color:var(--gold)}
 .lgf.reload{margin-left:auto;color:var(--ash)}
 .lgmeta{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-top:8px}
 .lgbadge{display:inline-block;font-family:var(--f-label);font-weight:600;font-size:13px;line-height:1.2;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:0;padding:4px 8px}
 .lgbadge.plain{color:var(--ash);border-color:var(--hair)}
 .lgby{color:var(--ash);font-family:var(--f-label);font-weight:500;font-size:14px;letter-spacing:.12em}
 .lgactions{margin-top:14px}
 .lgvote{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone);background:transparent;border:1px solid var(--hair);border-radius:0;cursor:pointer}
 .lgvote:hover:not(:disabled){border-color:var(--bone)}
 .lgvote .ar{font-size:10px;color:var(--ash)}
 .lgvote .vc{color:var(--bone);font-variant-numeric:tabular-nums;letter-spacing:.05em}
 .lgvote.voted{color:var(--gold);border-color:var(--gold)}
 .lgvote.voted .ar,.lgvote.voted .vc{color:var(--gold)}
 .lgvote:disabled{cursor:default}
.bpager{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:18px 0 4px}
.bpg{min-width:44px;min-height:44px;padding:0 12px;border:1px solid var(--hair);background:transparent;color:var(--bone);border-radius:0;font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;font-variant-numeric:tabular-nums}
.bpg:hover:not(:disabled):not(.dots){border-color:var(--bone)}
.bpg[aria-current="true"]{border-color:var(--gold);color:var(--gold)}
.bpg:disabled{opacity:.4;cursor:default}
.bpg.dots{display:inline-flex;align-items:center;justify-content:center;min-width:20px;padding:0;border:0;cursor:default;color:var(--ash)}
</style></head>
<body>
<header class="top"><div class="eyebrow">Lorebounds</div><h1 class="title">Bond<span class="ember">Forge</span></h1></header>
<div class="topbar" id="topbar"><div class="topinner">
   <div class="tabs" id="tabs">
     <button class="tab" data-t="catalog">Catalog</button>
     <button class="tab" data-t="forge">Forge</button>
     <button class="tab" data-t="ledger">Ledger</button>
   </div>
</div></div>
<div class="wrap" id="wrap">
 <div id="view"></div>
</div>
<script>
const DATA={"catalog": [{"name": "The Aerostrix", "world": "Sellenia", "role": "Bends fortune so a Fell's strike lands true.", "archetype": "control", "image": "", "aspectName": "Augury", "initial": "When a Fell makes an attack, that attack is a Lucky Roll.", "branches": ["The target's Evasion becomes 0 against that attack.", "The Fell adds the higher of the lorebound owner's Vigor or Wit to its own Precision for that attack."], "crowns": ["Add a second Lucky die to that attack.", "The target's Evade against that attack is an Unlucky Roll."]}, {"name": "The Alkagoo", "world": "Akkoroka", "role": "Distills a spent spell or ability into a potion or tablet to use later.", "archetype": "negation", "image": "", "aspectName": "Distillation", "initial": "When a target's Tier 1 spell or ability resolves, copy it into the targeted Fell's inventory as a potion for a spell or a tablet for an ability.", "branches": ["Capture the spell or ability one Tier higher, up to Tier 2.", "Create a second copy."], "crowns": ["Capture one Tier higher again, up to Tier 3.", "Create a second copy."]}, {"name": "The Aquafin", "world": "Neriad", "role": "Robs a foe of the Charge its attack would earn.", "archetype": "empower", "image": "", "aspectName": "Siphon", "initial": "When a target lands an attack, prevent it from gaining a Charge.", "branches": ["Give the prevented Charge to another Fell within the lorebound's Mobility range.", "Give the prevented Charge to the lorebound owner."], "crowns": ["Remove all additional Charges from the target.", "Restore the lorebound owner to maximum Charges."]}, {"name": "The Boreal", "world": "Mortavia", "role": "Softens a physical blow and turns what it spares into vitality.", "archetype": "mitigation", "image": "", "aspectName": "Succor", "initial": "When a physical attack hits a Fell, prevent Base damage equal to the higher of the lorebound owner's Vigor or Wit.", "branches": ["Convert the prevented damage into Temporary Vitality for the lorebound owner.", "Convert the prevented damage into Temporary Vitality for the Fell that was hit."], "crowns": ["The prevented damage restores Current Vitality first, and overflow is converted to Temporary Vitality.", "Prevent and convert double the Base damage."]}, {"name": "The Cawmarch", "world": "Mortavia", "role": "Scours an Affliction from a Fell before it sets in.", "archetype": "control", "image": "", "aspectName": "Scour", "initial": "When a Fell gains an Affliction, negate it.", "branches": ["Apply the negated Affliction to the attacker.", "Store the Affliction as a Glyph in the lorebound owner's inventory."], "crowns": ["Apply a copy of the Affliction to every enemy in the lorebound's Mobility range.", "Remove every Affliction from that Fell."]}, {"name": "The Drakelith", "world": "Burhallow", "role": "Turns any roll a Fell makes into a stroke of luck.", "archetype": "control", "image": "", "aspectName": "Boon", "initial": "When a Fell makes any roll, that roll is a Lucky Roll.", "branches": ["Add a second Lucky die to the roll.", "If that roll is a Fellmark, double its effect."], "crowns": ["Every Fell in the lorebound's Mobility range becomes Lucky (its rolls are Lucky Rolls until it takes damage).", "A single target gains the Unlucky Affliction (all its rolls become Unlucky)."]}, {"name": "The Felionis", "world": "Shervinaw", "role": "Sours hostile magic aimed at a Fell so it falters.", "archetype": "mitigation", "image": "", "aspectName": "Aegis", "initial": "When an enemy's spell targets a Fell, the spell is an Unlucky Roll.", "branches": ["If the spell still succeeds, prevent Base damage equal to the higher of the lorebound owner's Vigor or Wit.", "If the spell fails, it resolves on the caster instead."], "crowns": ["If the spell fails, the caster gains the Disrupted Affliction (its spells automatically fail unless a Fellmark is rolled).", "That spell targets every enemy in the lorebound's Mobility range."]}, {"name": "The Grimgrit", "world": "Kwuhara", "role": "Answers a blow against a Fell with one of its own.", "archetype": "retort", "image": "", "aspectName": "Reprisal", "initial": "When a Fell is hit, deal Base damage to the attacker equal to the higher of the lorebound owner\'s Vigor or Wit.", "branches": ["Also apply a Combat Effect of your choice to the attacker.", "Deal Bonus damage to the attacker equal to the higher of the lorebound owner\'s Vigor or Wit as well."], "crowns": ["Deal the damage to every enemy in the lorebound's Mobility range.", "Double all damage dealt."]}, {"name": "The Hexarach", "world": "Vyrathis", "role": "Makes a Fell's spell take hold without fail.", "archetype": "empower", "image": "", "aspectName": "Weave", "initial": "When a Fell casts a spell, it automatically succeeds.", "branches": ["Swap the spell for another spell of your choosing in the same Tier.", "Duplicate the spell's effect onto another target."], "crowns": ["A second spell of your choosing in the same Tier is also cast and automatically succeeds.", "Spread the spell's effect to any targets you choose within the lorebound's Mobility range."]}, {"name": "The Lumitoad", "world": "Mireth", "role": "Strips a foe of its React the moment it commits to an Act.", "archetype": "control", "image": "", "aspectName": "Forfeit", "initial": "When an enemy uses its Act, it loses its React.", "branches": ["The enemy also gains a Combat Effect of your choice.", "Give the lost React to a Fell within the lorebound's Mobility range."], "crowns": ["The enemy's Act is negated entirely.", "Apply an Affliction of your choice to the enemy."]}, {"name": "The Mordel", "world": "Thaloryn", "role": "Shrugs off a blow's bite and sends it back at the striker.", "archetype": "mitigation", "image": "", "aspectName": "Adamant", "initial": "When a physical attack hits a Fell, prevent Bonus damage equal to the higher of the lorebound owner's Vigor or Wit.", "branches": ["Deal the prevented damage to the attacker.", "After the Bonus is prevented, also prevent the Base damage."], "crowns": ["Deal the prevented damage to every enemy in the lorebound's Mobility range.", "Prevent all of the incoming damage instead."]}, {"name": "The Runesteed", "world": "Valoria", "role": "Raises stone between a Fell and what comes for them.", "archetype": "mitigation", "image": "", "aspectName": "Redoubt", "initial": "When a Fell is targeted, Manifest a barrier in an empty space between that Fell and the attacker, and the attack strikes the barrier instead. The barrier\'s Vitality equals the higher of the lorebound owner\'s Vigor or Wit.", "branches": ["Manifest the barrier in two empty spaces instead of one.", "Double the barrier\'s Vitality."], "crowns": ["Manifest a barrier in a number of empty spaces equal to the higher of the lorebound owner\'s Vigor or Wit.", "Manifest a barrier in every empty space adjacent to the targeted Fell."]}, {"name": "The Slipfang", "world": "Avemriol", "role": "Slips a Fell out of an attack's path.", "archetype": "negation", "image": "", "aspectName": "Elude", "initial": "When a Fell rolls to Evade, that roll is a Lucky Roll.", "branches": ["The attacker's Precision becomes 0 for that attack.", "The Fell adds the higher of the lorebound owner's Vigor or Wit to its own Evasion for that attack."], "crowns": ["Add a second Lucky die to that Evade.", "The attacker's attack roll against that Fell is an Unlucky Roll."]}, {"name": "The Solmera", "world": "Oroniel", "role": "Burns any foe whose blow finds only air.", "archetype": "retort", "image": "", "aspectName": "Kindle", "initial": "When a Fell is missed, deal Base damage to the attacker equal to the higher of the lorebound owner\'s Vigor or Wit.", "branches": ["Also apply a Combat Effect of your choice to the attacker.", "Deal Bonus damage to the attacker equal to the higher of the lorebound owner\'s Vigor or Wit as well."], "crowns": ["Deal the damage to every enemy in the lorebound\'s Mobility range.", "Double all damage dealt."]}, {"name": "The Thistlewing", "world": "Sylvanoth", "role": "Snares a spent spell or ability into a rune or trap.", "archetype": "retort", "image": "", "aspectName": "Snare", "initial": "When a target's Tier 1 spell or ability resolves, create a rune for the spell or a trap for the ability in the targeted Fell's inventory.", "branches": ["Capture the spell or ability one Tier higher, up to Tier 2.", "Create a second copy."], "crowns": ["Capture one Tier higher again, up to Tier 3.", "Create a second copy."]}, {"name": "The Vixel", "world": "Wildermire", "role": "Shifts a targeted Fell out of harm's way.", "archetype": "control", "image": "", "aspectName": "Veer", "initial": "When a Fell is targeted, apply a Movement Combat Effect of your choice to that Fell.", "branches": ["Also apply the Combat Effect to one other target within range.", "That Fell is Restored (gains 1 Charge)."], "crowns": ["Apply a second Combat Effect of your choice to the enemy targeting the Fell.", "The enemy must target a different Fell, or lose its Act."]}, {"name": "The Worgar", "world": "Elysara", "role": "Reaps a Skyvault Shard from every wound a Fell takes.", "archetype": "restoration", "image": "", "aspectName": "Reap", "initial": "When a Fell takes damage from an attack or spell, manifest a Skyvault Shard in the lorebound owner's inventory.", "branches": ["Heal that Fell's Vitality equal to the higher of the lorebound owner's Vigor or Wit.", "Manifest a second shard in the targeted Fell's inventory."], "crowns": ["Double the effects of Reap. The shards it manifests and the Vitality it heals both double.", "Destroy any number of Skyvault Shards and deal Base damage to the attacker equal to the higher of the lorebound owner's Vigor or Wit for each one destroyed."]}, {"name": "The Xenophis", "world": "Crixalis", "role": "Wraps a wounded Fell in shadow, beyond an enemy's sight.", "archetype": "control", "image": "", "aspectName": "Umbra", "initial": "When a Fell takes damage from any source, it becomes Obscured (enemies cannot see or target it until it deals damage or the end of its next round).", "branches": ["Apply a Movement Combat Effect of your choice to that Fell.", "Deal the damage taken back to the source."], "crowns": ["Also apply Obscured to another Fell within the lorebound's Mobility range.", "Apply a second Movement Combat Effect to the Fell."]}]};

const $=id=>document.getElementById(id);
const S={tab:"catalog"};
const F={name:"",world:"",role:"",aspectName:"",initial:"",b1:"",b2:"",c1:"",c2:"",creator:"",image:""};
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const av=s=>(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;");
function fitTop(){/* the bar is static now, so #wrap needs no room cleared under it */const w=$("wrap");if(w)w.style.paddingTop="";}
window.addEventListener("resize",fitTop);
function tabBtns(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.t===S.tab));}
function optsHTML(a,b){if(a||b){let h="";if(a)h+='<div class="pv-opt">'+esc(a)+'</div>';if(a&&b)h+='<div class="pv-or">or</div>';if(b)h+='<div class="pv-opt">'+esc(b)+'</div>';return h;}return '<div class="pv-empty">Two options.</div>';}

function bondSlug(n){return (n||"").replace(/^The\s+/i,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");}
function bondTry(box,slug){const exts=["png","jpg","jpeg","webp"];let i=0;(function next(){if(i>=exts.length)return;const src="bonds/"+slug+"."+exts[i++];const im=new Image();im.onload=function(){box.classList.add("has");box.innerHTML='<img src="'+av(src)+'" alt="">';};im.onerror=next;im.src=src;})();}
let catLoaded=false, catItems=null;
let bondCatPage=0, bondLgPage=0;
function bPagerHTML(page,pages,cls){
 if(pages<=1)return "";
 let h='<div class="bpager"><button class="bpg" data-pg="'+(page-1)+'" data-pgr="'+cls+'"'+(page<=0?' disabled':'')+'>Prev</button>';
 const nums=[];for(let i=0;i<pages;i++){if(i===0||i===pages-1||Math.abs(i-page)<=1)nums.push(i);else if(nums[nums.length-1]!==-1)nums.push(-1);}
 nums.forEach(i=>{h+= i===-1?'<span class="bpg dots" aria-hidden="true">\u00B7</span>':'<button class="bpg" data-pg="'+i+'" data-pgr="'+cls+'" aria-current="'+(i===page?'true':'false')+'">'+(i+1)+'</button>';});
 return h+'<button class="bpg" data-pg="'+(page+1)+'" data-pgr="'+cls+'"'+(page>=pages-1?' disabled':'')+'>Next</button></div>';
}
function loadCatalog(){const el=$("catlist");if(el)el.innerHTML='<div class="empty">Summoning the canon.</div>';post({type:"CATALOG_LOAD"});setTimeout(function(){if(catItems==null){catItems=DATA.catalog;if(S.tab==="catalog")renderCatCards(catItems);}},1500);}
function catCardHTML(c){
 const slug=bondSlug(c.name),hasImg=!!c.image,br=c.branches||[],cr=c.crowns||[];
 const thumb=hasImg?'<img src="'+av(c.image)+'" alt="">':esc((c.name||"").replace(/^The\s+/i,"").charAt(0));
 let h='<div class="catitem"><div class="catimg'+(hasImg?' has':'')+'" data-bslug="'+av(slug)+'"'+(hasImg?' data-has="1"':'')+'>'+thumb+'</div><div class="catbody">';
 h+='<div class="cn">'+esc(c.name)+' <span class="cw">'+esc(c.world||"")+'</span></div>';
 if(c.role)h+='<div class="cr">'+esc(c.role)+'</div>';
 if(c.aspectName)h+='<div class="pv-aspectname">Aspect \u00B7 '+esc(c.aspectName)+'</div>';
 h+='<div class="pv-h">Initial <span class="pv-sub">always active</span></div><div class="pv-line">'+esc(c.initial||"")+'</div>';
 h+='<div class="pv-h">Branching <span class="pv-sub">keep one</span></div>'+optsHTML(br[0],br[1]);
 h+='<div class="pv-h">Crown <span class="pv-sub">keep one</span></div>'+optsHTML(cr[0],cr[1]);
 h+='</div></div>';return h;
}
function renderCatCards(list){
 const el=$("catlist");if(!el)return;list=list||[];
 if(!list.length){el.innerHTML='<div class="empty">No canon lorebounds yet.</div>';fitTop();return;}
 const SZ=8,pages=Math.max(1,Math.ceil(list.length/SZ));if(bondCatPage>=pages)bondCatPage=pages-1;if(bondCatPage<0)bondCatPage=0;
 const slice=list.slice(bondCatPage*SZ,bondCatPage*SZ+SZ);
 el.innerHTML=slice.map(catCardHTML).join("")+bPagerHTML(bondCatPage,pages,"cat");
 el.querySelectorAll(".catimg[data-bslug]").forEach(function(box){if(box.getAttribute("data-has"))return;bondTry(box,box.getAttribute("data-bslug"));});
 el.querySelectorAll('.bpg[data-pg][data-pgr="cat"]').forEach(b=>b.addEventListener("click",()=>{const n=+b.getAttribute("data-pg");if(n!==bondCatPage){bondCatPage=n;renderCatCards(catItems);const c=$("catlist");if(c&&c.scrollIntoView)c.scrollIntoView({block:"start"});}}));
 fitTop();
}
function renderCatalog(){
 S.tab="catalog";tabBtns();
 $("view").innerHTML='<main><section class="panel"><div class="explain">The canon lorebounds. Each carries one named Aspect: an always-active Initial, two Branch options, and two Crown options. Whoever bonds the creature keeps one Branch at Companion and one Crown at Corsair, never both. Tap a portrait to enlarge it.</div><div id="catlist"></div></section></main>';
 if(catItems!=null)renderCatCards(catItems);
 else if(!catLoaded){catLoaded=true;loadCatalog();}
 else loadCatalog();
 fitTop();
}

function fld(label,id,val,ph,area){
 const inp=area?('<textarea id="'+id+'" placeholder="'+av(ph)+'">'+esc(val)+'</textarea>'):('<input type="text" id="'+id+'" placeholder="'+av(ph)+'" value="'+av(val)+'">');
 return '<label class="fld">'+label+'</label>'+inp;
}
function renderForge(){
 S.tab="forge";tabBtns();
 let h='<main class="forge"><section class="panel">';
 h+='<div class="explain">Author your own lorebound. Write its always-active <b>Initial Aspect</b>, then <b>two Branch options</b> and <b>two Crown options</b>. Whoever bonds the creature keeps one Branch and one Crown as it grows, never both. Submitting routes it to LoreForge for the canon vote.</div>';
 h+=fld("Lorebound name","f_name",F.name,"The Name");
 h+=fld("World","f_world",F.world,"Home world");
 h+=fld("Role line","f_role",F.role,"One line on what it does for the party");
 h+='<label class="fld">Portrait</label><label class="uploader" id="f_up">'+(F.image?'<img src="'+F.image+'" alt=""><div>Change image</div>':'<div>Tap to upload an image</div>')+'<input type="file" id="f_img" accept="image/*"></label>';
 h+=fld("Aspect name","f_aspect",F.aspectName,"Name this React");
 h+=fld("Initial Aspect","f_initial",F.initial,"Always active. When something happens, what follows",true);
 h+=fld("Branching Aspect, option one","f_b1",F.b1,"A player may keep this",true);
 h+=fld("Branching Aspect, option two","f_b2",F.b2,"or this",true);
 h+=fld("Crown Aspect, option one","f_c1",F.c1,"A player may keep this",true);
 h+=fld("Crown Aspect, option two","f_c2",F.c2,"or this",true);
 h+='<button class="btn go" id="f_submit" style="width:100%;margin-top:16px">Submit for canon</button><div id="f_out"></div>';
 h+='</section><aside class="panel preview" id="preview"></aside></main>';
 $("view").innerHTML=h;
 const bind=(id,key,prev)=>{const el=$(id);if(el)el.oninput=e=>{F[key]=e.target.value;if(prev)$("preview").innerHTML=formPreview();};};
 bind("f_name","name",1);bind("f_world","world",1);bind("f_role","role",1);bind("f_aspect","aspectName",1);
 bind("f_initial","initial",1);bind("f_b1","b1",1);bind("f_b2","b2",1);bind("f_c1","c1",1);bind("f_c2","c2",1);bind("f_creator","creator",0);
 $("f_img").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{F.image=ev.target.result;renderForge();};r.readAsDataURL(f);};
 $("f_submit").onclick=submitForge;
 $("preview").innerHTML=formPreview();fitTop();
}
function formPreview(){
 let h='<div class="seal">Your Lorebound</div>';
 if(F.image)h+='<img class="pv-portrait" src="'+F.image+'" alt="">';
 h+='<div class="pv-name">'+(esc(F.name)||"Unnamed lorebound")+'</div>';
 h+='<div class="cw" style="text-align:center;display:block">'+(esc(F.world)||"&nbsp;")+'</div>';
 h+='<div class="pv-role">'+(esc(F.role)||"a support React")+'</div>';
 if(F.aspectName)h+='<div class="pv-aspectname">Aspect \u00B7 '+esc(F.aspectName)+'</div>';
 h+='<div class="pv-h">Initial <span class="pv-sub">always active</span></div>';
 h+=F.initial?'<div class="pv-line">'+esc(F.initial)+'</div>':'<div class="pv-empty">Describe the always-active React.</div>';
 h+='<div class="pv-h">Branching <span class="pv-sub">a player keeps one</span></div>'+optsHTML(F.b1,F.b2);
 h+='<div class="pv-h">Crown <span class="pv-sub">a player keeps one</span></div>'+optsHTML(F.c1,F.c2);
 h+='<div class="charge"><b>Charge 1</b> Initial only \u00B7 <b>Charge 2</b> Initial plus the kept Branch \u00B7 <b>Charge 3</b> plus the kept Crown</div>';
 return h;
}
function submitForge(){
 if(!(F.name||"").trim()||!(F.initial||"").trim()){const o=$("f_out");if(o)o.innerHTML='<div class="payload" style="color:var(--warn)">A name and an Initial Aspect are needed.</div>';return;}
 post({type:"BOND_SUBMIT",payload:{name:F.name||"",world:F.world||"",role:F.role||"",aspectName:F.aspectName||"",initial:F.initial||"",branches:[F.b1||"",F.b2||""],crowns:[F.c1||"",F.c2||""],creator:F.creator||"",image:F.image||""}});
 const b=$("f_submit");if(b){b.classList.add("submitted");b.textContent="Submitted to LoreForge \u2713";b.disabled=true;}
 const o=$("f_out");if(o)o.innerHTML='<div class="payload">Sent to LoreForge for the canon vote.</div>';
}
/* ---------- ledger ---------- */
let lgScope="all", lgLoaded=false, lgItems=[];
function loadLedger(){const el=$("lglist");if(el)el.innerHTML='<div class="empty">Loading the ledger.</div>';post({type:"BOND_LOAD_LEDGER",payload:{scope:lgScope}});}
function badgeOf(st){return ({canon:["Canon","Folded into the lorebounds."],voting:["In Vote","The community is weighing in."],submitted:["Submitted","Waiting for the vote."],declined:["Declined","Set aside for now."]})[st]||["Draft","A work in progress."];}
function renderLedger(){
 S.tab="ledger";tabBtns();
 let h='<main><section class="panel"><div class="explain">Every lorebound put forward. Read one, lend it your voice, or check on your own.</div>';
 h+='<div class="lgfilters"><button class="lgf'+(lgScope==="all"?" active":"")+'" data-scope="all">All</button><button class="lgf'+(lgScope==="canon"?" active":"")+'" data-scope="canon">Canon</button><button class="lgf'+(lgScope==="mine"?" active":"")+'" data-scope="mine">Mine</button><button class="lgf reload" id="lgReload">Reload</button></div>';
 h+='<div id="lglist"></div></section></main>';$("view").innerHTML=h;
 document.querySelectorAll(".lgf[data-scope]").forEach(b=>b.onclick=()=>{lgScope=b.dataset.scope;bondLgPage=0;document.querySelectorAll(".lgf[data-scope]").forEach(x=>x.classList.toggle("active",x===b));loadLedger();});
 const r=$("lgReload");if(r)r.onclick=()=>{bondLgPage=0;loadLedger();};
 if(!lgLoaded){lgLoaded=true;loadLedger();}else renderLgList(lgItems);
 fitTop();
}
function renderLgList(items){
 lgItems=items||[];const el=$("lglist");if(!el)return;
 if(!lgItems.length){el.innerHTML='<div class="empty">'+(lgScope==="mine"?"You have not put one forward.":"Be the first to put one forward.")+'</div>';fitTop();return;}
 const SZ=8,pages=Math.max(1,Math.ceil(lgItems.length/SZ));if(bondLgPage>=pages)bondLgPage=pages-1;if(bondLgPage<0)bondLgPage=0;
 const lgSlice=lgItems.slice(bondLgPage*SZ,bondLgPage*SZ+SZ);
 el.innerHTML=lgSlice.map(it=>{
  let m={};try{m=(JSON.parse(it.payload||"{}").meta)||{};}catch(e){}
  const b=badgeOf(it.canonStatus),canon=it.canonStatus==="canon";
  const br=m.branches||[],cr=m.crowns||[];const by=m.creator||it.creatorName||"";
  const thumb=it.imageUrl?'<img src="'+av(it.imageUrl)+'" alt="">':esc((it.creationName||"").replace("The ","").charAt(0));
  return '<div class="catitem"><div class="catimg'+(it.imageUrl?" has":"")+'">'+thumb+'</div><div class="catbody">'
   +'<div class="cn">'+esc(it.creationName)+' <span class="cw">'+esc(m.world||"")+'</span></div>'
   +'<div class="lgmeta"><span class="lgbadge'+(canon?"":" plain")+'">'+b[0]+'</span>'+(by?'<span class="lgby">by '+esc(by)+'</span>':"")+'</div>'
   +(m.role?'<div class="cr">'+esc(m.role)+'</div>':"")
   +(m.aspectName?'<div class="pv-aspectname">Aspect \u00B7 '+esc(m.aspectName)+'</div>':"")
   +'<div class="pv-h">Initial <span class="pv-sub">always active</span></div><div class="pv-line">'+esc(it.shorthand||m.initial||"")+'</div>'
   +'<div class="pv-h">Branching <span class="pv-sub">keep one</span></div>'+optsHTML(br[0],br[1])
   +'<div class="pv-h">Crown <span class="pv-sub">keep one</span></div>'+optsHTML(cr[0],cr[1])
   +'<div class="lgactions"><button type="button" class="lgvote" data-id="'+av(it.creationId)+'"><span class="ar">\u25B2</span> Vote <span class="vc">'+(it.voteCount||0)+'</span></button></div>'
   +'</div></div>';
 }).join("")+bPagerHTML(bondLgPage,pages,"lg");
 el.querySelectorAll(".lgvote").forEach(bn=>bn.addEventListener("click",()=>castVote(bn)));
 el.querySelectorAll('.bpg[data-pg][data-pgr="lg"]').forEach(b=>b.addEventListener("click",()=>{const n=+b.getAttribute("data-pg");if(n!==bondLgPage){bondLgPage=n;renderLgList(lgItems);const c=$("lglist");if(c&&c.scrollIntoView)c.scrollIntoView({block:"start"});}}));
 fitTop();
}
function castVote(btn){if(!btn||btn.disabled)return;const id=btn.getAttribute("data-id");if(!id)return;btn.disabled=true;post({type:"BOND_VOTE",payload:{creationId:id}});}
function applyVoteResult(m){
 if(!m||!m.creationId)return;let btn=null;document.querySelectorAll(".lgvote").forEach(b=>{if(b.getAttribute("data-id")===m.creationId)btn=b;});
 if(m.ok){if(btn){if(m.voteCount!=null){const c=btn.querySelector(".vc");if(c)c.textContent=m.voteCount;}btn.classList.add("voted");btn.disabled=true;}lgItems.forEach(it=>{if(it.creationId===m.creationId&&m.voteCount!=null)it.voteCount=m.voteCount;});}
 else if(btn){btn.disabled=false;}
}
/* ---------- bridge ---------- */
function post(msg){try{if(window.parent)window.parent.postMessage(msg,"*");}catch(e){}}
function reportHeight(){try{if(window.parent)window.parent.postMessage({type:"FORGE_HEIGHT",height:document.body.scrollHeight},"*");}catch(e){}}
try{new ResizeObserver(reportHeight).observe(document.body);}catch(e){}
window.onmessage=function(e){
 const m=e&&e.data;if(!m||typeof m!=="object")return;
 if(m.type==="CATALOG_RESULT"){const items=Array.isArray(m.items)?m.items:[];catItems=items.length?items:DATA.catalog;if(S.tab==="catalog")renderCatCards(catItems);return;}
 if(m.type==="BOND_LEDGER_RESULT"){renderLgList(m.items||[]);return;}
 if(m.type==="BOND_VOTE_RESULT"){applyVoteResult(m);return;}
 if(m.type==="BOND_SUBMIT_RESULT"){
  if(!m.ok){const b=$("f_submit");if(b){b.classList.remove("submitted");b.disabled=false;b.textContent="Submit for canon";}const o=$("f_out");if(o)o.innerHTML='<div class="payload" style="color:var(--warn)">'+esc((m.errors&&m.errors[0])||"That did not save. Try again.")+'</div>';}
  else{lgLoaded=false;}
  return;
 }
};
function render(){if(S.tab==="forge")renderForge();else if(S.tab==="ledger")renderLedger();else renderCatalog();}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render();});
render();window.addEventListener("load",fitTop);
</script></body></html>
