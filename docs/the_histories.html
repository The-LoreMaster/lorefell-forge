<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Histories | LoreFell</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* The Histories: every LoreFell campaign played on the channel. Each is a wide banner from its
   own art; opened, it lists its episodes, and points to its History in the FellGuide. */
:root{ --ink:#0a0e1a; --ink2:#111830; --line:#26324c; --parch:#ece5d2; --dim:#9aa6b8; --gold:#c9a84c; --gold2:#f0d48a; }
*{ box-sizing:border-box; }
html, body{ margin:0; background:var(--ink); color:var(--parch); font-family:'Crimson Pro', Georgia, serif; font-size:18px; line-height:1.5; }
a{ color:var(--gold); } a:hover{ color:var(--gold2); }
:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
.wrap{ max-width:1180px; margin:0 auto; padding:40px 24px 64px; }
header{ text-align:center; margin-bottom:34px; }
h1{ margin:0; font-family:Cinzel, serif; font-weight:600; font-size:clamp(2rem, 4.5vw, 3.2rem); letter-spacing:.04em; color:var(--parch); }
h1 span{ color:var(--gold); }
header p{ margin:10px auto 0; max-width:60ch; color:var(--dim); font-size:1.08rem; }
.list{ display:flex; flex-direction:column; gap:18px; }
.adv{ border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--ink2); }
.adv.open{ border-color:rgba(201,168,76,.6); }
.banner{ position:relative; display:block; width:100%; min-height:220px; padding:0; border:0; cursor:pointer; text-align:left; color:inherit; font:inherit; background:#141b31 center/cover no-repeat; }
.banner::after{ content:''; position:absolute; inset:0; background:linear-gradient(90deg, rgba(10,14,26,.94) 0%, rgba(10,14,26,.72) 45%, rgba(10,14,26,.15) 100%); }
.banner .in{ position:relative; z-index:1; display:flex; flex-direction:column; gap:8px; padding:26px 28px; max-width:640px; }
.banner h2{ margin:0; font-family:Cinzel, serif; font-weight:600; font-size:clamp(1.4rem, 2.6vw, 2rem); line-height:1.15; color:var(--parch); }
.meta{ display:flex; gap:14px; flex-wrap:wrap; font-size:.92rem; color:var(--gold2); }
.blurb{ margin:0; color:#d8d2c0; font-size:1.02rem; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.cta{ display:inline-flex; align-items:center; gap:8px; margin-top:4px; font-family:Cinzel, serif; font-size:.78rem; letter-spacing:.08em; color:var(--gold); }
.cta .chev{ transition:transform .2s; display:inline-block; } .adv.open .cta .chev{ transform:rotate(90deg); }
.body{ display:none; padding:18px 22px 22px; border-top:1px solid var(--line); }
.adv.open .body{ display:block; }
.acts{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.btn{ display:inline-flex; align-items:center; height:42px; padding:0 18px; border-radius:9px; border:1px solid var(--line); background:#0d1324; color:var(--parch); font-family:Cinzel, serif; font-size:.78rem; letter-spacing:.06em; text-decoration:none; }
.btn.pri{ background:var(--gold); border-color:var(--gold); color:#0a0e1a; } .btn.pri:hover{ background:#d8b85c; color:#0a0e1a; }
.btn:hover{ border-color:rgba(201,168,76,.6); }
.eps{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
.ep a{ display:grid; grid-template-columns:112px minmax(0,1fr); gap:12px; align-items:center; padding:8px; border-radius:11px; border:1px solid transparent; text-decoration:none; color:var(--parch); }
.ep a:hover{ border-color:var(--line); background:#0d1324; }
.ep img{ width:112px; aspect-ratio:16 / 9; object-fit:cover; border-radius:7px; background:#141b31; display:block; }
.ep b{ display:block; font-weight:600; font-size:1rem; line-height:1.25; }
.ep small{ display:block; color:var(--dim); font-size:.85rem; margin-top:2px; }
.ep .n{ font-family:Cinzel, serif; color:var(--gold); font-size:.78rem; letter-spacing:.06em; }
.note{ text-align:center; color:var(--dim); padding:40px 0; }
@media (max-width:640px){
  .wrap{ padding:26px 14px 48px; }
  .banner{ min-height:0; }
  .banner::after{ background:linear-gradient(180deg, rgba(10,14,26,.25) 0%, rgba(10,14,26,.92) 55%); }
  .banner .in{ padding:120px 18px 20px; }
  .body{ padding:14px; }
  .eps{ grid-template-columns:1fr; }
  .btn{ flex:1 1 auto; justify-content:center; }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The <span>Histories</span></h1>
    <p>Every LoreFell campaign we have played, as it happened, episode by episode. Open one to watch it from the start, or read its History in the FellGuide.</p>
  </header>
  <main id="list" class="list" aria-live="polite"><p class="note">Gathering the Histories…</p></main>
</div>
<script>
var ROOM = 'https://lorefell-table.nate8-johnson.workers.dev';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function when(d){ try { return new Date(d).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }); } catch(e){ return ''; } }
function span(a, b){ var x = new Date(a), y = new Date(b); if (isNaN(x) || isNaN(y)) return ''; var f = function(d){ return d.toLocaleDateString(undefined, { month:'short', year:'numeric' }); }; return f(x) === f(y) ? f(x) : f(x) + ' to ' + f(y); }
/* an episode's own name is the part after the pipe; the adventure's name is already above it */
function epName(t, adv){ var parts = String(t).split('|'); var n = parts.length > 1 ? parts.slice(1).join('|').trim() : String(t).replace(new RegExp('^' + adv.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*[-:]?\\s*', 'i'), '').trim(); return n || t; }
function paint(advs){
  var el = document.getElementById('list');
  if (!advs.length){ el.innerHTML = '<p class="note">No Histories to show yet.</p>'; return; }
  el.innerHTML = advs.map(function(a, i){
    return '<article class="adv" id="adv' + i + '">'
      + '<button class="banner" aria-expanded="false" aria-controls="body' + i + '" onclick="toggle(' + i + ')" style="background-image:url(\'' + esc(a.thumb) + '\')"><span class="in">'
      + '<h2>' + esc(a.title) + '</h2>'
      + '<span class="meta"><span>' + a.count + ' episode' + (a.count === 1 ? '' : 's') + '</span><span>' + esc(span(a.first, a.last)) + '</span>' + (a.history ? '<span>Has a History</span>' : '') + '</span>'
      + (a.blurb ? '<p class="blurb">' + esc(a.blurb) + '</p>' : '')
      + '<span class="cta"><span class="chev" aria-hidden="true">\u25b8</span> The episodes</span></span></button>'
      + '<div class="body" id="body' + i + '"><div class="acts">'
      + '<a class="btn pri" href="https://www.youtube.com/watch?v=' + esc(a.episodes[0].id) + '&list=' + esc(a.id) + '" target="_blank" rel="noopener">Watch from the start</a>'
      + '<a class="btn" href="https://www.youtube.com/playlist?list=' + esc(a.id) + '" target="_blank" rel="noopener">The playlist on YouTube</a>'
      + (a.history ? '<a class="btn" href="' + esc(a.history) + '" target="_blank" rel="noopener">Read its History</a>' : '')
      + '</div><ol class="eps">' + a.episodes.map(function(e, k){
          return '<li class="ep"><a href="https://www.youtube.com/watch?v=' + esc(e.id) + '&list=' + esc(a.id) + '" target="_blank" rel="noopener">'
            + '<img src="' + esc(e.thumb) + '" alt="" loading="lazy"><span><span class="n">Episode ' + (k + 1) + '</span><b>' + esc(epName(e.title, a.title)) + '</b><small>' + esc(when(e.at)) + '</small></span></a></li>'; }).join('')
      + '</ol></div></article>';
  }).join('');
}
function toggle(i){
  var el = document.getElementById('adv' + i), open = !el.classList.contains('open');
  el.classList.toggle('open', open); el.querySelector('.banner').setAttribute('aria-expanded', open ? 'true' : 'false');
}
fetch(ROOM + '/pub/adventures').then(function(r){ return r.json(); }).then(function(d){
  if (!d || !d.ok){ document.getElementById('list').innerHTML = '<p class="note">The Histories could not be gathered just now. Try again in a little while.</p>'; return; }
  paint(d.adventures || []);
}).catch(function(){ document.getElementById('list').innerHTML = '<p class="note">The Histories could not be gathered just now. Try again in a little while.</p>'; });
</script>
</body>
</html>
