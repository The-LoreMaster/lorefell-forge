<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Anexanum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* The Anexanum: Nate's lore desk. A scriptorium, not a dashboard: ink, parchment and gold,
   with verdigris for what is new and rust for what is changed. One memorable thing: the
   ledger of pages on the review step. */
:root{ --ink:#0d1222; --ink2:#131a2e; --line:#26324c; --parch:#e9e2cf; --dim:#9aa6b8; --gold:#c9a84c; --gold2:#f0d48a; --verd:#7fb3a3; --rust:#d08a6e; }
*{ box-sizing:border-box; }
html, body{ margin:0; min-height:100%; background:var(--ink); color:var(--parch); font-family:'Crimson Pro', Georgia, serif; font-size:18px; line-height:1.5; }
button, input, select, textarea{ font:inherit; color:inherit; }
a{ color:var(--gold); } a:hover{ color:var(--gold2); }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.wrap{ max-width:1180px; margin:0 auto; padding:28px 24px 60px; }
header.top{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:22px; }
h1{ margin:0; font-family:Cinzel, serif; font-weight:600; font-size:2.1rem; letter-spacing:.04em; color:var(--gold); }
.sub{ color:var(--dim); font-size:1rem; margin-top:2px; }
.status{ display:flex; gap:14px; font-size:.95rem; color:var(--dim); flex-wrap:wrap; }
.status b{ font-weight:500; } .status .ok{ color:var(--verd); } .status .no{ color:var(--rust); }
nav.tabs{ display:flex; gap:6px; margin-bottom:22px; }
nav.tabs button{ height:40px; padding:0 18px; border-radius:9px; border:1px solid var(--line); background:none; color:var(--dim); font-family:Cinzel, serif; font-size:.85rem; letter-spacing:.05em; cursor:pointer; }
nav.tabs button.on{ color:var(--gold); border-color:rgba(201,168,76,.6); background:rgba(201,168,76,.08); }
.steps{ display:grid; grid-template-columns:240px minmax(0,1fr); gap:28px; }
.steps ol{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; counter-reset:s; }
.steps li button{ width:100%; text-align:left; display:grid; grid-template-columns:30px 1fr; gap:10px; align-items:start; padding:10px 12px; border-radius:10px; border:1px solid transparent; background:none; cursor:pointer; color:var(--dim); }
.steps li button .n{ font-family:Cinzel, serif; color:var(--gold); font-size:1rem; padding-top:1px; }
.steps li button b{ display:block; color:var(--parch); font-weight:600; font-size:1rem; } .steps li button span.d{ font-size:.88rem; }
.steps li button.on{ border-color:var(--line); background:var(--ink2); }
.panel{ min-width:0; }
.panel h2{ margin:0 0 6px; font-family:Cinzel, serif; font-weight:600; font-size:1.3rem; color:var(--parch); }
.panel p.lead{ margin:0 0 16px; color:var(--dim); max-width:68ch; }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:10px 0; }
label.f{ display:flex; flex-direction:column; gap:4px; font-size:.9rem; color:var(--dim); min-width:240px; flex:1; }
input.t, select.t, textarea.t{ background:var(--ink2); border:1px solid var(--line); border-radius:8px; padding:9px 11px; color:var(--parch); }
textarea.t{ width:100%; resize:vertical; line-height:1.55; font-size:1rem; }
.btn{ height:40px; padding:0 16px; border-radius:9px; border:1px solid var(--line); background:var(--ink2); color:var(--parch); font-family:Cinzel, serif; font-size:.8rem; letter-spacing:.05em; cursor:pointer; }
.btn.pri{ background:var(--gold); border-color:var(--gold); color:#0a0e1a; } .btn.pri:hover{ background:#d8b85c; }
.btn[disabled]{ opacity:.45; cursor:default; }
.list{ display:flex; flex-direction:column; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.list .it{ display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 14px; border-bottom:1px solid #1a2338; }
.list .it:last-child{ border-bottom:0; } .list .it .num{ font-family:Cinzel, serif; color:var(--gold); }
.list .it .ti{ min-width:0; } .list .it .ti small{ display:block; color:var(--dim); font-size:.85rem; }
.mark{ font-size:.85rem; } .mark.done{ color:var(--verd); } .mark.wait{ color:var(--dim); } .mark.err{ color:var(--rust); }
.pick{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:10px; }
.pick button{ text-align:left; padding:12px 14px; border-radius:11px; border:1px solid var(--line); background:var(--ink2); cursor:pointer; }
.pick button b{ display:block; font-family:Cinzel, serif; font-weight:600; font-size:1rem; } .pick button small{ color:var(--dim); }
.pick button.on{ border-color:var(--gold); }
.log{ margin-top:14px; padding:12px 14px; border-left:2px solid var(--gold); background:var(--ink2); color:var(--dim); font-size:.95rem; white-space:pre-wrap; max-height:220px; overflow:auto; }
/* the review: the ledger of pages and the page itself */
.review{ display:grid; grid-template-columns:320px minmax(0,1fr); gap:22px; align-items:start; }
.ledger{ border:1px solid var(--line); border-radius:12px; overflow:auto; max-height:72vh; }
.ledger h3{ margin:0; padding:10px 14px 6px; font-family:Cinzel, serif; font-weight:600; font-size:.85rem; letter-spacing:.06em; color:var(--gold); background:var(--ink); position:sticky; top:0; }
.ledger .pg{ display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:8px; align-items:center; padding:7px 14px; cursor:pointer; border-left:3px solid transparent; }
.ledger .pg:hover{ background:var(--ink2); } .ledger .pg.on{ background:var(--ink2); border-left-color:var(--gold); }
.ledger .pg input{ width:16px; height:16px; accent-color:var(--gold); }
.ledger .pg .nm{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ledger .pg .st{ font-size:.8rem; } .st.new{ color:var(--verd); } .st.changed{ color:var(--rust); } .st.same{ color:var(--dim); }
.page{ border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--ink2); }
.page .path{ font-size:.85rem; color:var(--dim); margin-bottom:8px; word-break:break-all; }
.diff{ font-size:.95rem; line-height:1.55; white-space:pre-wrap; max-height:60vh; overflow:auto; padding:10px; border-radius:8px; background:var(--ink); }
.diff .a{ background:rgba(127,179,163,.16); display:block; } .diff .d{ background:rgba(208,138,110,.16); text-decoration:line-through; display:block; color:var(--dim); }
.empty{ padding:28px; border:1px dashed var(--line); border-radius:12px; color:var(--dim); }
.gate{ max-width:560px; margin:12vh auto; text-align:center; } .gate h1{ font-size:2.6rem; }
@media (max-width:860px){ .steps, .review{ grid-template-columns:1fr; } .steps ol{ flex-direction:row; overflow:auto; } .steps li button{ min-width:180px; } }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="gate"><h1>The Anexanum</h1><p class="sub">Opening the archive…</p></div></div>
<script>
/* ---- talking to the page (a ticket) and to the room (everything else) ---- */
var ROOM = 'https://lorefell-table.nate8-johnson.workers.dev';
var AI = 'https://lorefell-ai.nate8-johnson.workers.dev/';
var BASE = 'The FellGuide/The FellGuide/The Lore (Contains Spoilers)/The Histories/';
var NAVMAP = '_Canon/NAV_ORDER_MAP.md';
var SECTIONS = ['Storyline', 'Characters', 'Locations', 'Bestiary', 'Artifacts'];
var _rid = 0, _wait = {};
window.addEventListener('message', function(e){ var m = e.data || {}; if (m.type === 'AX_REPLY' && _wait[m.id]){ _wait[m.id](m); delete _wait[m.id]; } });
function askPage(type){ return new Promise(function(res, rej){ var id = ++_rid; _wait[id] = function(m){ m.ok ? res(m.data) : rej(new Error((m.data && m.data.error) || 'no answer')); }; try { parent.postMessage({ type:type, id:id }, '*'); } catch(e){ rej(e); } setTimeout(function(){ if (_wait[id]){ delete _wait[id]; rej(new Error('the page did not answer: paste velo/page-the_anexanum.js')); } }, 20000); }); }
var TICKET = '';
function api(path, params, body){
  var q = Object.keys(params || {}).map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(ROOM + path + '?t=' + encodeURIComponent(TICKET) + (q ? '&' + q : ''), body !== undefined ? { method:'POST', body:typeof body === 'string' ? body : JSON.stringify(body) } : {})
    .then(function(r){ return r.json(); }).then(function(d){ if (!d || d.ok === false) throw new Error((d && d.error) || 'no answer'); return d; });
}
function ai(system, user, max, smart){
  return fetch(AI, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ system:system, messages:[{ role:'user', content:user }], max_tokens:max || 900, model:smart ? 'smart' : 'fast' }) })
    .then(function(r){ if (r.status === 429) throw new Error('too many requests just now: wait a minute'); return r.json(); })
    .then(function(d){ if (!d || d.ok === false) throw new Error((d && d.error) ? String(d.error).slice(0, 160) : 'no text'); return d.text || ''; });
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function slug(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60); }
function safeName(s){ return String(s || '').replace(/[\\/:*?"<>|#^\[\]]/g, '').replace(/\s+/g, ' ').trim().slice(0, 90); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function noDash(t){ return String(t || '').replace(/\s*\u2014\s*/g, ', ').replace(/\s*\u2013\s*/g, ', '); }

/* ---- state ---- */
var AX = { tab:'histories', step:1, who:null, playlists:null, pl:null, videos:[], name:'', existing:'', histories:[], style:'', example:'', exampleChar:'',
           notes:{}, files:{}, sel:'', busy:false, log:'', diff:true };
function hist(){ return safeName(AX.name); }
function hkey(){ return 'h:' + slug(AX.name); }
function say(t){ AX.log = (AX.log ? AX.log + '\n' : '') + t; var el = document.getElementById('axlog'); if (el){ el.textContent = AX.log; el.scrollTop = el.scrollHeight; } }

/* ---- drafts kept in the room until sent: a manifest of notes and file paths, and each file ---- */
function saveManifest(){ return api('/ax/draft', { k:hkey() + ':m' }, JSON.stringify({ name:AX.name, pl:AX.pl, notes:AX.notes, files:Object.keys(AX.files).map(function(p){ return { p:p, approved:AX.files[p].approved, status:AX.files[p].status }; }) })); }
function saveFile(path){ var f = AX.files[path]; return api('/ax/draft', { k:hkey() + ':f:' + path }, f.content); }
function loadDraft(){
  return api('/ax/draft', { k:hkey() + ':m' }).then(function(d){
    if (!d.v) return false;
    var m = JSON.parse(d.v); AX.notes = m.notes || {};
    return Promise.all((m.files || []).map(function(f){ return api('/ax/draft', { k:hkey() + ':f:' + f.p }).then(function(x){ AX.files[f.p] = { content:x.v || '', original:null, status:f.status || 'new', approved:f.approved !== false }; }); })).then(function(){ return true; });
  });
}

/* ---- the start ---- */
function boot(){
  askPage('AX_TICKET').then(function(r){ TICKET = r.ticket; return api('/ax/whoami'); })
    .then(function(w){ AX.who = w; paint(); loadVaultBasics(); })
    .catch(function(e){ document.getElementById('app').innerHTML = '<div class="gate"><h1>The Anexanum</h1><p class="sub">' + esc(e.message || 'Not open.') + '</p></div>'; });
}
function loadVaultBasics(){
  if (!AX.who || !AX.who.vault) return;
  api('/ax/vault/list', { prefix:BASE }).then(function(d){
    var set = {}; d.files.forEach(function(p){ var rest = p.slice(BASE.length), i = rest.indexOf('/'); if (i > 0) set[rest.slice(0, i)] = 1; });
    AX.histories = Object.keys(set).sort(); AX.vaultFiles = d.files; paint();
  }).catch(function(){});
  api('/ax/vault/file', { path:'_Canon/STYLE.md' }).then(function(d){ AX.style = d.content || ''; }).catch(function(){});
  api('/ax/vault/file', { path:BASE + 'A Court of Ashes/Storyline/01 - Heirs of Rot.md' }).then(function(d){ AX.example = (d.content || '').slice(0, 3500); }).catch(function(){});
  api('/ax/vault/file', { path:BASE + 'A Court of Ashes/Characters/Kethra Valis.md' }).then(function(d){ AX.exampleChar = d.content || ''; }).catch(function(){});
}

/* ---- painting ---- */
function paint(){
  var w = AX.who || {};
  var h = '<header class="top"><div><h1>The Anexanum</h1><div class="sub">Where the lore is kept. Nothing reaches the FellGuide until you send it.</div></div>'
    + '<div class="status"><span>YouTube <b class="' + (w.youtube ? 'ok' : 'no') + '">' + (w.youtube ? 'connected' : 'not set') + '</b></span><span>The vault <b class="' + (w.vault ? 'ok' : 'no') + '">' + (w.vault ? 'open' : 'no key yet') + '</b></span></div></header>'
    + '<nav class="tabs" aria-label="The Anexanum"><button class="' + (AX.tab === 'histories' ? 'on' : '') + '" onclick="AX.tab=\'histories\';paint()">The Histories</button><button class="' + (AX.tab === 'videos' ? 'on' : '') + '" onclick="AX.tab=\'videos\';paint()">The videos</button></nav>';
  h += AX.tab === 'histories' ? paintHistories() : paintVideos();
  document.getElementById('app').innerHTML = h;
  var lg = document.getElementById('axlog'); if (lg) lg.scrollTop = lg.scrollHeight;
}
/* ================= a recap video, planned =================
   For one session video: the moments marked at the table (kept and suggested), and the
   captions line by line. The AI picks six to eight clips of three to five seconds, in story
   order, thirty to forty seconds in all: the funny, the triumphs, the disasters, the epic and
   the drama. Nate watches each, trims or drops any, adds a moment, and downloads the plan for
   the Recap Cutter on his own machine. Only here, only for him. */
var RP = null;
function rpOpen(i){
  var v = VD.list[i]; if (!v) return;
  RP = { v:v, busy:true, msg:'Reading the captions and the moments…', clips:[], moments:[], lines:[] };
  VD.open = null; paint();
  Promise.all([api('/ax/video', { v:v.id, captions:1, lines:1 }), api('/ax/draft', { k:'mo:' + v.id }), api('/ax/draft', { k:'rp:' + v.id })]).then(function(r){
    RP.lines = r[0].lines || [];
    try { RP.moments = JSON.parse(r[1].v || '[]'); } catch(e){ RP.moments = []; }
    if (r[2].v){ try { var dr = JSON.parse(r[2].v); RP.clips = dr.clips || []; RP.busy = false; RP.msg = 'Your plan from ' + new Date(dr.at).toLocaleDateString(undefined, { month:'short', day:'numeric' }) + '.'; paint(); return; } catch(e){} }
    return rpPick();
  }).catch(function(e){ RP.busy = false; RP.msg = e.message; paint(); });
}
function rpPick(){
  RP.busy = true; RP.msg = 'Choosing the clips…'; paint();
  if (!RP.lines.length){ RP.busy = false; RP.msg = 'This video has no timed captions yet, so the clips cannot be found. Try again once YouTube has made them.'; paint(); return Promise.resolve(); }
  var mom = RP.moments.map(function(m){ return vdTime(m.t) + ' (' + m.t + 's) ' + m.name + (m.tags && m.tags.length ? ' [' + m.tags.join(', ') + ']' : '') + (m.kept ? ' KEPT' : ' suggested'); }).join('\n');
  var lines = RP.lines.map(function(l){ return Math.round(l.s) + ': ' + l.t; }).join('\n');
  if (lines.length > 300000) lines = lines.slice(0, 300000);
  var sys = 'You cut a 30 to 40 second recap of a tabletop actual-play session from its captions, so someone who missed it understands what happened and wants to watch. Pick 6 to 8 clips, each 3 to 5 seconds, in the order they happened. Choose moments that land on their own: a laugh, a triumph, a disaster, something epic, real drama. Prefer the marked moments (KEPT ones most), and make each clip start on the line that sets it up and end just after the payoff. '
    + 'Return ONLY JSON: [{"start":seconds,"end":seconds,"label":"a few words","tags":["funny"|"triumph"|"disaster"|"epic"|"drama"]}] using the caption seconds given.';
  var user = 'Video: ' + RP.v.title + '\n\nMoments marked at the table:\n' + (mom || '(none)') + '\n\nCaptions, by the second they start:\n' + lines;
  return ai(sys, user, 1500, true).then(function(raw){
    var arr = []; try { arr = JSON.parse(String(raw).replace(/```json|```/g, '').trim()); } catch(e){ var m = String(raw).match(/\[[\s\S]*\]/); try { arr = m ? JSON.parse(m[0]) : []; } catch(e2){ arr = []; } }
    RP.clips = (Array.isArray(arr) ? arr : []).map(function(c){ var s = Math.max(0, +c.start || 0), e = Math.max(s + 1, +c.end || s + 4); if (e - s > 8) e = s + 8; return { start:Math.round(s * 10) / 10, end:Math.round(e * 10) / 10, label:noDash(c.label || '').trim(), tags:Array.isArray(c.tags) ? c.tags : [] }; }).sort(function(a, b){ return a.start - b.start; });
    RP.busy = false; RP.msg = RP.clips.length ? '' : 'No clips came back. Try Choose again.'; rpSave(); paint();
  }).catch(function(e){ RP.busy = false; RP.msg = 'Not chosen: ' + e.message; paint(); });
}
function rpSave(){ if (RP) return api('/ax/draft', { k:'rp:' + RP.v.id }, JSON.stringify({ clips:RP.clips, at:Date.now() })).catch(function(){}); }
function rpTotal(){ return RP.clips.reduce(function(a, c){ return a + Math.max(0, c.end - c.start); }, 0); }
function rpNudge(i, k, d){ var c = RP.clips[i]; c[k] = Math.max(0, Math.round((c[k] + d) * 10) / 10); if (c.end <= c.start) c.end = c.start + 1; rpSave(); paint(); }
function rpDrop(i){ RP.clips.splice(i, 1); rpSave(); paint(); }
function rpAdd(j){ var m = RP.moments[j]; if (!m) return; RP.clips.push({ start:Math.max(0, m.t - 1), end:m.t + 3, label:m.name, tags:m.tags || [] }); RP.clips.sort(function(a, b){ return a.start - b.start; }); rpSave(); paint(); }
function rpLine(c){ var l = RP.lines.filter(function(x){ return x.s >= c.start - 0.5 && x.s < c.end; }).map(function(x){ return x.t; }).join(' '); return l.slice(0, 220); }
function paintRecap(){
  var h = '<div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">A recap video: ' + esc(RP.v.title) + '</h2><button class="btn" onclick="RP=null;paint()">Back to the videos</button></div>';
  if (RP.busy) return h + '<p class="lead">' + esc(RP.msg) + '</p></div>';
  var tot = rpTotal();
  h += '<p class="lead">Watch each pick, trim it a second at a time, drop what does not land, add a marked moment. Then download the plan and open it in the Recap Cutter with the session\u2019s recording.</p>'
    + '<div class="list">' + RP.clips.map(function(c, i){ return '<div class="it" style="grid-template-columns:44px minmax(0,1fr) auto"><span class="num">' + (i + 1) + '</span>'
      + '<span class="ti"><a href="https://youtu.be/' + esc(RP.v.id) + '?t=' + Math.floor(c.start) + '" target="_blank" rel="noopener">' + vdTime(c.start) + '</a> to ' + vdTime(c.end) + ' (' + (Math.round((c.end - c.start) * 10) / 10) + 's) ' + esc(c.label) + (c.tags && c.tags.length ? ' <small style="display:inline">' + esc(c.tags.join(', ')) + '</small>' : '') + '<small>' + esc(rpLine(c)) + '</small></span>'
      + '<span class="row" style="margin:0;gap:4px"><button class="btn" onclick="rpNudge(' + i + ',\'start\',-1)" title="Start a second earlier">\u2212 start</button><button class="btn" onclick="rpNudge(' + i + ',\'start\',1)" title="Start a second later">+ start</button><button class="btn" onclick="rpNudge(' + i + ',\'end\',-1)" title="End a second earlier">\u2212 end</button><button class="btn" onclick="rpNudge(' + i + ',\'end\',1)" title="End a second later">+ end</button><button class="btn" onclick="rpDrop(' + i + ')">Drop</button></span></div>'; }).join('') + '</div>'
    + '<p class="lead" style="margin-top:8px">' + RP.clips.length + ' clips, ' + Math.round(tot) + ' seconds' + (tot > 40 ? ': over 40, drop or trim one.' : tot < 30 ? ': under 30, add a moment if one is missing.' : '.') + '</p>'
    + (RP.moments.length ? '<div class="row"><label class="f">Add a marked moment<select class="t" onchange="if(this.value!==\'\'){rpAdd(+this.value);}"><option value="">Choose one\u2026</option>' + RP.moments.map(function(m, j){ return '<option value="' + j + '">' + esc(vdTime(m.t) + ' ' + m.name + (m.kept ? '' : ' (suggested)')) + '</option>'; }).join('') + '</select></label></div>' : '<p class="lead">No moments came from the table for this video. Mark them with M during a session, and keep them in Moments.</p>')
    + '<div class="row"><button class="btn" onclick="rpPick()">Choose again</button><button class="btn pri" onclick="rpDownload()"' + (RP.clips.length ? '' : ' disabled') + '>Download the plan</button></div>'
    + '<p class="lead">' + esc(RP.msg || '') + '</p></div>';
  return h;
}
function rpDownload(){
  var plan = { kind:'lorefell-recap-plan', version:1, video:{ id:RP.v.id, title:RP.v.title }, made:new Date().toISOString(), clips:RP.clips.map(function(c){ return { start:c.start, end:c.end, label:c.label, tags:c.tags }; }) };
  var name = 'recap-plan - ' + String(RP.v.title).replace(/[\\/:*?"<>|]+/g, '').slice(0, 80) + '.json';
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(plan, null, 2)], { type:'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  RP.msg = 'Downloaded. Open it in the Recap Cutter with the session\u2019s recording.'; paint();
}
/* ================= the videos: titles and descriptions, past and present =================
   Every video on the channel (or one playlist), oldest first. Each gets a title of
   "Adventure | Episode" and a description written to be found and shared: a hook, a teaser,
   chapters from the timed captions, an invitation to LoreFell and a few hashtags. The episode
   name is read from the captions, or chosen from a History's chapters in the FellGuide. Drafts
   are kept in the room; nothing goes up until Update the video. */
var VD = { list:null, from:'all', busy:false, msg:'', open:null, drafting:false, histChapters:{} };
function vdKey(id){ return 'v:' + id; }
function vdTime(s){ s = Math.max(0, s | 0); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (x < 10 ? '0' : '') + x; }
function vdLoad(){
  VD.list = 'loading'; paint();
  var go = VD.from === 'all' ? api('/ax/uploads') : api('/ax/playlist', { id:VD.from });
  go.then(function(d){
    var items = (d.items || []).slice().sort(function(a, b){ return new Date(a.at) - new Date(b.at); });
    return api('/ax/drafts', { prefix:'v' }).then(function(k){
      var keys = k.keys || [];
      items.forEach(function(v){ v.draft = keys.indexOf('v:' + v.id) >= 0; v.done = keys.indexOf('vd:' + v.id) >= 0; });
      VD.list = items; paint();
    });
  }).catch(function(e){ VD.list = []; VD.msg = e.message; paint(); });
}
function paintVideos(){
  if (VD.list === null) vdLoad();
  var pls = Array.isArray(AX.playlists) ? AX.playlists : [];
  if (AX.playlists === null){ AX.playlists = 'loading'; api('/ax/playlists').then(function(d){ AX.playlists = d.items; paint(); }).catch(function(){ AX.playlists = []; }); }
  if (RP) return paintRecap();
  if (VD.open) return paintVideoOpen();
  var h = '<div class="panel"><h2>The videos</h2><p class="lead">Give each video its title, Adventure | Episode, and a description made to be found: a hook, a teaser, chapters, an invitation and hashtags. Open one to write it, or draft the rest and read each before it goes up.</p>'
    + '<div class="row"><label class="f">Which videos<select class="t" onchange="VD.from=this.value;vdLoad()"><option value="all"' + (VD.from === 'all' ? ' selected' : '') + '>Every video on the channel</option>' + pls.map(function(p){ return '<option value="' + esc(p.id) + '"' + (VD.from === p.id ? ' selected' : '') + '>' + esc(p.title) + '</option>'; }).join('') + '</select></label></div>';
  if (VD.list === 'loading') h += '<p class="lead">Reading the channel…</p>';
  else if (!VD.list.length) h += '<div class="empty">' + esc(VD.msg || 'No videos here.') + '</div>';
  else h += '<div class="list">' + VD.list.map(function(v, i){ return '<div class="it"><span class="num">' + (i + 1) + '</span><span class="ti">' + esc(v.title) + '<small>' + esc(new Date(v.at).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' })) + '</small></span>'
      + '<span class="row" style="margin:0"><span class="mark ' + (v.done ? 'done' : v.draft ? 'wait' : 'wait') + '">' + (v.done ? 'updated' : v.draft ? 'draft saved' : '') + '</span><button class="btn" onclick="rpOpen(' + i + ')" title="Plan a 30 to 40 second recap video">Recap video</button><button class="btn' + (v.draft ? ' pri' : '') + '" onclick="vdOpen(' + i + ')">' + (v.draft ? 'Open the draft' : v.done ? 'Again' : 'Write it') + '</button></span></div>'; }).join('') + '</div>'
      + '<div class="row"><button class="btn pri" onclick="vdDraftRest()"' + (VD.drafting ? ' disabled' : '') + '>' + (VD.drafting ? 'Drafting…' : 'Draft the rest') + '</button></div>';
  return h + '<div class="log" id="axlog" aria-live="polite">' + esc(VD.msg || '') + '</div></div>';
}
/* a History's chapter titles from the FellGuide, to name an episode by */
function vdHistories(){ return AX.histories || []; }
function vdChapters(hist){
  if (VD.histChapters[hist]) return VD.histChapters[hist];
  VD.histChapters[hist] = [];
  var pre = BASE + hist + '/Storyline/';
  VD.histChapters[hist] = (AX.vaultFiles || []).filter(function(p){ return p.indexOf(pre) === 0; }).map(function(p){ return p.slice(pre.length).replace(/\.md$/, '').replace(/^\d+\s*-\s*/, ''); });
  return VD.histChapters[hist];
}
function vdOpen(i, fresh){
  var v = VD.list[i]; if (!v) return;
  VD.open = { i:i, v:v, busy:true, msg:'Reading the video…', adv:String(v.title).split('|')[0].trim(), ep:(String(v.title).split('|').slice(1).join('|') || '').trim(), title:'', desc:'', hist:'' };
  paint();
  (fresh ? Promise.resolve({ v:'' }) : api('/ax/draft', { k:vdKey(v.id) })).then(function(d){
    if (d.v){ var dr = JSON.parse(d.v); Object.assign(VD.open, dr, { busy:false, msg:'Your draft from ' + new Date(dr.at).toLocaleDateString(undefined, { month:'short', day:'numeric' }) + '.' }); paint(); return; }
    return vdWrite(VD.open).then(paint);
  }).catch(function(e){ VD.open.busy = false; VD.open.msg = e.message; paint(); });
}
function vdWrite(o){
  return api('/ax/video', { v:o.v.id, captions:1 }).then(function(d){
    var segs = d.segments || [], hist = o.hist || vdGuessHistory(o.adv), chs = hist ? vdChapters(hist) : [];
    o.hist = hist;
    var sys = 'You write the YouTube title part and description for an actual-play episode of LoreFell, a dark fantasy tabletop roleplaying game, to help it be found and shared. Return ONLY JSON, no other text: '
      + '{"episode":"the episode\u2019s name, a few words, from what happens in it' + (chs.length ? ' (if it matches one of the History\u2019s chapter titles given, use that title exactly)' : '') + '","hook":"one gripping line under 110 characters","teaser":"two or three sentences on what happens, vivid and plain, ending on a question or a turn, no spoilers of the very end","chapters":[{"s":seconds,"title":"two to five words"}],"hashtags":["#LoreFell","#TTRPG","..."]} '
      + 'Chapters: from the timed caption pieces, where the story turns, 5 to 12, the first at 0 called Opening, at least a minute apart; none if there are no timings. Hashtags: 4 to 6, always #LoreFell and #TTRPG, plus #ActualPlay and fitting ones. No em dashes, no cliches, no emoji, never invent what did not happen.' + styleRules();
    var user = 'Adventure: ' + (o.adv || '(unknown)') + '\nIts title now: ' + o.v.title + '\nIts description now:\n' + String(d.description || '').slice(0, 2000)
      + (chs.length ? '\n\nThe History\u2019s chapter titles, in order:\n' + chs.join('\n') : '')
      + (segs.length ? '\n\nTimed caption pieces (seconds: words):\n' + segs.map(function(g){ return g.s + ': ' + String(g.t).slice(0, 160); }).join('\n').slice(0, 60000) : '\n\nTranscript:\n' + String(d.captions || '').slice(0, 60000) + '\n(No timings: return an empty chapters list.)');
    return ai(sys, user, 1600, true).then(function(raw){
      var j = {}; try { j = JSON.parse(String(raw).replace(/```json|```/g, '').trim()); } catch(e){ var m = String(raw).match(/\{[\s\S]*\}/); try { j = m ? JSON.parse(m[0]) : {}; } catch(e2){ j = {}; } }
      var ch = (Array.isArray(j.chapters) ? j.chapters : []).map(function(c){ return { s:Math.max(0, parseInt(c.s, 10) || 0), t:noDash(c.title).trim() }; }).filter(function(c){ return c.t; }).sort(function(a, b){ return a.s - b.s; });
      if (ch.length){ ch[0].s = 0; ch = ch.filter(function(c, i){ return i === 0 || c.s - ch[i - 1].s >= 10; }); }
      var tags = (Array.isArray(j.hashtags) ? j.hashtags : ['#LoreFell', '#TTRPG', '#ActualPlay']).map(function(t){ t = String(t).replace(/\s+/g, ''); return t.charAt(0) === '#' ? t : '#' + t; }).slice(0, 6);
      var lines = [noDash(j.hook).trim(), '', noDash(j.teaser).trim()];
      if (ch.length >= 3) lines.push('', 'Chapters', ch.map(function(c){ return vdTime(c.s) + ' ' + c.t; }).join('\n'));
      lines.push('', 'Run your own adventure, or catch up on this one: https://www.lorefell.com', '', tags.join(' '));
      o.ep = noDash(j.episode || o.ep).trim(); o.title = vdTitle(o); o.desc = lines.join('\n');
      o.busy = false; o.msg = ch.length >= 3 ? '' : (segs.length ? '' : 'No chapters: this video has no timed captions yet.');
    });
  });
}
function vdGuessHistory(adv){ var a = String(adv || '').toLowerCase(); return vdHistories().filter(function(h){ return h.toLowerCase() === a; })[0] || ''; }
function vdTitle(o){ return (String(o.adv || '').trim() + (o.ep ? ' | ' + String(o.ep).trim() : '')).slice(0, 100); }
function paintVideoOpen(){
  var o = VD.open, h = '<div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">' + esc(o.v.title) + '</h2><button class="btn" onclick="VD.open=null;paint()">Back to the videos</button></div>';
  if (o.busy) return h + '<p class="lead">' + esc(o.msg) + '</p></div>';
  var chs = o.hist ? vdChapters(o.hist) : [];
  h += '<div class="row"><label class="f">The adventure<input class="t" id="vdAdv" value="' + esc(o.adv) + '" oninput="VD.open.adv=this.value;vdRetitle()"></label>'
    + '<label class="f">Its History in the FellGuide<select class="t" onchange="VD.open.hist=this.value;paint()"><option value="">None</option>' + vdHistories().map(function(n){ return '<option' + (o.hist === n ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select></label></div>'
    + '<div class="row">' + (chs.length ? '<label class="f">A chapter of that History<select class="t" onchange="if(this.value){VD.open.ep=this.value;document.getElementById(\'vdEp\').value=this.value;vdRetitle();}"><option value="">Choose a chapter…</option>' + chs.map(function(c){ return '<option' + (o.ep === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></label>' : '')
    + '<label class="f">The episode<input class="t" id="vdEp" value="' + esc(o.ep) + '" oninput="VD.open.ep=this.value;vdRetitle()"></label></div>'
    + '<label class="f" style="margin-top:6px">Title<input class="t" id="vdTitle" maxlength="100" value="' + esc(o.title) + '" oninput="VD.open.title=this.value"></label>'
    + '<label class="f" style="margin-top:10px">Description<textarea class="t" id="vdDesc" rows="16" oninput="VD.open.desc=this.value">' + esc(o.desc) + '</textarea></label>'
    + '<p class="lead" style="margin-top:6px">This replaces the video\u2019s whole title and description. ' + esc(o.msg || '') + '</p>'
    + '<div class="row"><button class="btn" onclick="vdOpen(' + o.i + ',true)">Write it again</button><button class="btn" onclick="vdSaveDraft()">Save draft</button><button class="btn pri" onclick="vdSend()">Update the video</button></div>';
  return h + '</div>';
}
function vdRetitle(){ var o = VD.open; o.title = vdTitle(o); var t = document.getElementById('vdTitle'); if (t) t.value = o.title; }
function vdSaveDraft(quiet){
  var o = VD.open; if (!o) return Promise.resolve();
  var dr = { adv:o.adv, ep:o.ep, hist:o.hist, title:o.title, desc:o.desc, at:Date.now() };
  o.v.draft = true;
  return api('/ax/draft', { k:vdKey(o.v.id) }, JSON.stringify(dr)).then(function(){ if (!quiet){ o.msg = 'Draft saved.'; paint(); } });
}
function vdSend(){
  var o = VD.open; if (!o) return;
  if (!confirm('Put this title and description up on YouTube? It replaces what is there now.')) return;
  o.busy = true; o.msg = 'Putting it up…'; paint();
  api('/ax/video/update', { v:o.v.id }, { title:o.title, description:o.desc }).then(function(){
    api('/ax/draft', { k:vdKey(o.v.id) }, ''); api('/ax/draft', { k:'vd:' + o.v.id }, String(Date.now()));
    o.v.title = o.title; o.v.draft = false; o.v.done = true; VD.msg = '\u201c' + o.title + '\u201d is up on YouTube.'; VD.open = null; paint();
  }).catch(function(e){ o.busy = false; o.msg = 'Not updated: ' + e.message; paint(); });
}
/* one after another, each kept as a draft, never put up */
function vdDraftRest(){
  if (VD.drafting || !Array.isArray(VD.list)) return;
  var todo = VD.list.map(function(v, i){ return i; }).filter(function(i){ return !VD.list[i].draft && !VD.list[i].done; });
  if (!todo.length){ VD.msg = 'Every video here has a draft or is updated.'; paint(); return; }
  VD.drafting = true; var n = 0;
  var step = function(){
    if (!todo.length){ VD.drafting = false; VD.msg = n + ' drafted. Open each to read it and put it up.'; paint(); return; }
    var i = todo.shift(), v = VD.list[i];
    VD.msg = 'Drafting ' + v.title + '… (' + todo.length + ' to go)'; paint();
    var o = { i:i, v:v, adv:String(v.title).split('|')[0].trim(), ep:(String(v.title).split('|').slice(1).join('|') || '').trim(), hist:'' };
    vdWrite(o).then(function(){ VD.open = o; return vdSaveDraft(true); }).then(function(){ VD.open = null; n++; setTimeout(step, 300); })
      .catch(function(e){ VD.open = null; VD.drafting = false; VD.msg = 'Stopped at ' + v.title + ': ' + e.message + (/quota/i.test(e.message) ? '. YouTube\u2019s allowance is spent for today; Draft the rest tomorrow.' : ''); paint(); });
  };
  step();
}

function stepBtn(n, t, d){ return '<li><button class="' + (AX.step === n ? 'on' : '') + '" onclick="AX.step=' + n + ';paint()"' + (AX.step === n ? ' aria-current="step"' : '') + '><span class="n">' + n + '</span><span><b>' + t + '</b><span class="d">' + d + '</span></span></button></li>'; }
function paintHistories(){
  var h = '<div class="steps"><ol>'
    + stepBtn(1, 'Choose a playlist', AX.pl ? esc(AX.pl.title) : 'One History per playlist')
    + stepBtn(2, 'Write the chapters', Object.keys(AX.notes).length + ' of ' + (AX.videos.length || 0) + ' episodes')
    + stepBtn(3, 'Write the world', 'People, places, beasts, things')
    + stepBtn(4, 'Review and send', Object.keys(AX.files).length + ' pages drafted')
    + '</ol><div class="panel">';
  if (AX.step === 1) h += paintStep1(); else if (AX.step === 2) h += paintStep2(); else if (AX.step === 3) h += paintStep3(); else h += paintStep4();
  return h + '</div></div>';
}
function paintStep1(){
  if (AX.playlists === null){ AX.playlists = 'loading'; api('/ax/playlists').then(function(d){ AX.playlists = d.items; paint(); }).catch(function(e){ AX.playlists = []; AX.err = e.message; paint(); }); }
  var h = '<h2>Choose a playlist</h2><p class="lead">Each playlist becomes one History, one chapter per episode. Pick an existing History to add to it instead of starting a new one.</p>';
  if (AX.playlists === 'loading') h += '<p class="lead">Reading your playlists…</p>';
  else if (!AX.playlists.length) h += '<div class="empty">' + esc(AX.err || 'No playlists on your channel yet.') + '</div>';
  else h += '<div class="pick">' + AX.playlists.map(function(p, i){ return '<button class="' + (AX.pl && AX.pl.id === p.id ? 'on' : '') + '" onclick="pickPlaylist(' + i + ')"><b>' + esc(p.title) + '</b><small>' + p.count + ' videos</small></button>'; }).join('') + '</div>';
  if (AX.pl){
    h += '<div class="row"><label class="f">The History\u2019s name<input class="t" id="hname" value="' + esc(AX.name) + '" oninput="AX.name=this.value"></label>'
      + '<label class="f">Or add to an existing History<select class="t" onchange="if(this.value){AX.name=this.value;AX.existing=this.value;document.getElementById(\'hname\').value=this.value;}"><option value="">A new History</option>' + (AX.histories || []).map(function(n){ return '<option' + (AX.existing === n ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select></label></div>'
      + '<div class="list">' + AX.videos.map(function(v, i){ return '<div class="it"><span class="num">' + (i + 1) + '</span><span class="ti">' + esc(v.title) + '<small>' + esc(new Date(v.at).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' })) + '</small></span><span class="mark ' + (AX.notes[v.id] ? 'done' : 'wait') + '">' + (AX.notes[v.id] ? 'written' : 'to write') + '</span></div>'; }).join('') + '</div>'
      + '<div class="row"><button class="btn pri" onclick="startHistory()">Use this History</button></div>';
  }
  return h;
}
function pickPlaylist(i){
  var p = AX.playlists[i]; AX.pl = { id:p.id, title:p.title }; AX.name = AX.name || p.title; AX.videos = [];
  paint();
  api('/ax/playlist', { id:p.id }).then(function(d){ AX.videos = d.items.sort(function(a, b){ return (a.pos || 0) - (b.pos || 0); }); paint(); }).catch(function(e){ alert(e.message); });
}
function startHistory(){
  if (!hist()){ alert('Give the History a name.'); return; }
  AX.notes = {}; AX.files = {};
  loadDraft().then(function(had){ AX.step = 2; AX.log = had ? 'Picked up the drafts kept for ' + hist() + '.' : ''; paint(); }).catch(function(){ AX.step = 2; paint(); });
}
function paintStep2(){
  var done = AX.videos.filter(function(v){ return AX.notes[v.id]; }).length;
  return '<h2>Write the chapters</h2><p class="lead">One chapter per episode, from its captions and description, in the FellGuide\u2019s voice. Captions cost YouTube allowance, so a long playlist may take more than one day; it picks up where it stopped.</p>'
    + '<div class="list">' + AX.videos.map(function(v, i){ var n = AX.notes[v.id]; return '<div class="it"><span class="num">' + (i + 1) + '</span><span class="ti">' + esc(n ? n.title : v.title) + '<small>' + esc(v.title) + '</small></span><span class="mark ' + (n ? 'done' : 'wait') + '">' + (n ? 'written' : 'to write') + '</span></div>'; }).join('') + '</div>'
    + '<div class="row"><button class="btn pri" onclick="writeChapters()"' + (AX.busy ? ' disabled' : '') + '>' + (AX.busy ? 'Writing…' : done ? 'Write the rest' : 'Write the chapters') + '</button>' + (done ? '<button class="btn" onclick="AX.step=3;paint()">On to the world</button>' : '') + '</div>'
    + '<div class="log" id="axlog" aria-live="polite">' + esc(AX.log || 'Ready.') + '</div>';
}
function paintStep3(){
  var ents = gatherEntities();
  return '<h2>Write the world</h2><p class="lead">Everyone and everything the chapters named, each a page under Characters, Locations, Bestiary or Artifacts. A page already in the FellGuide is updated with what is new, not replaced. Then the History\u2019s own page and its place in the order map.</p>'
    + (ents.length ? '<div class="list">' + ents.slice(0, 80).map(function(x){ var p = BASE + hist() + '/' + x.kind + '/' + safeName(x.name) + '.md'; return '<div class="it"><span class="num">' + x.kind.charAt(0) + '</span><span class="ti">' + esc(x.name) + '<small>' + esc(x.kind) + ', chapters ' + x.eps.join(', ') + '</small></span><span class="mark ' + (AX.files[p] ? 'done' : 'wait') + '">' + (AX.files[p] ? 'written' : 'to write') + '</span></div>'; }).join('') + '</div>' : '<div class="empty">Write the chapters first; the world comes from them.</div>')
    + '<div class="row"><button class="btn pri" onclick="writeWorld()"' + (AX.busy || !ents.length ? ' disabled' : '') + '>' + (AX.busy ? 'Writing…' : 'Write the world') + '</button><button class="btn" onclick="AX.step=4;paint()">Review</button></div>'
    + '<div class="log" id="axlog" aria-live="polite">' + esc(AX.log || 'Ready.') + '</div>';
}

/* ---- step 2: each episode a chapter ---- */
function styleRules(){ return AX.style ? '\n\nThe FellGuide\u2019s style rules, binding (especially its Never Use list):\n' + AX.style.slice(0, 9000) : ''; }
function writeChapters(){
  if (AX.busy) return; AX.busy = true; paint();
  var todo = AX.videos.map(function(v, i){ return { v:v, i:i }; }).filter(function(x){ return !AX.notes[x.v.id]; });
  var next = function(){
    if (!todo.length){ AX.busy = false; say('Every chapter is written.'); paint(); return; }
    var x = todo.shift(), n = x.i + 1;
    say('Episode ' + n + ': reading its captions…');
    api('/ax/video', { v:x.v.id, captions:1 }).then(function(d){
      if (!d.captions){ throw new Error(d.captionError || 'no captions yet'); }
      var prior = AX.videos.slice(0, x.i).map(function(v, k){ var nn = AX.notes[v.id]; return nn ? 'Chapter ' + (k + 1) + ', ' + nn.title + ': ' + nn.summary : ''; }).filter(Boolean).join('\n');
      var sys = 'You write one chapter of a History for the LoreFell FellGuide: the story of what happened in one episode of an actual-play tabletop game, told as grounded dark fantasy prose, past tense, third person, about the characters (the Fell) and the world, never about the players, the table, dice, rules or the stream. '
        + 'Write only what happened in the episode; never invent events, names or outcomes. Leave out table talk and rules. 900 to 1600 words. Start with a line "# " and the chapter\u2019s title (a few words drawn from the episode), then the prose in paragraphs. No headings inside, no lists, no em dashes.'
        + styleRules() + (AX.example ? '\n\nA chapter from another History, for voice and shape:\n' + AX.example : '');
      var user = 'History: ' + hist() + '\nEpisode ' + n + ' of the playlist: ' + x.v.title + '\nIts description:\n' + String(d.description || '').slice(0, 3000)
        + (prior ? '\n\nThe chapters before it, in short:\n' + prior : '') + '\n\nThe episode\u2019s transcript:\n' + String(d.captions).slice(0, 320000);
      say('Episode ' + n + ': writing the chapter…');
      return ai(sys, user, 4000, true).then(function(md){
        md = noDash(md).trim(); if (md.indexOf('# ') !== 0) md = '# ' + x.v.title + '\n\n' + md;
        var title = safeName(md.split('\n')[0].replace(/^#\s*/, '')) || ('Chapter ' + n);
        var path = BASE + hist() + '/Storyline/' + pad2(n) + ' - ' + title + '.md';
        say('Episode ' + n + ': noting who and what it named…');
        return ai('From this chapter of a History, return ONLY JSON: {"summary":"two sentences on what happened","entities":[{"kind":"Characters|Locations|Bestiary|Artifacts","name":"as written","facts":["one plain fact each, from the chapter only"]}]} . Characters are people and named beings; Bestiary is kinds of creatures; Artifacts are objects, rituals and powers; Locations are places. Up to 25 entities.', md, 1500, false).then(function(raw){
          var j = {}; try { j = JSON.parse(String(raw).replace(/```json|```/g, '').trim()); } catch(e){ var m = String(raw).match(/\{[\s\S]*\}/); try { j = m ? JSON.parse(m[0]) : {}; } catch(e2){ j = {}; } }
          AX.notes[x.v.id] = { n:n, title:title, path:path, summary:String(j.summary || ''), entities:Array.isArray(j.entities) ? j.entities : [] };
          AX.files[path] = { content:md, original:null, status:'new', approved:true };
          return saveFile(path).then(saveManifest).then(function(){ say('Episode ' + n + ': ' + title + ', written.'); paint(); });
        });
      });
    }).then(function(){ setTimeout(next, 300); }).catch(function(e){
      AX.busy = false; say('Episode ' + n + ' stopped: ' + e.message + (/quota|allowance/i.test(e.message) ? '. YouTube\u2019s allowance is spent for today; press Write the rest tomorrow.' : '. Press Write the rest to try again.')); paint();
    });
  };
  next();
}

/* ---- step 3: the people, places, beasts and things, then the History's page and the map ---- */
var KIND_OK = { Characters:1, Locations:1, Bestiary:1, Artifacts:1 };
function gatherEntities(){
  var map = {};
  AX.videos.forEach(function(v){ var nn = AX.notes[v.id]; if (!nn) return;
    (nn.entities || []).forEach(function(e){ var kind = KIND_OK[e.kind] ? e.kind : 'Characters', name = safeName(e.name); if (!name) return;
      var k = kind + '|' + name.toLowerCase(); var x = map[k] = map[k] || { kind:kind, name:name, facts:[], eps:[] };
      (e.facts || []).forEach(function(f){ x.facts.push('Chapter ' + nn.n + ': ' + f); }); if (x.eps.indexOf(nn.n) < 0) x.eps.push(nn.n); }); });
  return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a, b){ return b.eps.length - a.eps.length || a.name.localeCompare(b.name); });
}
function writeWorld(){
  if (AX.busy) return; AX.busy = true; paint();
  var ents = gatherEntities().slice(0, 80).filter(function(x){ return !AX.files[BASE + hist() + '/' + x.kind + '/' + safeName(x.name) + '.md']; });
  var next = function(){
    if (!ents.length) return writeRoot();
    var x = ents.shift(), path = BASE + hist() + '/' + x.kind + '/' + safeName(x.name) + '.md';
    say(x.kind + ': ' + x.name + '…');
    api('/ax/vault/file', { path:path }).then(function(cur){
      var sys = 'You write one page of the LoreFell FellGuide about a ' + x.kind.replace(/s$/, '').toLowerCase() + ' of a History: "# " and its name, then one to three paragraphs of grounded prose on who or what it is and what it did, from the facts given only. No lists, no headings inside, no em dashes.'
        + (cur.exists ? ' The page exists: keep everything in it, in its words, and weave in only what is new from the facts.' : '') + styleRules() + (AX.exampleChar ? '\n\nA page from another History, for voice and shape:\n' + AX.exampleChar : '');
      var user = 'History: ' + hist() + '\nName: ' + x.name + '\nFacts, by chapter:\n' + x.facts.join('\n') + (cur.exists ? '\n\nThe page as it is now:\n' + cur.content : '');
      return ai(sys, user, 1200, true).then(function(md){
        md = noDash(md).trim(); if (md.indexOf('# ') !== 0) md = '# ' + x.name + '\n\n' + md;
        AX.files[path] = { content:md, original:cur.exists ? cur.content : null, status:cur.exists ? 'changed' : 'new', approved:true };
        return saveFile(path).then(saveManifest).then(function(){ paint(); });
      });
    }).then(function(){ setTimeout(next, 200); }).catch(function(e){ AX.busy = false; say('Stopped at ' + x.name + ': ' + e.message + '. Press Write the world to go on.'); paint(); });
  };
  next();
}
function writeRoot(){
  var root = BASE + hist() + '/' + hist() + '.md';
  var chapters = AX.videos.map(function(v){ return AX.notes[v.id]; }).filter(Boolean).sort(function(a, b){ return a.n - b.n; });
  say('The History\u2019s own page…');
  api('/ax/vault/file', { path:root }).then(function(cur){
    return ai('Write the opening of a History\u2019s page for the LoreFell FellGuide: two short paragraphs that set up the story and pull the reader in, without spoiling its end, from the chapter summaries. Grounded, no em dashes, no headings, no lists.' + styleRules(), 'History: ' + hist() + '\n' + chapters.map(function(c){ return 'Chapter ' + c.n + ', ' + c.title + ': ' + c.summary; }).join('\n') + (cur.exists ? '\n\nIts page as it is now:\n' + cur.content : ''), 900, true).then(function(intro){
      var md = '# ' + hist() + '\n\n' + noDash(intro).trim() + '\n\n> [!note] Campaign\n>\n> A History of LoreFell.\n\n## Chapters\n\n| # | Chapter |\n| --- | --- |\n' + chapters.map(function(c){ return '| ' + c.n + ' | ' + c.title + ' |'; }).join('\n') + '\n';
      AX.files[root] = { content:md, original:cur.exists ? cur.content : null, status:cur.exists ? 'changed' : 'new', approved:true };
      return saveFile(root);
    });
  }).then(function(){ return writeNavMap(); }).then(function(){ AX.busy = false; say('The world is written. Review it before anything is sent.'); AX.step = 4; paint(); })
    .catch(function(e){ AX.busy = false; say('Stopped: ' + e.message); paint(); });
}
/* the order map: this History's block under The Histories, rebuilt from its pages */
function writeNavMap(){
  return api('/ax/vault/file', { path:NAVMAP }).then(function(cur){
    if (!cur.exists) return;
    var names = { Storyline:[], Characters:[], Locations:[], Bestiary:[], Artifacts:[] };
    Object.keys(AX.files).concat(AX.vaultFiles || []).forEach(function(p){ if (p.indexOf(BASE + hist() + '/') !== 0) return; var rest = p.slice((BASE + hist() + '/').length).split('/'); if (rest.length === 2 && names[rest[0]] && /\.md$/.test(rest[1])){ var n = rest[1].replace(/\.md$/, ''); if (names[rest[0]].indexOf(n) < 0) names[rest[0]].push(n); } });
    var I = '        ', block = [I + '- **' + hist() + '/**', I + '    - ' + hist()];
    ['Characters', 'Artifacts', 'Bestiary', 'Locations', 'Storyline'].forEach(function(s){ if (!names[s].length) return; block.push(I + '    - **' + s + '/**'); names[s].sort().forEach(function(n){ block.push(I + '        - ' + n); }); });
    var lines = cur.content.split('\n'), start = -1, end = -1, hi = lines.findIndex(function(l){ return /^ {4}- \*\*The Histories\/\*\*/.test(l); });
    if (hi < 0) return;
    var secEnd = lines.length; for (var i = hi + 1; i < lines.length; i++){ if (/^ {0,4}- /.test(lines[i])){ secEnd = i; break; } }
    for (var j = hi + 1; j < secEnd; j++){ if (lines[j] === I + '- **' + hist() + '/**'){ start = j; end = j + 1; while (end < secEnd && !/^ {8}- \*\*/.test(lines[end])) end++; break; } }
    if (start >= 0) lines.splice(start, end - start, block.join('\n'));
    else {
      var at = secEnd;
      for (var k = hi + 1; k < secEnd; k++){ var m = lines[k].match(/^ {8}- \*\*(.+)\/\*\*$/); if (m && m[1].localeCompare(hist()) > 0){ at = k; break; } }
      lines.splice(at, 0, block.join('\n'));
    }
    var md = lines.join('\n');
    AX.files[NAVMAP] = { content:md, original:cur.content, status:'changed', approved:true };
    return saveFile(NAVMAP).then(saveManifest);
  });
}

/* ---- step 4: the ledger, each page read and changed before it goes ---- */
function lineDiff(a, b){
  a = String(a || '').split('\n'); b = String(b || '').split('\n');
  var n = a.length, m = b.length; if (n * m > 4e6) return '<span class="a">' + esc(b.join('\n')) + '</span>';
  var L = []; for (var i = 0; i <= n; i++){ L.push(new Uint16Array(m + 1)); }
  for (i = n - 1; i >= 0; i--) for (var j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  var out = []; i = 0; j = 0;
  while (i < n && j < m){ if (a[i] === b[j]){ out.push(esc(a[i]) + '\n'); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]){ out.push('<span class="d">' + esc(a[i]) + '</span>'); i++; } else { out.push('<span class="a">' + esc(b[j]) + '</span>'); j++; } }
  while (i < n) out.push('<span class="d">' + esc(a[i++]) + '</span>'); while (j < m) out.push('<span class="a">' + esc(b[j++]) + '</span>');
  return out.join('');
}
function paintStep4(){
  var paths = Object.keys(AX.files).sort();
  if (!paths.length) return '<h2>Review and send</h2><div class="empty">Nothing drafted yet.</div>';
  if (!AX.sel || !AX.files[AX.sel]) AX.sel = paths[0];
  var groups = {}; paths.forEach(function(p){ var g = p === NAVMAP ? 'The order map' : (p.slice(BASE.length).split('/')[1] || 'The History'); if (/\.md$/.test(g)) g = 'The History'; (groups[g] = groups[g] || []).push(p); });
  var order = ['The History', 'Storyline', 'Characters', 'Locations', 'Bestiary', 'Artifacts', 'The order map'];
  var approved = paths.filter(function(p){ return AX.files[p].approved; }).length;
  var f = AX.files[AX.sel];
  var h = '<h2>Review and send</h2><p class="lead">Read each page, change anything, and untick what should not go. Send to the FellGuide commits the ticked pages to the vault; Obsidian pulls them, and you publish from Obsidian.</p>'
    + '<div class="review"><div class="ledger" role="list">' + order.filter(function(g){ return groups[g]; }).map(function(g){ return '<h3>' + g + '</h3>' + groups[g].map(function(p){ var x = AX.files[p];
        return '<div class="pg' + (p === AX.sel ? ' on' : '') + '" role="listitem" onclick="AX.sel=' + esc(JSON.stringify(p)).replace(/"/g, '&quot;') + ';paint()"><input type="checkbox"' + (x.approved ? ' checked' : '') + ' onclick="event.stopPropagation()" onchange="AX.files[' + esc(JSON.stringify(p)).replace(/"/g, '&quot;') + '].approved=this.checked;saveManifest();paint()" aria-label="Send this page"><span class="nm">' + esc(p.split('/').pop().replace(/\.md$/, '')) + '</span><span class="st ' + x.status + '">' + x.status + '</span></div>'; }).join(''); }).join('') + '</div>'
    + '<div class="page"><div class="path">' + esc(AX.sel) + '</div>'
    + (f.original != null ? '<div class="row"><button class="btn' + (AX.diff ? '' : ' pri') + '" onclick="AX.diff=false;paint()">Edit</button><button class="btn' + (AX.diff ? ' pri' : '') + '" onclick="AX.diff=true;paint()">What changed</button></div>' : '')
    + (f.original != null && AX.diff ? '<div class="diff">' + lineDiff(f.original, f.content) + '</div>' : '<textarea class="t" id="ped" rows="26" oninput="AX.files[AX.sel].content=this.value;clearTimeout(window._sv);window._sv=setTimeout(function(){saveFile(AX.sel);},800)">' + esc(f.content) + '</textarea>')
    + '</div></div>'
    + '<div class="row"><button class="btn pri" onclick="sendIt()"' + (AX.busy || !approved ? ' disabled' : '') + '>' + (AX.busy ? 'Sending…' : 'Send ' + approved + ' page' + (approved === 1 ? '' : 's') + ' to the FellGuide') + '</button><button class="btn" onclick="dropAll()">Drop these drafts</button></div>'
    + '<div class="log" id="axlog" aria-live="polite">' + esc(AX.log || '') + '</div>';
  return h;
}
function sendIt(){
  var paths = Object.keys(AX.files).filter(function(p){ return AX.files[p].approved; });
  if (!paths.length || AX.busy) return;
  if (!confirm('Send ' + paths.length + ' pages to the FellGuide? They go to the vault\u2019s main branch, and Obsidian pulls them.')) return;
  AX.busy = true; paint();
  api('/ax/vault/commit', {}, { message:'The Anexanum: ' + hist(), files:paths.map(function(p){ return { path:p, content:AX.files[p].content }; }) }).then(function(r){
    say('Sent ' + r.files + ' pages to the FellGuide. Pull in Obsidian, then publish.');
    paths.forEach(function(p){ AX.files[p].status = 'sent'; AX.files[p].approved = false; api('/ax/draft', { k:hkey() + ':f:' + p }, ''); });
    AX.busy = false; return saveManifest().then(paint);
  }).catch(function(e){ AX.busy = false; say('Not sent: ' + e.message); paint(); });
}
function dropAll(){
  if (!confirm('Drop every draft for ' + hist() + '? Pages already sent stay in the FellGuide.')) return;
  Object.keys(AX.files).forEach(function(p){ api('/ax/draft', { k:hkey() + ':f:' + p }, ''); });
  api('/ax/draft', { k:hkey() + ':m' }, ''); AX.files = {}; AX.notes = {}; AX.step = 1; paint();
}
boot();
</script>
