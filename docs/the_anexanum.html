<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Anexanum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* The Anexanum: Nate's lore desk. A scriptorium, not a dashboard: ink, parchment and gold,
   with verdigris for what is new and rust for what is changed. One memorable thing: the
   ledger of pages on the review step. */
:root{ --ink:#0d1222; --ink2:#131a2e; --line:#26324c; --parch:#e9e2cf; --dim:#9aa6b8; --gold:#c9a84c; --gold2:#f0d48a; --verd:#7fb3a3; --rust:#d08a6e; }
*{ box-sizing:border-box; }
html, body{ margin:0; min-height:100%; background:var(--ink); color:var(--parch); font-family:'Crimson Pro', Georgia, serif; font-size:18px; line-height:1.5; }
button, input, select, textarea{ font:inherit; color:inherit; }
a{ color:var(--gold); } a:hover{ color:var(--gold2); }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.wrap{ max-width:1180px; margin:0 auto; padding:28px 24px 60px; }
header.top{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:22px; }
h1{ margin:0; font-family:Cinzel, serif; font-weight:600; font-size:2.1rem; letter-spacing:.04em; color:var(--gold); }
.sub{ color:var(--dim); font-size:1rem; margin-top:2px; }
.status{ display:flex; gap:14px; align-items:center; font-size:.95rem; color:var(--dim); flex-wrap:wrap; }
.status b{ font-weight:500; } .status .ok{ color:var(--verd); } .status .no{ color:var(--rust); }
nav.tabs{ display:flex; gap:6px; margin-bottom:22px; }
nav.tabs button{ height:40px; padding:0 18px; border-radius:9px; border:1px solid var(--line); background:none; color:var(--dim); font-family:Cinzel, serif; font-size:.85rem; letter-spacing:.05em; cursor:pointer; }
nav.tabs button.on{ color:var(--gold); border-color:rgba(201,168,76,.6); background:rgba(201,168,76,.08); }
.steps{ display:grid; grid-template-columns:240px minmax(0,1fr); gap:28px; }
.steps ol{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; counter-reset:s; }
.steps li button{ width:100%; text-align:left; display:grid; grid-template-columns:30px 1fr; gap:10px; align-items:start; padding:10px 12px; border-radius:10px; border:1px solid transparent; background:none; cursor:pointer; color:var(--dim); }
.steps li button .n{ font-family:Cinzel, serif; color:var(--gold); font-size:1rem; padding-top:1px; }
.steps li button b{ display:block; color:var(--parch); font-weight:600; font-size:1rem; } .steps li button span.d{ font-size:.88rem; }
.steps li button.on{ border-color:var(--line); background:var(--ink2); }
.panel{ min-width:0; }
.panel h2{ margin:0 0 6px; font-family:Cinzel, serif; font-weight:600; font-size:1.3rem; color:var(--parch); }
.panel p.lead{ margin:0 0 16px; color:var(--dim); max-width:68ch; }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:10px 0; }
label.f{ display:flex; flex-direction:column; gap:4px; font-size:.9rem; color:var(--dim); min-width:240px; flex:1; }
input.t, select.t, textarea.t{ background:var(--ink2); border:1px solid var(--line); border-radius:8px; padding:9px 11px; color:var(--parch); }
textarea.t{ width:100%; resize:vertical; line-height:1.55; font-size:1rem; }
.btn{ height:40px; padding:0 16px; border-radius:9px; border:1px solid var(--line); background:var(--ink2); color:var(--parch); font-family:Cinzel, serif; font-size:.8rem; letter-spacing:.05em; cursor:pointer; }
.btn.pri{ background:var(--gold); border-color:var(--gold); color:#0a0e1a; } .btn.pri:hover{ background:#d8b85c; }
.btn[disabled]{ opacity:.45; cursor:default; }
.list{ display:flex; flex-direction:column; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.list .it{ display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 14px; border-bottom:1px solid #1a2338; }
.list .it:last-child{ border-bottom:0; } .list .it .num{ font-family:Cinzel, serif; color:var(--gold); }
.list .it .ti{ min-width:0; } .list .it .ti small{ display:block; color:var(--dim); font-size:.85rem; }
.mark{ font-size:.85rem; } .mark.done{ color:var(--verd); } .mark.wait{ color:var(--dim); } .mark.err{ color:var(--rust); }
.pick{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:10px; }
.pick button{ text-align:left; padding:12px 14px; border-radius:11px; border:1px solid var(--line); background:var(--ink2); cursor:pointer; }
.pick button b{ display:block; font-family:Cinzel, serif; font-weight:600; font-size:1rem; } .pick button small{ color:var(--dim); }
.pick button.on{ border-color:var(--gold); }
.log{ margin-top:14px; padding:12px 14px; border-left:2px solid var(--gold); background:var(--ink2); color:var(--dim); font-size:.95rem; white-space:pre-wrap; max-height:220px; overflow:auto; }
/* the review: the ledger of pages and the page itself */
.review{ display:grid; grid-template-columns:320px minmax(0,1fr); gap:22px; align-items:start; }
.ledger{ border:1px solid var(--line); border-radius:12px; overflow:auto; max-height:72vh; }
.ledger h3{ margin:0; padding:10px 14px 6px; font-family:Cinzel, serif; font-weight:600; font-size:.85rem; letter-spacing:.06em; color:var(--gold); background:var(--ink); position:sticky; top:0; }
.ledger .pg{ display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:8px; align-items:center; padding:7px 14px; cursor:pointer; border-left:3px solid transparent; }
.ledger .pg:hover{ background:var(--ink2); } .ledger .pg.on{ background:var(--ink2); border-left-color:var(--gold); }
.ledger .pg input{ width:16px; height:16px; accent-color:var(--gold); }
.ledger .pg .nm{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ledger .pg .st{ font-size:.8rem; } .st.new{ color:var(--verd); } .st.changed{ color:var(--rust); } .st.same{ color:var(--dim); }
.page{ border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--ink2); }
.page .path{ font-size:.85rem; color:var(--dim); margin-bottom:8px; word-break:break-all; }
.diff{ font-size:.95rem; line-height:1.55; white-space:pre-wrap; max-height:60vh; overflow:auto; padding:10px; border-radius:8px; background:var(--ink); }
.diff .a{ background:rgba(127,179,163,.16); display:block; } .diff .d{ background:rgba(208,138,110,.16); text-decoration:line-through; display:block; color:var(--dim); }
.empty{ padding:28px; border:1px dashed var(--line); border-radius:12px; color:var(--dim); }
.gate{ max-width:560px; margin:12vh auto; text-align:center; } .gate h1{ font-size:2.6rem; }
@media (max-width:860px){
  .steps, .review{ grid-template-columns:1fr; }
  .steps ol{ flex-direction:row; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:4px; }
  .steps li button{ min-width:190px; scroll-snap-align:start; }
  .ledger{ max-height:40vh; }
}
@media (max-width:640px){
  html, body{ font-size:17px; }
  .wrap{ padding:16px 14px 48px; }
  header.top{ flex-direction:column; align-items:flex-start; gap:8px; }
  h1{ font-size:1.7rem; }
  nav.tabs{ display:grid; grid-template-columns:1fr 1fr; }
  nav.tabs button{ height:44px; }
  .btn{ height:44px; }
  .row{ gap:8px; }
  .row .btn{ flex:1 1 auto; }
  label.f{ min-width:0; flex:1 1 100%; }
  input.t, select.t{ min-height:44px; font-size:16px; }
  textarea.t{ font-size:16px; }
  /* a list row: the words on top, its buttons wrapping beneath */
  .list .it{ grid-template-columns:30px minmax(0,1fr); align-items:start; }
  .list .it > :last-child:not(.ti){ grid-column:1 / -1; justify-self:stretch; }
  .list .it > .row:last-child{ display:flex; flex-wrap:wrap; }
  .list .it > .row:last-child .btn{ flex:1 1 calc(33% - 6px); min-width:0; padding:0 8px; font-size:.72rem; }
  .pick{ grid-template-columns:1fr; }
  .page{ padding:12px; }
  .diff{ max-height:50vh; }
  .log{ max-height:160px; }
}
.fsbtn{ height:36px; padding:0 12px; border-radius:9px; border:1px solid var(--line); background:none; color:var(--dim); font-family:Cinzel, serif; font-size:.72rem; letter-spacing:.05em; cursor:pointer; }
.fsbtn:hover{ color:var(--gold); border-color:rgba(201,168,76,.6); }
@media (max-width:860px), (pointer:coarse){ .fsbtn{ display:none; } }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="gate"><h1>The Anexanum</h1><p class="sub">Opening the archive…</p></div></div>
<script>
/* ---- talking to the page (a ticket) and to the room (everything else) ---- */
var ROOM = 'https://lorefell-table.nate8-johnson.workers.dev';
var AI = 'https://lorefell-ai.nate8-johnson.workers.dev/';
var BASE = 'The FellGuide/The FellGuide/The Lore (Contains Spoilers)/The Histories/';
var NAVMAP = '_Canon/NAV_ORDER_MAP.md';
var SECTIONS = ['Storyline', 'Characters', 'Locations', 'Bestiary', 'Artifacts'];
var _rid = 0, _wait = {};
window.addEventListener('message', function(e){ var m = e.data || {}; if (m.type === 'AX_REPLY' && _wait[m.id]){ _wait[m.id](m); delete _wait[m.id]; } });
function askPage(type){ return new Promise(function(res, rej){ var id = ++_rid; _wait[id] = function(m){ m.ok ? res(m.data) : rej(new Error((m.data && m.data.error) || 'no answer')); }; try { parent.postMessage({ type:type, id:id }, '*'); } catch(e){ rej(e); } setTimeout(function(){ if (_wait[id]){ delete _wait[id]; rej(new Error('the page did not answer: paste velo/page-the_anexanum.js')); } }, 20000); }); }
var TICKET = '';
function api(path, params, body){
  var q = Object.keys(params || {}).map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(ROOM + path + '?t=' + encodeURIComponent(TICKET) + (q ? '&' + q : ''), body !== undefined ? { method:'POST', body:typeof body === 'string' ? body : JSON.stringify(body) } : {})
    .then(function(r){ return r.json(); }).then(function(d){ if (!d || d.ok === false) throw new Error((d && d.error) || 'no answer'); return d; });
}
function ai(system, user, max, smart){
  return fetch(AI, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ system:system, messages:[{ role:'user', content:user }], max_tokens:max || 900, model:smart ? 'smart' : 'fast' }) })
    .then(function(r){ if (r.status === 429) throw new Error('too many requests just now: wait a minute'); return r.json(); })
    .then(function(d){ if (!d || d.ok === false) throw new Error((d && d.error) ? String(d.error).slice(0, 160) : 'no text'); return d.text || ''; });
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function slug(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60); }
function safeName(s){ return String(s || '').replace(/[\\/:*?"<>|#^\[\]]/g, '').replace(/\s+/g, ' ').trim().slice(0, 90); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function noDash(t){ return String(t || '').replace(/\s*\u2014\s*/g, ', ').replace(/\s*\u2013\s*/g, ', '); }

/* ---- state ---- */
var AX = { tab:'histories', step:1, who:null, playlists:null, pl:null, videos:[], name:'', existing:'', histories:[], style:'', example:'', exampleChar:'',
           notes:{}, files:{}, sel:'', busy:false, log:'', diff:true, names:{}, toldThrough:0, fixVault:true, refNames:null };
function hist(){ return safeName(AX.name); }
function hkey(){ return 'h:' + slug(AX.name); }
function say(t){ AX.log = (AX.log ? AX.log + '\n' : '') + t; var el = document.getElementById('axlog'); if (el){ el.textContent = AX.log; el.scrollTop = el.scrollHeight; } }

/* ---- drafts kept in the room until sent: a manifest of notes and file paths, and each file ---- */
function saveManifest(){ return api('/ax/draft', { k:hkey() + ':m' }, JSON.stringify({ name:AX.name, pl:AX.pl, notes:AX.notes, names:AX.names, toldThrough:AX.toldThrough, files:Object.keys(AX.files).map(function(p){ return { p:p, approved:AX.files[p].approved, status:AX.files[p].status, del:!!AX.files[p].del }; }) })); }
function saveFile(path){ var f = AX.files[path]; return api('/ax/draft', { k:hkey() + ':f:' + path }, f.content); }
function loadDraft(){
  return api('/ax/draft', { k:hkey() + ':m' }).then(function(d){
    if (!d.v) return false;
    var m = JSON.parse(d.v); AX.notes = m.notes || {}; AX.names = m.names || {}; AX.toldThrough = m.toldThrough || 0;
    return Promise.all((m.files || []).map(function(f){ return api('/ax/draft', { k:hkey() + ':f:' + f.p }).then(function(x){ AX.files[f.p] = { content:x.v || '', original:null, status:f.status || 'new', approved:f.approved !== false, del:!!f.del }; }); })).then(function(){ return true; });
  });
}

/* ---- the start ---- */
/* F, anywhere but a text box, toggles full screen on a desktop */
function toggleFull(){
  try {
    var el = document.documentElement, rf = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!document.fullscreenElement && !document.webkitFullscreenElement){ if (rf){ var pr = rf.call(el); if (pr && pr.catch) pr.catch(function(){}); } }
    else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } catch(e){}
}
document.addEventListener('keydown', function(e){
  if (e.key !== 'f' && e.key !== 'F') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  e.preventDefault(); toggleFull();
});
function boot(){
  askPage('AX_TICKET').then(function(r){ TICKET = r.ticket; return api('/ax/whoami'); })
    .then(function(w){ AX.who = w; paint(); loadVaultBasics(); })
    .catch(function(e){ document.getElementById('app').innerHTML = '<div class="gate"><h1>The Anexanum</h1><p class="sub">' + esc(e.message || 'Not open.') + '</p></div>'; });
}
function loadVaultBasics(){
  if (!AX.who || !AX.who.vault) return;
  api('/ax/vault/list', { prefix:BASE }).then(function(d){
    var set = {}; d.files.forEach(function(p){ var rest = p.slice(BASE.length), i = rest.indexOf('/'); if (i > 0) set[rest.slice(0, i)] = 1; });
    AX.histories = Object.keys(set).sort(); AX.vaultFiles = d.files; paint();
  }).catch(function(){});
  api('/ax/vault/file', { path:'_Canon/STYLE.md' }).then(function(d){ AX.style = d.content || ''; }).catch(function(){});
  api('/ax/vault/file', { path:BASE + 'A Court of Ashes/Storyline/01 - Heirs of Rot.md' }).then(function(d){ AX.example = (d.content || '').slice(0, 3500); }).catch(function(){});
  api('/ax/vault/file', { path:BASE + 'A Court of Ashes/Characters/Kethra Valis.md' }).then(function(d){ AX.exampleChar = d.content || ''; }).catch(function(){});
}

/* ---- painting ---- */
function paint(){
  var w = AX.who || {};
  var h = '<header class="top"><div><h1>The Anexanum</h1><div class="sub">Where the lore is kept. Nothing reaches the FellGuide until you send it.</div></div>'
    + '<div class="status"><button class="fsbtn" onclick="toggleFull()" title="Full screen (F)">Full screen</button><span>YouTube <b class="' + (w.youtube ? 'ok' : 'no') + '">' + (w.youtube ? 'connected' : 'not set') + '</b></span><span>The vault <b class="' + (w.vault ? 'ok' : 'no') + '">' + (w.vault ? 'open' : 'no key yet') + '</b></span></div></header>'
    + '<nav class="tabs" aria-label="The Anexanum"><button class="' + (AX.tab === 'histories' ? 'on' : '') + '" onclick="AX.tab=\'histories\';paint()">The Histories</button><button class="' + (AX.tab === 'videos' ? 'on' : '') + '" onclick="AX.tab=\'videos\';paint()">The videos</button></nav>';
  h += AX.tab === 'histories' ? paintHistories() : paintVideos();
  document.getElementById('app').innerHTML = h;
  var lg = document.getElementById('axlog'); if (lg) lg.scrollTop = lg.scrollHeight;
}
/* ---- a transcript file instead of YouTube's captions ----
   An .srt, .vtt or .sbv file (from Restream, YouTube Studio, or anywhere) gives the lines with
   their times, so the recap and its clips work without spending YouTube's allowance; a plain
   .txt gives the words alone, enough for the recap but not for choosing clips. */
function txTime(t){ var m = String(t).trim().replace(',', '.').match(/^(?:(\d+):)?(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?$/); if (!m) return null; return (+(m[1] || 0)) * 3600 + (+m[2]) * 60 + (+m[3]) + (m[4] ? +('0.' + m[4]) : 0); }
function txParse(name, text){
  text = String(text || '').replace(/\r/g, '');
  var lines = [], ext = (String(name).split('.').pop() || '').toLowerCase();
  text.split(/\n\s*\n/).forEach(function(blk){
    var rows = blk.split('\n').filter(function(r){ return r.trim(); }); if (!rows.length) return;
    var ti = -1, s = null, e = null;
    for (var i = 0; i < rows.length; i++){
      var m = rows[i].match(/^\s*([\d:.,]+)\s*-->\s*([\d:.,]+)/) || rows[i].match(/^\s*(\d+:\d{2}:\d{2}\.\d{1,3}),(\d+:\d{2}:\d{2}\.\d{1,3})\s*$/);
      if (m){ s = txTime(m[1]); e = txTime(m[2]); ti = i; break; }
    }
    if (ti < 0 || s === null) return;
    var t = rows.slice(ti + 1).join(' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
    if (t) lines.push({ s:Math.round(s * 10) / 10, e:Math.round((e === null ? s + 2 : e) * 10) / 10, t:t.slice(0, 200) });
  });
  if (!lines.length){
    var stamped = [];
    text.split('\n').forEach(function(row){
      var m = row.match(/^\s*[\[(]?\s*((?:\d+:)?\d{1,2}:\d{2}(?:[.,]\d{1,3})?)\s*[\])]?\s*[-\u2013:|]?\s*(.*)$/);
      if (m && m[2].trim()){ var st = txTime(m[1]); if (st !== null) stamped.push({ s:Math.round(st * 10) / 10, t:m[2].replace(/<[^>]+>/g, '').trim().slice(0, 200) }); }
      else if (stamped.length && row.trim()) stamped[stamped.length - 1].t = (stamped[stamped.length - 1].t + ' ' + row.trim()).slice(0, 200);
    });
    if (stamped.length >= 3){
      stamped.forEach(function(l, i){ var nx = stamped[i + 1]; l.e = nx ? Math.max(l.s + 0.5, Math.min(nx.s, l.s + Math.max(2, l.t.split(/\s+/).length * 0.4))) : l.s + 3; l.e = Math.round(l.e * 10) / 10; });
      lines = stamped;
    }
  }
  if (!lines.length) return { lines:[], text:text.replace(/\s+/g, ' ').trim() };
  return { lines:lines, text:lines.map(function(l){ return l.t; }).join(' ') };
}
function rpFromFile(input, vidIndex){
  var f = input.files && input.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    var got = txParse(f.name, rd.result);
    var v = (vidIndex !== undefined && VD.list && VD.list[vidIndex]) ? VD.list[vidIndex] : { id:'', title:f.name.replace(/\.[^.]+$/, '') };
    RP = { v:v, busy:false, msg:'', clips:[], moments:(RP && RP.v && RP.v.id === v.id) ? RP.moments : [], lines:got.lines, plain:got.lines.length ? '' : got.text, fromFile:f.name, recap:'' };
    VD.open = null;
    if (!got.lines.length && !got.text){ RP.msg = 'Nothing readable in that file.'; paint(); return; }
    if (v.id) api('/ax/draft', { k:'mo:' + v.id }).then(function(d){ try { RP.moments = JSON.parse(d.v || '[]'); } catch(e){} }).catch(function(){});
    rpRecap().then(function(){ if (RP.recap && RP.lines.length) return rpPick(); if (RP.recap && !RP.lines.length){ RP.msg = 'This file has no times in it, so the recap is written but clips cannot be chosen. Make a timed transcript from the recording with the Recap Cutter (Make a transcript), then use that .srt here.'; paint(); } });
  };
  rd.readAsText(f);
}
function rpFileBtn(vidIndex){ return '<label class="btn" style="display:inline-flex;align-items:center;cursor:pointer">Use a transcript file<input type="file" accept=".srt,.vtt,.sbv,.txt" style="display:none" onchange="rpFromFile(this' + (vidIndex !== undefined ? ',' + vidIndex : '') + ')"></label>'; }
/* ================= a recap video, planned =================
   For one session video: the moments marked at the table (kept and suggested), and the
   captions line by line. The AI picks six to eight clips of three to five seconds, in story
   order, thirty to forty seconds in all: the funny, the triumphs, the disasters, the epic and
   the drama. Nate watches each, trims or drops any, adds a moment, and downloads the plan for
   the Recap Cutter on his own machine. Only here, only for him. */
var RP = null;
function rpOpen(i){
  var v = VD.list[i]; if (!v) return;
  RP = { v:v, busy:true, msg:'Reading the captions and the moments…', clips:[], moments:[], lines:[] };
  VD.open = null; paint();
  RP.idx = i;
  Promise.all([api('/ax/video', { v:v.id, captions:1, lines:1 }).catch(function(e){ return { lines:[], captionError:e.message }; }), api('/ax/draft', { k:'mo:' + v.id }), api('/ax/draft', { k:'rp:' + v.id })]).then(function(r){
    if (r[0].captionError) RP.capErr = r[0].captionError;
    RP.lines = r[0].lines || []; RP._ends = null; RP._starts = null;
    try { RP.moments = JSON.parse(r[1].v || '[]'); } catch(e){ RP.moments = []; }
    if (r[2].v){ try { var dr = JSON.parse(r[2].v); RP.clips = dr.clips || []; RP.recap = dr.recap || ''; RP.busy = false; RP.msg = 'Your plan from ' + new Date(dr.at).toLocaleDateString(undefined, { month:'short', day:'numeric' }) + '.'; paint(); return; } catch(e){} }
    return rpRecap().then(function(){ if (RP.recap) return rpPick(); });
  }).catch(function(e){ RP.busy = false; RP.msg = e.message; paint(); });
}
/* The spine of the recap video is the story: first a short recap of the session, the same

function vdSend(){

    api('/ax/draft', { k:vdKey(o.v.id) }, ''); api('/ax/draft', { k:'vd:' + o.v.id }, String(Date.now()));

/* one after another, each kept as a draft, never put up */
function vdDraftRest(){
  if (VD.drafting || !Array.isArray(VD.list)) return;
  var todo = VD.list.map(function(v, i){ return i; }).filter(function(i){ return !VD.list[i].draft && !VD.list[i].done; });
  if (!todo.length){ VD.msg = 'Every video here has a draft or is updated.'; paint(); return; }
  VD.drafting = true; var n = 0;
  var step = function(){
    if (!todo.length){ VD.drafting = false; VD.msg = n + ' drafted. Open each to read it and put it up.'; paint(); return; }
    var i = todo.shift(), v = VD.list[i];
    VD.msg = 'Drafting ' + v.title + '… (' + todo.length + ' to go)'; paint();
    var o = { i:i, v:v, adv:String(v.title).split('|')[0].trim(), ep:(String(v.title).split('|').slice(1).join('|') || '').trim(), hist:'' };
    vdWrite(o).then(function(){ VD.open = o; return vdSaveDraft(true); }).then(function(){ VD.open = null; n++; setTimeout(step, 300); })
      .catch(function(e){ VD.open = null; VD.drafting = false; VD.msg = 'Stopped at ' + v.title + ': ' + e.message + (/quota/i.test(e.message) ? '. YouTube\u2019s allowance is spent for today; Draft the rest tomorrow.' : ''); paint(); });
  };
  step();
}

/* ---- what the FellGuide already holds for this History ----
   A History added to keeps its own chapters. Chapters already sent are matched to the vault
   by their path, or by their title when they have been renumbered there; a chapter sent and
   since taken out of the vault (a duplicate of one already told) is marked told, so it is not
   written again and does not come back in the chapters table. Episodes the vault's own
   chapters already tell are skipped (Already told through), and new chapters number on from
   the last one there. */
function histFiles(sec){ var pre = BASE + hist() + '/' + (sec ? sec + '/' : ''); return (AX.vaultFiles || []).filter(function(p){ return p.indexOf(pre) === 0 && /\.md$/.test(p); }); }
function chNum(p){ var m = String(p).split('/').pop().match(/^(\d+)\s*-\s*/); return m ? +m[1] : 0; }
function chTitle(p){ return String(p).split('/').pop().replace(/^\d+\s*-\s*/, '').replace(/\.md$/, ''); }
function storyPaths(){
  var pre = BASE + hist() + '/Storyline/', set = {};
  histFiles('Storyline').forEach(function(p){ set[p] = 1; });
  Object.keys(AX.files).forEach(function(p){ if (p.indexOf(pre) === 0){ if (AX.files[p].del) delete set[p]; else set[p] = 1; } });
  return Object.keys(set).sort(function(a, b){ return chNum(a) - chNum(b); });
}
function nextChapterNum(){ var top = 0; storyPaths().forEach(function(p){ top = Math.max(top, chNum(p)); }); return top + 1; }
function reconcile(){
  var ex = histFiles('Storyline'), moved = 0, told = 0;
  AX.videos.forEach(function(v){
    var n = AX.notes[v.id]; if (!n || n.told) return;
    var f = AX.files[n.path]; if (f && f.status !== 'sent') return;
    if (ex.indexOf(n.path) >= 0) return;
    var same = ex.filter(function(p){ return chTitle(p).toLowerCase() === String(n.title).toLowerCase(); })[0];
    if (same){ n.path = same; n.n = chNum(same); moved++; } else { n.told = true; told++; }
  });
  if (!AX.toldThrough && ex.length && !Object.keys(AX.notes).length) AX.toldThrough = Math.min(AX.videos.length, ex.length);
  if (moved || told) saveManifest();
  return (moved ? moved + ' chapter' + (moved === 1 ? '' : 's') + ' found renumbered in the FellGuide. ' : '') + (told ? told + ' chapter' + (told === 1 ? ' was' : 's were') + ' taken out of the FellGuide as already told, and will not be written again.' : '');
}
function epTold(v, i){ var n = AX.notes[v.id]; return (n && n.told) || (!n && i < AX.toldThrough); }

      + '<p class="lead">Those are skipped, never written twice. New chapters number on from chapter ' + (nextChapterNum() - 1) + '.</p>' : '')
    + '<div class="list">' + AX.videos.map(function(v, i){ var n = AX.notes[v.id], t = epTold(v, i); return '<div class="it"><span class="num">' + (i + 1) + '</span><span class="ti">' + esc(n && !n.told ? n.title : v.title) + '<small>' + esc(n && !n.told ? 'Chapter ' + n.n + ' \u00b7 ' + v.title : v.title) + '</small></span><span class="mark ' + (n || t ? 'done' : 'wait') + '">' + (t ? 'already told' : n ? 'written' : 'to write') + '</span></div>'; }).join('') + '</div>'

    + '<div class="log" id="axlog" aria-live="polite">' + esc(AX.log || 'Ready.') + '</div>';

/* ================= step 3: the names, spelled right =================
   The captions hear names, they do not spell them, so the chapters come back with Krathor for
   Kray-Thor and Aantha for Acantha. Every name the chapters noted is listed here with what
   the FellGuide already holds (this History's own pages first, then every page in the vault),
   and a likely match is offered. Correct any; Use these names puts them into every drafted
   chapter, into the chapters already in the FellGuide when that is ticked, and into what is
   written next: the world, the History's page, and any chapter written later. Kept with the
   History's drafts. A chapter whose title changes is renamed, the old page taken out. */
function reEsc(t){ return String(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function nameRe(from){ return new RegExp('(^|[^\\p{L}\\p{N}\'’-])' + reEsc(from) + '(?=$|[^\\p{L}\\p{N}-])', 'gu'); }
function nameFor(n){ var seen = 0; n = String(n || ''); while (AX.names[n] && seen++ < 5) n = AX.names[n]; return n; }
function applyNames(t){
  var keys = Object.keys(AX.names).filter(function(k){ return AX.names[k] && AX.names[k] !== k; }).sort(function(a, b){ return b.length - a.length; });
  keys.forEach(function(k){ t = String(t).replace(nameRe(k), function(m, pre){ return pre + nameFor(k); }); });
  return t;
}
function namesRule(){
  var keys = Object.keys(AX.names).filter(function(k){ return AX.names[k] && AX.names[k] !== k; });
  var keep = {}; histPages().forEach(function(x){ keep[x.name] = 1; }); keys.forEach(function(k){ keep[nameFor(k)] = 1; });
  var list = Object.keys(keep);
  if (!list.length) return '';
  return '\n\nNames in this History, spelled exactly so (the transcript mishears them): ' + list.join(', ') + '.' + (keys.length ? ' Never write ' + keys.map(function(k){ return '"' + k + '" (write "' + nameFor(k) + '")'; }).join(', ') + '.' : '');
}
/* the pages this History already has, by kind: the surest spellings there are */
function histPages(){ var out = []; ['Characters', 'Locations', 'Bestiary', 'Artifacts'].forEach(function(sec){ histFiles(sec).forEach(function(p){ out.push({ kind:sec, name:p.split('/').pop().replace(/\.md$/, ''), own:true }); }); }); return out; }
function loadRefNames(){
  if (AX.refNames) return Promise.resolve(AX.refNames);
  AX.refNames = [];
  return api('/ax/vault/list', { prefix:'The FellGuide/' }).then(function(d){
    var set = {}; d.files.forEach(function(p){ if (!/\.md$/.test(p) || /\/(Images|Storyline)\//.test(p)) return; var n = p.split('/').pop().replace(/\.md$/, '').replace(/^\d+\s*-\s*/, ''); if (n.length > 2 && n.length < 40) set[n] = 1; });
    AX.refNames = Object.keys(set); if (AX.step === 3) paint(); return AX.refNames;
  }).catch(function(){ return []; });
}
function nameKey(n){ return String(n || '').toLowerCase().replace(/^the\s+/, '').replace(/[^a-z0-9]/g, ''); }
function lev(a, b){ var m = a.length, n = b.length; if (!m) return n; if (!n) return m; var d = []; for (var i = 0; i <= n; i++) d[i] = i; for (var x = 1; x <= m; x++){ var prev = d[0]; d[0] = x; for (var y = 1; y <= n; y++){ var t = d[y]; d[y] = Math.min(d[y] + 1, d[y - 1] + 1, prev + (a[x - 1] === b[y - 1] ? 0 : 1)); prev = t; } } return d[n]; }
function likeness(a, b){ a = nameKey(a); b = nameKey(b); if (!a || !b) return 0; if (a === b) return 1; if (a.length > 3 && b.length > 3 && (a.indexOf(b) >= 0 || b.indexOf(a) >= 0)) return .8; return 1 - lev(a, b) / Math.max(a.length, b.length); }
/* the likeliest right spelling: this History's own pages first, then the vault, then the
   names that come up more often here (Aantha once beside Acantha in five chapters) */
function nameGuess(n, all){
  var best = '', score = .7, me = all.filter(function(o){ return o.name === n; })[0] || { eps:[] };
  histPages().forEach(function(x){ var l = likeness(n, x.name) + .06; if (l > score && nameKey(x.name) !== nameKey(n)){ score = l; best = x.name; } });
  (AX.refNames || []).forEach(function(r){ var l = likeness(n, r); if (l > score && nameKey(r) !== nameKey(n)){ score = l; best = r.replace(/^The /, ''); } });
  all.forEach(function(o){ if (o.name === n || o.eps.length < me.eps.length || (o.eps.length === me.eps.length && o.name.length <= n.length)) return; var l = likeness(n, o.name) - .04; if (l > score){ score = l; best = o.name; } });
  return best;
}
function rawEntities(){
  var map = {};
  AX.videos.forEach(function(v){ var nn = AX.notes[v.id]; if (!nn) return; (nn.entities || []).forEach(function(e){ var name = safeName(e.name); if (!name) return; var k = name.toLowerCase(); var x = map[k] = map[k] || { kind:KIND_OK[e.kind] ? e.kind : 'Characters', name:name, eps:[] }; var ep = nn.told ? 'early' : nn.n; if (x.eps.indexOf(ep) < 0) x.eps.push(ep); }); });
  return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a, b){ return a.kind.localeCompare(b.kind) || a.name.localeCompare(b.name); });
}
function paintNames(){
  loadRefNames();
  var all = rawEntities(), have = histFiles('Storyline').length;
  if (!all.length) return '<h2>Set the names</h2><div class="empty">Write the chapters first; the names come from them.</div>';
  var rows = all.map(function(x){
    var cur = AX.names[x.name] || x.name, g = nameGuess(x.name, all);
    return '<div class="it"><span class="num">' + x.kind.charAt(0) + '</span><span class="ti"><input class="t" data-from="' + esc(x.name) + '" value="' + esc(cur) + '" aria-label="The right name for ' + esc(x.name) + '">'
      + '<small>' + (cur !== x.name ? 'heard as ' + esc(x.name) + ', ' : '') + esc(x.kind) + ', ' + esc(x.eps.filter(function(e){ return e !== 'early'; }).length ? 'chapters ' + x.eps.filter(function(e){ return e !== 'early'; }).join(', ') : 'an earlier chapter') + '</small></span>'
      + (g && g !== cur ? '<button class="btn" title="Use this spelling" onclick="this.parentNode.querySelector(\'input\').value=' + esc(JSON.stringify(g)) + '">' + esc(g) + '?</button>' : '<span></span>') + '</div>';
  }).join('');
  var extra = Object.keys(AX.names).filter(function(k){ return !all.some(function(x){ return x.name === k; }); });
  return '<h2>Set the names</h2><p class="lead">Every name the chapters noted, as the captions heard it. Type the right spelling where it is wrong; a likely match from the FellGuide is offered beside it. Use these names puts them into every chapter and into whatever is written after.</p>'
    + '<div class="list" id="nameRows">' + rows + '</div>'
    + '<h3 style="font-family:Cinzel,serif;color:var(--gold);font-weight:500;margin:18px 0 6px">Anything else to change</h3><p class="lead">A word the list missed (a lorebound, a lineage, a place said once): what the chapters say, and what it should be.</p>'
    + '<div class="list" id="nameExtra">' + extra.map(function(k){ return '<div class="it"><span class="num">+</span><span class="ti"><input class="t" data-x="from" value="' + esc(k) + '" aria-label="As written"><input class="t" data-x="to" value="' + esc(AX.names[k]) + '" aria-label="As it should be"></span><span></span></div>'; }).join('')
      + '<div class="it"><span class="num">+</span><span class="ti"><input class="t" data-x="from" placeholder="As written" aria-label="As written"><input class="t" data-x="to" placeholder="As it should be" aria-label="As it should be"></span><span></span></div></div>'
    + (have ? '<label class="f" style="flex-direction:row;align-items:center;gap:10px;margin:14px 0"><input type="checkbox"' + (AX.fixVault ? ' checked' : '') + ' onchange="AX.fixVault=this.checked"> Also fix the chapters and pages of ' + esc(hist()) + ' already in the FellGuide</label>' : '')
    + '<div class="row"><button class="btn pri" onclick="useNames()"' + (AX.busy ? ' disabled' : '') + '>' + (AX.busy ? 'Working…' : 'Use these names') + '</button><button class="btn" onclick="AX.step=4;paint()">On to the world</button></div>'
    + '<div class="log" id="axlog" aria-live="polite">' + esc(AX.log || 'Ready.') + '</div>';
}
/* a page's text with the names put right; renamed when its title or name changed */
function fixPage(path, before, fromVault){
  var after = applyNames(before); if (after === before) return 0;
  var f = AX.files[path], orig = fromVault ? before : (f && f.original != null ? f.original : null);
  var newPath = path;
  if (path.indexOf(BASE + hist() + '/Storyline/') === 0){ var t = safeName((after.split('\n')[0] || '').replace(/^#\s*/, '')); if (t) newPath = path.slice(0, path.lastIndexOf('/') + 1) + pad2(chNum(path)) + ' - ' + t + '.md'; }
  else if (/\/(Characters|Locations|Bestiary|Artifacts)\//.test(path)){ var n = path.split('/').pop().replace(/\.md$/, ''), nn = nameFor(n); if (nn !== n) newPath = path.slice(0, path.lastIndexOf('/') + 1) + safeName(nn) + '.md'; }
  AX.files[newPath] = { content:after, original:newPath === path ? orig : null, status:(newPath === path && orig != null) ? 'changed' : 'new', approved:true };
  if (newPath !== path){
    var inVault = (AX.vaultFiles || []).indexOf(path) >= 0;
    if (inVault){ AX.files[path] = { content:'', original:before, status:'changed', approved:true, del:true, why:'renamed to ' + newPath.split('/').pop().replace(/\.md$/, '') }; saveFile(path); }
    else { delete AX.files[path]; api('/ax/draft', { k:hkey() + ':f:' + path }, ''); }
    AX.videos.forEach(function(v){ var nn2 = AX.notes[v.id]; if (nn2 && nn2.path === path){ nn2.path = newPath; nn2.title = chTitle(newPath); } });
  }
  saveFile(newPath);
  return 1;
}
function useNames(){
  if (AX.busy) return;
  document.querySelectorAll('#nameRows input[data-from]').forEach(function(el){ var from = el.getAttribute('data-from'), to = el.value.trim(); if (to && to !== from) AX.names[from] = to; else delete AX.names[from]; });
  document.querySelectorAll('#nameExtra .it').forEach(function(row){ var a = row.querySelector('[data-x=from]'), b = row.querySelector('[data-x=to]'); var from = a && a.value.trim(), to = b && b.value.trim(); if (from && to && from !== to) AX.names[from] = to; else if (from && !to) delete AX.names[from]; });
  Object.keys(AX.names).forEach(function(k){ if (nameFor(k) === k) delete AX.names[k]; });
  AX.busy = true; AX.log = ''; paint();
  var n = 0;
  Object.keys(AX.files).forEach(function(p){ var f = AX.files[p]; if (!f || f.del || f.status === 'sent' || p.indexOf(BASE + hist() + '/') !== 0) return; n += fixPage(p, f.content, false); });
  AX.videos.forEach(function(v){ var nn = AX.notes[v.id]; if (!nn) return; nn.summary = applyNames(nn.summary || ''); (nn.entities || []).forEach(function(e){ e.facts = (e.facts || []).map(applyNames); }); });
  var vaultPages = AX.fixVault ? histFiles('').filter(function(p){ return !AX.files[p] || AX.files[p].status === 'sent'; }) : [];
  say('The names are set. ' + n + ' drafted page' + (n === 1 ? '' : 's') + ' changed.' + (vaultPages.length ? ' Reading the ' + vaultPages.length + ' pages already in the FellGuide…' : ''));
  var m = 0;
  var next = function(){
    if (!vaultPages.length){ AX.busy = false; if (AX.fixVault) say(m + ' page' + (m === 1 ? '' : 's') + ' already in the FellGuide changed. Review them before they go.'); saveManifest().then(paint); return; }
    var p = vaultPages.shift();
    api('/ax/vault/file', { path:p }).then(function(cur){ if (cur.exists){ if (AX.files[p] && AX.files[p].status === 'sent') delete AX.files[p]; m += fixPage(p, cur.content, true); } }).catch(function(){}).then(function(){ setTimeout(next, 60); });
  };
  saveManifest().then(next);
}

/* ---- step 2: each episode a chapter ---- */
function styleRules(){ return AX.style ? '\n\nThe FellGuide\u2019s style rules, binding (especially its Never Use list):\n' + AX.style.slice(0, 9000) : ''; }
function writeChapters(){
  if (AX.busy) return; AX.busy = true; paint();
  var todo = AX.videos.map(function(v, i){ return { v:v, i:i }; }).filter(function(x){ return !AX.notes[x.v.id] && !epTold(x.v, x.i); });
  var next = function(){
    if (!todo.length){ AX.busy = false; say('Every chapter is written.'); paint(); return; }
    var x = todo.shift(), n = nextChapterNum();
    say('Episode ' + n + ': reading its captions…');
    api('/ax/video', { v:x.v.id, captions:1 }).then(function(d){
      if (!d.captions){ throw new Error(d.captionError || 'no captions yet'); }
      var prior = AX.videos.slice(0, x.i).map(function(v){ var nn = AX.notes[v.id]; return nn && !nn.told ? 'Chapter ' + nn.n + ', ' + nn.title + ': ' + nn.summary : ''; }).filter(Boolean).join('\n');
      var sys = 'You write one chapter of a History for the LoreFell FellGuide: the story of what happened in one episode of an actual-play tabletop game, told as grounded dark fantasy prose, past tense, third person, about the characters (the Fell) and the world, never about the players, the table, dice, rules or the stream. '
        + 'Write only what happened in the episode; never invent events, names or outcomes. Leave out table talk and rules. 900 to 1600 words. Start with a line "# " and the chapter\u2019s title (a few words drawn from the episode), then the prose in paragraphs. No headings inside, no lists, no em dashes.'
        + styleRules() + namesRule() + (AX.example ? '\n\nA chapter from another History, for voice and shape:\n' + AX.example : '');
      var user = 'History: ' + hist() + '\nEpisode ' + (x.i + 1) + ' of the playlist: ' + x.v.title + '\nIts description:\n' + String(d.description || '').slice(0, 3000)
        + (prior ? '\n\nThe chapters before it, in short:\n' + prior : '') + '\n\nThe episode\u2019s transcript:\n' + String(d.captions).slice(0, 320000);
      say('Episode ' + n + ': writing the chapter…');
      return ai(sys, user, 4000, true).then(function(md){
        md = applyNames(noDash(md).trim()); if (md.indexOf('# ') !== 0) md = '# ' + x.v.title + '\n\n' + md;
        /* which episode this chapter tells, hidden from the published page, so it is never told twice */
        md += '\n\n%% episode: ' + x.v.id + ' %%\n';
        var title = safeName(md.split('\n')[0].replace(/^#\s*/, '')) || ('Chapter ' + n);
        var path = BASE + hist() + '/Storyline/' + pad2(n) + ' - ' + title + '.md';
        say('Episode ' + n + ': noting who and what it named…');
        return ai(namesRule() + '\n\nFrom this chapter of a History, return ONLY JSON: {"summary":"two sentences on what happened","entities":[{"kind":"Characters|Locations|Bestiary|Artifacts","name":"as written","facts":["one plain fact each, from the chapter only"]}]} . Characters are people and named beings; Bestiary is kinds of creatures; Artifacts are objects, rituals and powers; Locations are places. Up to 25 entities.', md, 1500, false).then(function(raw){
          var j = {}; try { j = JSON.parse(String(raw).replace(/```json|```/g, '').trim()); } catch(e){ var m = String(raw).match(/\{[\s\S]*\}/); try { j = m ? JSON.parse(m[0]) : {}; } catch(e2){ j = {}; } }
          AX.notes[x.v.id] = { n:n, title:title, path:path, summary:String(j.summary || ''), entities:Array.isArray(j.entities) ? j.entities : [] };
          AX.files[path] = { content:md, original:null, status:'new', approved:true };
          return saveFile(path).then(saveManifest).then(function(){ say('Episode ' + n + ': ' + title + ', written.'); paint(); });
        });
      });
    }).then(function(){ setTimeout(next, 300); }).catch(function(e){
      AX.busy = false; say('Episode ' + n + ' stopped: ' + e.message + (/quota|allowance/i.test(e.message) ? '. YouTube\u2019s allowance is spent for today; press Write the rest tomorrow.' : '. Press Write the rest to try again.')); paint();
    });
  };
  next();
}

/* ---- step 3: the people, places, beasts and things, then the History's page and the map ---- */
var KIND_OK = { Characters:1, Locations:1, Bestiary:1, Artifacts:1 };
function gatherEntities(){
  var map = {};
  AX.videos.forEach(function(v){ var nn = AX.notes[v.id]; if (!nn) return;
    (nn.entities || []).forEach(function(e){ var kind = KIND_OK[e.kind] ? e.kind : 'Characters', name = safeName(nameFor(e.name)); if (!name) return;
      var k = kind + '|' + name.toLowerCase(); var x = map[k] = map[k] || { kind:kind, name:name, facts:[], eps:[], from:[] };
      if (e.name !== name && x.from.indexOf(e.name) < 0) x.from.push(e.name);
      (e.facts || []).forEach(function(f){ x.facts.push((nn.told ? 'An early chapter' : 'Chapter ' + nn.n) + ': ' + applyNames(String(f))); }); var ep = nn.told ? 'early' : nn.n; if (x.eps.indexOf(ep) < 0) x.eps.push(ep); }); });
  return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a, b){ return b.eps.length - a.eps.length || a.name.localeCompare(b.name); });
}
function writeWorld(){
  if (AX.busy) return; AX.busy = true; paint();
  var ents = gatherEntities().slice(0, 80).filter(function(x){ return !AX.files[BASE + hist() + '/' + x.kind + '/' + safeName(x.name) + '.md']; });
  var next = function(){
    if (!ents.length) return writeRoot();
    var x = ents.shift(), path = BASE + hist() + '/' + x.kind + '/' + safeName(x.name) + '.md';
    say(x.kind + ': ' + x.name + '…');
    api('/ax/vault/file', { path:path }).then(function(cur){
      var sys = 'You write one page of the LoreFell FellGuide about a ' + x.kind.replace(/s$/, '').toLowerCase() + ' of a History: "# " and its name, then one to three paragraphs of grounded prose on who or what it is and what it did, from the facts given only. No lists, no headings inside, no em dashes.'
        + (cur.exists ? ' The page exists: keep everything in it, in its words, and weave in only what is new from the facts.' : '') + styleRules() + namesRule() + (AX.exampleChar ? '\n\nA page from another History, for voice and shape:\n' + AX.exampleChar : '');
      var user = 'History: ' + hist() + '\nName: ' + x.name + '\nFacts, by chapter:\n' + x.facts.join('\n') + (cur.exists ? '\n\nThe page as it is now:\n' + cur.content : '');
      return ai(sys, user, 1200, true).then(function(md){
        md = applyNames(noDash(md).trim()); if (md.indexOf('# ') !== 0) md = '# ' + x.name + '\n\n' + md;
        AX.files[path] = { content:md, original:cur.exists ? cur.content : null, status:cur.exists ? 'changed' : 'new', approved:true };
        return saveFile(path).then(saveManifest).then(function(){ paint(); });
      });
    }).then(function(){ setTimeout(next, 200); }).catch(function(e){ AX.busy = false; say('Stopped at ' + x.name + ': ' + e.message + '. Press Write the world to go on.'); paint(); });
  };
  next();
}
function writeRoot(){
  var root = BASE + hist() + '/' + hist() + '.md';
  var chapters = AX.videos.map(function(v){ return AX.notes[v.id]; }).filter(function(c){ return c && !c.told; }).sort(function(a, b){ return a.n - b.n; });
  var table = '## Chapters\n\n| # | Chapter |\n| --- | --- |\n' + storyPaths().map(function(p){ return '| ' + chNum(p) + ' | ' + chTitle(p) + ' |'; }).join('\n') + '\n';
  say('The History\u2019s own page…');
  api('/ax/vault/file', { path:root }).then(function(cur){
    /* a page already there keeps its opening and its note; only its chapters table is rebuilt */
    if (cur.exists){
      var at = cur.content.indexOf('## Chapters'), md0 = (at >= 0 ? cur.content.slice(0, at) : cur.content.replace(/\s*$/, '\n\n')) + table;
      if (md0 !== cur.content){ AX.files[root] = { content:md0, original:cur.content, status:'changed', approved:true }; return saveFile(root); }
      return;
    }
    return ai('Write the opening of a History\u2019s page for the LoreFell FellGuide: two short paragraphs that set up the story and pull the reader in, without spoiling its end, from the chapter summaries. Grounded, no em dashes, no headings, no lists.' + styleRules(), 'History: ' + hist() + '\n' + chapters.map(function(c){ return 'Chapter ' + c.n + ', ' + c.title + ': ' + c.summary; }).join('\n') + (cur.exists ? '\n\nIts page as it is now:\n' + cur.content : ''), 900, true).then(function(intro){
      var md = '# ' + hist() + '\n\n' + applyNames(noDash(intro).trim()) + '\n\n> [!note] Adventure\n>\n> A History of LoreFell.\n\n' + table;
      AX.files[root] = { content:md, original:cur.exists ? cur.content : null, status:cur.exists ? 'changed' : 'new', approved:true };
      return saveFile(root);
    });
  }).then(function(){ return writeNavMap(); }).then(function(){ return writeHistoriesIndex(); }).then(function(){ AX.busy = false; say('The world is written. Review it before anything is sent.'); AX.step = 5; paint(); })
    .catch(function(e){ AX.busy = false; say('Stopped: ' + e.message); paint(); });
}
/* The Histories' own page lists every History in its table: a new one gets its row */
function writeHistoriesIndex(){
  var path = BASE + 'The Histories.md';
  return api('/ax/vault/file', { path:path }).then(function(cur){
    if (!cur.exists || cur.content.indexOf('[[' + hist() + ']]') >= 0) return;
    var lines = cur.content.split('\n'), last = -1;
    lines.forEach(function(l, i){ if (/^\|\s*\[\[.+\]\]\s*\|/.test(l)) last = i; });
    if (last < 0) return;
    lines.splice(last + 1, 0, '| [[' + hist() + ']] | Adventure |');
    AX.files[path] = { content:lines.join('\n'), original:cur.content, status:'changed', approved:true };
    return saveFile(path).then(saveManifest);
  });
}
/* the order map: this History's block under The Histories, rebuilt from its pages */
function writeNavMap(){
  return api('/ax/vault/file', { path:NAVMAP }).then(function(cur){
    if (!cur.exists) return;
    var names = { Storyline:[], Characters:[], Locations:[], Bestiary:[], Artifacts:[] };
    Object.keys(AX.files).concat(AX.vaultFiles || []).forEach(function(p){ if (p.indexOf(BASE + hist() + '/') !== 0 || (AX.files[p] && AX.files[p].del)) return; var rest = p.slice((BASE + hist() + '/').length).split('/'); if (rest.length === 2 && names[rest[0]] && /\.md$/.test(rest[1])){ var n = rest[1].replace(/\.md$/, ''); if (names[rest[0]].indexOf(n) < 0) names[rest[0]].push(n); } });
    var I = '        ', block = [I + '- **' + hist() + '/**', I + '    - ' + hist()];
    ['Characters', 'Artifacts', 'Bestiary', 'Locations', 'Storyline'].forEach(function(s){ if (!names[s].length) return; block.push(I + '    - **' + s + '/**'); names[s].sort().forEach(function(n){ block.push(I + '        - ' + n); }); });
    var lines = cur.content.split('\n'), start = -1, end = -1, hi = lines.findIndex(function(l){ return /^ {4}- \*\*The Histories\/\*\*/.test(l); });
    if (hi < 0) return;
    var secEnd = lines.length; for (var i = hi + 1; i < lines.length; i++){ if (/^ {0,4}- /.test(lines[i])){ secEnd = i; break; } }
    for (var j = hi + 1; j < secEnd; j++){ if (lines[j] === I + '- **' + hist() + '/**'){ start = j; end = j + 1; while (end < secEnd && !/^ {8}- \*\*/.test(lines[end])) end++; break; } }
    if (start >= 0) lines.splice(start, end - start, block.join('\n'));
    else {
      var at = secEnd;
      for (var k = hi + 1; k < secEnd; k++){ var m = lines[k].match(/^ {8}- \*\*(.+)\/\*\*$/); if (m && m[1].localeCompare(hist()) > 0){ at = k; break; } }
      lines.splice(at, 0, block.join('\n'));
    }
    var md = lines.join('\n');
    AX.files[NAVMAP] = { content:md, original:cur.content, status:'changed', approved:true };
    return saveFile(NAVMAP).then(saveManifest);
  });
}

/* ---- step 4: the ledger, each page read and changed before it goes ---- */
function lineDiff(a, b){
  a = String(a || '').split('\n'); b = String(b || '').split('\n');
  var n = a.length, m = b.length; if (n * m > 4e6) return '<span class="a">' + esc(b.join('\n')) + '</span>';
  var L = []; for (var i = 0; i <= n; i++){ L.push(new Uint16Array(m + 1)); }
  for (i = n - 1; i >= 0; i--) for (var j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  var out = []; i = 0; j = 0;
  while (i < n && j < m){ if (a[i] === b[j]){ out.push(esc(a[i]) + '\n'); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]){ out.push('<span class="d">' + esc(a[i]) + '</span>'); i++; } else { out.push('<span class="a">' + esc(b[j]) + '</span>'); j++; } }
  while (i < n) out.push('<span class="d">' + esc(a[i++]) + '</span>'); while (j < m) out.push('<span class="a">' + esc(b[j++]) + '</span>');
  return out.join('');
}
function paintStep4(){
  var paths = Object.keys(AX.files).sort();
  if (!paths.length) return '<h2>Review and send</h2><div class="empty">Nothing drafted yet.</div>';
  if (!AX.sel || !AX.files[AX.sel]) AX.sel = paths[0];
  var groups = {}; paths.forEach(function(p){ var g = p === NAVMAP ? 'The order map' : (p.slice(BASE.length).split('/')[1] || 'The History'); if (/\.md$/.test(g)) g = 'The History'; (groups[g] = groups[g] || []).push(p); });
  var order = ['The History', 'Storyline', 'Characters', 'Locations', 'Bestiary', 'Artifacts', 'The order map'];
  var approved = paths.filter(function(p){ return AX.files[p].approved; }).length;
  var f = AX.files[AX.sel];
  var h = '<h2>Review and send</h2><p class="lead">Read each page, change anything, and untick what should not go. Send to the FellGuide commits the ticked pages to the vault; Obsidian pulls them, and you publish from Obsidian.</p>'
    + '<div class="review"><div class="ledger" role="list">' + order.filter(function(g){ return groups[g]; }).map(function(g){ return '<h3>' + g + '</h3>' + groups[g].map(function(p){ var x = AX.files[p];
        return '<div class="pg' + (p === AX.sel ? ' on' : '') + '" role="listitem" onclick="AX.sel=' + esc(JSON.stringify(p)).replace(/"/g, '&quot;') + ';paint()"><input type="checkbox"' + (x.approved ? ' checked' : '') + ' onclick="event.stopPropagation()" onchange="AX.files[' + esc(JSON.stringify(p)).replace(/"/g, '&quot;') + '].approved=this.checked;saveManifest();paint()" aria-label="Send this page"><span class="nm">' + esc(p.split('/').pop().replace(/\.md$/, '')) + '</span><span class="st ' + (x.del ? 'changed' : x.status) + '">' + (x.del ? 'removed' : x.status) + '</span></div>'; }).join(''); }).join('') + '</div>'
    + '<div class="page"><div class="path">' + esc(AX.sel) + '</div>'
    + (f.original != null ? '<div class="row"><button class="btn' + (AX.diff ? '' : ' pri') + '" onclick="AX.diff=false;paint()">Edit</button><button class="btn' + (AX.diff ? ' pri' : '') + '" onclick="AX.diff=true;paint()">What changed</button></div>' : '')
    + (f.del ? '<div class="empty">This page is taken out of the FellGuide when you send: ' + esc(f.why || 'it was renamed') + '.</div>' : f.original != null && AX.diff ? '<div class="diff">' + lineDiff(f.original, f.content) + '</div>' : '<textarea class="t" id="ped" rows="26" oninput="AX.files[AX.sel].content=this.value;clearTimeout(window._sv);window._sv=setTimeout(function(){saveFile(AX.sel);},800)">' + esc(f.content) + '</textarea>')
    + '</div></div>'
    + '<div class="row"><button class="btn pri" onclick="sendIt()"' + (AX.busy || !approved ? ' disabled' : '') + '>' + (AX.busy ? 'Sending…' : 'Send ' + approved + ' page' + (approved === 1 ? '' : 's') + ' to the FellGuide') + '</button><button class="btn" onclick="dropAll()">Drop these drafts</button></div>'
    + '<div class="log" id="axlog" aria-live="polite">' + esc(AX.log || '') + '</div>';
  return h;
}
function sendIt(){
  var paths = Object.keys(AX.files).filter(function(p){ return AX.files[p].approved; });
  if (!paths.length || AX.busy) return;
  if (!confirm('Send ' + paths.length + ' pages to the FellGuide? They go to the vault\u2019s main branch, and Obsidian pulls them.')) return;
  AX.busy = true; paint();
  api('/ax/vault/commit', {}, { message:'The Anexanum: ' + hist(), files:paths.filter(function(p){ return !AX.files[p].del; }).map(function(p){ return { path:p, content:AX.files[p].content }; }), deletes:paths.filter(function(p){ return AX.files[p].del; }) }).then(function(r){
    say('Sent ' + r.files + ' pages to the FellGuide' + (r.removed ? ' and took out ' + r.removed : '') + '. Pull in Obsidian, then publish.');
    var gone = paths.filter(function(p){ return AX.files[p].del; }); AX.vaultFiles = (AX.vaultFiles || []).filter(function(p){ return gone.indexOf(p) < 0; }).concat(paths.filter(function(p){ return !AX.files[p].del && (AX.vaultFiles || []).indexOf(p) < 0; }));
    paths.forEach(function(p){ AX.files[p].status = 'sent'; AX.files[p].approved = false; api('/ax/draft', { k:hkey() + ':f:' + p }, ''); });
    AX.busy = false; return saveManifest().then(paint);
  }).catch(function(e){ AX.busy = false; say('Not sent: ' + e.message); paint(); });
}
function dropAll(){
  if (!confirm('Drop every draft for ' + hist() + '? Pages already sent stay in the FellGuide.')) return;
  Object.keys(AX.files).forEach(function(p){ api('/ax/draft', { k:hkey() + ':f:' + p }, ''); });
  api('/ax/draft', { k:hkey() + ':m' }, ''); AX.files = {}; AX.notes = {}; AX.step = 1; paint();
}
boot();
</script>
