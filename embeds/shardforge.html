<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShardForge</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Cinzel:wght@500;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
/* site-look:start */
/* site-look v1: the lorefell-site look for the player tools. Source: forge scripts/site-look.css.
   Each tool pastes this block verbatim between the site-look markers; npm run checks keeps the copies identical.
   Old variable names are aliased onto the site tokens so a tool's own rules keep resolving. */
:root{
  --void:#060A14;--gold:#D8BC6A;--bone:#EFE8D8;--ash:#B9B2A2;--hair:rgba(239,232,216,.22);
  --panel:rgba(239,232,216,.035);--panel-2:rgba(239,232,216,.06);
  --f-display:'IM Fell English',Georgia,'Times New Roman',serif;
  --f-menu:'Cinzel','IM Fell English',Georgia,serif;
  --f-label:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --navy:var(--void);--ink:var(--void);--silver:var(--bone);--parch:var(--bone);
  --ice:var(--ash);--muted:var(--ash);--dim:var(--ash);--line:var(--hair);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--void);color:var(--bone)}
body{font-family:var(--f-display);font-size:20px;line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--bone);outline-offset:4px}
.sl-label{font-family:var(--f-label);font-weight:500;font-size:14px;line-height:1.3;letter-spacing:.3em;text-transform:uppercase;color:var(--ash)}
.sl-title{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.4vw,36px);line-height:1.15;color:var(--bone);margin:0}
.sl-btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border:1px solid var(--bone);border-radius:0;background:transparent;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:16px;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .25s,color .25s}
.sl-btn:hover{background:var(--bone);color:var(--void)}
.sl-btn.solid{background:var(--gold);border-color:var(--gold);color:var(--void)}
.sl-btn.solid:hover{background:transparent;color:var(--gold)}
.sl-btn.small{min-height:44px;padding:0 18px;font-size:14px}
.sl-btn:disabled{opacity:.45;cursor:not-allowed}
.sl-panel{border:1px solid var(--hair);border-radius:0;background:transparent}
.sl-tabs{display:flex;flex-wrap:wrap;gap:4px 22px;border-bottom:1px solid var(--hair)}
.sl-tab{min-height:44px;padding:0 2px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ash);font-family:var(--f-menu);font-size:15px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.sl-tab[aria-selected="true"],.sl-tab.on,.sl-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.sl-chip{display:inline-flex;align-items:center;min-height:44px;min-width:44px;justify-content:center;padding:0 14px;border:1px solid var(--hair);border-radius:0;background:transparent;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.sl-chip[aria-pressed="true"],.sl-chip[aria-current="true"],.sl-chip.on,.sl-chip.active{border-color:var(--gold);color:var(--gold)}
/* info mark: a 15px glyph inside a 44px hit area, opened by tap (.open), tip held on screen */
.sl-info{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-14px -12px;vertical-align:middle;cursor:pointer}
.sl-info .tip{position:absolute;top:100%;left:0;z-index:30;width:min(280px,calc(100vw - 32px));padding:12px 14px;border:1px solid var(--hair);background:var(--void);color:var(--bone);font-family:var(--f-display);font-size:16px;line-height:1.4;letter-spacing:0;text-transform:none;display:none}
.sl-info.open .tip{display:block}
.sl-split{display:grid;grid-template-columns:1fr;gap:28px}
@media (min-width:900px){.sl-split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* site-look:end */
  :root{--steel:#B9B2A2;--ok:#7fcf9f;--warn:#d6b35a}
  *{box-sizing:border-box}html,body{margin:0}
  body{padding:20px 16px 64px}
  button{font:inherit;color:inherit}
  .shell{max-width:1180px;margin:0 auto}
  header.masthead{display:flex;flex-direction:column-reverse;align-items:flex-start;gap:6px;padding:0 0 18px;border-bottom:1px solid var(--hair)}
  h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.4vw,36px);line-height:1.15;margin:0;color:var(--bone)}
  h1.app-title .ember{color:var(--gold)}
  .section{font-family:var(--f-label);font-weight:500;font-size:14px;line-height:1.3;letter-spacing:.3em;text-transform:uppercase;color:var(--ash);margin:0}

  /* side toggle: two outline chips, gold when chosen */
  .sideToggle{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0}
  .sideToggle button{flex:0 1 auto;display:inline-flex;align-items:baseline;justify-content:center;gap:10px;min-height:48px;padding:0 18px;background:transparent;border:1px solid var(--hair);border-radius:0;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:15px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;line-height:48px}
  .sideToggle button em{font-style:normal;font-weight:500;font-size:13px;letter-spacing:.2em;color:var(--ash)}
  .sideToggle button:hover{border-color:var(--bone)}
  .sideToggle button[aria-selected="true"]{border-color:var(--gold);color:var(--gold)}
  .sideToggle button[aria-selected="true"] em{color:var(--gold)}
  @media (max-width:520px){.sideToggle button{flex:1 1 0;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 8px;line-height:1.2;letter-spacing:.14em}.sideToggle button em{font-size:12px}}

  /* view tabs: Cinzel words, gold underline */
  .seg{display:flex;flex-wrap:wrap;gap:4px 26px;margin:14px 0 0;border-bottom:1px solid var(--hair)}
  .seg button{min-height:48px;padding:0 2px;margin-bottom:-1px;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--ash);font-family:var(--f-menu);font-size:15px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  .seg button:hover{color:var(--bone)}
  .seg button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}

  .panes{margin-top:24px}
  .pane{display:none;min-width:0}
  .pane.active{display:block}
  .panehead{display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--hair);padding-bottom:10px;margin-bottom:4px}
  .panehead .pe{font-family:var(--f-label);font-weight:500;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--ash)}
  .panehead .pt{font-family:var(--f-display);font-size:26px;line-height:1.2;color:var(--bone);margin-top:2px}
  .panehead .rule{display:none}

  .search{position:relative;margin-top:14px}
  .search input{padding-left:46px}
  .search .glass{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ash);opacity:.8}
  .filterbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:center}
  .filterbar select{flex:1 1 calc(50% - 5px);min-width:0;width:auto}
  .clear{min-height:44px;background:none;border:0;color:var(--ash);font-family:var(--f-label);font-weight:600;font-size:15px;letter-spacing:.22em;text-transform:uppercase;text-decoration:underline;text-underline-offset:6px;cursor:pointer;padding:0 4px}
  .clear:hover{color:var(--bone)}
  .count{font-family:var(--f-label);font-weight:500;font-size:14px;letter-spacing:.18em;color:var(--ash);text-transform:uppercase;margin:16px 0 2px;line-height:1.5}
  #catNote,#pane-ledger>p.count{font-family:var(--f-display);font-size:18px;letter-spacing:0;text-transform:none}
  .secthead{display:flex;align-items:center;gap:10px;min-height:48px;padding-bottom:6px;border-bottom:1px solid var(--hair);margin-top:14px}
  .secthead .nm{font-family:var(--f-label);font-weight:600;letter-spacing:.3em;text-transform:uppercase;font-size:14px;color:var(--ash)}
  .secthead .toggle{margin-left:auto;min-height:44px;padding:0 16px;background:none;border:1px solid var(--hair);border-radius:0;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
  .secthead .toggle:hover{border-color:var(--bone)}
  .card{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--hair);min-width:0}
  .sigil{flex:0 0 40px;width:40px;height:40px;margin-top:4px}
  .cbody{flex:1 1 auto;min-width:0}
  .row1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .cnm{font-family:var(--f-display);font-size:22px;line-height:1.2;color:var(--bone)}
  .badge,.cmeta span,.lgbadge,.lgtag{display:inline-block;font-family:var(--f-label);font-weight:600;font-size:13px;line-height:1.2;letter-spacing:.18em;text-transform:uppercase;color:var(--ash);border:1px solid var(--hair);border-radius:0;padding:4px 8px}
  .badge.core{color:var(--gold);border-color:var(--gold)}
  .crules{margin:6px 0 0;color:var(--bone);font-size:18px;line-height:1.45}
  .cmeta{margin:10px 0 0}
  .empty{text-align:center;color:var(--ash);padding:40px 12px;font-size:18px;grid-column:1/-1}
  .empty b{color:var(--bone);font-weight:400}

  .canonintro{border-left:1px solid var(--gold);padding:4px 0 4px 16px;font-size:18px;color:var(--ash);margin-top:16px;line-height:1.5}
  .canonintro strong{display:block;color:var(--gold);font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:6px}
  label.fld{display:block;margin-top:16px}
  label.fld>span{display:flex;align-items:center;font-family:var(--f-label);font-weight:500;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--ash);margin-bottom:8px;min-height:22px}
  label.fld>span em{color:var(--ash);font-family:var(--f-display);font-style:italic;text-transform:none;letter-spacing:0;font-size:16px;margin-left:8px}
  input,textarea,select{width:100%;min-height:48px;background:transparent;border:1px solid var(--hair);border-radius:0;color:var(--bone);font-family:var(--f-display);font-size:18px;padding:10px 14px;outline:none}
  select{appearance:none;-webkit-appearance:none;padding-right:40px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--ash) 50%),linear-gradient(135deg,var(--ash) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
  select option{background:var(--void);color:var(--bone)}
  textarea{line-height:1.45;resize:vertical}
  input::placeholder,textarea::placeholder{color:var(--ash);opacity:.75}
  input:focus,textarea:focus,select:focus{border-color:var(--gold)}
  .softnote{display:none;margin-top:10px;font-size:17px;color:var(--warn);align-items:flex-start;gap:10px}
  .softnote.show{display:flex}
  .softnote .d{flex:0 0 7px;width:7px;height:7px;background:var(--warn);margin-top:10px;transform:rotate(45deg)}
  /* the one solid gold button on Canonize */
  .submit{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:20px;padding:0 20px;background:var(--gold);border:1px solid var(--gold);border-radius:0;color:var(--void);font-family:var(--f-label);font-weight:600;font-size:16px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s}
  .submit:hover:not(:disabled){background:transparent;color:var(--gold)}
  .submit:disabled{opacity:.45;cursor:not-allowed}
  .note{color:var(--ash);font-size:16px;font-style:italic;text-align:center;margin-top:10px}
  .done-card{border:1px solid var(--hair);border-radius:0;padding:24px 20px;margin-top:16px;text-align:center}
  .done-card h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 8px;color:var(--gold)}
  .done-card p{color:var(--ash);font-size:18px;margin:0 0 16px}
  .done-card button{min-height:50px;background:transparent;border:1px solid var(--bone);border-radius:0;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:16px;letter-spacing:.22em;text-transform:uppercase;padding:0 26px;cursor:pointer;transition:background .25s,color .25s}
  .done-card button:hover{background:var(--bone);color:var(--void)}

  /* ledger */
  .lgfilters{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .lgf{min-height:44px;min-width:44px;padding:0 16px;background:transparent;border:1px solid var(--hair);border-radius:0;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
  .lgf:hover{border-color:var(--bone)}
  .lgf.active{border-color:var(--gold);color:var(--gold)}
  .lgf.reload{margin-left:auto;color:var(--ash)}
  .lgcard{padding:16px 0;border-bottom:1px solid var(--hair);min-width:0}
  .lgrow{display:flex;align-items:baseline;gap:8px 10px;flex-wrap:wrap}
  .lgnm{font-family:var(--f-display);font-size:22px;line-height:1.2;color:var(--bone)}
  .lgby{margin-left:auto;font-family:var(--f-label);font-weight:500;font-size:14px;letter-spacing:.12em;color:var(--ash)}
  .lgbadge{color:var(--gold);border-color:var(--gold)}
  .lgbadge.plain{color:var(--ash);border-color:var(--hair)}
  .lgeffect{margin:8px 0 0;color:var(--bone);font-size:18px;line-height:1.45}
  .lglore{margin:6px 0 0;color:var(--ash);font-size:17px;font-style:italic}
  .lggate{margin:6px 0 0;color:var(--ash);font-size:16px}
  .lgactions{display:flex;align-items:center;gap:10px;margin-top:12px}
  .lgvote{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone);background:transparent;border:1px solid var(--hair);border-radius:0;cursor:pointer}
  .lgvote:hover:not(:disabled){border-color:var(--bone)}
  .lgvote .ar{font-size:10px;color:var(--ash)}
  .lgvote .vc{color:var(--bone);font-variant-numeric:tabular-nums;letter-spacing:.05em}
  .lgvote.voted{color:var(--gold);border-color:var(--gold)}
  .lgvote.voted .ar,.lgvote.voted .vc{color:var(--gold)}
  .lgvote:disabled{cursor:default}

  /* pager: outline squares, gold outline for the page you are on */
  .sfpager{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:18px 0 4px;grid-column:1/-1}
  .sfpg{min-width:44px;min-height:44px;padding:0 12px;border:1px solid var(--hair);background:transparent;color:var(--bone);border-radius:0;font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;font-variant-numeric:tabular-nums}
  .sfpg:hover:not(:disabled):not(.dots){border-color:var(--bone)}
  .sfpg[aria-current="true"]{border-color:var(--gold);color:var(--gold)}
  .sfpg:disabled{opacity:.4;cursor:default}
  .sfpg.dots{display:inline-flex;align-items:center;justify-content:center;min-width:20px;padding:0;border:0;cursor:default;color:var(--ash)}

  /* desktop: canonize beside the catalog, lists in two columns when they have the room */
  @media (min-width:900px){
    .panes{display:grid;grid-template-columns:1fr;gap:40px;align-items:start}
    .pane{display:none}
    .pane.active{display:block}
    .panes.show-canon{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .panes.show-canon .pane.catalog,.panes.show-canon .pane.canonize{display:block}
    .panes.show-canon .pane.canonize{position:sticky;top:16px}
    .panes:not(.show-canon) #list,#ledger{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:40px}
    .panes:not(.show-canon) #list>.secthead{grid-column:1/-1}
    .panes:not(.show-canon) .search{max-width:none}
    .panes:not(.show-canon) #pane-catalog .filterbar{flex-wrap:nowrap}
    .panes:not(.show-canon) #pane-catalog .filterbar select{flex:0 1 280px}
  }

  /* info mark: a 16px glyph in a 44px hit area, opened by tap, tip held on screen */
  .finfo{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-11px -12px -11px -4px;
    color:var(--gold);font-family:var(--f-display);font-size:14px;font-style:italic;line-height:1;letter-spacing:0;text-transform:none;cursor:pointer;vertical-align:middle;user-select:none}
  .finfo::before{content:'';position:absolute;left:14px;top:14px;width:16px;height:16px;border:1px solid var(--gold);box-sizing:border-box}
  .finfo:hover::before,.finfo.open::before{background:rgba(216,188,106,.14)}
  .finfo .tip{position:absolute;left:0;top:100%;width:min(280px,calc(100vw - 32px));z-index:60;display:none;
    background:var(--void);border:1px solid var(--hair);border-radius:0;padding:12px 14px;color:var(--bone);font-family:var(--f-display);font-size:16px;
    font-style:normal;letter-spacing:0;text-transform:none;line-height:1.4;text-align:left;font-weight:400}
  .finfo.open .tip{display:block}
  @media (hover:hover){.finfo:hover .tip{display:block}}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <h1 class="app-title">Shard<span class="ember">Forge</span></h1>
    <div class="section" id="sfH1">Infusions</div>
  </header>

  <div class="sideToggle" role="tablist" aria-label="Shard type">
    <button id="side-infusion" type="button" aria-selected="true">Infusions <em>Weapons</em></button>
    <button id="side-augmentation" type="button" aria-selected="false">Augmentations <em>Armor</em></button>
  </div>

  <div class="seg" role="tablist">
    <button role="tab" id="seg-catalog" aria-selected="true">Catalog</button>
    <button role="tab" id="seg-canon" aria-selected="false">Canonize</button>
    <button role="tab" id="seg-ledger" aria-selected="false">Ledger</button>
  </div>

  <div class="panes">
    <section class="pane catalog active" id="pane-catalog">
      <div class="panehead"><div><div class="pe" id="catPe">The Lapidary</div><div class="pt">Catalog</div></div><span class="rule"></span></div>
      <p class="count" id="catNote" style="margin-top:10px"></p>
      <div class="search">
        <svg class="glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="q" type="search" placeholder="Search name or text" autocomplete="off" aria-label="Search the catalog">
      </div>
      <div class="filterbar">
        <select id="fCat" aria-label="Filter by category"></select>
        <select id="fCore" aria-label="Filter by core"></select>
        <button class="clear" id="clear" type="button">Reset</button>
      </div>
      <div class="count" id="count"></div>
      <div id="list" aria-live="polite"></div>
    </section>

    <section class="pane canonize" id="pane-canon">
      <div class="panehead"><div><div class="pe" id="canonPe">The Assay</div><div class="pt">Canonize a customization</div></div><span class="rule"></span></div>
      <div id="canon"></div>
    </section>

    <section class="pane ledger" id="pane-ledger">
      <div class="panehead"><div><div class="pe">The Vault</div><div class="pt">Ledger</div></div><span class="rule"></span></div>
      <p class="count" style="margin-top:10px">Every custom shard put forward. Read one, lend it your voice, or check on your own.</p>
      <div class="lgfilters">
        <button class="lgf active" data-scope="all" type="button">All</button>
        <button class="lgf" data-scope="canon" type="button">Canon</button>
        <button class="lgf" data-scope="mine" type="button">Mine</button>
        <button class="lgf reload" id="lgReload" type="button">Reload</button>
      </div>
      <div id="ledger" aria-live="polite"></div>
    </section>
  </div>
</div>

<script>

const SIDES={
  infusion:{
    side:"infusion",noun:"infusion",catLabel:"Attribute",core:false,
    eyebrow:"ShardForge \u00B7 Infusions",h1:"Infusions",
    catPe:"The Lapidary",canonPe:"The Assay",
    note:"A weapon holds three infusions, matched to its attribute. Search or filter by attribute to find what fits yours.",
    catOptions:["Precision", "Power", "Magic"],
    /* CANON:infusions start. Baked from schemas/seed/Infusions.json by genCanon (disabled in CI). Change infusions in the seed and here together, or add [canon-skip: infusions]. */
    data:[{"name":"Targeted","cat":"Precision","desc":"Attacks with this weapon ignore Evasion equal to your Precision."},{"name":"Sharp","cat":"Precision","desc":"Add your Precision to this weapon's Base Damage."},{"name":"Wounding","cat":"Precision","desc":"Add your Precision to this weapon's Bonus Damage."},{"name":"Rebounding","cat":"Precision","desc":"When this weapon deals damage, deal its Base Damage again. The second instance cannot be reduced."},{"name":"Hunting","cat":"Precision","desc":"Attacks with this weapon are Lucky Rolls."},{"name":"Rooting","cat":"Precision","desc":"When this weapon deals damage, the target cannot move until the end of the round."},{"name":"Guarding","cat":"Precision","desc":"When an attack targeting you misses, deal this weapon's standard damage to the attacker."},{"name":"Agile","cat":"Precision","desc":"While wielding this weapon, you may use a free movement during your Act. This does not remove your ability to move during your React."},{"name":"Vorpal","cat":"Precision","desc":"When this weapon deals damage, the target loses two Charges."},{"name":"Reprieve","cat":"Precision","desc":"When this weapon reduces a target to 0, remove one Affliction from yourself."},{"name":"Swift","cat":"Precision","desc":"When you make a standard attack, immediately make one more standard attack against the same target. The extra attack does not trigger this effect again."},{"name":"Powerful","cat":"Power","desc":"Attacks with this weapon ignore Durability equal to your Power."},{"name":"Brutal","cat":"Power","desc":"Add your Power to this weapon's Base Damage."},{"name":"Mauling","cat":"Power","desc":"Add your Power to this weapon's Bonus Damage."},{"name":"Sweeping","cat":"Power","desc":"When this weapon deals damage, the nearest other enemy takes this weapon's Base Damage."},{"name":"Merciless","cat":"Power","desc":"Fellmark effects with this weapon are doubled."},{"name":"Hooking","cat":"Power","desc":"When this weapon deals damage, pull the target one space toward you. If its movement is prevented, deal this weapon's Base Damage."},{"name":"Vengeful","cat":"Power","desc":"When an enemy hits you, deal this weapon's standard damage to it."},{"name":"Goring","cat":"Power","desc":"Attacks with this weapon ignore the target's Armor Stance entirely."},{"name":"Siphoning","cat":"Power","desc":"When this weapon deals damage, take one of the target's Charges for yourself."},{"name":"Emboldening","cat":"Power","desc":"When this weapon reduces a target to 0, gain temporary Vitality equal to your Power."},{"name":"Afflicted","cat":"Power","desc":"When you inflict a Fellmark with this weapon, apply an Affliction of your choice. It replaces the weapon's innate Fellmark Affliction."},{"name":"Ethereal","cat":"Magic","desc":"Attacks with this weapon ignore Resistance equal to your Magic."},{"name":"Potent","cat":"Magic","desc":"Add your Magic to this weapon's Base Damage."},{"name":"Blighting","cat":"Magic","desc":"Add your Magic to this weapon's Bonus Damage."},{"name":"Coursing","cat":"Magic","desc":"When you successfully cast a spell, each enemy adjacent to you takes this weapon's Base Damage."},{"name":"Honed","cat":"Magic","desc":"Rolls of 5 also count as Fellmarks with this weapon."},{"name":"Forceful","cat":"Magic","desc":"When this weapon deals damage, push the target one space away from you. If its movement is prevented, deal this weapon's Base Damage."},{"name":"Backlash","cat":"Magic","desc":"When an enemy hits or misses you, the attacker takes this weapon's Base Damage."},{"name":"Unflagging","cat":"Magic","desc":"Treat your Fatigue as one rank lower while wielding this weapon."},{"name":"Welling","cat":"Magic","desc":"When this weapon deals damage, charge one additional tier."},{"name":"Devouring","cat":"Magic","desc":"When this weapon reduces a target to 0, restore Vitality equal to your Magic."},{"name":"Blinking","cat":"Magic","desc":"This weapon's Range becomes In Sight."}]
    /* CANON:infusions end */
  },
  augmentation:{
    side:"augmentation",noun:"augmentation",catLabel:"Domain",core:true,
    eyebrow:"ShardForge \u00B7 Augmentations",h1:"Augmentations",
    catPe:"The Mantle",canonPe:"The Temper",
    note:"A suit holds two augmentations, active in every stance. Core is the starting set of six.",
    catOptions:["Affliction Ward", "Anti-burst", "Anti-lethal", "Concealment", "Fortune", "Guardian", "Intercept", "Last Stand", "Mobility", "Negation", "Reactive Move", "Recovery", "Resilience", "Senses", "Stability", "Targeting denial", "Terrain", "Ward", "Ward Vitality", "Something new"],
    /* CANON:augmentations start. Baked from schemas/seed/Augmentations.json by genCanon (disabled in CI). Sibling: docs/foeforge.html augmentations. Change augments in the seed and both tools together, or add [canon-skip: augmentations]. */
    data:[{"name":"Mistform","cat":"Negation","core":true,"desc":"Once each round, you may negate one attack against you."},{"name":"Nullward","cat":"Ward","core":false,"desc":"Once each round, you may negate one spell that targets you."},{"name":"Driftstep","cat":"Reactive Move","core":false,"desc":"When an attack hits you, you may immediately move one space."},{"name":"Phantomfield","cat":"Mobility","core":true,"desc":"You may move through enemies, allies, and obstacles. You may not end your movement inside one."},{"name":"Treadlight","cat":"Terrain","core":false,"desc":"You ignore the movement and damage payloads of Pales you stand in or move through."},{"name":"Shadowmeld","cat":"Concealment","core":false,"desc":"While wielding this, if you deal no damage this round you become Obscured at the end of the round."},{"name":"Echosight","cat":"Senses","core":false,"desc":"You can see through darkness and concealment, and you cannot be hidden from or ambushed."},{"name":"Afterimage","cat":"Fortune","core":false,"desc":"Your first Evasion roll each round is a Lucky Roll."},{"name":"Deathsong","cat":"Fortune","core":false,"desc":"After you take damage, the attacker takes Base Damage equal to your highest defensive attribute."},{"name":"Oakspine","cat":"Stability","core":true,"desc":"You cannot be forcibly moved from your space."},{"name":"Threshold","cat":"Anti-burst","core":true,"desc":"No single hit can reduce your Vitality by more than half your current Vitality."},{"name":"Emberhold","cat":"Anti-lethal","core":false,"desc":"Each time a hit would reduce you to 0 Vitality, you remain at 1 instead. Each time this happens, there is an even chance you die."},{"name":"Mendseam","cat":"Recovery","core":true,"desc":"At the start of each round, recover Vitality equal to your highest defensive attribute."},{"name":"Scarweave","cat":"Ward Vitality","core":false,"desc":"At the start of each round, gain Temporary Vitality equal to your highest defensive attribute."},{"name":"Runeguard","cat":"Guardian","core":true,"desc":"Once each round, when an ally within your Mobility range is hit, reduce the Base Damage they take by your highest defensive attribute."},{"name":"Bulwark","cat":"Intercept","core":false,"desc":"Once each round, when an ally within your Mobility range is targeted by an attack, you may make yourself the target instead."},{"name":"Unbowed","cat":"Resilience","core":false,"desc":"The highest Fatigue rank you can reach is 3."},{"name":"Lastlight","cat":"Last Stand","core":false,"desc":"While below 25 Vitality, the first attack against you each round misses."},{"name":"Ironroot","cat":"Targeting denial","core":false,"desc":"Spells and abilities may target you, but they may not target the space you occupy."},{"name":"Hexward","cat":"Affliction Ward","core":false,"desc":"The first Affliction applied to you each round is prevented."}]
    /* CANON:augmentations end */
  }
};
let SIDE="infusion";
const catLoaded={infusion:false,augmentation:false};
function loadCatalog(side){post({type:"CATALOG_LOAD",payload:{side:side}});}
function sc(){return SIDES[SIDE];}

/* ---------- catalog ---------- */
function gem(){return `<svg class="sigil" viewBox="0 0 44 44" aria-hidden="true"><g fill="none" stroke="var(--gold)" stroke-width="1" stroke-opacity=".7"><path d="M14 8 H30 L38 18 L22 40 L6 18 Z" fill="var(--steel)" fill-opacity=".14"/><path d="M6 18 H38" stroke-opacity=".4"/><path d="M14 8 L18 18 M30 8 L26 18 M18 18 H26" stroke-opacity=".4"/><path d="M18 18 L22 40 M26 18 L22 40" stroke-opacity=".4"/></g><circle cx="22" cy="12" r="1.6" fill="var(--gold)" fill-opacity=".9"/></svg>`;}
function sigil(){return `<svg class="sigil" viewBox="0 0 44 44" aria-hidden="true"><g fill="none" stroke="var(--gold)" stroke-width="1" stroke-opacity=".7"><path d="M22 3 L38 10 V24 C38 33 31 39 22 42 C13 39 6 33 6 24 V10 Z" fill="var(--steel)" fill-opacity=".14"/><path d="M22 3 V42" stroke-opacity=".4"/><path d="M6 18 H38" stroke-opacity=".4"/></g><circle cx="22" cy="18" r="2" fill="var(--gold)" fill-opacity=".9"/></svg>`;}
const cstate={q:"",cat:"",core:"",expanded:false,page:0};
const uniq=a=>[...new Set(a)].filter(Boolean);
function buildFilters(){
  const S=sc();
  const cats=S.core?uniq(S.data.map(d=>d.cat)).sort():S.catOptions.slice();
  document.getElementById("fCat").innerHTML=`<option value="">${S.catLabel}: all</option>`+cats.map(c=>`<option value="${c}">${c}</option>`).join("");
  const fc=document.getElementById("fCore");
  if(S.core){fc.style.display="";fc.innerHTML=`<option value="">Core: all</option><option value="core">Core only</option>`;}
  else{fc.style.display="none";fc.innerHTML="";}
}
const cfiltering=()=>cstate.q||cstate.cat||cstate.core;
function cmatch(d){
  if(cstate.cat&&d.cat!==cstate.cat)return false;
  if(sc().core&&cstate.core==="core"&&!d.core)return false;
  if(cstate.q){const h=(d.name+" "+d.desc+" "+d.cat).toLowerCase();if(!h.includes(cstate.q.toLowerCase()))return false;}
  return true;
}
function ccard(d){return `<article class="card">${sc().side==="infusion"?gem():sigil()}<div class="cbody"><div class="row1"><span class="cnm">${esc(d.name)}</span>${d.core?'<span class="badge core">Core</span>':''}</div><p class="crules">${esc(d.desc)}</p><div class="cmeta"><span>${esc(d.cat)}</span></div></div></article>`;}
const SF_PAGE=12;
function sfPagerHTML(page,pages){
  if(pages<=1)return "";
  let h='<div class="sfpager"><button class="sfpg" data-pg="'+(page-1)+'"'+(page<=0?' disabled':'')+'>Prev</button>';
  const nums=[];for(let i=0;i<pages;i++){if(i===0||i===pages-1||Math.abs(i-page)<=1)nums.push(i);else if(nums[nums.length-1]!==-1)nums.push(-1);}
  nums.forEach(i=>{h+= i===-1?'<span class="sfpg dots" aria-hidden="true">\u00B7</span>':'<button class="sfpg" data-pg="'+i+'" aria-current="'+(i===page?'true':'false')+'">'+(i+1)+'</button>';});
  return h+'<button class="sfpg" data-pg="'+(page+1)+'"'+(page>=pages-1?' disabled':'')+'>Next</button></div>';
}
function sfWirePager(){
  document.querySelectorAll("#list .sfpg[data-pg]").forEach(b=>b.addEventListener("click",()=>{const n=+b.getAttribute("data-pg");if(n!==cstate.page){cstate.page=n;renderCatalog();const l=document.getElementById("list");if(l&&l.scrollIntoView)l.scrollIntoView({block:"start"});}}));
}
function sfPaginate(arr){const pages=Math.max(1,Math.ceil(arr.length/SF_PAGE));if(cstate.page>=pages)cstate.page=pages-1;if(cstate.page<0)cstate.page=0;return {pages,slice:arr.slice(cstate.page*SF_PAGE,cstate.page*SF_PAGE+SF_PAGE)};}
function renderCatalog(){
  const S=sc();
  const list=document.getElementById("list"),counter=document.getElementById("count");
  const flt=cfiltering();
  const all=S.data.filter(cmatch);
  if(!S.core){
    if(!all.length){list.innerHTML=`<div class="empty"><b>Nothing matches.</b><br>Loosen a filter or clear the search.</div>`;}
    else{const pg=sfPaginate(all);list.innerHTML=`<div class="secthead"><span class="nm">${flt?'Results':'The set'}</span></div>`+pg.slice.map(ccard).join("")+sfPagerHTML(cstate.page,pg.pages);}
    counter.textContent=flt?`${all.length} matching`:`${S.data.length} in the catalog`;
    sfWirePager();reportHeight();return;
  }
  const core=all.filter(d=>d.core);
  const open=flt||cstate.expanded;
  const visible=flt?all:(open?all:core);
  let html="";
  if(!visible.length){html=`<div class="empty"><b>Nothing matches.</b><br>Loosen a filter or clear the search.</div>`;}
  else{
    let toggle="";
    if(!flt&&all.length>core.length)toggle=`<button class="toggle" id="toggle" type="button">${open?'Show Core only':('Show all '+all.length)}</button>`;
    const pg=sfPaginate(visible);
    html=`<div class="secthead"><span class="nm">${flt?'Results':'The set'}</span>${toggle}</div>`+pg.slice.map(ccard).join("")+sfPagerHTML(cstate.page,pg.pages);
  }
  list.innerHTML=html;
  counter.textContent=flt?`${visible.length} matching`:`Showing Core. ${S.data.length} in the full catalog.`;
  const tg=document.getElementById("toggle");if(tg)tg.onclick=()=>{cstate.expanded=!cstate.expanded;cstate.page=0;renderCatalog();};
  sfWirePager();reportHeight();
}
document.getElementById("q").addEventListener("input",e=>{cstate.q=e.target.value;cstate.page=0;renderCatalog();});
document.getElementById("fCat").addEventListener("change",e=>{cstate.cat=e.target.value;cstate.page=0;renderCatalog();});
document.getElementById("fCore").addEventListener("change",e=>{cstate.core=e.target.value;cstate.page=0;renderCatalog();});
document.getElementById("clear").addEventListener("click",()=>{cstate.q="";cstate.cat="";cstate.core="";cstate.expanded=false;cstate.page=0;document.getElementById("q").value="";document.getElementById("fCat").value="";document.getElementById("fCore").value="";renderCatalog();});

/* ---------- canonize ---------- */
const C={name:"",effect:"",cat:"",lore:"",by:"",submitted:false};
const EMDASH=/\u2014/;
const AIPHRASE=/(indistinguishable from|endure where others fade|extraordinary amounts of)/i;
function softCheck(){
  const all=[C.name,C.effect,C.lore].join(" ");
  if(EMDASH.test(all))return "Found an em dash. House style keeps copy free of them.";
  if(AIPHRASE.test(all))return "That phrasing reads as filler. State what it does plainly.";
  return "";
}
function renderCanon(){
  const S=sc();
  const root=document.getElementById("canon");
  if(C.submitted){
    root.innerHTML=`<div class="done-card"><h3>Sent for canonization</h3><p>Your ${S.noun} is in the queue for the community vote. If it passes, the team folds it into the catalog. Thank you for adding to the world.</p><button id="again">Submit another</button></div>`;
    root.querySelector("#again").onclick=()=>{C.name="";C.effect="";C.cat="";C.lore="";C.by="";C.submitted=false;renderCanon();};
    reportHeight();return;
  }
  root.innerHTML=`<div class="canonintro"><strong>How this works</strong>Made a custom ${S.noun} at your table that you think belongs in the world? Put it forward. The community votes, and the team checks it against the rules before it becomes canon. Describe what it does in plain terms.</div>
    <label class="fld"><span>Name</span><input id="cName" value="${esc(C.name)}" placeholder="A short, plain name"></label>
    <label class="fld"><span>What it does<span class='finfo' tabindex='0' role='button' aria-label='What is this'>i<span class='tip'>The plain rules text for this creation, worded the way it will read in the catalog.</span></span></span><textarea id="cEffect" rows="4" placeholder="Plain rules text, the way it reads in the catalog.">${esc(C.effect)}</textarea></label>
    <label class="fld"><span>${S.catLabel}<span class='finfo' tabindex='0' role='button' aria-label='What is this'>i<span class='tip'>Which family or class this creation belongs to. Sets where it lands and how it is grouped.</span></span></span><select class="cat" id="cCat">${S.catOptions.map(o=>`<option value="${esc(o)}" ${C.cat===o?"selected":""}>${esc(o)}</option>`).join("")}</select></label>
    <label class="fld"><span>Lore <em>(one line, optional)</em></span><input id="cLore" value="${esc(C.lore)}" placeholder="One grounded line."></label>
    <div class="softnote" id="soft"><span class="d"></span><span id="softtext"></span></div>
    <button class="submit" id="cSubmit" disabled>Put forward for the vote</button>
    <p class="note">Anyone can submit. The vote and the team decide what becomes canon.</p>`;
  const g=s=>root.querySelector(s);
  g("#cName").oninput=e=>{C.name=e.target.value;upd();};
  g("#cEffect").oninput=e=>{C.effect=e.target.value;upd();};
  g("#cCat").onchange=e=>{C.cat=e.target.value;upd();};
  g("#cLore").oninput=e=>{C.lore=e.target.value;upd();};
  g("#cSubmit").onclick=submit;
  if(!C.cat){C.cat=S.catOptions[0];}
  upd();reportHeight();
}
function upd(){
  const root=document.getElementById("canon");
  const msg=softCheck();
  const sn=root.querySelector("#soft");
  if(sn){sn.classList.toggle("show",!!msg);root.querySelector("#softtext").textContent=msg;}
  const btn=root.querySelector("#cSubmit");
  if(btn)btn.disabled=!(C.name.trim()&&C.effect.trim());
}
function submit(){
  post({type:"SHARD_SUBMIT",payload:{
    side:SIDE, name:C.name.trim(), effect:C.effect.trim(), category:C.cat||sc().catOptions[0], lore:C.lore.trim(), submittedBy:C.by.trim()
  }});
  C.submitted=true;renderCanon();
}

/* ---------- ledger ---------- */
let lgScope="all", lgLoaded=false, lgItems=[];
function loadLedger(){
  const root=document.getElementById("ledger");
  if(root)root.innerHTML=`<div class="empty">Loading the ledger.</div>`;
  post({type:"SHARD_LOAD_LEDGER",payload:{scope:lgScope,side:SIDE}});
}
function badgeOf(st){return ({canon:["Canon","Folded into the catalog."],voting:["In Vote","The community is weighing in."],submitted:["Submitted","Waiting for the vote."],declined:["Declined","Set aside for now."]})[st]||["Draft","A work in progress."];}
function renderLedger(items){
  lgItems=items||[];
  const root=document.getElementById("ledger"); if(!root)return;
  if(!lgItems.length){root.innerHTML=`<div class="empty"><b>Nothing here yet.</b><br>${lgScope==="mine"?"You have not put one forward.":"Be the first to put one forward."}</div>`;reportHeight();return;}
  root.innerHTML=lgItems.map(it=>{
    let meta={}; try{meta=(JSON.parse(it.payload||"{}").meta)||{};}catch(e){}
    const b=badgeOf(it.canonStatus); const canon=it.canonStatus==="canon";
    return `<article class="lgcard">`
      +`<div class="lgrow"><span class="lgnm">${esc(it.creationName)}</span>${it.creatorName?`<span class="lgby">by ${esc(it.creatorName)}</span>`:""}</div>`
      +`<div class="lgrow" style="margin-top:6px"><span class="lgbadge${canon?"":" plain"}">${b[0]}</span>${meta.category?`<span class="lgtag">${esc(meta.category)}</span>`:""}<span class="lgtag">${esc(it.kind||SIDE)}</span></div>`
      +`<p class="lgeffect">${esc(it.shorthand||"")}</p>`
      +(meta.lore?`<p class="lglore">${esc(meta.lore)}</p>`:"")
      +`<div class="lggate">${b[1]}</div>`
      +`<div class="lgactions"><button type="button" class="lgvote" data-id="${esc(it.creationId)}"><span class="ar">&#9650;</span> Vote <span class="vc">${it.voteCount||0}</span></button></div>`
      +`</article>`;
  }).join("");
  root.querySelectorAll(".lgvote").forEach(bn=>bn.addEventListener("click",()=>castVote(bn)));
  reportHeight();
}
function castVote(btn){
  if(!btn||btn.disabled)return;
  const id=btn.getAttribute("data-id"); if(!id)return;
  btn.disabled=true;
  post({type:"SHARD_VOTE",payload:{creationId:id}});
}
function applyVoteResult(m){
  if(!m||!m.creationId)return;
  let btn=null; document.querySelectorAll(".lgvote").forEach(b=>{if(b.getAttribute("data-id")===m.creationId)btn=b;});
  if(m.ok){
    if(btn){ if(m.voteCount!=null){const c=btn.querySelector(".vc");if(c)c.textContent=m.voteCount;} btn.classList.add("voted");btn.disabled=true; }
    lgItems.forEach(it=>{if(it.creationId===m.creationId&&m.voteCount!=null)it.voteCount=m.voteCount;});
  } else if(btn){ btn.disabled=false; }
}
(function(){
  const fs=document.querySelectorAll(".lgf[data-scope]");
  fs.forEach(b=>b.addEventListener("click",()=>{
    lgScope=b.getAttribute("data-scope");
    fs.forEach(x=>x.classList.toggle("active",x===b));
    loadLedger();
  }));
  const r=document.getElementById("lgReload"); if(r)r.addEventListener("click",loadLedger);
})();

/* ---------- shared ---------- */
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function post(msg){try{if(window.parent)window.parent.postMessage(msg,"*");}catch(e){}}
function reportHeight(){try{if(window.parent)window.parent.postMessage({type:"FORGE_HEIGHT",height:document.body.scrollHeight},"*");}catch(e){}}
new ResizeObserver(reportHeight).observe(document.body);
function setPane(p){
  ["catalog","canon","ledger"].forEach(x=>{
    const seg=document.getElementById("seg-"+x); if(seg)seg.setAttribute("aria-selected",p===x);
    const pane=document.getElementById("pane-"+x); if(pane)pane.classList.toggle("active",p===x);
  });
  const panes=document.querySelector(".panes"); if(panes)panes.classList.toggle("show-canon",p==="canon");
  if(p==="ledger"&&!lgLoaded){lgLoaded=true;loadLedger();}
  reportHeight();
}
document.getElementById("seg-catalog").onclick=()=>setPane("catalog");
document.getElementById("seg-canon").onclick=()=>setPane("canon");
document.getElementById("seg-ledger").onclick=()=>setPane("ledger");

function applySide(ns){
  if(ns!==SIDE){SIDE=ns;C.name="";C.effect="";C.cat="";C.lore="";C.by="";C.submitted=false;cstate.q="";cstate.cat="";cstate.core="";cstate.expanded=false;cstate.page=0;}
  const S=sc();
  document.getElementById("side-infusion").setAttribute("aria-selected",SIDE==="infusion");
  document.getElementById("side-augmentation").setAttribute("aria-selected",SIDE==="augmentation");
  document.getElementById("sfH1").textContent=S.h1;
  document.getElementById("catPe").textContent=S.catPe;
  document.getElementById("canonPe").textContent=S.canonPe;
  document.getElementById("catNote").textContent=S.note;
  const q=document.getElementById("q"); if(q)q.value="";
  buildFilters();renderCatalog();renderCanon();
  if(!catLoaded[SIDE]){catLoaded[SIDE]=true;loadCatalog(SIDE);}
  if(lgLoaded)loadLedger();
  reportHeight();
}
document.getElementById("side-infusion").onclick=()=>applySide("infusion");
document.getElementById("side-augmentation").onclick=()=>applySide("augmentation");

window.onmessage=function(e){
  const m=e&&e.data; if(!m||typeof m!=="object")return;
  if(m.type==="CATALOG_RESULT"){const side=m.side||"infusion";const items=Array.isArray(m.items)?m.items:[];if(items.length)SIDES[side].data=items;if(side===SIDE){buildFilters();renderCatalog();}return;}
  if(m.type==="SHARD_LEDGER_RESULT"){renderLedger(m.items||[]);return;}
  if(m.type==="SHARD_VOTE_RESULT"){applyVoteResult(m);return;}
  if(m.type==="SHARD_SUBMIT_RESULT"){
    if(!m.ok){C.submitted=false;renderCanon();const note=document.querySelector("#pane-canon .note");if(note){note.textContent=(m.errors&&m.errors[0])||"That did not save. Try again.";note.style.color="var(--warn)";}}
    else{lgLoaded=false;}
    return;
  }
};

applySide("infusion");

</script>

<script>
(function(){
  document.addEventListener('click', function(e){
    var t=e.target.closest ? e.target.closest('.finfo') : null;
    document.querySelectorAll('.finfo.open').forEach(function(x){ if(x!==t) x.classList.remove('open'); });
    if(t){ e.preventDefault(); e.stopPropagation(); t.classList.toggle('open'); placeTip(t); }
  });
  /* hold the tip inside the window: 16px from either edge */
  function placeTip(f){
    var tip=f.querySelector('.tip'); if(!tip) return;
    tip.style.left='0px';
    var r=f.getBoundingClientRect(), w=tip.offsetWidth||Math.min(280,window.innerWidth-32);
    var x=Math.max(16,Math.min(r.left,window.innerWidth-16-w));
    tip.style.left=(x-r.left)+'px';
  }
  document.addEventListener('mouseover', function(e){
    var t=e.target.closest ? e.target.closest('.finfo') : null;
    if(t) placeTip(t);
  });
})();
</script>
