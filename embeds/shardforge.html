<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShardForge</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Cinzel:wght@500;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
/* site-look:start */
/* site-look v2: the lorefell-site look for the player tools. Source: forge scripts/site-look.css.
   Each tool pastes this block verbatim between the site-look markers; npm run checks keeps the copies identical.
   Old variable names are aliased onto the site tokens so a tool's own rules keep resolving. */
:root{
  --void:#0A1124;--gold:#D8BC6A;--bone:#EFE8D8;--ash:#B9B2A2;--hair:rgba(239,232,216,.22);
  --panel:rgba(239,232,216,.035);--panel-2:rgba(239,232,216,.06);
  --f-display:'IM Fell English',Georgia,'Times New Roman',serif;
  --f-menu:'Cinzel','IM Fell English',Georgia,serif;
  --f-label:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --navy:var(--void);--ink:var(--void);--silver:var(--bone);--parch:var(--bone);
  --ice:var(--ash);--muted:var(--ash);--dim:var(--ash);--line:var(--hair);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--void);color:var(--bone)}
body{font-family:var(--f-display);font-size:20px;line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--bone);outline-offset:4px}
.sl-label{font-family:var(--f-label);font-weight:500;font-size:14px;line-height:1.3;letter-spacing:.3em;text-transform:uppercase;color:var(--ash)}
.sl-title{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.4vw,36px);line-height:1.15;color:var(--bone);margin:0}
.sl-btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border:1px solid var(--bone);border-radius:0;background:transparent;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:16px;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .25s,color .25s}
.sl-btn.solid{background:var(--gold);border-color:var(--gold);color:var(--void)}
.sl-btn.small{min-height:44px;padding:0 18px;font-size:14px}
.sl-btn:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover){.sl-btn:hover{background:var(--bone);color:var(--void)}.sl-btn.solid:hover{background:transparent;color:var(--gold)}}
.sl-panel{border:1px solid var(--hair);border-radius:0;background:transparent}
.sl-tabs{display:flex;flex-wrap:wrap;gap:4px 22px;border-bottom:1px solid var(--hair)}
.sl-tab{min-height:44px;padding:0 2px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ash);font-family:var(--f-menu);font-size:15px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.sl-tab[aria-selected="true"],.sl-tab.on,.sl-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.sl-chip{display:inline-flex;align-items:center;min-height:44px;min-width:44px;justify-content:center;padding:0 14px;border:1px solid var(--hair);border-radius:0;background:transparent;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.sl-chip[aria-pressed="true"],.sl-chip[aria-current="true"],.sl-chip.on,.sl-chip.active{border-color:var(--gold);color:var(--gold)}
/* info mark: a 15px glyph inside a 44px hit area, opened by tap (.open). The tip hangs from the
   row that holds the mark: put .sl-info-host on that label or row, and the tip never outgrows it. */
.sl-info-host{position:relative}
.sl-info{position:static;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-14px -12px;vertical-align:middle;cursor:pointer}
.sl-info .tip{position:absolute;top:100%;left:0;z-index:30;width:min(320px,100%);padding:12px 14px;border:1px solid var(--hair);background:var(--void);color:var(--bone);font-family:var(--f-display);font-size:16px;line-height:1.4;letter-spacing:0;text-transform:none;display:none}
.sl-info.open .tip{display:block}
.sl-split{display:grid;grid-template-columns:1fr;gap:28px}
@media (min-width:900px){.sl-split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
/* reduced motion: animations jump to their end state, so anything shown by an animation still shows */
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
/* a dropdown's list: the group labels sat on a white bar (Nate, 2026-10-12) */
select option{background:var(--void);color:var(--bone)}
select optgroup{background:var(--void);color:var(--gold);font-style:normal;font-weight:600}
/* no scrollbar inside a tool: the site holds the tool in a centred frame, so a bar inside it sat
   mid-screen (Nate, 2026-10-12). Wheel, trackpad, touch and keys still scroll. */
html,body,*{scrollbar-width:none!important}
::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
/* the page: the navy of the site's lore cards (lorefell-site src/styles/lore.css .lc-face), held
   still behind the content, with a faint gold dust drifting up it, one slow cycle a minute. The
   cards sit on it semi-transparent with a thin gold edge (Nate, 2026-10-13). A tool marks a
   grouping box with .sl-card and keeps its own padding. --void is the navy's deep end in the tools,
   so their solid bars, headers and fields sit in the same blue instead of black strips. */
html{background:#0A1124 linear-gradient(180deg,#121D3A,#0A1124) fixed!important}
body{background:transparent!important}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle at 22% 28%,rgba(216,188,106,.6) 0 1px,transparent 1.7px),radial-gradient(circle at 71% 63%,rgba(216,188,106,.45) 0 1px,transparent 1.7px),radial-gradient(circle at 46% 86%,rgba(239,232,216,.4) 0 .8px,transparent 1.5px),radial-gradient(circle at 88% 14%,rgba(216,188,106,.4) 0 .8px,transparent 1.5px);
  background-size:260px 300px,340px 300px,220px 300px,300px 300px;
  animation:slDust 60s linear infinite}
@keyframes slDust{from{background-position:0 0}to{background-position:0 -300px}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
.sl-card{position:relative;border:1px solid rgba(216,188,106,.28)!important;background:rgba(6,10,20,.42)!important}
/* site-look:end */
  :root{--warn:#d6b35a}
  *{box-sizing:border-box}html,body{margin:0}
  body{padding:24px 20px 48px}
  button{font:inherit;color:inherit}
  .shell{max-width:720px;margin:0 auto}
  /* the tool's mark from the site's maker's marks (lorefell-site src/data/marks.js), as SigilForge and FellForge wear theirs */
  .brand{display:flex;align-items:center;gap:12px;color:var(--gold);margin:0 0 20px}
  .brand svg{width:48px;height:48px;display:block;flex:none;margin:-4px -2px -4px -6px}
  h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.4vw,34px);line-height:1;margin:0;color:var(--bone)}

  /* the two sides: one tap picks what you are forging */
  .sides{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--hair)}
  .sides button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:72px;padding:10px 8px;background:transparent;border:0;border-radius:0;color:var(--ash);cursor:pointer;text-align:center}
  .sides button+button{border-left:1px solid var(--hair)}
  .sides .nm{font-family:var(--f-menu);font-size:17px;letter-spacing:.14em;text-transform:uppercase}
  .sides .for{font-family:var(--f-label);font-weight:500;font-size:13px;letter-spacing:.22em;text-transform:uppercase;opacity:.8}
  .sides button:hover{color:var(--bone)}
  .sides button[aria-selected="true"]{color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold);background:rgba(216,188,106,.06)}

  label.fld{display:block;margin-top:20px}
  label.fld>span{display:flex;align-items:center;font-family:var(--f-label);font-weight:500;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--ash);margin-bottom:8px;min-height:22px}
  label.fld>span em{font-family:var(--f-display);font-style:italic;text-transform:none;letter-spacing:0;font-size:16px;margin-left:8px}
  input,textarea,select{width:100%;min-height:48px;background:transparent;border:1px solid var(--hair);border-radius:0;color:var(--bone);font-family:var(--f-display);font-size:18px;padding:10px 14px;outline:none}
  select{appearance:none;-webkit-appearance:none;padding-right:40px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--ash) 50%),linear-gradient(135deg,var(--ash) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
  textarea{line-height:1.45;resize:vertical}
  input::placeholder,textarea::placeholder{color:var(--ash);opacity:.75}
  input:focus,textarea:focus,select:focus{border-color:var(--gold)}
  #forge{margin-top:18px;padding:4px 20px 22px}
  @media (max-width:560px){#forge{padding:2px 14px 18px}}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px}
  @media (max-width:560px){.row2{grid-template-columns:1fr}}

  .softnote{display:none;margin-top:12px;font-size:17px;color:var(--warn);align-items:flex-start;gap:10px}
  .softnote.show{display:flex}
  .softnote .d{flex:0 0 7px;width:7px;height:7px;background:var(--warn);margin-top:10px;transform:rotate(45deg)}
  /* the one solid gold button */
  .submit{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:24px;padding:0 20px;background:var(--gold);border:1px solid var(--gold);border-radius:0;color:var(--void);font-family:var(--f-label);font-weight:600;font-size:16px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s}
  .submit:hover:not(:disabled){background:transparent;color:var(--gold)}
  .submit:disabled{opacity:.45;cursor:not-allowed}
  .err{margin:12px 0 0;color:var(--warn);font-size:17px;text-align:center}
  .err:empty{display:none}
  .done{border:1px solid var(--hair);padding:28px 20px;margin-top:24px;text-align:center}
  .done h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 8px;color:var(--gold)}
  .done p{color:var(--ash);font-size:18px;margin:0 0 20px}
  .done button{min-height:50px;background:transparent;border:1px solid var(--bone);border-radius:0;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:16px;letter-spacing:.22em;text-transform:uppercase;padding:0 26px;cursor:pointer;transition:background .25s,color .25s}
  .done button:hover{background:var(--bone);color:var(--void)}

  /* a phone held sideways is short: tighter rhythm, the sides in one slim row */
  @media (orientation:landscape) and (max-height:540px){
    body{padding:14px 20px 32px}
    .brand{margin-bottom:12px}
    .brand svg{width:40px;height:40px}
    h1{font-size:26px}
    .sides button{flex-direction:row;gap:12px;min-height:48px}
    label.fld{margin-top:14px}
    .submit{margin-top:18px}
  }

  /* info mark: a 16px glyph in a 44px hit area, opened by tap, tip held on screen */
  .finfo{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-11px -12px -11px -4px;
    color:var(--gold);font-family:var(--f-display);font-size:14px;font-style:italic;line-height:1;letter-spacing:0;text-transform:none;cursor:pointer;vertical-align:middle;user-select:none}
  .finfo::before{content:'';position:absolute;left:14px;top:14px;width:16px;height:16px;border:1px solid var(--gold);box-sizing:border-box}
  .finfo:hover::before,.finfo.open::before{background:rgba(216,188,106,.14)}
  .finfo .tip{position:absolute;left:0;top:100%;width:min(280px,calc(100vw - 32px));z-index:60;display:none;
    background:var(--void);border:1px solid var(--hair);border-radius:0;padding:12px 14px;color:var(--bone);font-family:var(--f-display);font-size:16px;
    font-style:normal;letter-spacing:0;text-transform:none;line-height:1.4;text-align:left;font-weight:400}
  .finfo.open .tip{display:block}
  @media (hover:hover){.finfo:hover .tip{display:block}}
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <svg viewBox="0 0 96 96" aria-hidden="true"><path d="M33 22 H63 L74 35 L48 76 L22 35 Z" fill="currentColor"/><g fill="none" stroke="#0A1124" stroke-width="2"><path d="M22 35 H74"/><path d="M33 22 L40 35 M63 22 L56 35"/><path d="M40 35 L48 76 M56 35 L48 76"/></g></svg>
    <h1>ShardForge</h1>
  </div>

  <div class="sides" role="tablist" aria-label="What you are forging">
    <button id="side-infusion" type="button" role="tab" aria-selected="true"><span class="nm">Infusion</span><span class="for">For a weapon</span></button>
    <button id="side-augmentation" type="button" role="tab" aria-selected="false"><span class="nm">Augmentation</span><span class="for">For armor</span></button>
  </div>

  <div id="forge" class="sl-card"></div>
</div>

<script>
/* ShardForge makes one custom infusion or augmentation and submits it for the vote. The catalogs
   live on the character sheet and in the FellGuide, and the votes in the LoreForge (Nate,
   2026-10-12). The canon lists below only warn when a new name is already taken. */
const SIDES={
  infusion:{
    noun:"infusion",catLabel:"Attribute",
    catTip:"The attribute it is matched to. A weapon takes infusions of its own attribute.",
    doesTip:"The rules text, worded the way it will read on the sheet. A weapon holds three infusions.",
    doesPh:"Add your Precision to this weapon's Base Damage.",
    catOptions:["Precision", "Power", "Magic"],
    /* CANON:infusions start. Baked from schemas/seed/Infusions.json by genCanon (disabled in CI). Change infusions in the seed and here together, or add [canon-skip: infusions]. */
    data:[{"name":"Targeted","cat":"Precision","desc":"Attacks with this weapon ignore Evasion equal to your Precision."},{"name":"Sharp","cat":"Precision","desc":"Add your Precision to this weapon's Base Damage."},{"name":"Wounding","cat":"Precision","desc":"Add your Precision to this weapon's Bonus Damage."},{"name":"Rebounding","cat":"Precision","desc":"When this weapon deals damage, deal its Base Damage again. The second instance cannot be reduced."},{"name":"Hunting","cat":"Precision","desc":"Attacks with this weapon are Lucky Rolls."},{"name":"Rooting","cat":"Precision","desc":"When this weapon deals damage, the target cannot move until the end of the round."},{"name":"Guarding","cat":"Precision","desc":"When an attack targeting you misses, deal this weapon's standard damage to the attacker."},{"name":"Agile","cat":"Precision","desc":"While wielding this weapon, you may use a free movement during your Act. This does not remove your ability to move during your React."},{"name":"Vorpal","cat":"Precision","desc":"When this weapon deals damage, the target loses two Charges."},{"name":"Reprieve","cat":"Precision","desc":"When this weapon reduces a target to 0, remove one Affliction from yourself."},{"name":"Swift","cat":"Precision","desc":"When you make a standard attack, immediately make one more standard attack against the same target. The extra attack does not trigger this effect again."},{"name":"Powerful","cat":"Power","desc":"Attacks with this weapon ignore Durability equal to your Power."},{"name":"Brutal","cat":"Power","desc":"Add your Power to this weapon's Base Damage."},{"name":"Mauling","cat":"Power","desc":"Add your Power to this weapon's Bonus Damage."},{"name":"Sweeping","cat":"Power","desc":"When this weapon deals damage, the nearest other enemy takes this weapon's Base Damage."},{"name":"Merciless","cat":"Power","desc":"Fellmark effects with this weapon are doubled."},{"name":"Hooking","cat":"Power","desc":"When this weapon deals damage, pull the target one space toward you. If its movement is prevented, deal this weapon's Base Damage."},{"name":"Vengeful","cat":"Power","desc":"When an enemy hits you, deal this weapon's standard damage to it."},{"name":"Goring","cat":"Power","desc":"Attacks with this weapon ignore the target's Armor Stance entirely."},{"name":"Siphoning","cat":"Power","desc":"When this weapon deals damage, take one of the target's Charges for yourself."},{"name":"Emboldening","cat":"Power","desc":"When this weapon reduces a target to 0, gain temporary Vitality equal to your Power."},{"name":"Afflicted","cat":"Power","desc":"When you inflict a Fellmark with this weapon, apply an Affliction of your choice. It replaces the weapon's innate Fellmark Affliction."},{"name":"Ethereal","cat":"Magic","desc":"Attacks with this weapon ignore Resistance equal to your Magic."},{"name":"Potent","cat":"Magic","desc":"Add your Magic to this weapon's Base Damage."},{"name":"Blighting","cat":"Magic","desc":"Add your Magic to this weapon's Bonus Damage."},{"name":"Coursing","cat":"Magic","desc":"When you successfully cast a spell, each enemy adjacent to you takes this weapon's Base Damage."},{"name":"Honed","cat":"Magic","desc":"Rolls of 5 also count as Fellmarks with this weapon."},{"name":"Forceful","cat":"Magic","desc":"When this weapon deals damage, push the target one space away from you. If its movement is prevented, deal this weapon's Base Damage."},{"name":"Backlash","cat":"Magic","desc":"When an enemy hits or misses you, the attacker takes this weapon's Base Damage."},{"name":"Unflagging","cat":"Magic","desc":"Treat your Fatigue as one rank lower while wielding this weapon."},{"name":"Welling","cat":"Magic","desc":"When this weapon deals damage, charge one additional tier."},{"name":"Devouring","cat":"Magic","desc":"When this weapon reduces a target to 0, restore Vitality equal to your Magic."},{"name":"Blinking","cat":"Magic","desc":"This weapon's Range becomes In Sight."}]
    /* CANON:infusions end */
  },
  augmentation:{
    noun:"augmentation",
    doesTip:"The rules text, worded the way it will read on the sheet. A suit holds two augmentations, active in every stance.",
    doesPh:"Once each round, you may negate one spell that targets you.",
    /* no domain: it is only a label on the canon list, so the team sets it at canonization (Nate, 2026-10-12) */
    catOptions:[],
    /* CANON:augmentations start. Baked from schemas/seed/Augmentations.json by genCanon (disabled in CI). Sibling: docs/foeforge.html augmentations. Change augments in the seed and both tools together, or add [canon-skip: augmentations]. */
    data:[{"name":"Mistform","cat":"Negation","core":true,"desc":"Once each round, you may negate one attack against you."},{"name":"Nullward","cat":"Ward","core":false,"desc":"Once each round, you may negate one spell that targets you."},{"name":"Driftstep","cat":"Reactive Move","core":false,"desc":"When an attack hits you, you may immediately move one space."},{"name":"Phantomfield","cat":"Mobility","core":true,"desc":"You may move through enemies, allies, and obstacles. You may not end your movement inside one."},{"name":"Treadlight","cat":"Terrain","core":false,"desc":"You ignore the movement and damage payloads of Pales you stand in or move through."},{"name":"Shadowmeld","cat":"Concealment","core":false,"desc":"While wielding this, if you deal no damage this round you become Obscured at the end of the round."},{"name":"Echosight","cat":"Senses","core":false,"desc":"You can see through darkness and concealment, and you cannot be hidden from or ambushed."},{"name":"Afterimage","cat":"Fortune","core":false,"desc":"Your first Evasion roll each round is a Lucky Roll."},{"name":"Deathsong","cat":"Fortune","core":false,"desc":"After you take damage, the attacker takes Base Damage equal to your highest defensive attribute."},{"name":"Oakspine","cat":"Stability","core":true,"desc":"You cannot be forcibly moved from your space."},{"name":"Threshold","cat":"Anti-burst","core":true,"desc":"No single hit can reduce your Vitality by more than half your current Vitality."},{"name":"Emberhold","cat":"Anti-lethal","core":false,"desc":"Each time a hit would reduce you to 0 Vitality, you remain at 1 instead. Each time this happens, there is an even chance you die."},{"name":"Mendseam","cat":"Recovery","core":true,"desc":"At the start of each round, recover Vitality equal to your highest defensive attribute."},{"name":"Scarweave","cat":"Ward Vitality","core":false,"desc":"At the start of each round, gain Temporary Vitality equal to your highest defensive attribute."},{"name":"Runeguard","cat":"Guardian","core":true,"desc":"Once each round, when an ally within your Mobility range is hit, reduce the Base Damage they take by your highest defensive attribute."},{"name":"Bulwark","cat":"Intercept","core":false,"desc":"Once each round, when an ally within your Mobility range is targeted by an attack, you may make yourself the target instead."},{"name":"Unbowed","cat":"Resilience","core":false,"desc":"The highest Fatigue rank you can reach is 3."},{"name":"Lastlight","cat":"Last Stand","core":false,"desc":"While below 25 Vitality, the first attack against you each round misses."},{"name":"Ironroot","cat":"Targeting denial","core":false,"desc":"Spells and abilities may target you, but they may not target the space you occupy."},{"name":"Hexward","cat":"Affliction Ward","core":false,"desc":"The first Affliction applied to you each round is prevented."}]
    /* CANON:augmentations end */
  }
};
let SIDE="infusion";
const C={name:"",effect:"",cat:"",lore:"",state:"edit",error:""};
let waitTimer=null;
const sc=()=>SIDES[SIDE];

const EMDASH=/[—–]/;
const AIPHRASE=/(indistinguishable from|endure where others fade|extraordinary amounts of)/i;
function softCheck(){
  const n=C.name.trim().toLowerCase();
  if(n&&sc().data.some(d=>String(d.name).toLowerCase()===n))return `A canon ${sc().noun} already has that name.`;
  const all=[C.name,C.effect,C.lore].join(" ");
  if(EMDASH.test(all))return "House style keeps copy free of dashes.";
  if(AIPHRASE.test(all))return "That reads as filler. Say plainly what it does.";
  return "";
}
const tip=t=>`<span class="finfo" tabindex="0" role="button" aria-label="What is this">i<span class="tip">${t}</span></span>`;
function render(){
  const S=sc(), root=document.getElementById("forge");
  if(C.state==="done"){
    root.innerHTML=`<div class="done"><h2>Submitted</h2><p>Your ${S.noun} goes to the community vote, then the team checks it against the rules.</p><button type="button" id="again">Forge another</button></div>`;
    root.querySelector("#again").onclick=()=>{reset();render();};
    reportHeight();return;
  }
  const hasCat=S.catOptions.length>0;
  if(hasCat&&!C.cat)C.cat=S.catOptions[0];
  root.innerHTML=`<div class="${hasCat?"row2":""}">
      <label class="fld"><span>Name</span><input id="cName" maxlength="60" value="${esc(C.name)}" placeholder="A short, plain name" autocomplete="off"></label>
${hasCat?`<label class="fld"><span>${S.catLabel}${tip(S.catTip)}</span><select id="cCat">${S.catOptions.map(o=>`<option value="${esc(o)}"${C.cat===o?" selected":""}>${esc(o)}</option>`).join("")}</select></label>`:""}
    </div>
    <label class="fld"><span>What it does${tip(S.doesTip)}</span><textarea id="cEffect" rows="4" maxlength="600" placeholder="${esc(S.doesPh)}">${esc(C.effect)}</textarea></label>
    <label class="fld"><span>Lore <em>optional</em></span><input id="cLore" maxlength="200" value="${esc(C.lore)}" placeholder="One grounded line"></label>
    <div class="softnote" id="soft"><span class="d"></span><span id="softtext"></span></div>
    <button class="submit" id="cSubmit" type="button" disabled>${C.state==="sending"?"Submitting":"Submit for the vote"}</button>
    <p class="err" id="err" role="status">${esc(C.error)}</p>`;
  const g=q=>root.querySelector(q);
  g("#cName").oninput=e=>{C.name=e.target.value;upd();};
  if(hasCat)g("#cCat").onchange=e=>{C.cat=e.target.value;};
  g("#cEffect").oninput=e=>{C.effect=e.target.value;upd();};
  g("#cLore").oninput=e=>{C.lore=e.target.value;upd();};
  g("#cSubmit").onclick=submit;
  upd();reportHeight();
}
function upd(){
  const root=document.getElementById("forge"), msg=softCheck();
  const sn=root.querySelector("#soft"); if(sn){sn.classList.toggle("show",!!msg);root.querySelector("#softtext").textContent=msg;}
  const btn=root.querySelector("#cSubmit"); if(btn)btn.disabled=C.state==="sending"||!(C.name.trim()&&C.effect.trim());
}
function reset(){C.name="";C.effect="";C.cat="";C.lore="";C.state="edit";C.error="";clearTimeout(waitTimer);}
function submit(){
  if(C.state==="sending")return;
  C.state="sending";C.error="";render();
  post({type:"SHARD_SUBMIT",payload:{side:SIDE,name:C.name.trim(),effect:C.effect.trim(),category:C.cat||sc().catOptions[0]||"",lore:C.lore.trim()}});
  clearTimeout(waitTimer);
  waitTimer=setTimeout(()=>{if(C.state==="sending"){C.state="edit";C.error="The forge did not answer. Try again.";render();}},20000);
}
function setSide(ns){
  if(ns===SIDE)return;
  SIDE=ns;reset();
  ["infusion","augmentation"].forEach(k=>document.getElementById("side-"+k).setAttribute("aria-selected",k===SIDE));
  render();
}
document.getElementById("side-infusion").onclick=()=>setSide("infusion");
document.getElementById("side-augmentation").onclick=()=>setSide("augmentation");

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function post(msg){try{if(window.parent)window.parent.postMessage(msg,"*");}catch(e){}}
function reportHeight(){try{if(window.parent)window.parent.postMessage({type:"FORGE_HEIGHT",height:document.body.scrollHeight},"*");}catch(e){}}
new ResizeObserver(reportHeight).observe(document.body);

window.onmessage=function(e){
  const m=e&&e.data; if(!m||typeof m!=="object")return;
  if(m.type==="SHARD_SUBMIT_RESULT"){
    clearTimeout(waitTimer);
    if(m.ok){C.state="done";}
    else{C.state="edit";C.error=(m.errors&&m.errors[0])||"That did not save. Try again.";}
    render();
  }
};

render();
</script>

<script>
(function(){
  document.addEventListener('click', function(e){
    var t=e.target.closest ? e.target.closest('.finfo') : null;
    document.querySelectorAll('.finfo.open').forEach(function(x){ if(x!==t) x.classList.remove('open'); });
    if(t){ e.preventDefault(); e.stopPropagation(); t.classList.toggle('open'); placeTip(t); }
  });
  /* hold the tip inside the window: 16px from either edge */
  function placeTip(f){
    var tip=f.querySelector('.tip'); if(!tip) return;
    tip.style.left='0px';
    var r=f.getBoundingClientRect(), w=tip.offsetWidth||Math.min(280,window.innerWidth-32);
    var x=Math.max(16,Math.min(r.left,window.innerWidth-16-w));
    tip.style.left=(x-r.left)+'px';
  }
  document.addEventListener('mouseover', function(e){
    var t=e.target.closest ? e.target.closest('.finfo') : null;
    if(t) placeTip(t);
  });
})();
</script>
</body>
</html>
