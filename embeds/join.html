<!-- Join page: player onboarding entry point -->
<!DOCTYPE html>
<!-- build: join-3 -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Cinzel:wght@500;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
/* site-look:start */
/* site-look v1: the lorefell-site look for the player tools. Source: forge scripts/site-look.css.
   Each tool pastes this block verbatim between the site-look markers; npm run checks keeps the copies identical.
   Old variable names are aliased onto the site tokens so a tool's own rules keep resolving. */
:root{
  --void:#060A14;--gold:#D8BC6A;--bone:#EFE8D8;--ash:#B9B2A2;--hair:rgba(239,232,216,.22);
  --panel:rgba(239,232,216,.035);--panel-2:rgba(239,232,216,.06);
  --f-display:'IM Fell English',Georgia,'Times New Roman',serif;
  --f-menu:'Cinzel','IM Fell English',Georgia,serif;
  --f-label:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --navy:var(--void);--ink:var(--void);--silver:var(--bone);--parch:var(--bone);
  --ice:var(--ash);--muted:var(--ash);--dim:var(--ash);--line:var(--hair);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--void);color:var(--bone)}
body{font-family:var(--f-display);font-size:20px;line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--bone);outline-offset:4px}
.sl-label{font-family:var(--f-label);font-weight:500;font-size:14px;line-height:1.3;letter-spacing:.3em;text-transform:uppercase;color:var(--ash)}
.sl-title{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.4vw,36px);line-height:1.15;color:var(--bone);margin:0}
.sl-btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border:1px solid var(--bone);border-radius:0;background:transparent;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:16px;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .25s,color .25s}
.sl-btn:hover{background:var(--bone);color:var(--void)}
.sl-btn.solid{background:var(--gold);border-color:var(--gold);color:var(--void)}
.sl-btn.solid:hover{background:transparent;color:var(--gold)}
.sl-btn.small{min-height:44px;padding:0 18px;font-size:14px}
.sl-btn:disabled{opacity:.45;cursor:not-allowed}
.sl-panel{border:1px solid var(--hair);border-radius:0;background:transparent}
.sl-tabs{display:flex;flex-wrap:wrap;gap:4px 22px;border-bottom:1px solid var(--hair)}
.sl-tab{min-height:44px;padding:0 2px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ash);font-family:var(--f-menu);font-size:15px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.sl-tab[aria-selected="true"],.sl-tab.on,.sl-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.sl-chip{display:inline-flex;align-items:center;min-height:44px;min-width:44px;justify-content:center;padding:0 14px;border:1px solid var(--hair);border-radius:0;background:transparent;color:var(--bone);font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.sl-chip[aria-pressed="true"],.sl-chip[aria-current="true"],.sl-chip.on,.sl-chip.active{border-color:var(--gold);color:var(--gold)}
/* info mark: a 15px glyph inside a 44px hit area, opened by tap (.open), tip held on screen */
.sl-info{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-14px -12px;vertical-align:middle;cursor:pointer}
.sl-info .tip{position:absolute;top:100%;left:0;z-index:30;width:min(280px,calc(100vw - 32px));padding:12px 14px;border:1px solid var(--hair);background:var(--void);color:var(--bone);font-family:var(--f-display);font-size:16px;line-height:1.4;letter-spacing:0;text-transform:none;display:none}
.sl-info.open .tip{display:block}
.sl-split{display:grid;grid-template-columns:1fr;gap:28px}
@media (min-width:900px){.sl-split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* site-look:end */
  *{ box-sizing:border-box; }
  /* its own dark page, so no host can paint white behind it (a light host, or a dark one the browser
     answers with a white frame). The site-look block paints html and body void. */
  body{ margin:0; min-height:100vh; }
  .wrap{ max-width:560px; margin:0 auto; padding:22px 16px 32px; }
  @media (min-width:900px){ .wrap{ max-width:1040px; padding:32px 40px 40px; } }
  /* the adventure's header picture, when it has one; no title here, the host already shows LoreFell */
  .mast img{ display:block; width:100%; max-height:30vh; object-fit:cover; border-radius:0; border:1px solid var(--hair); margin-bottom:6px; }
  h1{ font-family:var(--f-display); font-weight:400; font-size:clamp(26px,3.4vw,36px); line-height:1.15; color:var(--bone); margin:14px 0 8px; overflow-wrap:anywhere; }
  .sub{ color:var(--ash); margin:0 0 18px; }
  .muted{ color:var(--ash); }
  /* desktop: the list runs in two columns, everything else spans the width */
  @media (min-width:900px){
    #view{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); column-gap:16px; align-items:start; }
    #view > :not(.card){ grid-column:1 / -1; }
    #view > h1, #view > .sub, #view > .note{ max-width:44em; }
    #view > .wide{ justify-self:start; width:auto; min-width:360px; }
  }
  .card{ background:transparent; border:1px solid var(--hair); border-radius:0; padding:12px 14px; margin-bottom:10px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; min-width:0; }
  .card .nm{ font-family:var(--f-display); font-size:22px; line-height:1.2; color:var(--bone); flex:1 1 8em; min-width:0; overflow-wrap:anywhere; }
  .card .lv{ font-family:var(--f-label); font-weight:500; font-size:14px; letter-spacing:.2em; text-transform:uppercase; color:var(--ash); }
  .tag{ font-family:var(--f-label); font-weight:600; font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); border:1px solid var(--gold); border-radius:0; padding:3px 9px; }
  /* buttons are the site .btn: a bone outline; the one solid gold button per screen carries .solid */
  button{ display:inline-flex; align-items:center; justify-content:center; min-height:50px; padding:0 26px; border:1px solid var(--bone); border-radius:0; background:transparent; color:var(--bone); font-family:var(--f-label); font-weight:600; font-size:16px; letter-spacing:.22em; text-transform:uppercase; cursor:pointer; transition:background .25s,color .25s; }
  button:hover{ background:var(--bone); color:var(--void); }
  /* .gold is kept for the script; it is an outline like every other button */
  button.gold{ border-color:var(--bone); color:var(--bone); background:transparent; }
  button.gold:hover{ background:var(--bone); color:var(--void); }
  button.solid{ background:var(--gold); border-color:var(--gold); color:var(--void); }
  button.solid:hover{ background:transparent; color:var(--gold); }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  button.small{ min-height:44px; padding:0 18px; font-size:14px; }
  .card button.small{ margin-left:auto; }
  .wide{ width:100%; margin-top:10px; }
  .note{ color:var(--ash); font-size:17px; font-style:italic; margin:10px 0 22px; }
.card .av{width:44px;height:44px;border-radius:0;border:1px solid var(--hair);object-fit:cover;flex:none;}
</style></head>
<body>
<div class="wrap">
  <div class="mast" id="mast" hidden></div>
  <div id="view"><p class="sub muted">Reading the invite.</p></div>
</div>
<script>
  var STATE = { signedIn:false, campaignName:'', characters:[] };
  function post(m){ try{ window.parent.postMessage(m,"*"); }catch(e){} }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function el(id){ return document.getElementById(id); }

  function render(){
    var v = el('view'); var s = STATE;
    if (!s.signedIn){
      v.innerHTML = '<h1>Join '+esc(s.campaignName||'the adventure')+'</h1>'
        + '<p class="sub">Sign in to bring your characters to the table.</p>'
        + '<button class="gold solid wide" onclick="post({type:\'JOIN_LOGIN\'})">Sign in</button>';
      return;
    }
    if (s.isOwner){
      v.innerHTML = '<h1>'+esc(s.campaignName||'The Adventure')+'</h1>'
        + '<p class="sub">You run this adventure.</p>'
        + '<p class="note">Players join by opening the invite link you share. Characters are attached only through that link, so there is nothing to attach here.</p>';
      return;
    }
    var h = '<h1>'+esc(s.campaignName||'The Adventure')+'</h1>';
    /* Fell the LoreMaster made, waiting for a player */
    if ((s.adoptable||[]).length){
      h += '<p class="sub">Your LoreMaster made these Fell at the table, waiting for a player. Make one your own:</p>';
      s.adoptable.forEach(function(c){
        h += '<div class="card">' + (c.img ? '<img class="av" src="'+esc(c.img)+'" alt="">' : '') + '<span class="nm">'+esc(c.name)+'</span><span class="lv">Lvl '+esc(c.level)+(c.role ? ' \u00b7 '+esc(c.role) : '')+'</span>'
          + '<button class="small gold" onclick="post({type:\'JOIN_ADOPT\',charId:\''+esc(c.charId)+'\'})">Make it mine</button></div>';
      });
      h += '<p class="note">Once it is yours, it is yours alone: its sheet opens next.</p>';
    }
    h += '<p class="sub">' + ((s.adoptable||[]).length ? 'Or attach one of your own.' : 'Attach the characters you want to play.') + '</p>';
    if (!s.characters.length){
      h += '<p class="note">You have no characters yet.</p>';
    } else {
      s.characters.forEach(function(c){
        h += '<div class="card"><span class="nm">'+esc(c.name)+'</span><span class="lv">Lvl '+esc(c.level)+'</span>';
        if (c.here){ h += '<span class="tag">in play</span><button class="small" onclick="post({type:\'JOIN_DETACH\',charId:\''+esc(c.charId)+'\'})">Remove</button>'; }
        else if (c.elsewhere){ h += '<button class="small gold" onclick="post({type:\'JOIN_ATTACH\',charId:\''+esc(c.charId)+'\'})">Move here</button>'; }
        else { h += '<button class="small gold" onclick="post({type:\'JOIN_ATTACH\',charId:\''+esc(c.charId)+'\'})">Attach</button>'; }
        h += '</div>';
      });
      if (s.characters.some(function(c){ return c.elsewhere; }))
        h += '<p class="note">A character can be in one adventure at a time. Moving it here removes it from its other adventure.</p>';
    }
    h += '<button class="gold solid wide" onclick="post({type:\'JOIN_FORGE\'})">Forge a new character</button>';
    v.innerHTML = h;
  }

  function showImage(u){
    var mast = document.getElementById('mast'); mast.innerHTML = '';
    if (typeof u !== 'string' || !/^https:\/\//.test(u)) { mast.hidden = true; return; }
    var img = document.createElement('img'); img.src = u; img.alt = '';
    img.onerror = function(){ mast.hidden = true; };
    mast.appendChild(img); mast.hidden = false;
  }

  window.onmessage = function(e){
    var m = e && e.data; if (!m || typeof m !== 'object') return;
    if (m.type === 'JOIN_STATE'){
      STATE.signedIn = !!m.signedIn;
      STATE.campaignName = m.campaignName || '';
      showImage(m.image);
      STATE.isOwner = !!m.isOwner;
      STATE.characters = Array.isArray(m.characters) ? m.characters : [];
      STATE.adoptable = Array.isArray(m.adoptable) ? m.adoptable : [];
      render();
    }
  };
  post({ type:'JOIN_READY' });
</script>
</body></html>
