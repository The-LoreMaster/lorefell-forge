name: Apply CMS

on:
  # Auto-applies when CMS inputs change (schemas, seed data, apply scripts, or this
  # workflow). Routine tool and changelog pushes do not trigger it. Every step is
  # idempotent and additive: backup is read-only, createCollection adopts existing
  # collections, upsert matches on a natural key, migrate skips migrated rows.
  push:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'scripts/**'
      - '.github/workflows/apply.yml'
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
      WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
      WIX_ACCOUNT_ID: ${{ secrets.WIX_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Backup first
        run: node scripts/backup.js

      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backups/
          if-no-files-found: warn

      - name: Create collections
        run: node scripts/createCollection.js

      - name: Add CombatPlayer placed-utility fields
        run: node scripts/addCombatPlayerFields.js

      - name: Seed items
        run: node scripts/upsertItems.js

      - name: Migrate legacy LoreForgeAbilities into Creations
        run: node scripts/migrate.js

      # DISABLED. This REST-path migration wrote scene rows that Velo's .eq('advId') query
      # cannot find, so the tools re-inserted the tree forever and flooded the collection with
      # duplicates. The tree is now populated through the Velo dual-write instead (queryable
      # rows). Do not re-enable without confirming Velo can query what this writes.
      # - name: Migrate Campaigns blobs into the Adventures tree
      #   run: node scripts/migrateCampaigns.js

      - name: Seed tool embeds into SiteEmbeds
        run: node scripts/seedEmbeds.js
