name: Apply CMS

# Seeds the canon collections (schemas/seed) into D1, the database the tools read since the
# data switch (2026-10-11), when the seed or this workflow changes. scripts/applyD1.js matches
# each row on its natural key, so a run changes only what changed and is safe to repeat; it
# writes every table it touches to backups/ first, kept here as an artifact. Until 2026-10-12
# this wrote the Wix CMS, which nothing reads any more.
on:
  push:
    branches: [main]
    paths:
      - 'schemas/seed/**'
      - 'scripts/applyD1.js'
      - '.github/workflows/apply.yml'
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Seed D1
        run: node scripts/applyD1.js

      - name: Upload what was there before
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backups/
          if-no-files-found: warn
