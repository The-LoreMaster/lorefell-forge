name: Table room
# Deploys the live table room (cloudflare/table-room) to Cloudflare Workers.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Cloudflare, My Profile, API Tokens,
# the "Edit Cloudflare Workers" template). CLOUDFLARE_ACCOUNT_ID is optional, only needed
# if the token can see more than one account.
on:
  push:
    branches: [main]
    paths: ['cloudflare/table-room/**', '.github/workflows/table-room.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy
        working-directory: cloudflare/table-room
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret first"; exit 1; fi
          npx --yes wrangler@3 deploy
      - name: Check it answers
        run: |
          sleep 5
          curl -s https://lorefell-table.nate8-johnson.workers.dev/health && echo
