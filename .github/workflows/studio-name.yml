name: Fix studio name in D1

# One-off data fix (Nate, 2026-10-12): rows in D1 that say "Skyvault Studios" are changed to
# "Skyvault Studio" by scripts/fixStudioName.js. Every row it changes is saved to backups/ first,
# kept here as an artifact. Safe to run again: a second run finds nothing.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fixStudioName.js'
      - '.github/workflows/studio-name.yml'
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fix the studio name
        run: node scripts/fixStudioName.js

      - name: Upload what was there before
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-name-backup-${{ github.run_id }}
          path: backups/
          if-no-files-found: warn
