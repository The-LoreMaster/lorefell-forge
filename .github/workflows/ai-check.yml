name: AI check

# Runs FoeForge's AI request through the AI worker and prints the worker's answer
# (scripts/aiCheck.js). Runs when the check changes, or by hand from Actions.
on:
  push:
    branches: [main]
    paths: ['scripts/aiCheck.js', '.github/workflows/ai-check.yml']
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - run: node scripts/aiCheck.js
