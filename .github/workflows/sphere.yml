name: Sphere Sync

# Keeps The Sphere (table.lorefell.com/the_sphere.html) in step with the FellGuide vault.
# Every half hour it bakes the Sphere from the vault and compares it to what is live.
# If they differ (a world page was edited, renamed or moved in Obsidian), it redeploys
# Pages, which bakes the Sphere fresh from the vault on the way out. Nothing is committed.
# Run it by hand from the Actions tab to push a vault edit out right away.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: sphere-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HAS_VAULT_TOKEN: ${{ secrets.VAULT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Needs the vault
        if: ${{ env.HAS_VAULT_TOKEN != 'true' }}
        run: |
          echo '::error::VAULT_TOKEN secret not set. The Sphere is read from the private vault and cannot sync without it.'
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: The-LoreMaster/lorefell-fellguide
          token: ${{ secrets.VAULT_TOKEN }}
          path: .vault-checkout
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bake from the vault and compare to live
        id: cmp
        run: |
          VAULT_DIR=.vault-checkout node scripts/buildSphere.js
          curl -fsSL "https://table.lorefell.com/the_sphere.html?v=$(date +%s)" -o live.html || : > live.html
          if cmp -s docs/the_sphere.html live.html; then
            echo "The Sphere is live and current."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "The live Sphere is behind the vault. Redeploying."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy Pages
        if: ${{ steps.cmp.outputs.stale == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
